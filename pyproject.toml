[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astermax-windows-pmv"
version = "0.1.0"
description = "Windows-first agentic PMV for auditable mechanical simulation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
windows = [
  "PySide6>=6.7,<7",
  "vtk>=9.3,<10",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
]

[project.scripts]
astermax = "astermax.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
