name: AsterMax one-time standard workflow face fix

on:
  push:
    branches:
      - agent/mechanical-gui-pdf-workflow
    paths:
      - ".github/workflows/astermax-one-time-workflow-face-fix.yml"

permissions:
  contents: write

jobs:
  patch-standard-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mechanical-gui-pdf-workflow
          fetch-depth: 0

      - name: Patch face picking and standard workflow integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          gmsh = Path('windows/AsterMax.MechanicalGui/MechanicalForm.GmshCad.cs')
          text = gmsh.read_text(encoding='utf-8')
          text = text.replace('private CadMeshCanvas? _cadCanvas;', 'private SelectableCadMeshCanvas? _cadCanvas;', 1)
          text = text.replace('GmshCliMesher.GenerateAsync', 'SelectableGmshMesher.GenerateAsync')
          text = text.replace('private CadMeshCanvas EnsureCadCanvas()', 'private SelectableCadMeshCanvas EnsureCadCanvas()', 1)
          text = text.replace('_cadCanvas ??= new CadMeshCanvas();', '_cadCanvas ??= new SelectableCadMeshCanvas(HandleCadFaceSelected);', 1)
          text = text.replace('        _cadCanvas.BringToFront();\n        return _cadCanvas;', '        _cadCanvas.BringToFront();\n        RefreshCadScopeMarkers();\n        return _cadCanvas;', 1)
          text = text.replace('        _cadStepPath = null;\n        _cadEnvelope = null;', '        _selectedCadSurfaceTag = null;\n        _cadStepPath = null;\n        _cadEnvelope = null;', 1)
          text = text.replace('"Mesh ready; general face scoping not yet defined"', '"Mesh ready; click a face to scope supports and loads"', 1)
          gmsh.write_text(text, encoding='utf-8')

          actions = Path('windows/AsterMax.MechanicalGui/MechanicalForm.Actions.cs')
          text = actions.read_text(encoding='utf-8')
          text = text.replace('    private void AddSupport(string type)\n    {\n        var analysis', '    private void AddSupport(string type)\n    {\n        if (TryAddScopedSupport(type)) return;\n        var analysis', 1)
          text = text.replace('    private void AddLoad(string type)\n    {\n        var analysis', '    private void AddLoad(string type)\n    {\n        if (TryAddScopedLoad(type)) return;\n        var analysis', 1)
          old_cad_solve = '''        if (_cadVolumeMesh is not null)
        {
            MessageBox.Show(this,
                "The real Gmsh mesh is ready, but arbitrary-face scoping and assembly into the general 3-D solver are not implemented yet. No fictitious solution will be generated.",
                "General STEP solver pending",
                MessageBoxButtons.OK,
                MessageBoxIcon.Information);
            return;
        }'''
          new_cad_solve = '''        if (_cadVolumeMesh is not null)
        {
            var cadIssues = WorkflowScopeIssues().ToList();
            if (cadIssues.Count > 0)
            {
                MessageBox.Show(this, string.Join(Environment.NewLine, cadIssues), "CAD model is not ready", MessageBoxButtons.OK, MessageBoxIcon.Warning);
                return;
            }
            MessageBox.Show(this,
                "Geometry, exterior mesh, real face selection, fixed support and force scoping are complete.\n\n" +
                "The arbitrary unstructured TET4 system still requires the sparse Code_Aster solve adapter; this build will not generate simulated results.",
                "CAD preprocessing verified — solver adapter pending",
                MessageBoxButtons.OK,
                MessageBoxIcon.Information);
            return;
        }'''
          if old_cad_solve not in text:
              raise SystemExit('CAD SolveAsync block not found')
          text = text.replace(old_cad_solve, new_cad_solve, 1)
          old_validate = '''        if (!AllNodes().Any(n => n.Tag is ModelObject { Kind: ObjectKind.Support, State: not ObjectState.Suppressed })) issues.Add("Insert at least one support.");
        if (!AllNodes().Any(n => n.Tag is ModelObject { Kind: ObjectKind.Load, State: not ObjectState.Suppressed })) issues.Add("Insert at least one load.");'''
          text = text.replace(old_validate, '        issues.AddRange(WorkflowScopeIssues());', 1)
          old_stats = '''    private void ShowMeshStatistics()
    {
        _worksheet.Columns.Clear();'''
          new_stats = '''    private void ShowMeshStatistics()
    {
        if (_cadVolumeMesh is not null)
        {
            PopulateCadMeshTable(_cadVolumeMesh, ParseEngineeringNumber(((ModelObject)_nodes["Mesh"].Tag).Properties.GetValueOrDefault("Target Size", "0")));
            SelectLowerTab("Worksheet");
            return;
        }
        _worksheet.Columns.Clear();'''
          text = text.replace(old_stats, new_stats, 1)
          actions.write_text(text, encoding='utf-8')

          simple = Path('windows/AsterMax.MechanicalGui/MechanicalForm.SimpleStatic.cs')
          text = simple.read_text(encoding='utf-8')
          text = text.replace('    private void ImportSimpleStep(string path)\n    {\n        ResetCadState();', '    private void ImportSimpleStep(string path)\n    {\n        ResetCadState();\n        _selectedSimpleFace = null;\n        _viewport.SelectFace(null);', 1)
          text = text.replace('''        if (!_simpleSetupDefined) ConfigureSimpleStatic();
        if (!_simpleSetupDefined) return;
        try
        {''', '''        try
        {''', 1)
          old_solve_setup = '''        if (_simpleSolid is null) { ImportSimpleStep(); return; }
        if (!_simpleSetupDefined) ConfigureSimpleStatic();
        if (!_simpleSetupDefined) return;
        if (_simpleMesh is null) GenerateSimpleMesh();'''
          new_solve_setup = '''        if (_simpleSolid is null) { ImportSimpleStep(); return; }
        if (!_simpleSetupDefined && !TryBuildSimpleSetupFromTree(out var workflowIssue))
        {
            if (string.Equals(_ribbon.SelectedTab?.Text, "Static Tutorial", StringComparison.OrdinalIgnoreCase))
                ConfigureSimpleStatic();
            else
            {
                MessageBox.Show(this, workflowIssue ?? "Select faces and insert a fixed support and force before solving.", "Model is not ready", MessageBoxButtons.OK, MessageBoxIcon.Warning);
                return;
            }
        }
        if (!_simpleSetupDefined) return;
        if (_simpleMesh is null) GenerateSimpleMesh();'''
          if old_solve_setup not in text:
              raise SystemExit('Simple solve setup block not found')
          text = text.replace(old_solve_setup, new_solve_setup, 1)
          simple.write_text(text, encoding='utf-8')

          viewport = Path('windows/AsterMax.MechanicalGui/MechanicalViewport.cs')
          text = viewport.read_text(encoding='utf-8')
          text = text.replace('''    private StaticSolution? _solution;

    public bool MeshVisible''', '''    private StaticSolution? _solution;
    private List<(SimpleFace Face, PointF[] Polygon)> _pickFaces = new();

    public event Action<SimpleFace>? FaceSelected;
    public SimpleFace? SelectedFace { get; private set; }
    public bool MeshVisible''', 1)
          text = text.replace('''        MouseUp += (_, _) => _dragging = false;
    }''', '''        MouseUp += (_, _) => _dragging = false;
        MouseClick += (_, e) =>
        {
            if (e.Button != MouseButtons.Left || ModifierKeys.HasFlag(Keys.Control) || _dragging) return;
            var hit = _pickFaces.AsEnumerable().Reverse().FirstOrDefault(item => PointInPolygon(e.Location, item.Polygon));
            if (hit.Polygon is null) return;
            SelectedFace = hit.Face;
            FaceSelected?.Invoke(hit.Face);
            Invalidate();
        };
    }''', 1)
          text = text.replace('''        _solution = null;
        MeshVisible = ResultVisible = SupportVisible = ForceVisible = false;''', '''        _solution = null;
        SelectedFace = null;
        _pickFaces.Clear();
        MeshVisible = ResultVisible = SupportVisible = ForceVisible = false;''', 1)
          text = text.replace('''    public void Fit()
    {
        _zoom = 1f;
        _yaw = -.35f;
        Invalidate();
    }''', '''    public void Fit()
    {
        _zoom = 1f;
        _yaw = -.35f;
        Invalidate();
    }

    public void SelectFace(SimpleFace? face)
    {
        SelectedFace = face;
        Invalidate();
    }''', 1)
          text = text.replace('''        var model = Corners(solid);
        var p = model.Select(Project).ToArray();
        DrawFace''', '''        var model = Corners(solid);
        var p = model.Select(Project).ToArray();
        _pickFaces =
        [
            (SimpleFace.ZMin, new[] { p[0], p[1], p[2], p[3] }),
            (SimpleFace.ZMax, new[] { p[4], p[5], p[6], p[7] }),
            (SimpleFace.XMax, new[] { p[1], p[5], p[6], p[2] }),
            (SimpleFace.YMin, new[] { p[0], p[4], p[5], p[1] }),
            (SimpleFace.XMin, new[] { p[0], p[3], p[7], p[4] }),
            (SimpleFace.YMax, new[] { p[3], p[2], p[6], p[7] })
        ];
        DrawFace''', 1)
          text = text.replace('''        DrawFace(g, FaceColor(.40), p[3], p[2], p[6], p[7]);

        using var edge''', '''        DrawFace(g, FaceColor(.40), p[3], p[2], p[6], p[7]);
        if (SelectedFace is SimpleFace selectedFace)
        {
            var selected = _pickFaces.First(item => item.Face == selectedFace).Polygon;
            using var selectedBrush = new SolidBrush(Color.FromArgb(175, 255, 184, 48));
            using var selectedPen = new Pen(Color.FromArgb(220, 125, 74, 0), 2f);
            g.FillPolygon(selectedBrush, selected);
            g.DrawPolygon(selectedPen, selected);
        }

        using var edge''', 1)
          text = text.replace('''    private static void DrawFace(Graphics g, Color color, params PointF[] points)
    {''', '''    private static bool PointInPolygon(Point point, IReadOnlyList<PointF> polygon)
    {
        var inside = false;
        for (var i = 0; i < polygon.Count; i++)
        {
            var j = (i + polygon.Count - 1) % polygon.Count;
            var intersects = polygon[i].Y > point.Y != polygon[j].Y > point.Y &&
                point.X < (polygon[j].X - polygon[i].X) * (point.Y - polygon[i].Y) /
                Math.Max(polygon[j].Y - polygon[i].Y, 1e-12f) + polygon[i].X;
            if (intersects) inside = !inside;
        }
        return inside;
    }

    private static void DrawFace(Graphics g, Color color, params PointF[] points)
    {''', 1)
          viewport.write_text(text, encoding='utf-8')

          form = Path('windows/AsterMax.MechanicalGui/MechanicalForm.cs')
          text = form.read_text(encoding='utf-8')
          text = text.replace('private const string ProductTitle = "AsterMax Mechanical 0.7 beta";', 'private const string ProductTitle = "AsterMax Mechanical 0.7.1 beta";', 1)
          text = text.replace('''        WireEvents();
        SelectNode("Project");
        _ribbon.SelectedTab = _ribbon.TabPages.Cast<TabPage>()
            .FirstOrDefault(page => page.Text == "Static Tutorial") ?? _ribbon.SelectedTab;''', '''        WireEvents();
        InitializeStandardWorkflowIntegration();
        SelectNode("Project");
        _ribbon.SelectedTab = _ribbon.TabPages.Cast<TabPage>()
            .FirstOrDefault(page => page.Text == "Workflow") ?? _ribbon.SelectedTab;''', 1)
          form.write_text(text, encoding='utf-8')

          presentation = Path('windows/AsterMax.MechanicalGui/MechanicalForm.Presentation.cs')
          text = presentation.read_text(encoding='utf-8')
          text = text.replace('''        var supportReady = AllNodes().Any(node => node.Tag is ModelObject { Kind: ObjectKind.Support, State: not ObjectState.Suppressed });
        var loadReady = AllNodes().Any(node => node.Tag is ModelObject { Kind: ObjectKind.Load, State: not ObjectState.Suppressed });''', '''        var supportReady = WorkflowSupportReady();
        var loadReady = WorkflowLoadReady();''', 1)
          presentation.write_text(text, encoding='utf-8')

          details = Path('windows/AsterMax.MechanicalGui/MechanicalForm.Details.cs')
          text = details.read_text(encoding='utf-8')
          text = text.replace('''                Detail("Element Order", "Quadratic");
                Detail("Element Size", obj.Properties.GetValueOrDefault("Element Size", "5 mm"));
                Category("Statistics");
                Detail("Nodes", _meshGenerated ? "12,486" : "Not generated", false);
                Detail("Elements", _meshGenerated ? "7,214" : "Not generated", false);''', '''                Detail("Element Order", obj.Properties.GetValueOrDefault("Element Order", "Linear / TET4"));
                Detail("Element Size", obj.Properties.GetValueOrDefault("Target Size", obj.Properties.GetValueOrDefault("Element Size", "5 mm")));
                Category("Statistics");
                Detail("Nodes", _meshGenerated ? obj.Properties.GetValueOrDefault("Nodes", _simpleMesh?.Nodes.Count.ToString("N0") ?? "Generated") : "Not generated", false);
                Detail("Elements", _meshGenerated ? obj.Properties.GetValueOrDefault("Tetrahedra", _simpleMesh?.Elements.Count.ToString("N0") ?? "Generated") : "Not generated", false);''', 1)
          text = text.replace('''                Detail("Magnitude", obj.Properties.GetValueOrDefault("Magnitude", DefaultMagnitude(obj.Name)));
                Detail("Direction", "Global X");''', '''                Detail("Magnitude", obj.Properties.GetValueOrDefault("Magnitude", DefaultMagnitude(obj.Name)));
                Detail("Direction", obj.Properties.GetValueOrDefault("Direction", "Global -Z"));
                if (obj.Properties.GetValueOrDefault("Define By", "Vector") == "Components")
                {
                    Detail("FX", obj.Properties.GetValueOrDefault("FX", "0 N"));
                    Detail("FY", obj.Properties.GetValueOrDefault("FY", "0 N"));
                    Detail("FZ", obj.Properties.GetValueOrDefault("FZ", "-1000 N"));
                }''', 1)
          text = text.replace('''        MarkSolutionDirty();
        Log($"{obj.Name}: {property} = {value}");''', '''        MarkSolutionDirty();
        SynchronizeWorkflowObject(obj);
        Log($"{obj.Name}: {property} = {value}");''', 1)
          details.write_text(text, encoding='utf-8')

          program = Path('windows/AsterMax.MechanicalGui/Program.cs')
          text = program.read_text(encoding='utf-8')
          text = text.replace('''        if (args.Any(arg => string.Equals(arg, "--solver-smoke", StringComparison.OrdinalIgnoreCase)))
            return RunSolverSmokeTest();

        _smokeTest''', '''        if (args.Any(arg => string.Equals(arg, "--solver-smoke", StringComparison.OrdinalIgnoreCase)))
            return RunSolverSmokeTest();
        if (args.Any(arg => string.Equals(arg, "--workflow-smoke", StringComparison.OrdinalIgnoreCase)))
            return StandardWorkflowVerifier.Run(args);

        _smokeTest''', 1)
          program.write_text(text, encoding='utf-8')

          project = Path('windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj')
          text = project.read_text(encoding='utf-8').replace('<Version>0.7.0-beta</Version>', '<Version>0.7.1-beta</Version>', 1)
          project.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/build-mechanical-gui.yml')
          text = workflow.read_text(encoding='utf-8')
          smoke_anchor = '''      - name: Windows startup smoke test
        shell: pwsh'''
          workflow_smoke = '''      - name: Standard workflow and real face-scoping smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/win-x64/AsterMax-Mechanical.exe
          $gmsh = Resolve-Path publish/win-x64/tools/gmsh/gmsh.exe
          $step = Resolve-Path smoke-cad/complex-flange.step
          $process = Start-Process -FilePath $exe -ArgumentList @("--workflow-smoke", $gmsh.Path, $step.Path) -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "AsterMax standard workflow smoke test failed with code $($process.ExitCode)." }
          Write-Host "Standard workflow verified: import, mesh, face scope, support/load mapping and prism solve."

      - name: Windows startup smoke test
        shell: pwsh'''
          if smoke_anchor not in text:
              raise SystemExit('Startup smoke anchor not found')
          text = text.replace(smoke_anchor, workflow_smoke, 1)
          text = text.replace('AsterMax-Mechanical-0.7.0-beta.exe', 'AsterMax-Mechanical-0.7.1-beta.exe')
          text = text.replace('AsterMax-Mechanical-0.7.0-beta-win-x64-with-gmsh', 'AsterMax-Mechanical-0.7.1-beta-win-x64-with-gmsh')
          workflow.write_text(text, encoding='utf-8')
          PY

      - name: Remove migration and commit
        shell: bash
        run: |
          git rm .github/workflows/astermax-one-time-workflow-face-fix.yml
          git config user.name "AsterMax CI"
          git config user.email "actions@users.noreply.github.com"
          git add windows/AsterMax.MechanicalGui .github/workflows/build-mechanical-gui.yml .github/workflows/astermax-one-time-workflow-face-fix.yml
          git commit -m "Fix mesh rendering and enable real face-scoped standard workflow"
          git push origin HEAD:agent/mechanical-gui-pdf-workflow
