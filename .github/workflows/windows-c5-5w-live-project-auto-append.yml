name: Windows C5.5w Live Project Auto Append

on:
  pull_request:
  workflow_dispatch:

jobs:
  live-project-auto-append:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/live_project_capture.py src/astermax/fea/project_authoring.py src/astermax/fea/project_session_shell.py
      - name: C5.5w real live project capture harness
        run: python -m pytest -q tests/test_live_project_capture.py
      - name: Project authoring and unified project regressions
        run: python -m pytest -q tests/test_project_authoring.py tests/test_unified_project_model.py tests/test_project_session_shell.py tests/test_portable_adaptive_results.py
      - name: Adaptive Results regressions
        run: python -m pytest -q tests/test_adaptive_execution_bundle.py tests/test_adaptive_hotspot_visualization.py tests/test_adaptive_stress_comparison.py
      - name: CAD STEP regressions
        run: python -m pytest -q tests/test_step_to_solve.py tests/test_cad_face_picker.py tests/test_pre_solve_review.py
      - name: Full regression suite
        run: python -m pytest -q
