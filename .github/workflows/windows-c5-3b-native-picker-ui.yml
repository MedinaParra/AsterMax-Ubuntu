name: Windows C5.3b Native CAD Picker UI

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-picker-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/native_cad_picker_ui.py src/astermax/fea/cad_face_picker.py src/astermax/fea/arbitrary_bc.py
      - name: C5.3b native UI harness
        run: python -m pytest -q tests/test_native_cad_picker_ui.py tests/test_cad_face_picker.py tests/test_arbitrary_bc.py
      - name: Full regression suite
        run: python -m pytest -q
