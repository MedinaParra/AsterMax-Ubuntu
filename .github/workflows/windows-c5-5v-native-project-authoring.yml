name: Windows C5.5v Native Project Authoring

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-project-authoring:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/project_authoring.py
      - name: C5.5v real project authoring harness
        run: python -m pytest -q tests/test_project_authoring.py
      - name: Unified project and session regressions
        run: python -m pytest -q tests/test_unified_project_model.py tests/test_project_session_shell.py tests/test_portable_adaptive_results.py
      - name: Adaptive Results regressions
        run: python -m pytest -q tests/test_adaptive_execution_bundle.py tests/test_adaptive_hotspot_visualization.py tests/test_adaptive_stress_comparison.py
      - name: CAD STEP regressions
        run: python -m pytest -q tests/test_step_to_solve.py tests/test_cad_face_picker.py
      - name: Full regression suite
        run: python -m pytest -q
