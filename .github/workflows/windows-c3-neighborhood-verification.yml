name: Windows C3 Neighborhood Verification

on:
  push:
    branches:
      - agent/neighborhood-verification-c3-v0.7
  pull_request:
    branches:
      - agent/analytical-evidence-c2-v0.6
  workflow_dispatch:

jobs:
  verify-c3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV and test dependencies
        run: python -m pip install -e .[test]
      - name: Compile with warnings as errors
        run: python -W error -m compileall -q src tests
      - name: Run C3 neighborhood harness
        run: python -m pytest -q tests/test_neighborhood_verification.py
      - name: Run deterministic regression harness
        run: python -m pytest -q
