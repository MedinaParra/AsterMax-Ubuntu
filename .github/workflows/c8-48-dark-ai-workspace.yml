name: C8.48 Dark AI Workspace Windows

on:
  push:
    branches:
      - agent/c8-48-dark-ai-workspace
    paths:
      - '.github/workflows/c8-48-dark-ai-workspace.yml'
      - 'integrations/prepomax-codeaster/**'
  workflow_dispatch:

concurrency:
  group: c8-48-dark-ai-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap AsterMax source
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - name: Restore NuGet dependencies
        shell: pwsh
        run: nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify C8.48 source contract
        shell: pwsh
        run: |
          $theme = Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxUiTheme.cs' -Raw
          foreach ($token in @('Background = Color.FromArgb(9, 13, 20)','Accent = Color.FromArgb(0, 214, 255)','SurfaceRaised','AccentGlow')) {
            if ($theme -notmatch [regex]::Escape($token)) { throw "Missing dark-theme token: $token" }
          }
          $tree = Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxEngineeringTree.cs' -Raw
          foreach ($token in @('ANALYSIS SETUP','Static Structural · qualified path','Modal · not qualified','Linear Buckling · not qualified','Thermal · not qualified','Geometry / STEP','UI selection only · solver binding and qualification pending')) {
            if ($tree -notmatch [regex]::Escape($token)) { throw "Missing analysis-tree token: $token" }
          }
          $results = Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxResultsWorkspace.cs' -Raw
          if ($results -match '_evidenceValue\.Text\s*=\s*"VERIFIED"') { throw 'Dark HUD must not infer VERIFIED from GUI state.' }
          $chat = Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxAiChatForm.cs' -Raw
          if ($chat -notmatch 'Engineering Copilot · evidence-aware CAE assistant') { throw 'AI futuristic header missing.' }
      - name: Launch native GUI and capture dark workspace
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWin48 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          "@
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe = (Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 500
            $proc.Refresh()
            if ($proc.HasExited) { throw "GUI exited early. ExitCode=$($proc.ExitCode)" }
          } while ($proc.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
          $proc.Refresh()
          if ($proc.MainWindowHandle -eq 0) { throw 'GUI did not create a native main window.' }
          if ($proc.MainWindowTitle -notmatch '^AsterMax Mechanical') { throw "Unexpected window title: $($proc.MainWindowTitle)" }
          [NativeWin48]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          $rect = New-Object NativeWin48+RECT
          if (-not [NativeWin48]::GetWindowRect($proc.MainWindowHandle, [ref]$rect)) { throw 'Unable to read native window bounds.' }
          $w = [Math]::Max(1, $rect.Right - $rect.Left)
          $h = [Math]::Max(1, $rect.Bottom - $rect.Top)
          $bmp = New-Object System.Drawing.Bitmap $w, $h
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          try { $g.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bmp.Size) }
          finally { $g.Dispose() }
          $png = 'artifact/C8.48_DARK_AI_WORKSPACE.png'
          $bmp.Save((Join-Path $PWD $png), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          @{
            title=$proc.MainWindowTitle; window_width=$w; window_height=$h;
            screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Encoding UTF8 artifact/C8.48_WINDOW_EVIDENCE.json
          Stop-Process -Id $proc.Id -Force
      - name: Write C8.48 evidence
        shell: pwsh
        run: |
          @{
            schema='astermax.dark-ai-workspace.v1'; version='C8.48'; commit='${{ github.sha }}';
            dark_theme=$true; futuristic_ai_shell=$true; analysis_setup_selector=$true;
            static_structural_path_listed=$true; nonqualified_modes_marked=$true;
            gui_loaded_does_not_imply_solver_verified=$true; verified_state_inferred=$false;
            solver_logic_modified=$false; industrial_validation=$false; ansys_equivalence=$false
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 artifact/C8.48_UI_EVIDENCE.json
      - name: Upload C8.48 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.48-Dark-AI-Workspace-${{ github.sha }}
          path: |
            artifact/C8.48_UI_EVIDENCE.json
            artifact/C8.48_WINDOW_EVIDENCE.json
            artifact/C8.48_DARK_AI_WORKSPACE.png
          if-no-files-found: error
          retention-days: 14
