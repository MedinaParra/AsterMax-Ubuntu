name: Windows C5.4a Professional Results Workspace

on:
  pull_request:
  workflow_dispatch:

jobs:
  professional-results-workspace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/results_workspace.py src/astermax/fea/postprocess_tet10.py src/astermax/fea/viewer_tet10.py src/astermax/desktop_picker_app.py
      - name: C5.4a results workspace harness
        run: python -m pytest -q tests/test_results_workspace.py tests/test_tet10_postprocess.py tests/test_desktop_picker_app.py
      - name: Full regression suite
        run: python -m pytest -q
