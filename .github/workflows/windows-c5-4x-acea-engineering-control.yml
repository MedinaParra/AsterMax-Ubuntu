name: Windows C5.4x ACEA Engineering Control

on:
  pull_request:
  workflow_dispatch:

jobs:
  acea-engineering-control:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/engineering_evidence_bus.py src/astermax/fea/engineering_state_machine.py
      - name: C5.4x ACEA evidence/state harness
        run: python -m pytest -q tests/test_engineering_control_architecture.py
      - name: Demo-session and dashboard regression
        run: python -m pytest -q tests/test_demo_session.py tests/test_demo_dashboard.py tests/test_desktop_picker_app.py tests/test_step_to_solve.py
      - name: Solver and verification regression
        run: python -m pytest -q tests/test_tet10_global.py tests/test_tet_quality.py tests/test_pre_solve_review.py tests/test_production_results.py
      - name: Full regression suite
        run: python -m pytest -q
