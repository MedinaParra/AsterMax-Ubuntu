name: Windows C4.2 Live Analysis Evidence

on:
  pull_request:
    paths:
      - "src/astermax/app.py"
      - "src/astermax/fea/live_analysis_evidence.py"
      - "tests/test_live_analysis_evidence.py"
      - ".github/workflows/windows-c4-2-live-analysis-evidence.yml"

jobs:
  verify-live-evidence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMV and full test dependencies
        run: python -m pip install -e .[test]
      - name: Compile live evidence and desktop modules
        run: python -W error -m py_compile src/astermax/fea/live_analysis_evidence.py src/astermax/app.py
      - name: Run C4.2 live evidence harness
        run: python -m pytest tests/test_live_analysis_evidence.py -q
      - name: Run deterministic regression harness
        run: python -m pytest -q
