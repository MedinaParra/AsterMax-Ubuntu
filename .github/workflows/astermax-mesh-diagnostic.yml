name: AsterMax C10.20.8b Mesh Diagnostic

on:
  push:
    branches: [ codex/c10208b-mesh-diagnostic ]
    paths:
      - '.github/workflows/astermax-mesh-diagnostic.yml'
      - 'native-windows/**'
  workflow_dispatch:

concurrency:
  group: astermax-c10208b-mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesh-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v5

      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Validate patch chain
        shell: pwsh
        run: python native-windows/validate-patch-chain.py

      - name: Apply patch chain with error harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
            $patches=@(
              'patch-astermax.ps1','patch-branding.ps1','patch-c960-native-bridge.ps1',
              'patch-c961-native-codeaster-export.ps1','patch-c965-results-workspace.ps1',
              'patch-c966-results-scene.ps1','patch-c967-vtk-results-binding.ps1',
              'patch-c968-professional-results-hud.ps1','patch-c969-renderer-synchronized-results.ps1',
              'patch-c970-native-3d-probe.ps1','patch-c971-native-probe-callout.ps1',
              'patch-c972-native-framebuffer-evidence.ps1','patch-c974-solver-provenance.ps1',
              'patch-c975-analysis-provenance-manifest.ps1','patch-c976-automatic-model-fingerprint.ps1',
              'patch-c977-pre-solve-readiness.ps1','patch-c978-assignment-hexa8-quality.ps1',
              'patch-c985-model-fidelity-gate.ps1','patch-c998-current-model-results-gate.ps1',
              'patch-c991-startup-hardening.ps1','patch-c992-startup-viewport.ps1',
              'patch-c1000-native-solve-transaction.ps1','patch-c1001-automatic-results-handoff.ps1',
              'patch-c1002-runtime-discovery.ps1','patch-c1003-runtime-readiness.ps1',
              'patch-c1004-tetra-native-solve.ps1','patch-c1005-codeaster-runner-probe.ps1',
              'patch-c1006-python-med-runtime-probe.ps1','patch-c1008-aster-group-records.ps1',
              'patch-c10081-portable-cad-smoke.ps1','patch-c1009-functional-outline.ps1',
              'patch-c1010-button-audit.ps1','patch-c1011-windows-runtime.ps1',
              'patch-c1012-tetra-results-connectivity.ps1','patch-c1013-results-contours-options.ps1',
              'patch-c1014-refined-mesh-runner-diagnostics.ps1','patch-c1015-vtk-real-scalar-contours.ps1',
              'patch-c1016-pmx-compatibility.ps1','patch-c1018-integrated-results.ps1',
              'patch-c1020-workflow-conformance.ps1','patch-c10201-cload-semantics.ps1',
              'patch-c10202-async-solve-ui.ps1','patch-c10203-cancel-solve.ps1',
              'patch-c10204-result-lifecycle.ps1','patch-c10205-close-safe-solve.ps1',
              'patch-c10206-solve-state-coherence.ps1','patch-c10207-model-session-identity.ps1',
              'patch-c10208-functional-command-smoke.ps1'
            )
          & .\native-windows\harness-c10208a-patch-chain.ps1 -Root "$PWD\upstream" -Patches $patches -OutDir "$PWD\dist\Audit\PatchChain"
          if($LASTEXITCODE -ne 0){ throw "Patch-chain harness failed." }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install STEP generator
        shell: pwsh
        run: python -m pip install --disable-pip-version-check gmsh

      - name: Restore NuGet
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows x64
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Assemble mesh-only distribution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing' }
          New-Item -ItemType Directory -Force .\dist\Audit\C10.20 | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxTools | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" .\dist\ -Recurse -Force
          Copy-Item .\native-windows\bridge-c964-med-results.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\bind-c998-results-fingerprint.py .\dist\AsterMaxTools\ -Force
          $runtimeUrl='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          $runtimeSha256='954f406b65a08cb2fb47ef2fb02b03e4f70aa9c97e0979bd7048448273e17d46'
          Invoke-WebRequest $runtimeUrl -OutFile runtime.zip
          if((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtimeSha256){ throw 'Pinned CAD runtime digest mismatch.' }
          Expand-Archive runtime.zip runtime
          $ng=Get-ChildItem runtime -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $ng){ throw 'NetGenMesher.exe missing.' }
          Copy-Item $ng.Directory.FullName .\dist\NetGen -Recurse -Force
          New-Item -ItemType Directory -Force .\dist\Temp | Out-Null
          foreach($project in @('CaeGlobals','CaeJob','CaeMesh','CaeModel','CaeResults','UserControls','vtkControl')) {
            $dir=Join-Path $PWD "upstream\$project\bin\x64\Release"
            if(Test-Path $dir){ New-Item -ItemType Directory -Force .\dist\lib | Out-Null; Get-ChildItem $dir -Filter *.dll | Copy-Item -Destination .\dist\lib -Force }
          }
          python .\native-windows\build-c1010-materials.py --out .\dist

      - name: Generate B01 STEP
        shell: pwsh
        run: python native-windows/workflow-conformance/generate-b01-step.py --out "$PWD/dist/Audit/C10.20/B01-100x10x10.step"

      - name: Run GUI through mesh smoke
        shell: pwsh
        continue-on-error: true
        run: |
          ./native-windows/workflow-conformance/run-e2e.ps1 `
            -Exe "$PWD/dist/AsterMax Mechanical.exe" `
            -Step "$PWD/dist/Audit/C10.20/B01-100x10x10.step" `
            -OutDir "$PWD/dist/Audit/C10.20" `
            -TimeoutSeconds 300

      - name: Collect and replay meshing failure
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $smoke="$PWD\dist\Audit\C10.20\command-execution-smoke.json"
          if(-not(Test-Path $smoke)){ Write-Host 'No command smoke evidence found.'; exit 0 }
          $j=Get-Content $smoke -Raw | ConvertFrom-Json
          $mesh=$j.commands | Where-Object {$_.command -eq 'Generate Mesh'} | Select-Object -Last 1
          if(-not $mesh){ Write-Host 'No Generate Mesh row found.'; exit 0 }
          $mesh | ConvertTo-Json -Depth 10 | Set-Content "$PWD\dist\Audit\C10.20\mesh-diagnostic-row.json" -Encoding UTF8
          $work=[string]$mesh.work_directory
          Write-Host "MESH_WORK_DIRECTORY=$work"
          if($work -and (Test-Path $work)){
            New-Item -ItemType Directory -Force "$PWD\dist\Audit\MeshWork" | Out-Null
            Copy-Item "$work\*" "$PWD\dist\Audit\MeshWork\" -Recurse -Force -ErrorAction SilentlyContinue
            $brep=Join-Path $work 'geometry.brep'
            $vol=Join-Path $work 'geometry.vol'
            $params=Join-Path $work 'meshParameters'
            $refine=Join-Path $work 'meshRefinement'
            $netgen="$PWD\dist\NetGen\NetGenMesher.exe"
            [ordered]@{
              work_directory=$work
              brep_present=(Test-Path $brep)
              brep_bytes=$(if(Test-Path $brep){(Get-Item $brep).Length}else{0})
              parameters_present=(Test-Path $params)
              parameters_bytes=$(if(Test-Path $params){(Get-Item $params).Length}else{0})
              refinement_present=(Test-Path $refine)
              refinement_bytes=$(if(Test-Path $refine){(Get-Item $refine).Length}else{0})
              vol_present_before_replay=(Test-Path $vol)
              vol_bytes_before_replay=$(if(Test-Path $vol){(Get-Item $vol).Length}else{0})
              netgen_present=(Test-Path $netgen)
            } | ConvertTo-Json -Depth 5 | Set-Content "$PWD\dist\Audit\C10.20\mesh-work-files.json" -Encoding UTF8
            if((Test-Path $netgen) -and (Test-Path $brep) -and (Test-Path $params) -and (Test-Path $refine)){
              Remove-Item $vol -Force -ErrorAction SilentlyContinue
              $stdout="$PWD\dist\Audit\C10.20\netgen-replay.stdout.log"
              $stderr="$PWD\dist\Audit\C10.20\netgen-replay.stderr.log"
              $args=@('BREP_MESH',$brep,$vol,$params,$refine)
              $p=Start-Process -FilePath $netgen -ArgumentList $args -WorkingDirectory $work -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              [ordered]@{
                exit_code=$p.ExitCode
                vol_present=(Test-Path $vol)
                vol_bytes=$(if(Test-Path $vol){(Get-Item $vol).Length}else{0})
                stdout=$stdout
                stderr=$stderr
              } | ConvertTo-Json -Depth 5 | Set-Content "$PWD\dist\Audit\C10.20\netgen-replay.json" -Encoding UTF8
              $variants=@(
                [ordered]@{name='no-localh'; values=@{uselocalh='0'}},
                [ordered]@{name='coarse'; values=@{uselocalh='0';maxh='10';minh='0.5';fineness='0.3';grading='0.2'}},
                [ordered]@{name='very-coarse'; values=@{uselocalh='0';maxh='20';minh='1';fineness='0.2';grading='0.1'}},
                [ordered]@{name='no-volume-opt'; values=@{uselocalh='0';optvolmeshenable='0';optsteps_3d='0'}},
                [ordered]@{name='uniform'; values=@{uselocalh='0';grading='0';maxh='10';minh='1'}}
              )
              $sweep=@()
              foreach($variant in $variants){
                $variantDir=Join-Path "$PWD\dist\Audit\C10.20\netgen-sweep" $variant.name
                New-Item -ItemType Directory -Force $variantDir | Out-Null
                $variantParams=Join-Path $variantDir 'meshParameters'
                Copy-Item $params $variantParams -Force
                $lines=Get-Content $variantParams
                foreach($key in $variant.values.Keys){
                  for($i=0;$i -lt $lines.Count-1;$i++){
                    if($lines[$i] -match ('^\s*(int|double)\s+'+[regex]::Escape($key)+'\b')){
                      $lines[$i+1]=[string]$variant.values[$key]
                      break
                    }
                  }
                }
                Set-Content $variantParams $lines -Encoding Ascii
                $variantVol=Join-Path $variantDir 'geometry.vol'
                $variantStdout=Join-Path $variantDir 'stdout.log'
                $variantStderr=Join-Path $variantDir 'stderr.log'
                $args=@('BREP_MESH',$brep,$variantVol,$variantParams,$refine)
                $vp=Start-Process -FilePath $netgen -ArgumentList $args -WorkingDirectory $work -Wait -PassThru -RedirectStandardOutput $variantStdout -RedirectStandardError $variantStderr
                $sweep += [ordered]@{
                  name=$variant.name
                  exit_code=$vp.ExitCode
                  exit_hex=('0x{0:X8}' -f ([uint32]$vp.ExitCode))
                  vol_present=(Test-Path $variantVol)
                  vol_bytes=$(if(Test-Path $variantVol){(Get-Item $variantVol).Length}else{0})
                  values=$variant.values
                }
              }
              $sweep | ConvertTo-Json -Depth 10 | Set-Content "$PWD\dist\Audit\C10.20\netgen-parameter-sweep.json" -Encoding UTF8

              # Cross-check the B01 baseline against NetGen runtimes close to the pinned source date.
              # These downloads are diagnostic only; hashes are recorded and no runtime is promoted automatically.
              $runtimeCandidates=@(
                [ordered]@{name='v1.4.1';url='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.1.zip'},
                [ordered]@{name='v2.0.0';url='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v2.0.0.zip'},
                [ordered]@{name='v2.1.0';url='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v2.1.0.zip'}
              )
              $runtimeSweep=@()
              foreach($candidate in $runtimeCandidates){
                $root=Join-Path "$PWD\dist\Audit\C10.20\runtime-sweep" $candidate.name
                New-Item -ItemType Directory -Force $root | Out-Null
                $zip=Join-Path $root 'runtime.zip'
                try {
                  Invoke-WebRequest $candidate.url -OutFile $zip
                  $zipHash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
                  $expanded=Join-Path $root 'expanded'
                  Expand-Archive $zip $expanded -Force
                  $exe=Get-ChildItem $expanded -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
                  if(-not $exe){ throw 'NetGenMesher.exe missing from runtime archive.' }
                  $exeHash=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                  $outVol=Join-Path $root 'geometry.vol'
                  $outStdout=Join-Path $root 'stdout.log'
                  $outStderr=Join-Path $root 'stderr.log'
                  $args=@('BREP_MESH',$brep,$outVol,$params,$refine)
                  $rp=Start-Process -FilePath $exe.FullName -ArgumentList $args -WorkingDirectory $work -Wait -PassThru -RedirectStandardOutput $outStdout -RedirectStandardError $outStderr
                  $runtimeSweep += [ordered]@{
                    name=$candidate.name; url=$candidate.url; zip_sha256=$zipHash; netgen_sha256=$exeHash;
                    exit_code=$rp.ExitCode; vol_present=(Test-Path $outVol);
                    vol_bytes=$(if(Test-Path $outVol){(Get-Item $outVol).Length}else{0})
                  }
                } catch {
                  $runtimeSweep += [ordered]@{name=$candidate.name;url=$candidate.url;error=$_.Exception.ToString()}
                }
              }
              $runtimeSweep | ConvertTo-Json -Depth 10 | Set-Content "$PWD\dist\Audit\C10.20\netgen-runtime-sweep.json" -Encoding UTF8
            }
          }

      - name: Upload mesh diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.20.8b-Mesh-Diagnostic
          path: |
            dist/Audit/C10.20
            dist/Audit/MeshWork
            dist/Audit/PatchChain
          if-no-files-found: warn
