name: C10.83 STEP import format hotfix
on:
  push:
    branches: [agent/c1083-step-import-format-hotfix]
  workflow_dispatch:
jobs:
  windows-x64-executable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Rebuild cumulative source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python native-windows/validate-patch-chain.py
          $chain=Get-Content native-windows/patch-chain.json -Raw|ConvertFrom-Json
          $patches=@($chain.patches|ForEach-Object{$_.file})
          ./native-windows/harness-c10208a-patch-chain.ps1 -Root "$PWD/upstream" -Patches $patches -OutDir "$PWD/dist/Audit/PatchChain"
      - name: Apply C10.42 through C10.46c prerequisites and C10.83 hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/candidate-c1042-vtk-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-controller-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-large-assembly-pipeline.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1042-large-assembly.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1043-cad-import-reliability.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1043-cad-import-reliability.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1044-adaptive-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1044-adaptive-cad-preview.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1045-parallel-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1083-step-import-format-hotfix.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1045b-isolated-netgen-workers.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1045b-isolated-netgen-workers.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/test-c1046-netgen-worker-lifecycle.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream"
      - name: Apply C10.47 through C10.81
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/candidate-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1047-runtime-audit.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1048-actor-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1048-lazy-element-edges-v3.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1078-runtime-counters.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1079-render-execution-counters.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1080-edge-camera-runtime-counters.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1081-edge-materialization-counters.ps1 -Root "$PWD/upstream"
      - name: Validate contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1048-lazy-element-edges.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1078-runtime-counter-contract.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1079-render-execution-counter-contract.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1080-edge-camera-runtime-counter-contract.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1081-edge-materialization-contract.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1052-viewport-purity.ps1 -Root "$PWD/upstream"
      - name: Windows x64 Release build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          nuget restore .\upstream\PrePoMax.sln -NonInteractive
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild=& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe'|Select-Object -First 1
          if(!$msbuild){throw 'MSBuild.exe not found'}
          & $msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0){throw 'Windows x64 build failed'}
      - name: Package executable and required NetGen runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem "$PWD/upstream" -Recurse -File -Filter 'AsterMax Mechanical.exe' | Where-Object { $_.FullName -match '[\\/]bin[\\/]x64[\\/]Release[\\/]' } | Select-Object -First 1
          if(!$exe){throw 'AsterMax Mechanical.exe not found in bin/x64/Release after successful build'}
          $source=$exe.Directory.FullName
          $dest="$PWD/dist/AsterMax-C10.83-Windows-x64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "$source\*" $dest -Recurse -Force
          $releaseZip="$env:RUNNER_TEMP\PrePoMax-v2.0.0.zip"
          $releaseDir="$env:RUNNER_TEMP\PrePoMax-v2.0.0"
          Invoke-WebRequest -Uri 'https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v2.0.0.zip' -OutFile $releaseZip
          Expand-Archive -Path $releaseZip -DestinationPath $releaseDir -Force
          $netgenExe=Get-ChildItem $releaseDir -Recurse -File -Filter 'NetGenMesher.exe' | Select-Object -First 1
          if(!$netgenExe){throw 'NetGenMesher.exe not found in PrePoMax v2.0.0 portable release'}
          $netgenDest=Join-Path $dest 'NetGen'
          New-Item -ItemType Directory -Force -Path $netgenDest | Out-Null
          Copy-Item "$($netgenExe.Directory.FullName)\*" $netgenDest -Recurse -Force
          foreach($path in @((Join-Path $dest 'AsterMax Mechanical.exe'),(Join-Path $dest 'NetGen\NetGenMesher.exe'))){if(!(Test-Path $path)){throw "Required runtime missing: $path"};if((Get-Item $path).Length -le 0){throw "Required runtime empty: $path"}}
      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-Mechanical-C10.83-Windows-x64-StepImportFix
          path: dist/AsterMax-C10.83-Windows-x64
          if-no-files-found: error
