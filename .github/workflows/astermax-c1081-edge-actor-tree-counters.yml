name: C10.81 deferred edge actor trace
on:
  push:
    branches: [agent/c1081-edge-actor-tree-counters]
  workflow_dispatch:
jobs:
  windows-x64-deferred-edge-trace:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Rebuild cumulative source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python native-windows/validate-patch-chain.py
          $chain=Get-Content native-windows/patch-chain.json -Raw|ConvertFrom-Json
          $patches=@($chain.patches|ForEach-Object{$_.file})
          ./native-windows/harness-c10208a-patch-chain.ps1 -Root "$PWD/upstream" -Patches $patches -OutDir "$PWD/dist/Audit/PatchChain"
      - name: Apply C10.42 large assembly semantics
        shell: pwsh
        run: ./native-windows/candidate-c1042-large-assembly-pipeline.ps1 -Root "$PWD/upstream"
      - name: Apply C10.48 lazy element edges
        shell: pwsh
        run: ./native-windows/candidate-c1048-lazy-element-edges-v3.ps1 -Root "$PWD/upstream"
      - name: Apply C10.78 diagnostic counters
        shell: pwsh
        run: ./native-windows/candidate-c1078-runtime-counters.ps1 -Root "$PWD/upstream"
      - name: Apply C10.79 render execution counters
        shell: pwsh
        run: ./native-windows/candidate-c1079-render-execution-counters.ps1 -Root "$PWD/upstream"
      - name: Apply C10.80 edge camera counters
        shell: pwsh
        run: ./native-windows/candidate-c1080-edge-camera-runtime-counters.ps1 -Root "$PWD/upstream"
      - name: Apply C10.81 effective deferred edge trace
        shell: pwsh
        run: ./native-windows/candidate-c1081-edge-materialization-counters.ps1 -Root "$PWD/upstream"
      - name: Validate C10.48 lazy edge contract
        shell: pwsh
        run: ./native-windows/test-c1048-lazy-element-edges.ps1 -Root "$PWD/upstream"
      - name: Validate C10.78 contract
        shell: pwsh
        run: ./native-windows/test-c1078-runtime-counter-contract.ps1 -Root "$PWD/upstream"
      - name: Validate C10.79 contract
        shell: pwsh
        run: ./native-windows/test-c1079-render-execution-counter-contract.ps1 -Root "$PWD/upstream"
      - name: Validate C10.80 contract
        shell: pwsh
        run: ./native-windows/test-c1080-edge-camera-runtime-counter-contract.ps1 -Root "$PWD/upstream"
      - name: Validate C10.81 contract
        shell: pwsh
        run: ./native-windows/test-c1081-edge-materialization-contract.ps1 -Root "$PWD/upstream"
      - name: Viewport purity regression guard
        shell: pwsh
        run: ./native-windows/test-c1052-viewport-purity.ps1 -Root "$PWD/upstream"
      - name: Windows x64 Release build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          nuget restore .\upstream\PrePoMax.sln -NonInteractive
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild=& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe'|Select-Object -First 1
          if(!$msbuild){throw 'MSBuild.exe not found'}
          & $msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0){throw 'Windows x64 build failed'}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.81-Deferred-Edge-Trace-Audit
          path: |
            dist/Audit/C10.81
            dist/Audit/PatchChain
          if-no-files-found: warn
