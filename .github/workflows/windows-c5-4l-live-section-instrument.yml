name: Windows C5.4l Live Section Instrument

on:
  pull_request:
  workflow_dispatch:

jobs:
  live-section-instrument:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/results_section_instrument.py src/astermax/fea/results_section_view.py src/astermax/fea/results_workspace_ui.py
      - name: C5.4l live section instrument harness
        run: python -m pytest -q tests/test_results_section_instrument.py tests/test_results_section_view.py tests/test_section_overlay.py tests/test_section_intersection.py
      - name: Results regression
        run: python -m pytest -q tests/test_results_workspace_ui.py tests/test_results_workspace.py tests/test_production_results.py
      - name: Full regression suite
        run: python -m pytest -q
