name: AsterMax Harness

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  case-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run verifiable engineering-context harness
        run: python -m unittest discover -s tests -v
