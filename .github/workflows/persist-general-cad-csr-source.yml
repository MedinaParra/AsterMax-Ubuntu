name: Persist verified general CAD CSR solver source

on:
  push:
    branches:
      - agent/mechanical-gui-pdf-workflow
    paths:
      - ".github/workflows/persist-general-cad-csr-source.yml"

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mechanical-gui-pdf-workflow
          fetch-depth: 0

      - name: Apply verified solver implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          solver_path = Path('windows/AsterMax.MechanicalGui/GeneralCadTet4Solver.cs')
          text = solver_path.read_text(encoding='utf-8')
          text = text.replace('Math.Clamp(freeToGlobal.Count * 8, 600, 30000)', 'Math.Clamp(freeToGlobal.Count * 3, 300, 8000)')
          text = text.replace('            1e-9,', '            1e-6,')
          if 'stiffness.Freeze();' not in text:
              text = text.replace('        stiffness.ValidateDiagonal();', '        stiffness.ValidateDiagonal();\n        stiffness.Freeze();', 1)

          old = '''    private sealed class SparseMatrix
              {
                  private readonly Dictionary<int, double>[] _rows;
                  public double[] Diagonal { get; }

                  public SparseMatrix(int size)
                  {
                      _rows = Enumerable.Range(0, size).Select(_ => new Dictionary<int, double>(48)).ToArray();
                      Diagonal = new double[size];
                  }

                  public void Add(int row, int column, double value)
                  {
                      if (Math.Abs(value) <= 1e-30) return;
                      var entries = _rows[row];
                      entries[column] = entries.GetValueOrDefault(column) + value;
                      if (row == column) Diagonal[row] += value;
                  }

                  public void ValidateDiagonal()
                  {
                      var maximum = Diagonal.Select(Math.Abs).DefaultIfEmpty(1.0).Max();
                      var minimumAllowed = Math.Max(1e-18, maximum * 1e-14);
                      for (var index = 0; index < Diagonal.Length; index++)
                      {
                          if (!double.IsFinite(Diagonal[index]) || Diagonal[index] <= minimumAllowed)
                              throw new InvalidOperationException(
                                  $"The stiffness diagonal is singular at free degree of freedom {index + 1}. " +
                                  "The mesh may contain disconnected nodes or insufficient supports.");
                      }
                  }

                  public void Multiply(double[] vector, double[] result)
                  {
                      Array.Clear(result);
                      for (var row = 0; row < _rows.Length; row++)
                      {
                          var sum = 0.0;
                          foreach (var (column, value) in _rows[row]) sum += value * vector[column];
                          result[row] = sum;
                      }
                  }
              }'''
          new = '''    private sealed class SparseMatrix
              {
                  private readonly Dictionary<int, double>[] _rows;
                  private int[]? _rowPointers;
                  private int[]? _columnIndices;
                  private double[]? _values;
                  public double[] Diagonal { get; }

                  public SparseMatrix(int size)
                  {
                      _rows = Enumerable.Range(0, size).Select(_ => new Dictionary<int, double>(48)).ToArray();
                      Diagonal = new double[size];
                  }

                  public void Add(int row, int column, double value)
                  {
                      if (_rowPointers is not null)
                          throw new InvalidOperationException("Cannot add stiffness entries after CSR finalization.");
                      if (Math.Abs(value) <= 1e-30) return;
                      var entries = _rows[row];
                      entries[column] = entries.GetValueOrDefault(column) + value;
                      if (row == column) Diagonal[row] += value;
                  }

                  public void ValidateDiagonal()
                  {
                      var maximum = Diagonal.Select(Math.Abs).DefaultIfEmpty(1.0).Max();
                      var minimumAllowed = Math.Max(1e-18, maximum * 1e-14);
                      for (var index = 0; index < Diagonal.Length; index++)
                      {
                          if (!double.IsFinite(Diagonal[index]) || Diagonal[index] <= minimumAllowed)
                              throw new InvalidOperationException(
                                  $"The stiffness diagonal is singular at free degree of freedom {index + 1}. " +
                                  "The mesh may contain disconnected nodes or insufficient supports.");
                      }
                  }

                  public void Freeze()
                  {
                      if (_rowPointers is not null) return;
                      _rowPointers = new int[_rows.Length + 1];
                      var nonzeroCount = 0;
                      for (var row = 0; row < _rows.Length; row++)
                      {
                          _rowPointers[row] = nonzeroCount;
                          nonzeroCount += _rows[row].Count;
                      }
                      _rowPointers[^1] = nonzeroCount;
                      _columnIndices = new int[nonzeroCount];
                      _values = new double[nonzeroCount];
                      var cursor = 0;
                      for (var row = 0; row < _rows.Length; row++)
                      {
                          foreach (var entry in _rows[row].OrderBy(entry => entry.Key))
                          {
                              _columnIndices[cursor] = entry.Key;
                              _values[cursor] = entry.Value;
                              cursor++;
                          }
                          _rows[row].Clear();
                      }
                  }

                  public void Multiply(double[] vector, double[] result)
                  {
                      if (_rowPointers is null || _columnIndices is null || _values is null) Freeze();
                      Array.Clear(result);
                      for (var row = 0; row < _rows.Length; row++)
                      {
                          var sum = 0.0;
                          for (var index = _rowPointers![row]; index < _rowPointers[row + 1]; index++)
                              sum += _values![index] * vector[_columnIndices![index]];
                          result[row] = sum;
                      }
                  }
              }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'private int[]? _rowPointers;' not in text:
              raise SystemExit('Unable to locate SparseMatrix block for CSR persistence')
          solver_path.write_text(text, encoding='utf-8')

          for path in [
              Path('windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj'),
              Path('windows/AsterMax.MechanicalGui/MechanicalForm.cs')]:
              source = path.read_text(encoding='utf-8')
              source = source.replace('0.7.1-beta', '0.8.0-beta').replace('AsterMax Mechanical 0.7.1 beta', 'AsterMax Mechanical 0.8.0 beta')
              path.write_text(source, encoding='utf-8')

          readme = Path('windows/AsterMax.MechanicalGui/README.md')
          source = readme.read_text(encoding='utf-8')
          source = source.replace('# AsterMax Mechanical 0.7.1 beta', '# AsterMax Mechanical 0.8.0 beta')
          source = source.replace('AsterMax-Mechanical-0.7.1-beta.exe', 'AsterMax-Mechanical-0.8.0-beta.exe')
          source = source.replace(
              'The arbitrary unstructured TET4 static solve is not enabled yet. AsterMax validates the general CAD preprocessing state and blocks **Solve** instead of returning simulated stresses. The next required block is the sparse Code_Aster/general TET4 solve adapter.',
              'The general CAD route now performs sparse TET4 assembly, CSR matrix-vector products, diagonally preconditioned conjugate-gradient solution, reactions, displacement and von Mises recovery.')
          source = source.replace(
              '- General CAD face selection and support/load scoping work, but its static solution still awaits the sparse Code_Aster/general TET4 adapter.',
              '- General CAD static solution is limited to one closed isotropic linear-elastic solid, first-order TET4 elements, fixed supports and total forces applied to selected faces.')
          readme.write_text(source, encoding='utf-8')
          PY

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "AsterMax Build Agent"
          git config user.email "actions@users.noreply.github.com"
          git add windows/AsterMax.MechanicalGui
          if git diff --cached --quiet; then
            echo "Verified CSR source was already current."
          else
            git commit -m "Persist verified CSR general CAD solver"
            git push origin HEAD:agent/mechanical-gui-pdf-workflow
          fi
