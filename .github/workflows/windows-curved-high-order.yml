name: Windows Curved TET10 High-Order Gate

on:
  pull_request:
  push:
    branches:
      - agent/curved-tet10-high-order-optimize-v1.5

jobs:
  verify-curved-high-order-mesh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV
        run: python -m pip install -e .[test]
      - name: Run deterministic regression harness
        run: python -m pytest -q
      - name: Measure documented Gmsh high-order optimization candidates
        run: python benchmarks/curved_tet10_high_order_optimize.py
      - name: Upload C10b curved high-order mesh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curved-tet10-high-order-optimize-windows
          path: |
            curved_tet10_high_order_optimize.step
            curved_tet10_high_order_optimize.json
          if-no-files-found: error
