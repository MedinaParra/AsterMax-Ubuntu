name: AsterMax one-time Object Generator migration

on:
  push:
    branches:
      - agent/mechanical-gui-pdf-workflow
    paths:
      - ".github/workflows/astermax-one-time-rename.yml"

permissions:
  contents: write

jobs:
  rename-legacy-method:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mechanical-gui-pdf-workflow
          fetch-depth: 0
      - name: Rename only the legacy demonstration method
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('windows/AsterMax.MechanicalGui/MechanicalForm.Actions.cs')
          text = path.read_text(encoding='utf-8')
          old = '    private void OpenObjectGenerator()\n    {\n        using var form = new Form\n        {\n            Text = "AsterMax Object Generator",'
          new = '    private void OpenLegacyObjectGenerator()\n    {\n        using var form = new Form\n        {\n            Text = "AsterMax Object Generator",'
          if old not in text:
              raise SystemExit('Legacy Object Generator method signature was not found exactly once.')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy method, found {text.count(old)}.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "AsterMax CI"
          git config user.email "actions@users.noreply.github.com"
          git add windows/AsterMax.MechanicalGui/MechanicalForm.Actions.cs
          git commit -m "Rename legacy Object Generator demo method"
          git push origin HEAD:agent/mechanical-gui-pdf-workflow
