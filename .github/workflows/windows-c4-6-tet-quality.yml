name: Windows C4.6 Tetra Quality Cross-Check

on:
  pull_request:
    paths:
      - "src/astermax/fea/tet_quality.py"
      - "src/astermax/fea/pre_solve_review.py"
      - "tests/test_tet_quality.py"
      - ".github/workflows/windows-c4-6-tet-quality.yml"

jobs:
  verify-tetra-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMV and full test dependencies
        run: python -m pip install -e .[test]
      - name: Compile C4.6 modules with warnings as errors
        run: python -W error -m py_compile src/astermax/fea/tet_quality.py src/astermax/fea/pre_solve_review.py
      - name: Run C4.6 tetra-quality harness
        run: python -m pytest tests/test_tet_quality.py -q
      - name: Run deterministic regression harness
        run: python -m pytest -q
