name: AsterMax C10.01 Windows Automatic Results Handoff

on:
  push:
    branches: [ main ]
    paths:
      - 'native-windows/patch-c1001-automatic-results-handoff.ps1'
      - 'native-windows/bridge-c964-med-results.py'
      - 'native-windows/bind-c998-results-fingerprint.py'
      - '.github/workflows/astermax-c1001-windows-results-handoff.yml'
  workflow_dispatch:

jobs:
  windows-x64-results-handoff:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Apply integrated AsterMax PMV patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\native-windows\patch-astermax.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-branding.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c960-native-bridge.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c961-native-codeaster-export.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c965-results-workspace.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c966-results-scene.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c967-vtk-results-binding.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c968-professional-results-hud.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c969-renderer-synchronized-results.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c970-native-3d-probe.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c971-native-probe-callout.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c972-native-framebuffer-evidence.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c974-solver-provenance.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c975-analysis-provenance-manifest.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c976-automatic-model-fingerprint.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c977-pre-solve-readiness.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c978-assignment-hexa8-quality.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c985-model-fidelity-gate.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c998-current-model-results-gate.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c991-startup-hardening.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c992-startup-viewport.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c1000-native-solve-transaction.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c1001-automatic-results-handoff.ps1 -Root "$PWD\upstream"

      - name: C10.01 source and fail-safe gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Get-Content .\upstream\PrePoMax\Forms\AsterMaxNativeSolveTransaction.cs -Raw
          foreach($token in @(
            'CompleteVerifiedResultsHandoff',
            'ASTERMAX_PYTHON',
            'ASTERMAX_MED_BRIDGE_MODE',
            'bridge-c964-med-results.py',
            'bind-c998-results-fingerprint.py',
            'AsterMaxResultsBundle.Load',
            'RequireCurrentModel',
            'SOLUTION_CURRENT',
            'SOLUTION_STALE',
            'new FileInfo(ResultBundleFile).Length==0',
            'new FileInfo(ResultVtuFile).Length==0'
          )) { if(-not $src.Contains($token)){ throw "C10.01 token missing: $token" } }
          if($src.Contains('fea_values_invented = true') -or $src.Contains('fea_values_invented\"]=true')){ throw 'Synthetic FEA path detected' }
          Write-Host 'C1001_SOURCE_FAILSAFE_GATE=PASS'

      - name: Validate bridge scripts syntax
        shell: pwsh
        run: |
          python -m py_compile .\native-windows\bridge-c964-med-results.py
          python -m py_compile .\native-windows\bind-c998-results-fingerprint.py
          if($LASTEXITCODE -ne 0){ throw 'Python bridge syntax gate failed' }
          Write-Host 'C1001_PYTHON_BRIDGE_SYNTAX=PASS'

      - name: Restore packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive

      - uses: microsoft/setup-msbuild@v2

      - name: Rebuild Windows x64 Release
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: ModelTree constructor smoke gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path .\upstream).Path
          $uc=Get-ChildItem .\upstream -Recurse -Filter 'UserControls.dll' | Where-Object {$_.FullName -match 'UserControls\\bin\\Release'} | Select-Object -First 1
          if(-not $uc){ throw 'UserControls.dll missing' }
          $script=@"
          `$ErrorActionPreference='Stop'
          `$global:root='$root'
          [AppDomain]::CurrentDomain.add_AssemblyResolve({
            param(`$sender,`$args)
            `$name=([Reflection.AssemblyName]`$args.Name).Name + '.dll'
            `$cand=Get-ChildItem `$global:root -Recurse -Filter `$name -ErrorAction SilentlyContinue | Where-Object { `$_.FullName -match 'bin\\(x64\\)?Release|packages' } | Select-Object -First 1
            if(`$cand){ return [Reflection.Assembly]::LoadFrom(`$cand.FullName) }
            return `$null
          })
          `$asm=[Reflection.Assembly]::LoadFrom('$($uc.FullName)')
          `$type=`$asm.GetType('UserControls.ModelTree', `$true)
          `$tree=[Activator]::CreateInstance(`$type)
          if(`$null -eq `$tree){ throw 'ModelTree constructor returned null' }
          Write-Host 'MODEL_TREE_CONSTRUCTOR=PASS'
          `$tree.Dispose()
          "@
          Set-Content .\modeltree-smoke.ps1 $script -Encoding UTF8
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\modeltree-smoke.ps1
          if($LASTEXITCODE -ne 0){ throw "ModelTree smoke gate failed: $LASTEXITCODE" }

      - name: Stage C10.01 demo runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing after rebuild' }
          New-Item -ItemType Directory -Force .\dist\AsterMaxTools | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" .\dist\ -Recurse -Force
          Copy-Item .\native-windows\bridge-c964-med-results.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\bind-c998-results-fingerprint.py .\dist\AsterMaxTools\ -Force
          $hash=(Get-FileHash '.\dist\AsterMax Mechanical.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            release='C10.01'
            platform='Windows x64'
            executable='AsterMax Mechanical.exe'
            executable_sha256=$hash
            solver_backend='Code_Aster'
            unit_contract='MM_N_S_MPA'
            automatic_results_handoff=$true
            med_bridge_mode='production'
            fingerprint_binding=$true
            vtk_auto_open=$true
            stale_result_rejection=$true
            solver_runtime_bundled=$false
            python_runtime_bundled=$false
            python_env='ASTERMAX_PYTHON'
            runner_env='ASTERMAX_CODE_ASTER_RUNNER'
            fea_values_invented=$false
            ansys_equivalence='NOT_PROVEN'
            limitation='C10.01 compiles and validates the automatic verified result handoff. A Windows-hosted Code_Aster runtime and Python+h5py+numpy runtime are still externally configured; this workflow does not claim a fresh numerical solve inside AsterMax.exe.'
          } | ConvertTo-Json | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.01-Windows-x64-Automatic-Results-Handoff
          path: dist
          if-no-files-found: error
