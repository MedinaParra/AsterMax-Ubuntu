name: C8.75 Professional Viewport + Safe Lifecycle

on:
  push:
    branches: [agent/c8-75-professional-viewport-safe-lifecycle]
  workflow_dispatch:

concurrency:
  group: c8-75-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-professional-viewport:
    runs-on: windows-2025
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    env:
      C865_RUN_ID: '33963671896'
      C865_SHA: '86b123a2df7a481a06451358e299bac69db2b7e4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin exact admitted solver evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prior/windows,prior/solve | Out-Null
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "C8.65-Windows-Generated-Study-$env:C865_SHA" --dir prior/windows
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "AsterMax-C8.65-Product-Native-Reaction-$env:C865_SHA" --dir prior/solve
          $pmx=Get-ChildItem prior/windows -Recurse -Filter 'AsterMax_C862_Structural.pmx'|Select-Object -First 1
          $rmed=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.rmed'|Select-Object -First 1
          $resu=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.resu'|Select-Object -First 1
          $ev=Get-ChildItem prior/solve -Recurse -Filter 'C8.65_PRODUCT_NATIVE_REACTION_EVIDENCE.json'|Select-Object -First 1
          if(-not $pmx -or -not $rmed -or -not $resu -or -not $ev){throw 'Pinned evidence bundle incomplete.'}
          $e=Get-Content $ev.FullName -Raw|ConvertFrom-Json
          if(-not $e.solver_verified -or -not $e.result_field_values_verified -or -not $e.reaction_equilibrium_verified){throw 'Source solve is not admitted.'}
          "C875_PMX=$($pmx.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C875_RMED=$($rmed.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C875_RESU=$($resu.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C875_PRIOR=$($ev.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C875_NODES=$($e.node_count)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C875_MISES=$($e.max_von_mises_mpa.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C875_DISP=$($e.max_displacement_mm.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C875_MISES_NODE=$($e.max_von_mises_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C875_DISP_NODE=$($e.max_displacement_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap and apply C8.66-C8.75 qualification chain
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_full_model_results_demo.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_results_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_clean_verified_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_extrema_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_node_probe_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_deformation_geometry.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_render_mesh_deformation_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_deformation_ui_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_deformation_ui_evidence_fix.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_rendered_viewport_deformation_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_rendered_viewport_diagnostic_admission.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_professional_viewport_badge.py build/PrePoMax-CodeAster

      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64 and retain architecture diagnostics
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal 2>&1 | Tee-Object artifact-build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Run viewport admission, inspect badge, capture, and close normally
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class NativeWindowC875 {
            public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc proc, IntPtr lParam);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern IntPtr GetWindowLongPtr(IntPtr hWnd, int nIndex);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          New-Item -ItemType Directory -Force artifact/c8-75|Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $ready=(Join-Path $PWD 'artifact/c8-75/RESULTS_C875_READY.json')
          $stdout=(Join-Path $PWD 'artifact/c8-75/results.stdout.log')
          $stderr=(Join-Path $PWD 'artifact/c8-75/results.stderr.log')
          $env:ASTERMAX_RESULTS_FULL_MODEL_PMX=$env:C875_PMX
          $env:ASTERMAX_RESULTS_EXPECTED_NODES=$env:C875_NODES
          $env:ASTERMAX_RESULTS_EXPECTED_ELEMENTS='2474'
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_MAX=$env:C875_MISES
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_MAX=$env:C875_DISP
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_NODE=$env:C875_MISES_NODE
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_NODE=$env:C875_DISP_NODE
          $p=Start-Process $exe -ArgumentList @('--astermax-results-demo',$env:C875_RMED,$env:C875_RESU,$ready) -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $deadline=(Get-Date).AddSeconds(120)
          while(-not(Test-Path $ready) -and (Get-Date)-lt $deadline){Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){Get-Content $stderr -ErrorAction SilentlyContinue;throw "Results process exited early: $($p.ExitCode)"}}
          if(-not(Test-Path $ready)){throw 'Timed out waiting for C8.75 READY.'}
          $s=Get-Content $ready -Raw|ConvertFrom-Json
          if(-not $s.scene_ready -or -not $s.result_admitted -or -not $s.full_model_pmx_loaded){throw 'Full-model Results gate failed.'}
          if(-not [bool]$s.rendered_viewport_deformation_verified){throw 'C8.74b rendered deformation prerequisite lost.'}
          if([double]$s.rendered_viewport_float32_quantized_max_error_mm -gt 1e-6){throw 'Rendered x10 precision gate lost.'}
          if(-not [bool]$s.native_scalar_bar_semantically_verified){throw 'Scalar-bar semantics gate lost.'}
          if([string]$s.deformation_state -ne 'user-defined-x10-contour'){throw 'Final deformation state is not x10.'}

          $windows=New-Object System.Collections.Generic.List[object]
          $cb=[NativeWindowC875+EnumWindowsProc]{ param($h,$l)
            [uint32]$windowProcessId=0;[NativeWindowC875]::GetWindowThreadProcessId($h,[ref]$windowProcessId)|Out-Null
            if($windowProcessId -eq [uint32]$p.Id -and [NativeWindowC875]::IsWindowVisible($h)){
              $sb=New-Object Text.StringBuilder 512;[NativeWindowC875]::GetWindowText($h,$sb,$sb.Capacity)|Out-Null
              $r=New-Object NativeWindowC875+RECT;[NativeWindowC875]::GetWindowRect($h,[ref]$r)|Out-Null
              $style=[NativeWindowC875]::GetWindowLongPtr($h,-16).ToInt64()
              $windows.Add([pscustomobject]@{Handle=$h;Title=$sb.ToString();Left=$r.Left;Top=$r.Top;Width=$r.Right-$r.Left;Height=$r.Bottom-$r.Top;Style=$style})
            }
            return $true
          }
          [NativeWindowC875]::EnumWindows($cb,[IntPtr]::Zero)|Out-Null
          $badge=$windows|Where-Object {$_.Title -eq 'AsterMax | Verified Result'}|Select-Object -First 1
          if(-not $badge){$windows|ConvertTo-Json -Depth 4|Set-Content artifact/c8-75/windows.json;throw 'Verified-result badge native window not found.'}
          $WS_CAPTION=0x00C00000L;$WS_THICKFRAME=0x00040000L
          if(($badge.Style -band $WS_CAPTION) -ne 0 -or ($badge.Style -band $WS_THICKFRAME) -ne 0){throw "Badge still carries developer window chrome. style=$($badge.Style)"}
          if($badge.Width -gt 600 -or $badge.Height -gt 100){throw "Badge footprint is not compact: $($badge.Width)x$($badge.Height)"}
          $badge|ConvertTo-Json|Set-Content artifact/c8-75/C8_75_BADGE_WINDOW.json -Encoding UTF8

          $windowDeadline=(Get-Date).AddSeconds(20)
          do{Start-Sleep -Milliseconds 250;$p.Refresh()}while($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and (Get-Date)-lt $windowDeadline)
          if($p.HasExited -or $p.MainWindowHandle -eq 0){throw 'No live AsterMax main window for capture.'}
          [NativeWindowC875]::SetForegroundWindow($p.MainWindowHandle)|Out-Null
          Start-Sleep -Seconds 2
          $r=New-Object NativeWindowC875+RECT
          if(-not [NativeWindowC875]::GetWindowRect($p.MainWindowHandle,[ref]$r)){throw 'GetWindowRect failed.'}
          $w=$r.Right-$r.Left;$h=$r.Bottom-$r.Top
          if($w -lt 640 -or $h -lt 480){throw "Window too small: ${w}x${h}"}
          $bmp=New-Object Drawing.Bitmap($w,$h);$g=[Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)
          $png=(Join-Path $PWD 'artifact/c8-75/AsterMax-C8.75-professional-verified-viewport.png')
          $bmp.Save($png,[Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bmp.Dispose()
          if((Get-Item $png).Length -lt 15000){throw 'Native Results screenshot unexpectedly small.'}

          # Lifecycle qualification: the demo returns from its nested callback first, then Program queues
          # FrmMain.Close() as a new UI message. Do not inject WM_CLOSE from the harness while Run() pumps DoEvents.
          if(-not $p.WaitForExit(25000)){
            throw 'AsterMax did not complete application-controlled normal VTK/WinForms shutdown within 25 s.'
          }
          if($p.ExitCode -ne 0){throw "Serialized normal shutdown returned non-zero exit code $($p.ExitCode)."}
          $err=Get-Content $stderr -Raw -ErrorAction SilentlyContinue
          if($err -match 'AccessViolationException|FatalExecutionEngineError|SEHException'){throw 'Unsafe native teardown signature detected in stderr.'}
          @{normal_close_requested=$false;application_controlled_close=$true;process_exited=$true;exit_code=$p.ExitCode;access_violation_detected=$false}|ConvertTo-Json|Set-Content artifact/c8-75/C8_75_LIFECYCLE.json -Encoding UTF8

      - name: Emit C8.75 evidence
        shell: pwsh
        run: |
          $s=Get-Content artifact/c8-75/RESULTS_C875_READY.json -Raw|ConvertFrom-Json
          $prior=Get-Content $env:C875_PRIOR -Raw|ConvertFrom-Json
          $badge=Get-Content artifact/c8-75/C8_75_BADGE_WINDOW.json -Raw|ConvertFrom-Json
          $life=Get-Content artifact/c8-75/C8_75_LIFECYCLE.json -Raw|ConvertFrom-Json
          $warnings=(Select-String -Path artifact-build.log -Pattern 'MSIL|AMD64|architecture' -SimpleMatch:$false -ErrorAction SilentlyContinue|ForEach-Object {$_.Line})
          @{
            schema='astermax.c8.75.professional-viewport-safe-lifecycle.v1';commit='${{ github.sha }}';source_solver_run=[long]$env:C865_RUN_ID;source_solver_commit=$env:C865_SHA
            solver_verified=[bool]$prior.solver_verified;result_fields_verified=[bool]$prior.result_field_values_verified;reaction_equilibrium_verified=[bool]$prior.reaction_equilibrium_verified
            mesh_nodes=[int]$s.mesh_nodes;mesh_elements=2474;field='STRESS/MISES';unit='MPa';deformation_state=[string]$s.deformation_state
            rendered_viewport_deformation_verified=[bool]$s.rendered_viewport_deformation_verified;render_precision_model=[string]$s.rendered_viewport_precision_model
            compact_verified_badge=$true;badge_borderless=$true;badge_width_px=[int]$badge.Width;badge_height_px=[int]$badge.Height
            normal_vtk_winforms_shutdown_verified=[bool]$life.process_exited;application_controlled_normal_close=[bool]$life.application_controlled_close;normal_shutdown_exit_code=[int]$life.exit_code;access_violation_detected=[bool]$life.access_violation_detected
            build_architecture_warning_count=@($warnings).Count;build_architecture_warnings=@($warnings)
            pmx_sha256=(Get-FileHash $env:C875_PMX -Algorithm SHA256).Hash.ToLowerInvariant();rmed_sha256=(Get-FileHash $env:C875_RMED -Algorithm SHA256).Hash.ToLowerInvariant();resu_sha256=(Get-FileHash $env:C875_RESU -Algorithm SHA256).Hash.ToLowerInvariant();screenshot_sha256=(Get-FileHash artifact/c8-75/AsterMax-C8.75-professional-verified-viewport.png -Algorithm SHA256).Hash.ToLowerInvariant()
            industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 6|Set-Content artifact/c8-75/C8_75_PROFESSIONAL_VIEWPORT_SAFE_LIFECYCLE_EVIDENCE.json -Encoding UTF8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.75-Professional-Viewport-${{ github.sha }}
          path: |
            artifact/c8-75/**
            artifact-build.log
          if-no-files-found: warn
          retention-days: 14
