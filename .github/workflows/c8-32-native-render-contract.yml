name: C8.32 Native render contract

on:
  push:
    branches:
      - agent/c8-32-native-render-contract
    paths:
      - 'integrations/prepomax-codeaster/**'
      - '.github/workflows/c8-32-native-render-contract.yml'
  workflow_dispatch:

concurrency:
  group: c8-32-native-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Genuine Code_Aster 17.4.0 solve
        shell: bash
        run: |
          chmod -R a+rwX integrations/prepomax-codeaster/smoke/codeaster-linear-tetra
          docker pull simvia/code_aster:17.4.0
          python integrations/prepomax-codeaster/harness/astermax_harness.py \
            --manifest integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/smoke.harness.manifest.json
      - name: Independent mm-N-MPa oracle
        shell: bash
        run: |
          python integrations/prepomax-codeaster/harness/validate_numeric_reference.py \
            --resu integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/smoke.resu \
            --contract integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/c8-29-reference-contract.json
      - name: Stage genuine evidence
        shell: bash
        run: |
          mkdir -p artifact/genuine
          cp integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/{smoke.rmed,smoke.resu,smoke.mess,smoke.harness.json} artifact/genuine/
          sha256sum artifact/genuine/* > artifact/genuine/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c8-32-genuine-${{ github.sha }}
          path: artifact/genuine/**
          if-no-files-found: error

  windows-native-render-contract:
    needs: genuine-solve
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: c8-32-genuine-${{ github.sha }}
          path: genuine
      - name: Bootstrap exact pinned AsterMax source
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - name: Fail-closed native render contract
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/harness/validate_native_render_contract.py `
            --repo build/PrePoMax-CodeAster `
            --output artifact/c8-32/NATIVE_RENDER_CONTRACT.json
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Re-admit verified native scalar fields
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $rmed=(Resolve-Path 'genuine/smoke.rmed').Path
          $resu=(Resolve-Path 'genuine/smoke.resu').Path
          $out=Join-Path $PWD 'artifact/c8-32/native-fields.log'
          New-Item -ItemType Directory -Force (Split-Path $out) | Out-Null
          $p=Start-Process -FilePath $exe -ArgumentList @('--codeaster-import-probe',$rmed,$resu) -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $out -NoNewWindow -Wait -PassThru
          if($p.ExitCode -ne 0){ throw "Native field admission failed: $($p.ExitCode)" }
          $log=Get-Content $out -Raw
          foreach($needle in @('Code_Aster CaeResults import probe: PASS','Native contour field: STRESS/MISES','Native deformation field: DISP/ALL')) {
            if($log -notmatch [regex]::Escape($needle)){ throw "Missing verified native field evidence: $needle" }
          }
      - name: Launch branded native GUI and capture renderer-host evidence
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindowC832 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $deadline=(Get-Date).AddSeconds(30)
            do { Start-Sleep -Milliseconds 500; $p.Refresh() } while($p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if($p.MainWindowHandle -eq 0){ throw 'AsterMax native GUI did not expose a main window.' }
            if($p.MainWindowTitle -notlike 'AsterMax Mechanical*'){ throw "Unexpected title: $($p.MainWindowTitle)" }
            [NativeWindowC832]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            $r=New-Object NativeWindowC832+RECT
            if(-not [NativeWindowC832]::GetWindowRect($p.MainWindowHandle,[ref]$r)){ throw 'GetWindowRect failed.' }
            $w=$r.Right-$r.Left; $h=$r.Bottom-$r.Top
            if($w -lt 640 -or $h -lt 480){ throw "Native GUI too small: ${w}x${h}" }
            $bmp=New-Object System.Drawing.Bitmap($w,$h)
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)
            $png=Join-Path $PWD 'artifact/c8-32/AsterMax-C8.32-native-window.png'
            $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            if((Get-Item $png).Length -lt 10000){ throw 'Screenshot evidence is unexpectedly small.' }
          } finally {
            if(-not $p.HasExited){ Stop-Process -Id $p.Id -Force }
          }
      - name: Emit content-addressed evidence
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $png=(Resolve-Path 'artifact/c8-32/AsterMax-C8.32-native-window.png').Path
          @{
            schema='astermax.c8-32-native-render-contract.v1'
            commit='${{ github.sha }}'
            solver='Code_Aster 17.4.0'
            unit_system='mm-N-MPa'
            genuine_solve=$true
            numerical_oracle=$true
            native_field_admission=$true
            native_render_contract=$true
            branded_native_gui=$true
            executable_sha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            rmed_sha256=(Get-FileHash genuine/smoke.rmed -Algorithm SHA256).Hash.ToLowerInvariant()
            resu_sha256=(Get-FileHash genuine/smoke.resu -Algorithm SHA256).Hash.ToLowerInvariant()
            screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant()
            contour_rendered_from_verified_result=$false
            rendering_semantics_verified=$false
            industrial_validation=$false
            ansys_equivalence=$false
          } | ConvertTo-Json -Depth 4 | Set-Content artifact/c8-32/C8_32_EVIDENCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.32-native-render-contract-${{ github.sha }}
          path: artifact/c8-32/**
          if-no-files-found: error
          retention-days: 14
