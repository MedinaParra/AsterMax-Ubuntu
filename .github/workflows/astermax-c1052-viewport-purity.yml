name: C10.52 viewport purity Windows validation

on:
  push:
    branches: [agent/c1052-viewport-purity]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout AsterMax validation repository
        uses: actions/checkout@v4

      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v4
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Apply validated AsterMax patch chain through C10.49
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $scripts = @(
            'native-windows/candidate-c1042-large-assembly-pipeline.ps1',
            'native-windows/candidate-c1043-large-assembly-dedup.ps1',
            'native-windows/candidate-c1044-large-assembly-tree.ps1',
            'native-windows/candidate-c1045-large-assembly-camera.ps1',
            'native-windows/candidate-c1046-large-assembly-actors.ps1',
            'native-windows/candidate-c1047-vtk-scene-batch.ps1',
            'native-windows/candidate-c1048-lazy-element-edges-v3.ps1',
            'native-windows/candidate-c1049-import-telemetry.ps1'
          )
          foreach($s in $scripts){
            if(Test-Path $s){ & (Join-Path $PWD $s) -Root "$PWD/upstream"; if($LASTEXITCODE -ne 0){ throw "Patch failed: $s" } }
            else { Write-Host "NOT_PRESENT: $s" }
          }

      - name: Run C10.52 viewport purity guard
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1052-viewport-purity.ps1 -Root "$PWD/upstream"

      - name: Restore and build Windows x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          nuget restore .\upstream\PrePoMax.sln -NonInteractive
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if(!(Test-Path $vswhere)){ throw 'vswhere.exe not found.' }
          $msbuild=& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if([string]::IsNullOrWhiteSpace($msbuild) -or !(Test-Path $msbuild)){ throw 'MSBuild.exe not found.' }
          & $msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0){ throw 'C10.52 Windows x64 Release build failed.' }

      - name: Upload C10.52 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.52-Viewport-Purity-Evidence
          path: dist/Audit/C10.52
          if-no-files-found: warn
