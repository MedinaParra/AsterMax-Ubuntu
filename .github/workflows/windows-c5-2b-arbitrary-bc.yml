name: Windows C5.2b Arbitrary BC Production

on:
  pull_request:
    paths:
      - "src/astermax/fea/arbitrary_bc.py"
      - "src/astermax/fea/face_ownership.py"
      - "src/astermax/fea/named_selections.py"
      - "src/astermax/fea/solver.py"
      - "tests/test_arbitrary_bc.py"
      - "tests/test_face_ownership.py"
      - ".github/workflows/windows-c5-2b-arbitrary-bc.yml"

jobs:
  verify-arbitrary-bc-production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMV and full test dependencies
        run: python -m pip install -e .[test]
      - name: Compile C5.2b modules with warnings as errors
        run: python -W error -m py_compile src/astermax/fea/arbitrary_bc.py src/astermax/fea/face_ownership.py
      - name: Run C5.2b arbitrary BC production harness
        run: python -m pytest tests/test_arbitrary_bc.py tests/test_face_ownership.py -q
      - name: Re-run named-selection binding harnesses
        run: python -m pytest tests/test_named_selections.py tests/test_named_selection_bc.py -q
      - name: Run deterministic regression harness including solver tests
        run: python -m pytest -q
