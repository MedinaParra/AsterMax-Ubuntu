name: C8.66 Full-model Verified Native Results

on:
  push:
    branches: [agent/c8-66-full-model-verified-results]
  workflow_dispatch:

concurrency:
  group: c8-66-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-full-model-results:
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      C865_RUN_ID: '33963671896'
      C865_SHA: '86b123a2df7a481a06451358e299bac69db2b7e4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download exact C8.65 product-generated PMX and genuine solved fields
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prior/windows,prior/solve | Out-Null
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "C8.65-Windows-Generated-Study-$env:C865_SHA" --dir prior/windows
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "AsterMax-C8.65-Product-Native-Reaction-$env:C865_SHA" --dir prior/solve
          $pmx=Get-ChildItem prior/windows -Recurse -Filter 'AsterMax_C862_Structural.pmx' | Select-Object -First 1
          $rmed=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.rmed' | Select-Object -First 1
          $resu=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.resu' | Select-Object -First 1
          $ev=Get-ChildItem prior/solve -Recurse -Filter 'C8.65_PRODUCT_NATIVE_REACTION_EVIDENCE.json' | Select-Object -First 1
          if(-not $pmx -or -not $rmed -or -not $resu -or -not $ev){throw 'Pinned C8.65 evidence bundle is incomplete.'}
          $e=Get-Content $ev.FullName -Raw | ConvertFrom-Json
          if(-not $e.solver_verified -or -not $e.result_field_values_verified -or -not $e.reaction_equilibrium_verified){throw 'Pinned C8.65 evidence is not solver/result/equilibrium verified.'}
          "C866_PMX=$($pmx.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C866_RMED=$($rmed.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C866_RESU=$($resu.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C866_PRIOR_EVIDENCE=$($ev.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C866_EXPECTED_NODES=$($e.node_count)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C866_EXPECTED_MISES=$($e.max_von_mises_mpa.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C866_EXPECTED_DISP=$($e.max_displacement_mm.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Bootstrap pinned AsterMax source and apply C8.66 product increment
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_full_model_results_demo.py build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Launch full-model verified STRESS/MISES scene and capture native window
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindowC866 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          New-Item -ItemType Directory -Force artifact/c8-66 | Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $ready=(Join-Path $PWD 'artifact/c8-66/RESULTS_FULL_MODEL_READY.json')
          $stdout=(Join-Path $PWD 'artifact/c8-66/results.stdout.log')
          $stderr=(Join-Path $PWD 'artifact/c8-66/results.stderr.log')
          $env:ASTERMAX_RESULTS_FULL_MODEL_PMX=$env:C866_PMX
          $env:ASTERMAX_RESULTS_EXPECTED_NODES=$env:C866_EXPECTED_NODES
          $env:ASTERMAX_RESULTS_EXPECTED_ELEMENTS='2474'
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_MAX=$env:C866_EXPECTED_MISES
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_MAX=$env:C866_EXPECTED_DISP
          $p=Start-Process -FilePath $exe -ArgumentList @('--astermax-results-demo',$env:C866_RMED,$env:C866_RESU,$ready) -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $deadline=(Get-Date).AddSeconds(90)
          while(-not(Test-Path $ready) -and (Get-Date)-lt $deadline){Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){Get-Content $stderr -ErrorAction SilentlyContinue;throw "Results process exited early: $($p.ExitCode)"}}
          if(-not(Test-Path $ready)){throw 'Timed out waiting for full-model Results READY.'}
          $s=Get-Content $ready -Raw|ConvertFrom-Json
          if(-not $s.scene_ready -or -not $s.result_admitted -or -not $s.native_draw_invoked){throw 'Results scene did not reach READY.'}
          if(-not $s.full_model_pmx_loaded){throw 'C8.66 did not load the persisted PMX mesh.'}
          if([int]$s.mesh_nodes -ne [int]$env:C866_EXPECTED_NODES){throw "Mesh node mismatch: $($s.mesh_nodes)"}
          if(-not $s.native_scalar_bar_semantically_verified -or -not $s.native_scalar_bar_range_matches_field){throw 'Native scalar-bar semantic gate failed.'}
          $expectedM=[double]::Parse($env:C866_EXPECTED_MISES,[Globalization.CultureInfo]::InvariantCulture)
          $expectedU=[double]::Parse($env:C866_EXPECTED_DISP,[Globalization.CultureInfo]::InvariantCulture)
          if([math]::Abs([double]$s.mises_max_mpa-$expectedM) -gt 1e-5){throw "Mises max mismatch: $($s.mises_max_mpa) vs $expectedM"}
          if([math]::Abs([double]$s.disp_max_mm-$expectedU) -gt 1e-9){throw "Disp max mismatch: $($s.disp_max_mm) vs $expectedU"}
          $windowDeadline=(Get-Date).AddSeconds(20)
          do{Start-Sleep -Milliseconds 250;$p.Refresh()}while($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and (Get-Date)-lt $windowDeadline)
          if($p.HasExited -or $p.MainWindowHandle -eq 0){throw 'No live AsterMax native window for capture.'}
          [NativeWindowC866]::SetForegroundWindow($p.MainWindowHandle)|Out-Null; Start-Sleep -Seconds 2
          $r=New-Object NativeWindowC866+RECT
          if(-not [NativeWindowC866]::GetWindowRect($p.MainWindowHandle,[ref]$r)){throw 'GetWindowRect failed.'}
          $w=$r.Right-$r.Left;$h=$r.Bottom-$r.Top;if($w -lt 640 -or $h -lt 480){throw "Window too small: ${w}x${h}"}
          $bmp=New-Object Drawing.Bitmap($w,$h);$g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)
          $png=(Join-Path $PWD 'artifact/c8-66/AsterMax-C8.66-full-model-verified-results.png');$bmp.Save($png,[Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bmp.Dispose()
          if((Get-Item $png).Length -lt 15000){throw 'Native Results screenshot unexpectedly small.'}
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Emit fail-closed C8.66 evidence
        shell: pwsh
        run: |
          $s=Get-Content artifact/c8-66/RESULTS_FULL_MODEL_READY.json -Raw|ConvertFrom-Json
          $prior=Get-Content $env:C866_PRIOR_EVIDENCE -Raw|ConvertFrom-Json
          @{
            schema='astermax.c8.66.full-model-native-results.v1';commit='${{ github.sha }}';source_solver_run=[long]$env:C865_RUN_ID;source_solver_commit=$env:C865_SHA
            source_solver_verified=[bool]$prior.solver_verified;source_result_fields_verified=[bool]$prior.result_field_values_verified;source_reaction_equilibrium_verified=[bool]$prior.reaction_equilibrium_verified
            persisted_pmx_loaded=[bool]$s.full_model_pmx_loaded;mesh_nodes=[int]$s.mesh_nodes;mesh_elements=2474;field='STRESS/MISES';unit='MPa';mises_max_mpa=[double]$s.mises_max_mpa;disp_max_mm=[double]$s.disp_max_mm
            native_results_view=$true;native_color_contours=$true;native_scalar_bar_semantically_verified=[bool]$s.native_scalar_bar_semantically_verified;screenshot_captured_after_ready=$true
            pmx_sha256=(Get-FileHash $env:C866_PMX -Algorithm SHA256).Hash.ToLowerInvariant();rmed_sha256=(Get-FileHash $env:C866_RMED -Algorithm SHA256).Hash.ToLowerInvariant();resu_sha256=(Get-FileHash $env:C866_RESU -Algorithm SHA256).Hash.ToLowerInvariant();screenshot_sha256=(Get-FileHash artifact/c8-66/AsterMax-C8.66-full-model-verified-results.png -Algorithm SHA256).Hash.ToLowerInvariant()
            contour_field_semantics_verified=$true;industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 5|Set-Content artifact/c8-66/C8_66_FULL_MODEL_RESULTS_EVIDENCE.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.66-Full-Model-Verified-Results-${{ github.sha }}
          path: artifact/c8-66/**
          if-no-files-found: warn
          retention-days: 14
