name: C8.51 Native CAE Glyph Layer Windows

on:
  push:
    branches: [agent/c8-51-native-cae-glyph-layer]
  workflow_dispatch:

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - name: Restore
        shell: pwsh
        run: nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Verify C8.51 glyph contract
        shell: pwsh
        run: |
          $glyph = Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxGlyphLayer.cs' -Raw
          foreach ($token in @('ENGINEERING GLYPHS','SCREEN SPACE · OBSERVED MODEL STATE','FIXED SUPPORT','FORCE','PRESSURE','MESH EDGES','NOT ENTITY-ANCHORED · NOT SOLVER VERIFIED','ProbeTypedCount','ProbePresence')) {
            if ($glyph -notmatch [regex]::Escape($token)) { throw "Missing C8.51 glyph token: $token" }
          }
          if ($glyph -match 'solver_verified\s*=\s*true|VERIFIED\s*=') { throw 'Glyph layer must not synthesize solver verification.' }
          $integration = Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxGlyphIntegration.cs' -Raw
          if ($integration -notmatch 'InstallAsterMaxGlyphLayer') { throw 'Glyph layer is not integrated into FrmMain.' }
          $frm = Get-Content 'build/PrePoMax-CodeAster/PrePoMax/Forms/FrmMain.cs' -Raw
          if ($frm -notmatch 'InstallAsterMaxGlyphLayer\(\)') { throw 'Bootstrap did not install the glyph layer.' }
      - name: Launch and capture native GUI
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class NativeWin51 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int nCmdShow);
          }
          "@
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 500; $p.Refresh(); if($p.HasExited){throw 'GUI exited early'} } while($p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
          if($p.MainWindowHandle -eq 0){throw 'No native window'}
          if($p.MainWindowTitle -notmatch '^AsterMax Mechanical'){throw "Unexpected title: $($p.MainWindowTitle)"}
          [NativeWin51]::ShowWindow($p.MainWindowHandle,3)|Out-Null
          [NativeWin51]::SetForegroundWindow($p.MainWindowHandle)|Out-Null
          Start-Sleep -Seconds 3
          $r=New-Object NativeWin51+RECT; [NativeWin51]::GetWindowRect($p.MainWindowHandle,[ref]$r)|Out-Null
          $w=$r.Right-$r.Left; $h=$r.Bottom-$r.Top
          if($w -lt 1000 -or $h -lt 700){throw "Native demo window below hosted-runner evidence threshold: ${w}x${h}"}
          $bmp=New-Object Drawing.Bitmap $w,$h; $g=[Drawing.Graphics]::FromImage($bmp)
          try{$g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)}finally{$g.Dispose()}
          $png='artifact/C8.51_NATIVE_CAE_GLYPHS.png'; $bmp.Save((Join-Path $PWD $png),[Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          @{title=$p.MainWindowTitle;width=$w;height=$h;screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant()}|ConvertTo-Json|Set-Content -Encoding UTF8 artifact/C8.51_WINDOW_EVIDENCE.json
          Stop-Process -Id $p.Id -Force
      - name: Write evidence
        shell: pwsh
        run: |
          @{schema='astermax.native-cae-glyph-layer.v1';version='C8.51';commit='${{ github.sha }}';screen_space_glyph_layer=$true;fixed_support_glyph=$true;force_glyph=$true;pressure_glyph=$true;mesh_glyph=$true;entity_anchored=$false;solver_verified_inferred=$false;solver_logic_modified=$false;industrial_validation=$false;ansys_equivalence=$false}|ConvertTo-Json|Set-Content -Encoding UTF8 artifact/C8.51_UI_EVIDENCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.51-Native-CAE-Glyph-Layer-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
