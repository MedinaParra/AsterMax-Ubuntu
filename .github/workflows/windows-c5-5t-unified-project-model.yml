name: Windows C5.5t Unified Project Model

on:
  pull_request:
  workflow_dispatch:

jobs:
  unified-project-model:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/unified_project_model.py
      - name: C5.5t unified project harness
        run: python -m pytest -q tests/test_unified_project_model.py
      - name: Portable project and adaptive Results regressions
        run: python -m pytest -q tests/test_project_session_shell.py tests/test_portable_adaptive_results.py tests/test_adaptive_execution_bundle.py tests/test_adaptive_stress_comparison.py tests/test_adaptive_hotspot_visualization.py
      - name: CAD STEP and desktop regressions
        run: python -m pytest -q tests/test_step_to_solve.py tests/test_cad_face_picker.py tests/test_production_results.py
      - name: Full regression suite
        run: python -m pytest -q
