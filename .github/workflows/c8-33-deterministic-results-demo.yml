name: C8.33 Deterministic verified Results demo

on:
  push:
    branches:
      - agent/c8-33-deterministic-verified-results-demo
    paths:
      - 'integrations/prepomax-codeaster/**'
      - '.github/workflows/c8-33-deterministic-results-demo.yml'
  workflow_dispatch:

concurrency:
  group: c8-33-results-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Genuine Code_Aster 17.4.0 solve
        shell: bash
        run: |
          chmod -R a+rwX integrations/prepomax-codeaster/smoke/codeaster-linear-tetra
          docker pull simvia/code_aster:17.4.0
          python integrations/prepomax-codeaster/harness/astermax_harness.py \
            --manifest integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/smoke.harness.manifest.json
      - name: Independent mm-N-MPa oracle
        shell: bash
        run: |
          python integrations/prepomax-codeaster/harness/validate_numeric_reference.py \
            --resu integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/smoke.resu \
            --contract integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/c8-29-reference-contract.json
      - name: Stage genuine evidence
        shell: bash
        run: |
          mkdir -p artifact/genuine
          cp integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/{smoke.rmed,smoke.resu,smoke.mess,smoke.harness.json} artifact/genuine/
          sha256sum artifact/genuine/* > artifact/genuine/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c8-33-genuine-${{ github.sha }}
          path: artifact/genuine/**
          if-no-files-found: error

  windows-results-demo:
    needs: genuine-solve
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: c8-33-genuine-${{ github.sha }}
          path: genuine
      - name: Bootstrap pinned AsterMax source
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Launch deterministic verified Results scene
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $rmed=(Resolve-Path 'genuine/smoke.rmed').Path
          $resu=(Resolve-Path 'genuine/smoke.resu').Path
          New-Item -ItemType Directory -Force 'artifact/c8-33' | Out-Null
          $ready=(Join-Path $PWD 'artifact/c8-33/RESULTS_DEMO_READY.json')
          $stdout=(Join-Path $PWD 'artifact/c8-33/results-demo.stdout.log')
          $stderr=(Join-Path $PWD 'artifact/c8-33/results-demo.stderr.log')
          $p=Start-Process -FilePath $exe -ArgumentList @('--astermax-results-demo',$rmed,$resu,$ready) -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          "ASTERMAX_DEMO_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ASTERMAX_DEMO_READY=$ready" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $deadline=(Get-Date).AddSeconds(45)
          do {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if($p.HasExited){
              Write-Host (Get-Content $stdout -Raw -ErrorAction SilentlyContinue)
              Write-Host (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
              throw "Results demo exited before READY. ExitCode=$($p.ExitCode)"
            }
          } while(-not (Test-Path $ready) -and (Get-Date) -lt $deadline)
          if(-not (Test-Path $ready)){ throw 'Timed out waiting for deterministic Results scene READY marker.' }
          $state=Get-Content $ready -Raw | ConvertFrom-Json
          if(-not $state.scene_ready -or -not $state.result_admitted -or -not $state.native_draw_invoked){ throw 'Results demo READY marker is incomplete.' }
          if($state.field -ne 'STRESS' -or $state.component -ne 'MISES'){ throw 'Results demo did not select STRESS/MISES.' }
      - name: Capture native Results window after READY
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindowC833 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          $p=Get-Process -Id ([int]$env:ASTERMAX_DEMO_PID)
          $deadline=(Get-Date).AddSeconds(20)
          do { Start-Sleep -Milliseconds 500; $p.Refresh() } while($p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
          if($p.MainWindowHandle -eq 0){ throw 'Verified Results demo has no native main window.' }
          if($p.MainWindowTitle -notlike 'AsterMax Mechanical*'){ throw "Unexpected window title: $($p.MainWindowTitle)" }
          [NativeWindowC833]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          $r=New-Object NativeWindowC833+RECT
          if(-not [NativeWindowC833]::GetWindowRect($p.MainWindowHandle,[ref]$r)){ throw 'GetWindowRect failed.' }
          $w=$r.Right-$r.Left; $h=$r.Bottom-$r.Top
          if($w -lt 640 -or $h -lt 480){ throw "Native Results window too small: ${w}x${h}" }
          $bmp=New-Object System.Drawing.Bitmap($w,$h)
          $g=[System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)
          $png=Join-Path $PWD 'artifact/c8-33/AsterMax-C8.33-verified-results-scene.png'
          $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          if((Get-Item $png).Length -lt 15000){ throw 'Verified Results screenshot is unexpectedly small.' }
          Stop-Process -Id $p.Id -Force
      - name: Emit content-addressed C8.33 evidence
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $png=(Resolve-Path 'artifact/c8-33/AsterMax-C8.33-verified-results-scene.png').Path
          $ready=(Resolve-Path 'artifact/c8-33/RESULTS_DEMO_READY.json').Path
          @{
            schema='astermax.c8-33-deterministic-results-demo.v1'
            commit='${{ github.sha }}'
            solver='Code_Aster 17.4.0'
            unit_system='mm-N-MPa'
            genuine_solve=$true
            numerical_oracle=$true
            result_admitted_to_live_controller=$true
            selected_field='STRESS/MISES'
            deformation_field='DISP/ALL'
            native_draw_invoked=$true
            screenshot_captured_after_scene_ready=$true
            executable_sha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            rmed_sha256=(Get-FileHash genuine/smoke.rmed -Algorithm SHA256).Hash.ToLowerInvariant()
            resu_sha256=(Get-FileHash genuine/smoke.resu -Algorithm SHA256).Hash.ToLowerInvariant()
            ready_state_sha256=(Get-FileHash $ready -Algorithm SHA256).Hash.ToLowerInvariant()
            screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant()
            contour_pixels_semantically_verified=$false
            industrial_validation=$false
            ansys_equivalence=$false
          } | ConvertTo-Json -Depth 4 | Set-Content artifact/c8-33/C8_33_EVIDENCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.33-deterministic-results-demo-${{ github.sha }}
          path: artifact/c8-33/**
          if-no-files-found: error
          retention-days: 14
