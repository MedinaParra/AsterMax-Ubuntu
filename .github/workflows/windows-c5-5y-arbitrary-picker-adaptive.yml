name: Windows C5.5y Arbitrary Picker Adaptive Cutover

on:
  pull_request:
  workflow_dispatch:

jobs:
  arbitrary-picker-adaptive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/adaptive_picker_authoring.py src/astermax/fea/cad_face_picker.py src/astermax/fea/native_adaptive_analysis.py
      - name: C5.5y real sloped-face picker adaptive harness
        run: python -m pytest -q tests/test_adaptive_picker_authoring.py
      - name: Picker and arbitrary BC regressions
        run: python -m pytest -q tests/test_cad_face_picker.py tests/test_arbitrary_bc.py
      - name: Native adaptive and persistent face regressions
        run: python -m pytest -q tests/test_native_adaptive_analysis.py tests/test_persistent_geometry.py tests/test_face_ownership.py
      - name: Adaptive Results regressions
        run: python -m pytest -q tests/test_adaptive_execution_bundle.py tests/test_adaptive_hotspot_visualization.py tests/test_adaptive_stress_comparison.py
      - name: Full regression suite
        run: python -m pytest -q
