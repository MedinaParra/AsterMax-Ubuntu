name: AsterMax C9.97 Windows Professional Demo Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/astermax-c990-windows-build.yml'
      - 'native-windows/patch-c965-results-workspace.ps1'
      - 'native-windows/patch-c966-results-scene.ps1'
      - 'native-windows/patch-c967-vtk-results-binding.ps1'
      - 'native-windows/patch-c968-professional-results-hud.ps1'
      - 'native-windows/patch-c969-renderer-synchronized-results.ps1'
      - 'native-windows/patch-c970-native-3d-probe.ps1'
      - 'native-windows/patch-c971-native-probe-callout.ps1'
      - 'native-windows/patch-c972-native-framebuffer-evidence.ps1'
      - 'native-windows/patch-c974-solver-provenance.ps1'
      - 'native-windows/patch-c975-analysis-provenance-manifest.ps1'
      - 'native-windows/patch-c976-automatic-model-fingerprint.ps1'
      - 'native-windows/patch-c977-pre-solve-readiness.ps1'
      - 'native-windows/patch-c978-assignment-hexa8-quality.ps1'
      - 'native-windows/patch-c985-model-fidelity-gate.ps1'
      - 'native-windows/patch-c991-startup-hardening.ps1'
      - 'native-windows/patch-c992-startup-viewport.ps1'
  workflow_dispatch:

jobs:
  windows-x64-release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Apply AsterMax production + professional demo patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\native-windows\patch-astermax.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-branding.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c965-results-workspace.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c966-results-scene.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c967-vtk-results-binding.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c968-professional-results-hud.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c969-renderer-synchronized-results.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c970-native-3d-probe.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c971-native-probe-callout.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c972-native-framebuffer-evidence.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c974-solver-provenance.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c975-analysis-provenance-manifest.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c976-automatic-model-fingerprint.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c977-pre-solve-readiness.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c978-assignment-hexa8-quality.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c985-model-fidelity-gate.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c991-startup-hardening.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c992-startup-viewport.ps1 -Root "$PWD\upstream"

      - name: Gate professional demo source composition
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $forms = Join-Path $PWD 'upstream\PrePoMax\Forms'
          $required = @(
            'AsterMaxResultsWorkspace.cs',
            'AsterMaxResultsScene.cs',
            'AsterMaxVtkResultsBinding.cs'
          )
          foreach($f in $required){
            if(-not (Test-Path (Join-Path $forms $f))){ throw "Professional demo source missing: $f" }
          }
          $ui = Get-Content (Join-Path $forms 'AsterMaxNativeUi.cs') -Raw
          foreach($token in @('Results Explorer','FEA Viewport')){
            if(-not $ui.Contains($token)){ throw "Professional UI command missing: $token" }
          }
          $vtk = Get-Content (Join-Path $forms 'AsterMaxVtkResultsBinding.cs') -Raw
          foreach($token in @('vtkMaxActorData','AddCells','DeformedCoordinates','Connectivity')){
            if(-not $vtk.Contains($token)){ throw "VTK binding contract missing: $token" }
          }
          Write-Host 'PROFESSIONAL_DEMO_SOURCE_GATE=PASS'

      - name: Restore packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Rebuild AsterMax Mechanical Windows x64 Release
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: ModelTree constructor smoke gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing' }
          $root=(Resolve-Path .\upstream).Path
          $uc=Get-ChildItem .\upstream -Recurse -Filter 'UserControls.dll' | Where-Object {$_.FullName -match 'UserControls\\bin\\Release'} | Select-Object -First 1
          if(-not $uc){ throw 'UserControls.dll missing' }
          $script=@"
          `$ErrorActionPreference='Stop'
          `$global:root='$root'
          [AppDomain]::CurrentDomain.add_AssemblyResolve({
            param(`$sender,`$args)
            `$name=([Reflection.AssemblyName]`$args.Name).Name + '.dll'
            `$cand=Get-ChildItem `$global:root -Recurse -Filter `$name -ErrorAction SilentlyContinue | Where-Object { `$_.FullName -match 'bin\\(x64\\)?Release|packages' } | Select-Object -First 1
            if(`$cand){ return [Reflection.Assembly]::LoadFrom(`$cand.FullName) }
            return `$null
          })
          `$asm=[Reflection.Assembly]::LoadFrom('$($uc.FullName)')
          `$type=`$asm.GetType('UserControls.ModelTree', `$true)
          `$tree=[Activator]::CreateInstance(`$type)
          if(`$null -eq `$tree){ throw 'ModelTree constructor returned null' }
          Write-Host 'MODEL_TREE_CONSTRUCTOR=PASS'
          `$tree.Dispose()
          "@
          $smoke=Join-Path $PWD 'modeltree-smoke.ps1'
          Set-Content $smoke $script -Encoding UTF8
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File $smoke
          if($LASTEXITCODE -ne 0){ throw "ModelTree smoke gate failed: $LASTEXITCODE" }

      - name: Stage distributable professional demo runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing after rebuild' }
          $bin=$exe.Directory.FullName
          New-Item -ItemType Directory -Force .\dist | Out-Null
          Copy-Item "$bin\*" .\dist\ -Recurse -Force
          $exeHash=(Get-FileHash '.\dist\AsterMax Mechanical.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            release='C9.97'
            platform='Windows x64'
            configuration='Release'
            upstream_prepomax='3669e65581650e5d9d868aa761db9efd856f8571'
            executable='AsterMax Mechanical.exe'
            executable_sha256=$exeHash
            startup_hardening=$true
            modeltree_constructor_gate='PASS'
            professional_results_workspace=$true
            vtk_real_result_binding=$true
            result_probe=$true
            provenance_ui=$true
            automatic_model_fingerprint=$true
            pre_solve_readiness=$true
            hexa8_quality_gate=$true
            model_fidelity_gate=$true
            solver_backend='Code_Aster'
            unit_contract='MM_N_S_MPA'
            fea_values_invented=$false
            ansys_equivalence='NOT_PROVEN'
            note='Integrated Windows demo build: verified model preparation gates plus professional real-result VTK/probe/provenance stack. No synthetic FEA values are generated.'
          } | ConvertTo-Json | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8
          Get-FileHash .\dist\* -Algorithm SHA256 -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Set-Content .\dist\SHA256.txt
          Write-Host "EXE_SHA256=$exeHash"

      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C9.97-Windows-x64-Professional-Demo
          path: dist
          if-no-files-found: error
