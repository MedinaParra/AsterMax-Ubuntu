name: AsterMax C9.92 Windows Startup + Viewport Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/astermax-c990-windows-build.yml'
      - 'native-windows/patch-c991-startup-hardening.ps1'
      - 'native-windows/patch-c992-startup-viewport.ps1'
  workflow_dispatch:

jobs:
  windows-x64-release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Apply AsterMax production patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\native-windows\patch-astermax.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-branding.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c965-results-workspace.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c976-automatic-model-fingerprint.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c985-model-fidelity-gate.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c991-startup-hardening.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c992-startup-viewport.ps1 -Root "$PWD\upstream"
      - name: Restore packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Rebuild AsterMax Mechanical Windows x64 Release
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: ModelTree constructor smoke gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing' }
          $bin=$exe.Directory.FullName
          $uc=Get-ChildItem $bin -Recurse -Filter 'UserControls.dll' | Select-Object -First 1
          if(-not $uc){ $uc=Get-ChildItem .\upstream -Recurse -Filter 'UserControls.dll' | Where-Object {$_.FullName -match 'bin\\(x64\\)?Release'} | Select-Object -First 1 }
          if(-not $uc){ throw 'UserControls.dll missing' }
          $script=@"
          `$ErrorActionPreference='Stop'
          [Environment]::CurrentDirectory='$($uc.Directory.FullName)'
          [void][Reflection.Assembly]::LoadFrom('$($uc.FullName)')
          `$type=[Type]::GetType('UserControls.ModelTree, UserControls', `$true)
          `$tree=[Activator]::CreateInstance(`$type)
          if(`$null -eq `$tree){ throw 'ModelTree constructor returned null' }
          Write-Host 'MODEL_TREE_CONSTRUCTOR=PASS'
          `$tree.Dispose()
          "@
          $smoke=Join-Path $PWD 'modeltree-smoke.ps1'
          Set-Content $smoke $script -Encoding UTF8
          & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File $smoke
          if($LASTEXITCODE -ne 0){ throw "ModelTree smoke gate failed: $LASTEXITCODE" }
      - name: Stage distributable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing after rebuild' }
          $bin=$exe.Directory.FullName
          New-Item -ItemType Directory -Force .\dist | Out-Null
          Copy-Item "$bin\*" .\dist\ -Recurse -Force
          $exeHash=(Get-FileHash '.\dist\AsterMax Mechanical.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            release='C9.92'
            platform='Windows x64'
            configuration='Release'
            upstream_prepomax='3669e65581650e5d9d868aa761db9efd856f8571'
            executable='AsterMax Mechanical.exe'
            executable_sha256=$exeHash
            startup_hardening=$true
            modeltree_constructor_gate='PASS'
            vtk_post_chrome_relayout=$true
            fea_values_invented=$false
            note='ModelTree validated lookup plus post-ribbon VTK relayout. Code_Aster is not bundled in this artifact.'
          } | ConvertTo-Json | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8
          Get-FileHash .\dist\* -Algorithm SHA256 -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Set-Content .\dist\SHA256.txt
          Write-Host "EXE_SHA256=$exeHash"
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C9.92-Windows-x64-Release
          path: dist
          if-no-files-found: error
