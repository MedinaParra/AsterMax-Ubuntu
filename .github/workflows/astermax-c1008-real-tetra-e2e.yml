name: AsterMax C10.10 Real Tetra + Portable CAD Runtime

on:
  workflow_dispatch:
  push:
    branches: [ codex/c1004-unified-native-codeaster ]
    paths:
      - 'native-windows/c1008-real-tetra/**'
      - 'native-windows/patch-c1008-aster-group-records.ps1'
      - 'native-windows/patch-c10081-portable-cad-smoke.ps1'
      - 'native-windows/patch-c1009-functional-outline.ps1'
      - 'native-windows/ModelTree.AsterMaxOutline.cs'
      - 'native-windows/AsterMaxButtonAudit.cs'
      - 'native-windows/AsterMaxWorkflowStates.cs'
      - 'native-windows/patch-c1010-button-audit.ps1'
      - 'native-windows/audit-c1010-buttons.py'
      - '.github/workflows/astermax-c1008-real-tetra-e2e.yml'

jobs:
  real-codeaster-tetra:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout AsterMax
        uses: actions/checkout@v5
      - name: Prepare deterministic TETRA4 model
        shell: bash
        run: |
          set -euxo pipefail
          python3 native-windows/c1008-real-tetra/generate_tetra_bar.py --out c1008-evidence --name astermax-tet4-bar
          cp native-windows/c1008-real-tetra/validate_c1008.py c1008-evidence/
          cp native-windows/bridge-c964-med-results.py c1008-evidence/
          chmod -R 0777 c1008-evidence
          sha256sum c1008-evidence/astermax-tet4-bar.comm c1008-evidence/astermax-tet4-bar.mail c1008-evidence/astermax-tet4-bar.export > c1008-evidence/INPUT_SHA256.txt
      - name: Pull pinned genuine Code_Aster
        shell: bash
        run: |
          set -euxo pipefail
          docker pull scimulate/code_aster:15.2
          docker image inspect scimulate/code_aster:15.2 --format '{{json .RepoDigests}}' | tee c1008-evidence/CODE_ASTER_IMAGE_DIGEST.txt
      - name: Execute genuine Code_Aster TETRA4 solve
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --volume "$PWD/c1008-evidence:/analysis" scimulate/code_aster:15.2 /opt/aster/bin/as_run /analysis/astermax-tet4-bar.export | tee c1008-evidence/CODE_ASTER_STDOUT.log
          test -s c1008-evidence/astermax-tet4-bar.mess
          test -s c1008-evidence/astermax-tet4-bar.rmed
      - name: Install production MED bridge dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check numpy h5py
      - name: Convert genuine MED results to AsterMax VTK bundle
        shell: bash
        run: |
          set -euxo pipefail
          ASTERMAX_MED_BRIDGE_MODE=production python3 c1008-evidence/bridge-c964-med-results.py \
            c1008-evidence/astermax-tet4-bar.rmed \
            c1008-evidence/astermax-tet4-bar.astermax-results.json \
            c1008-evidence/astermax-tet4-bar.astermax-results.vtu | tee c1008-evidence/MED_BRIDGE_STDOUT.log
      - name: Validate physics, equilibrium and tetra results handoff
        shell: bash
        run: python3 c1008-evidence/validate_c1008.py --root c1008-evidence --name astermax-tet4-bar
      - name: Seal numerical evidence
        if: always()
        shell: bash
        run: |
          find c1008-evidence -type f ! -name OUTPUT_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > c1008-evidence/OUTPUT_SHA256.txt
      - name: Upload genuine C10.08 solver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.08-Real-Tetra-CodeAster-Evidence
          path: c1008-evidence
          if-no-files-found: error

  windows-x64-portable:
    needs: real-codeaster-tetra
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AsterMax integration branch
        uses: actions/checkout@v5
      - name: Download admitted genuine solver evidence
        uses: actions/download-artifact@v5
        with:
          name: AsterMax-C10.08-Real-Tetra-CodeAster-Evidence
          path: C10.08-Validation
      - name: Reject an unverified numerical handoff
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=Get-Content .\C10.08-Validation\C10.08_REAL_TETRA_VALIDATION.json -Raw | ConvertFrom-Json
          if(-not $v.all_checks_pass){ throw 'Genuine Code_Aster TETRA4 evidence was not admitted.' }
          if($v.solver_execution -ne 'RUN' -or $v.scientific_integrity.fea_values_invented){ throw 'Numerical evidence integrity contract failed.' }
      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Apply integrated AsterMax chain through C10.08
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patches=@(
            'patch-astermax.ps1','patch-branding.ps1','patch-c960-native-bridge.ps1',
            'patch-c961-native-codeaster-export.ps1','patch-c965-results-workspace.ps1',
            'patch-c966-results-scene.ps1','patch-c967-vtk-results-binding.ps1',
            'patch-c968-professional-results-hud.ps1','patch-c969-renderer-synchronized-results.ps1',
            'patch-c970-native-3d-probe.ps1','patch-c971-native-probe-callout.ps1',
            'patch-c972-native-framebuffer-evidence.ps1','patch-c974-solver-provenance.ps1',
            'patch-c975-analysis-provenance-manifest.ps1','patch-c976-automatic-model-fingerprint.ps1',
            'patch-c977-pre-solve-readiness.ps1','patch-c978-assignment-hexa8-quality.ps1',
            'patch-c985-model-fidelity-gate.ps1','patch-c998-current-model-results-gate.ps1',
            'patch-c991-startup-hardening.ps1','patch-c992-startup-viewport.ps1',
            'patch-c1000-native-solve-transaction.ps1','patch-c1001-automatic-results-handoff.ps1',
            'patch-c1002-runtime-discovery.ps1','patch-c1003-runtime-readiness.ps1',
            'patch-c1004-tetra-native-solve.ps1','patch-c1005-codeaster-runner-probe.ps1',
            'patch-c1006-python-med-runtime-probe.ps1','patch-c1008-aster-group-records.ps1',
            'patch-c10081-portable-cad-smoke.ps1','patch-c1009-functional-outline.ps1','patch-c1010-button-audit.ps1'
          )
          foreach($p in $patches){ Write-Host "Applying $p"; & ".\native-windows\$p" -Root "$PWD\upstream" }
      - name: Gate production exporter group records
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exporter=Get-Content .\upstream\PrePoMax\AsterMaxCodeAsterNativeExporter.cs -Raw
          foreach($t in @('C10.08-native-codeaster-tetra-v2','GROUP_NO NOM = ','idsPerRecord=8','CreateAsterGroupName','RequireMappedGroup','GROUP_NO_NOM_WRAPPED_8')){
            if(-not $exporter.Contains($t)){ throw "C10.08 exporter token missing: $t" }
          }
          if($exporter.Contains('mail.Add("GROUP_NO");')){ throw 'Legacy unnamed GROUP_NO record remains.' }
      - name: Install Windows Python MED runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Qualify Windows Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy h5py
      - name: Inventory all native buttons and ribbon bindings
        shell: pwsh
        run: python .\native-windows\audit-c1010-buttons.py --root .\upstream --out .\button-audit
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Rebuild Windows x64 Release
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Assemble pinned CAD and NetGen runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing before CAD runtime assembly.' }
          $bin=$exe.Directory.FullName
          $runtimeUrl='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          $runtimeSha256='954f406b65a08cb2fb47ef2fb02b03e4f70aa9c97e0979bd7048448273e17d46'
          Invoke-WebRequest $runtimeUrl -OutFile runtime.zip
          $actual=(Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $runtimeSha256){ throw "Pinned CAD runtime digest mismatch: $actual" }
          Expand-Archive runtime.zip runtime
          $ng=Get-ChildItem runtime -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $ng){ throw 'Matching NetGen CAD mesher not found in pinned runtime.' }
          Copy-Item $ng.Directory.FullName (Join-Path $bin 'NetGen') -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $bin 'Temp') | Out-Null
          foreach($project in @('CaeGlobals','CaeJob','CaeMesh','CaeModel','CaeResults','UserControls','vtkControl')){
            $dir=Join-Path $PWD "upstream\$project\bin\x64\Release"
            if(Test-Path $dir){ Get-ChildItem $dir -Filter *.dll | Copy-Item -Destination (Join-Path $bin 'lib') -Force }
          }
          $mesher=Join-Path $bin 'NetGen\NetGenMesher.exe'
          if(-not(Test-Path $mesher)){ throw 'NetGenMesher.exe was not assembled beside AsterMax.' }
          if((Get-Item $mesher).Length -lt 50000){ throw 'NetGenMesher.exe payload is unexpectedly small.' }
          "source=$runtimeUrl`nsha256=$runtimeSha256`nnetgen=$mesher" | Set-Content (Join-Path $bin 'CAD-RUNTIME-PROVENANCE.txt') -Encoding UTF8
      - name: Package pinned OpenGL fallback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          $bin=$exe.Directory.FullName
          $mesaSha256='dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z' -OutFile mesa.7z
          if((Get-FileHash mesa.7z -Algorithm SHA256).Hash.ToLowerInvariant() -ne $mesaSha256){ throw 'Mesa archive digest mismatch.' }
          & 7z x mesa.7z -omesa -y | Out-Null
          if($LASTEXITCODE -ne 0){ throw 'Mesa extraction failed.' }
          foreach($name in @('opengl32.dll','libgallium_wgl.dll','dxil.dll')){
            $dll=Get-ChildItem mesa -Recurse -Filter $name | Where-Object {$_.FullName -match '\\x64\\'} | Select-Object -First 1
            if(-not $dll){ throw "Missing x64 OpenGL dependency: $name" }
            Copy-Item $dll.FullName $bin -Force
          }
          $licenseDir=Join-Path $bin 'licenses\Mesa'
          New-Item -ItemType Directory -Force $licenseDir | Out-Null
          Get-ChildItem mesa -Recurse -File | Where-Object {$_.Name -match 'license|copying|copyright'} | Copy-Item -Destination $licenseDir -Force
          "Mesa 26.2.0; archive SHA256 $mesaSha256; https://github.com/pal1000/mesa-dist-win" | Set-Content (Join-Path $licenseDir 'SOURCE.txt')
          'GALLIUM_DRIVER=llvmpipe' | Out-File $env:GITHUB_ENV -Append
      - name: Stage C10.10 portable package with CAD and Python MED runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing' }
          New-Item -ItemType Directory -Force .\dist | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" .\dist\ -Recurse -Force
          New-Item -ItemType Directory -Force .\dist\AsterMaxTools | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\Python | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\CodeAster | Out-Null
          Copy-Item .\native-windows\bridge-c964-med-results.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\bind-c998-results-fingerprint.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\runtime\CodeAster\astermax-codeaster-runner.cmd .\dist\AsterMaxRuntime\CodeAster\ -Force
          Copy-Item .\native-windows\runtime\CodeAster\astermax-codeaster-runner.ps1 .\dist\AsterMaxRuntime\CodeAster\ -Force
          $pythonRoot=Split-Path (Get-Command python).Source -Parent
          Copy-Item "$pythonRoot\*" .\dist\AsterMaxRuntime\Python\ -Recurse -Force
          & .\dist\AsterMaxRuntime\Python\python.exe -c "import sys,numpy,h5py; print('ASTERMAX_PACKAGED_PYTHON_MED_OK|'+sys.version.split()[0]+'|numpy='+numpy.__version__+'|h5py='+h5py.__version__)"
          if($LASTEXITCODE -ne 0){ throw 'Packaged Python MED runtime is not portable.' }
          Copy-Item .\C10.08-Validation .\dist\Validation\C10.08 -Recurse -Force
          Copy-Item .\native-windows\AUDIT-C10.09.md .\dist\AUDIT-C10.09.md -Force
          Copy-Item .\button-audit .\dist\Audit -Recurse -Force
          @'
          AsterMax Mechanical C10.10 portable hotfix
          1. Extract the complete ZIP before starting AsterMax Mechanical.exe.
          2. The native CAD/STEP and NetGen meshing runtime is included and package-tested.
          3. The Python MED/VTK postprocessor is included and pre-qualified.
          4. A genuine Code_Aster installation inside WSL2 is still required for local Solve.
          5. Use Solution > Runtime/PREFLIGHT; Solve remains blocked if the genuine backend is absent.
          6. The included Validation/C10.08 evidence comes from a real Code_Aster TETRA4 run; it is not synthetic FEA output.
          '@ | Set-Content .\dist\LEEME-C10.10.txt -Encoding UTF8
          $hash=(Get-FileHash '.\dist\AsterMax Mechanical.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $netgenHash=(Get-FileHash '.\dist\NetGen\NetGenMesher.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            release='C10.10'
            base_application_release='C10.08'
            branch='codex/c1004-unified-native-codeaster'
            executable_sha256=$hash
            netgen_mesher_sha256=$netgenHash
            cad_runtime_bundled=$true
            cad_runtime_sha256='954f406b65a08cb2fb47ef2fb02b03e4f70aa9c97e0979bd7048448273e17d46'
            solver_backend='Code_Aster'
            solver_transport='WSL2'
            solver_binary_bundled=$false
            python_med_runtime_bundled=$true
            native_element_types=@('TETRA4','TETRA10','HEXA8')
            production_group_records='GROUP_NO_NOM_WRAPPED_8'
            genuine_tetra_solver_fixture_validated=$true
            gui_initiated_local_solve_validated=$false
            unit_contract='MM_N_S_MPA'
            fea_values_invented=$false
            numerical_solve_claimed=$true
            claim_scope='The bundled evidence is a genuine Code_Aster TETRA4 admission case. Local GUI Solve still requires a real WSL2 Code_Aster backend.'
          } | ConvertTo-Json -Depth 5 | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8
      - name: Gate portable CAD payload and real STEP import
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($required in @(
            '.\dist\AsterMax Mechanical.exe',
            '.\dist\NetGen\NetGenMesher.exe',
            '.\dist\NetGen\nglib.dll',
            '.\dist\NetGen\TKSTEP.dll',
            '.\dist\NetGen\TKernel.dll'
          )){
            if(-not(Test-Path $required)){ throw "Portable CAD payload missing: $required" }
          }
          New-Item -ItemType Directory -Force .\runtime-fixture | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/Airthium/tanatloc/b1b9b084ab5ff04e908ed27eb7828ce847520316/public/doc/cube.stp' -OutFile .\runtime-fixture\cube-mm.stp
          if((Get-Item .\runtime-fixture\cube-mm.stp).Length -lt 1000){ throw 'STEP fixture download invalid.' }
          $report=(Resolve-Path .).Path + '\ASTERMAX_C10081_RUNTIME_STEP.json'
          $step=(Resolve-Path .\runtime-fixture\cube-mm.stp).Path
          $exe=(Resolve-Path '.\dist\AsterMax Mechanical.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList @($step,'-US','MM_TON_S_C',"--ASTERMAX-SMOKE=$report") -WorkingDirectory (Resolve-Path .\dist).Path -PassThru
          if(-not $p.WaitForExit(300000)){
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Portable STEP import gate timed out.'
          }
          if(-not(Test-Path $report)){ throw "AsterMax produced no STEP telemetry. ExitCode=$($p.ExitCode)" }
          $data=Get-Content $report -Raw | ConvertFrom-Json
          if(-not $data.pass){ throw "Portable STEP gate failed: $($data.reason)" }
          if($data.geometry_parts -lt 1 -or $data.geometry_nodes -lt 1){ throw 'Portable STEP import produced no real geometry.' }
          if($data.mesh_nodes -lt 1 -or $data.mesh_elements -lt 1){ throw 'Portable NetGen run produced no real volume mesh.' }
          New-Item -ItemType Directory -Force .\dist\Validation\C10.10 | Out-Null
          Copy-Item $report .\dist\Validation\C10.10\ASTERMAX_C10081_RUNTIME_STEP.json -Force
          foreach($suffix in @('.outline.png','.stages.log','.png','.vtk.png','.vtk.png.txt','.vtk.png.opengl.txt','.vtk.png.base.png')){
            $candidate="$report$suffix"
            if(Test-Path $candidate){ Copy-Item $candidate .\dist\Validation\C10.10\ -Force }
          }
          Get-ChildItem "$report.buttons*" | Copy-Item -Destination .\dist\Validation\C10.10\ -Force
          Copy-Item .\runtime-fixture\cube-mm.stp .\dist\Validation\C10.10\Cube-mm.stp -Force
      - name: Seal and audit final portable package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $m=Get-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Raw | ConvertFrom-Json
          $m | Add-Member -NotePropertyName portable_step_import_validated -NotePropertyValue $true -Force
          $m | Add-Member -NotePropertyName portable_volume_mesh_validated -NotePropertyValue $true -Force
          $m | ConvertTo-Json -Depth 6 | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8
          Get-ChildItem .\dist -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative=$_.FullName.Substring((Resolve-Path .\dist).Path.Length+1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$relative
          } | Set-Content .\dist\PACKAGE_SHA256.txt -Encoding UTF8
          if(-not(Test-Path '.\dist\NetGen\NetGenMesher.exe')){ throw 'Final audit lost NetGenMesher.exe.' }
      - name: Upload C10.10 Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.10-Windows-x64-Outline
          path: dist
          if-no-files-found: error
