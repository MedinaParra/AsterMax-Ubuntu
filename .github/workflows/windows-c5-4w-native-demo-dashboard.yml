name: Windows C5.4w Native Demo Dashboard

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-demo-dashboard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/demo_dashboard.py src/astermax/fea/demo_session.py src/astermax/desktop_picker_app.py
      - name: C5.4w dashboard harness
        run: python -m pytest -q tests/test_demo_dashboard.py tests/test_demo_session.py
      - name: End-to-end desktop and Results regression
        run: python -m pytest -q tests/test_desktop_picker_app.py tests/test_results_workspace_ui.py tests/test_results_section_contour_ui.py tests/test_step_to_solve.py
      - name: Full regression suite
        run: python -m pytest -q
