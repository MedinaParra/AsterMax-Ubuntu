name: Windows C5.5x Native Adaptive Analysis

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-adaptive-analysis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/app.py src/astermax/fea/native_adaptive_analysis.py src/astermax/fea/live_project_capture.py
      - name: C5.5x real native adaptive desktop harness
        run: python -m pytest -q tests/test_native_adaptive_analysis.py
      - name: Adaptive execution and project capture regressions
        run: python -m pytest -q tests/test_solution_driven_local_loop.py tests/test_adaptive_execution_bundle.py tests/test_portable_adaptive_results.py tests/test_live_project_capture.py
      - name: Project and native Results regressions
        run: python -m pytest -q tests/test_project_authoring.py tests/test_unified_project_model.py tests/test_project_session_shell.py tests/test_adaptive_hotspot_visualization.py tests/test_adaptive_stress_comparison.py
      - name: CAD STEP preparation regressions
        run: python -m pytest -q tests/test_step_to_solve.py tests/test_pre_solve_review.py tests/test_visual_model_preparation.py tests/test_cad_face_picker.py
      - name: Full regression suite
        run: python -m pytest -q
