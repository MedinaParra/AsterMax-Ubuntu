name: Windows C8.5 Capability-Driven Outline

on:
  pull_request:
    paths:
      - 'src/astermax/code_aster_capabilities.py'
      - 'src/astermax/code_aster_gui_tree.py'
      - 'src/astermax/windows_capability_outline.py'
      - 'tests/test_code_aster_capabilities.py'
      - 'tests/test_code_aster_gui_tree.py'
      - 'tests/test_windows_capability_outline.py'
      - '.github/workflows/windows-c8-5-capability-outline.yml'
  workflow_dispatch:

concurrency:
  group: c8-5-capability-outline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-outline-contract:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AsterMax and test dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run registry and Windows outline harnesses
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_code_aster_capabilities.py
          tests/test_code_aster_gui_tree.py
          tests/test_windows_capability_outline.py
      - name: Emit fail-closed capability evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          @'
          import json
          from pathlib import Path
          from astermax.windows_capability_outline import capability_outline_evidence
          evidence = capability_outline_evidence()
          assert evidence['fea_solve_executed'] is False
          assert evidence['numerical_verification'] is False
          assert evidence['results_verified'] is False
          assert evidence['industrial_validation'] is False
          assert evidence['ansys_equivalence'] is False
          Path('artifacts/c8-5-capability-outline-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: c8-5-capability-outline-evidence
          path: artifacts/c8-5-capability-outline-evidence.json
