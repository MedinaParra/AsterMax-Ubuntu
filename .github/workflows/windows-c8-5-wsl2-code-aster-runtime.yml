name: Windows C8.5 WSL2 Code_Aster Runtime Contract
on:
  push:
    branches: [agent/c8-5-wsl2-code-aster-runtime]
  workflow_dispatch:
jobs:
  verify-wsl2-runtime-contract:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AsterMax test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Verify C8.4 result extraction contract
        shell: pwsh
        run: python -m pytest -q tests/test_code_aster_result_contract.py
      - name: Verify WSL2 runtime adapter and genuine-solve gate semantics
        shell: pwsh
        run: python -m pytest -q tests/test_code_aster_wsl_runtime.py tests/test_code_aster_reference_run.py
      - name: Record non-solve runtime contract witness
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          from astermax.code_aster_wsl_runtime import CodeAsterWslRuntime
          rt = CodeAsterWslRuntime('smeca-2024', '/opt/salome_meca/tools/Code_aster_stable/bin/run_aster')
          ev = rt.as_evidence()
          assert ev['engine_kind'] == 'CODE_ASTER_WSL2_WINDOWS_HOST'
          assert ev['fea_solve_executed'] is False
          assert ev['results_verified'] is False
          Path('c8-5-evidence').mkdir(exist_ok=True)
          Path('c8-5-evidence/wsl_runtime_contract.json').write_text(json.dumps(ev, indent=2, sort_keys=True), encoding='utf-8')
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.5-wsl2-runtime-contract
          path: c8-5-evidence/wsl_runtime_contract.json
          if-no-files-found: error
