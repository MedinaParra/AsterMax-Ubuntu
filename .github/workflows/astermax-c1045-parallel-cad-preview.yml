name: C10.45 Isolated bounded parallel CAD preview benchmark
on:
  push:
    branches: [agent/c1045-parallel-cad-preview]
  workflow_dispatch:

jobs:
  windows-parallel-preview:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout AsterMax branch
        uses: actions/checkout@v5

      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Validate C10.41 release patch chain
        shell: pwsh
        run: python native-windows/validate-patch-chain.py

      - name: Apply C10.41 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $chain=Get-Content native-windows/patch-chain.json -Raw | ConvertFrom-Json
          $patches=@($chain.patches | ForEach-Object{$_.file})
          & ./native-windows/harness-c10208a-patch-chain.ps1 -Root "$PWD/upstream" -Patches $patches -OutDir "$PWD/dist/Audit/PatchChain"
          if($LASTEXITCODE -ne 0){throw 'C10.41 baseline failed.'}

      - name: Apply C10.42 through C10.45 candidates
        shell: pwsh
        run: |
          ./native-windows/candidate-c1042-vtk-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-controller-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-large-assembly-pipeline.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1042-large-assembly.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1043-cad-import-reliability.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1043-cad-import-reliability.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1044-adaptive-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1044-adaptive-cad-preview.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1045-parallel-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1045b-isolated-netgen-workers.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1045b-isolated-netgen-workers.ps1 -BuildRoot "$PWD/upstream"

      - name: Setup Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install benchmark CAD dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check gmsh

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild Windows x64 Release
        shell: pwsh
        run: |
          msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0){throw 'C10.45 Windows x64 build failed.'}

      - name: Assemble CAD runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){throw 'AsterMax Mechanical.exe missing.'}
          New-Item -ItemType Directory -Force .\dist | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" .\dist\ -Recurse -Force
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\Python | Out-Null
          $pythonRoot=Split-Path (Get-Command python).Source -Parent
          Copy-Item "$pythonRoot\*" .\dist\AsterMaxRuntime\Python\ -Recurse -Force
          & .\dist\AsterMaxRuntime\Python\python.exe -c "import gmsh; print('ASTERMAX_C1045_GMSH_OK')"
          if($LASTEXITCODE -ne 0){throw 'Packaged gmsh runtime failed.'}
          $runtimeUrl='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          $runtimeSha256='954f406b65a08cb2fb47ef2fb02b03e4f70aa9c97e0979bd7048448273e17d46'
          Invoke-WebRequest $runtimeUrl -OutFile runtime.zip
          if((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtimeSha256){throw 'Pinned CAD runtime digest mismatch.'}
          Expand-Archive runtime.zip runtime
          $ng=Get-ChildItem runtime -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $ng){throw 'NetGenMesher.exe missing.'}
          Copy-Item $ng.Directory.FullName .\dist\NetGen -Recurse -Force
          New-Item -ItemType Directory -Force .\dist\Temp | Out-Null

      - name: Benchmark isolated two-worker preview on 100 spheres
        shell: pwsh
        run: ./native-windows/benchmark-c1045-parallel-preview.ps1 -Dist "$PWD/dist" -ExpectedParts 100

      - name: Record C10.45 evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist\Audit\C10.45 | Out-Null
          $benchmarkPath='.\dist\Audit\C10.45\benchmark.json'
          $benchmarkStatus=if(Test-Path $benchmarkPath){(Get-Content $benchmarkPath -Raw|ConvertFrom-Json).status}else{'NOT_RUN'}
          [ordered]@{
            release='C10.45-isolated-parallel-cad-preview-candidate'
            commit='${{ github.sha }}'
            branch='${{ github.ref_name }}'
            exact_brep_modified=$false
            model_mutation_parallel=$false
            isolated_worker_directories=$true
            default_parallel_workers=2
            benchmark_status=$benchmarkStatus
            rc1_status='NOT_PROMOTED'
            fea_values_invented=$false
          }|ConvertTo-Json -Depth 5|Set-Content .\dist\Audit\C10.45\evidence.json -Encoding UTF8

      - name: Upload C10.45 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.45-Isolated-Parallel-Preview-Evidence
          path: dist/Audit/C10.45
          if-no-files-found: warn
