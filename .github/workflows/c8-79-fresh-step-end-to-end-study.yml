name: C8.79 Fresh STEP/mm End-to-End Study Qualification

on:
  push:
    branches: [agent/c8-79-fresh-step-end-to-end-study]
  workflow_dispatch:

concurrency:
  group: c8-79-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-fresh-windows-study:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap pinned AsterMax tree
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Restore and build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Fetch pinned CAD runtime and SI-mm STEP fixture
        shell: pwsh
        run: |
          $runtimeZip='build/PrePoMax-v1.4.0-portable.zip'
          $runtimeExtract='build/PrePoMax-v1.4.0-portable'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $runtimeZip 'https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Expand-Archive -Path $runtimeZip -DestinationPath $runtimeExtract -Force
          $netgen=Get-ChildItem -Path $runtimeExtract -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $netgen){throw 'Portable runtime missing NetGenMesher.exe'}
          $release=(Get-Item 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release').FullName
          $runtimeRoot=$netgen.Directory.Parent.FullName
          foreach($folder in @('NetGen','Solver','Models','Temp')){ $source=Join-Path $runtimeRoot $folder; if(Test-Path $source){Copy-Item -Path $source -Destination $release -Recurse -Force} }
          $fixture='build/AsterMax_C8.79_Box_mm.step'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $fixture 'https://raw.githubusercontent.com/facebookresearch/project_superdex/9b59be6f5279936d15322f02bd04c631c7249cb4/assets/prefabs/box_and_blocks/cad/box.step'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $raw=Get-Content $fixture -Raw
          if($raw -notmatch [regex]::Escape('.MILLI., .METRE.')){throw 'STEP fixture no longer declares SI millimetres.'}
          if($raw -notmatch '537\.000000' -or $raw -notmatch '162\.000000' -or $raw -notmatch '\-254\.000000'){throw 'STEP dimensional sentinels changed.'}
          "ASTERMAX_C879_STEP=$((Resolve-Path $fixture).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate fresh STEP to mesh to BC/load to PMX and Code_Aster case
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/c8-79-study | Out-Null
          $env:ASTERMAX_STEP_MESH_FIXTURE='1'
          $env:ASTERMAX_STEP_MESH_PATH=$env:ASTERMAX_C879_STEP
          $env:ASTERMAX_STEP_MESH_EVIDENCE_PATH=(Join-Path $PWD 'artifact/C8.79_STEP_NETGEN_RUNTIME.json')
          $env:ASTERMAX_STRUCTURAL_SETUP_FIXTURE='1'
          $env:ASTERMAX_STRUCTURAL_SETUP_EVIDENCE_PATH=(Join-Path $PWD 'artifact/C8.79_STRUCTURAL_SETUP_RUNTIME.json')
          $env:ASTERMAX_CODEASTER_GENERATION_FIXTURE='1'
          $env:ASTERMAX_CODEASTER_GENERATION_EVIDENCE_PATH=(Join-Path $PWD 'artifact/C8.79_CODEASTER_GENERATION_RUNTIME.json')
          $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR=(Join-Path $PWD 'artifact/c8-79-study')
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $start=Get-Date
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(35)
          do{Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw "GUI exited early: $($p.ExitCode)"}}while($p.MainWindowHandle -eq 0 -and (Get-Date)-lt $deadline)
          if($p.MainWindowHandle -eq 0){throw 'No native AsterMax window'}
          $meshEv=$env:ASTERMAX_STEP_MESH_EVIDENCE_PATH; $setupEv=$env:ASTERMAX_STRUCTURAL_SETUP_EVIDENCE_PATH; $genEv=$env:ASTERMAX_CODEASTER_GENERATION_EVIDENCE_PATH
          $proofDeadline=(Get-Date).AddSeconds(240)
          while(((-not(Test-Path $meshEv))-or(-not(Test-Path $setupEv))-or(-not(Test-Path $genEv))) -and (Get-Date)-lt $proofDeadline){Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw 'GUI exited during fresh study generation'}}
          foreach($ev in @($meshEv,$setupEv,$genEv)){if(-not(Test-Path $ev)){throw "Missing runtime evidence: $ev"}}
          $m=Get-Content $meshEv -Raw|ConvertFrom-Json; $s=Get-Content $setupEv -Raw|ConvertFrom-Json; $g=Get-Content $genEv -Raw|ConvertFrom-Json
          if(-not $m.source_step_declares_si_millimetres -or -not $m.native_step_imported -or -not $m.cad_mm_scale_qualified){throw "Fresh STEP/mm gate failed: $($m.error)"}
          if(-not $m.native_netgen_mesh_generated -or -not $m.post_mesh_mm_scale_qualified -or -not $m.element_connectivity_valid){throw "Fresh NetGen gate failed: $($m.error)"}
          if([int]$m.mesh_node_count -lt 4 -or [int]$m.mesh_element_count -lt 1){throw 'Fresh mesh is empty or trivial.'}
          if(-not $s.structural_setup_qualified -or -not $s.mm_n_mpa_unit_lock){throw "Fresh structural setup failed: $($s.error)"}
          if(-not $s.material_added -or -not $s.solid_section_added -or -not $s.fixed_support_added -or -not $s.load_added){throw 'Material/section/BC/load contract incomplete.'}
          if(-not $g.pmx_structural_roundtrip_qualified -or -not $g.unit_pmx_codeaster_generation_qualified){throw "Fresh PMX/translator gate failed: $($g.error)"}
          if($g.solver_executed -or $g.solver_verified){throw 'Windows generation stage must remain pre-solve.'}
          foreach($f in @('astermax_c862_static.comm','astermax_c862_static.mail','astermax_c862_static.export','AsterMax_C862_Structural.pmx')){
            $fp=Join-Path $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR $f
            if(-not(Test-Path $fp)){throw "Fresh generated artifact missing: $f"}
            if((Get-Item $fp).LastWriteTime -lt $start.AddMinutes(-1)){throw "Artifact timestamp predates this run: $f"}
          }
          $stepHash=(Get-FileHash $env:ASTERMAX_C879_STEP -Algorithm SHA256).Hash.ToLowerInvariant()
          $pmx=Join-Path $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR 'AsterMax_C862_Structural.pmx'
          $comm=Join-Path $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR 'astermax_c862_static.comm'
          $mail=Join-Path $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR 'astermax_c862_static.mail'
          $export=Join-Path $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR 'astermax_c862_static.export'
          @{
            schema='astermax.c8.79.fresh-windows-generation.v1';commit='${{ github.sha }}';generated_in_this_run=$true;source_step_sha256=$stepHash;source_declares_mm=$true
            cad_mm_scale_qualified=$true;netgen_mesh_generated=$true;mesh_node_count=[int]$m.mesh_node_count;mesh_element_count=[int]$m.mesh_element_count;post_mesh_mm_scale_qualified=$true
            material_added=$true;solid_section_added=$true;fixed_support_added=$true;load_added=$true;unit_system='mm-N-MPa';pmx_roundtrip_qualified=$true
            pmx_sha256=(Get-FileHash $pmx -Algorithm SHA256).Hash.ToLowerInvariant();comm_sha256=(Get-FileHash $comm -Algorithm SHA256).Hash.ToLowerInvariant();mail_sha256=(Get-FileHash $mail -Algorithm SHA256).Hash.ToLowerInvariant();export_sha256=(Get-FileHash $export -Algorithm SHA256).Hash.ToLowerInvariant()
            solver_executed=$false;solver_verified=$false;industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 5|Set-Content artifact/C8.79_FRESH_WINDOWS_GENERATION.json -Encoding UTF8
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: C8.79-Fresh-Windows-Study-${{ github.sha }}
          path: |
            artifact/c8-79-study/**
            artifact/C8.79_*RUNTIME.json
            artifact/C8.79_FRESH_WINDOWS_GENERATION.json
          if-no-files-found: error
          retention-days: 14

  genuine-code-aster-solve:
    needs: generate-fresh-windows-study
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: C8.79-Fresh-Windows-Study-${{ github.sha }}
          path: artifact/input
      - name: Stage exact current-run generated case
        run: |
          set -euxo pipefail
          mkdir -p artifact/c8-79-solve
          cp artifact/input/c8-79-study/astermax_c862_static.{comm,mail,export} artifact/c8-79-solve/
          cp artifact/input/c8-79-study/AsterMax_C862_Structural.pmx artifact/c8-79-solve/
          grep -F 'MECA_STATIQUE' artifact/c8-79-solve/astermax_c862_static.comm
          grep -F 'E=210000' artifact/c8-79-solve/astermax_c862_static.comm
          grep -F 'FX=1000' artifact/c8-79-solve/astermax_c862_static.comm
          sha256sum artifact/c8-79-solve/astermax_c862_static.{comm,mail,export} artifact/c8-79-solve/AsterMax_C862_Structural.pmx | tee artifact/c8-79-solve/PRE_SOLVE_SHA256SUMS.txt
      - name: Genuine Code_Aster 17.4.0 solve
        run: |
          set -euxo pipefail
          docker pull simvia/code_aster:17.4.0
          chmod -R a+rwX artifact/c8-79-solve
          docker run --rm -v "$PWD/artifact/c8-79-solve:/home/user/data" -w /home/user/data simvia/code_aster:17.4.0 bash -i -c 'run_aster astermax_c862_static.export' | tee artifact/c8-79-solve/CODE_ASTER_STDOUT.log
          test -s artifact/c8-79-solve/astermax_c862_static.mess
          test -s artifact/c8-79-solve/astermax_c862_static.rmed
          test -s artifact/c8-79-solve/astermax_c862_static.resu
      - name: Fail-closed solver and result-table admission
        run: |
          python - <<'PY'
          import hashlib,json,math,pathlib,re
          root=pathlib.Path('artifact/c8-79-solve')
          def sha(p):
              h=hashlib.sha256(); h.update(p.read_bytes()); return h.hexdigest()
          mess=(root/'astermax_c862_static.mess').read_text(encoding='utf-8',errors='replace')
          resu=(root/'astermax_c862_static.resu').read_text(encoding='utf-8',errors='replace')
          fatal=[pat for pat in (r'<F>',r'ERREUR FATALE',r'FATAL_ERROR',r'EXECUTION_CODE_ASTER.*FAILED') if re.search(pat,mess,re.I)]
          if fatal: raise SystemExit('Fatal Code_Aster markers: '+','.join(fatal))
          if not re.search(r'DIAGNOSTIC JOB\s*:\s*OK|Code_Aster MPI exits normally|TOTAL_JOB',mess,re.I): raise SystemExit('No positive Code_Aster completion marker')
          for marker in ('PPM_DEPL','PPM_STRESS_N'):
              if marker not in resu: raise SystemExit('Missing solver result table '+marker)
          nums=[]
          for line in resu.splitlines():
              if ';' not in line: continue
              for token in line.split(';'):
                  t=token.strip().replace('D','E')
                  try:
                      v=float(t)
                      if math.isfinite(v): nums.append(abs(v))
                  except: pass
          if not nums or max(nums)<=0: raise SystemExit('Solver result tables contain no non-zero finite numeric values')
          ev={'schema':'astermax.c8.79.genuine-solve.v1','commit':'${{ github.sha }}','solver':'Code_Aster 17.4.0','source':'current-run Windows-generated STEP/mm study','solver_process_exit_zero':True,'solver_executed':True,'solver_verified':True,'result_tables_present':True,'nonzero_finite_result_values_present':True,'pmx_sha256':sha(root/'AsterMax_C862_Structural.pmx'),'rmed_sha256':sha(root/'astermax_c862_static.rmed'),'resu_sha256':sha(root/'astermax_c862_static.resu'),'mess_sha256':sha(root/'astermax_c862_static.mess'),'industrial_validation':False,'ansys_equivalence':False}
          (root/'C8.79_GENUINE_SOLVE_EVIDENCE.json').write_text(json.dumps(ev,indent=2),encoding='utf-8')
          print(json.dumps(ev,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: C8.79-Genuine-CodeAster-Solve-${{ github.sha }}
          path: artifact/c8-79-solve/**
          if-no-files-found: error
          retention-days: 14

  windows-native-results:
    needs: genuine-code-aster-solve
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: C8.79-Genuine-CodeAster-Solve-${{ github.sha }}
          path: artifact/current-solve
      - name: Bootstrap Results-capable AsterMax
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_full_model_results_demo.py build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Restore and build Results app
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Open fresh current-run PMX/RMED/RESU in native Results
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/c8-79-results | Out-Null
          $pmx=(Resolve-Path 'artifact/current-solve/AsterMax_C862_Structural.pmx').Path
          $rmed=(Resolve-Path 'artifact/current-solve/astermax_c862_static.rmed').Path
          $resu=(Resolve-Path 'artifact/current-solve/astermax_c862_static.resu').Path
          $solverEv=Get-Content 'artifact/current-solve/C8.79_GENUINE_SOLVE_EVIDENCE.json' -Raw|ConvertFrom-Json
          if(-not $solverEv.solver_verified){throw 'Current-run solver evidence is not admitted.'}
          if((Get-FileHash $pmx -Algorithm SHA256).Hash.ToLowerInvariant() -ne $solverEv.pmx_sha256){throw 'PMX provenance mismatch.'}
          if((Get-FileHash $rmed -Algorithm SHA256).Hash.ToLowerInvariant() -ne $solverEv.rmed_sha256){throw 'RMED provenance mismatch.'}
          if((Get-FileHash $resu -Algorithm SHA256).Hash.ToLowerInvariant() -ne $solverEv.resu_sha256){throw 'RESU provenance mismatch.'}
          $env:ASTERMAX_RESULTS_FULL_MODEL_PMX=$pmx
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $ready=(Join-Path $PWD 'artifact/c8-79-results/READY.json')
          $stdout=(Join-Path $PWD 'artifact/c8-79-results/stdout.log')
          $stderr=(Join-Path $PWD 'artifact/c8-79-results/stderr.log')
          $p=Start-Process -FilePath $exe -ArgumentList @('--astermax-results-demo',$rmed,$resu,$ready) -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $deadline=(Get-Date).AddSeconds(100)
          while(-not(Test-Path $ready) -and (Get-Date)-lt $deadline){Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){Get-Content $stderr -ErrorAction SilentlyContinue;throw "Fresh Results exited early: $($p.ExitCode)"}}
          if(-not(Test-Path $ready)){throw 'Fresh Results READY timeout.'}
          $s=Get-Content $ready -Raw|ConvertFrom-Json
          if(-not $s.scene_ready -or -not $s.result_admitted -or -not $s.native_draw_invoked){throw 'Fresh Results scene did not reach admitted native draw.'}
          if(-not $s.full_model_pmx_loaded){throw 'Fresh PMX was not loaded in native Results.'}
          if(-not $s.native_scalar_bar_semantically_verified){throw 'Fresh Results scalar-bar semantics not verified.'}
          if([double]$s.mises_max_mpa -le 0 -or [double]$s.disp_max_mm -le 0){throw 'Fresh Results did not expose positive Mises/displacement extrema.'}
          @{
            schema='astermax.c8.79.native-results.v1';commit='${{ github.sha }}';source_current_run=$true;scene_ready=$true;result_admitted=$true;full_model_pmx_loaded=$true;native_draw_invoked=$true;native_scalar_bar_semantically_verified=$true
            mesh_nodes=[int]$s.mesh_nodes;mises_max_mpa=[double]$s.mises_max_mpa;disp_max_mm=[double]$s.disp_max_mm;pmx_sha256=(Get-FileHash $pmx -Algorithm SHA256).Hash.ToLowerInvariant();rmed_sha256=(Get-FileHash $rmed -Algorithm SHA256).Hash.ToLowerInvariant();resu_sha256=(Get-FileHash $resu -Algorithm SHA256).Hash.ToLowerInvariant();industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 5|Set-Content artifact/c8-79-results/C8.79_NATIVE_RESULTS_EVIDENCE.json -Encoding UTF8
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.79-Fresh-EndToEnd-${{ github.sha }}
          path: artifact/c8-79-results/**
          if-no-files-found: warn
          retention-days: 14
