name: C8.81 Fresh Professional Viewport + Permanent x64 Bootstrap

on:
  push:
    branches: [agent/c8-81-fresh-professional-viewport-x64-bootstrap]
  workflow_dispatch:

concurrency:
  group: c8-81-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-fresh-professional-viewport:
    runs-on: windows-2025
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    env:
      C879_RUN_ID: '34011943072'
      C879_SHA: '1110ba736fdc607f0fcf1d1016f549c1a634881f'
      C880_RUN_ID: '34014291198'
      C880_SHA: '64fd6acabe022b71efe1eac6ee1f5ac86aff20c8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download exact fresh solve and independent numerical admission
        uses: actions/download-artifact@v4
        with:
          name: C8.79-Genuine-CodeAster-Solve-${{ env.C879_SHA }}
          path: artifact/c879
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: MedinaParra/AsterMax-Ubuntu
          run-id: ${{ env.C879_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: C8.80-Numerical-Admission-${{ env.C880_SHA }}
          path: artifact/c880
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: MedinaParra/AsterMax-Ubuntu
          run-id: ${{ env.C880_RUN_ID }}

      - name: Pin fresh provenance and numerical extrema
        shell: pwsh
        run: |
          $pmx=(Resolve-Path 'artifact/c879/AsterMax_C862_Structural.pmx').Path
          $rmed=(Resolve-Path 'artifact/c879/astermax_c862_static.rmed').Path
          $resu=(Resolve-Path 'artifact/c879/astermax_c862_static.resu').Path
          $num=Get-Content 'artifact/c880/C8.80_NUMERICAL_ADMISSION.json' -Raw|ConvertFrom-Json
          if(-not $num.reaction_equilibrium_verified){throw 'C8.80 reaction equilibrium is not admitted'}
          if((Get-FileHash $pmx -Algorithm SHA256).Hash.ToLowerInvariant() -ne $num.pmx_sha256){throw 'Fresh PMX provenance mismatch'}
          if((Get-FileHash $rmed -Algorithm SHA256).Hash.ToLowerInvariant() -ne $num.rmed_sha256){throw 'Fresh RMED provenance mismatch'}
          if((Get-FileHash $resu -Algorithm SHA256).Hash.ToLowerInvariant() -ne $num.resu_sha256){throw 'Fresh RESU provenance mismatch'}
          if([int]$num.mises_max_node -ne 21 -or [int]$num.disp_max_node -ne 22){throw 'Fresh extrema node provenance changed'}
          "C881_PMX=$pmx"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C881_RMED=$rmed"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C881_RESU=$resu"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C881_NUM=$(Resolve-Path 'artifact/c880/C8.80_NUMERICAL_ADMISSION.json')"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C881_NODES=$($num.node_count)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C881_MISES=$([double]$num.mises_max_mpa)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C881_DISP=$([double]$num.disp_max_mm)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C881_MISES_NODE=$($num.mises_max_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C881_DISP_NODE=$($num.disp_max_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap permanent x64 contract and apply professional Results chain
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          $sln=Get-Content build/PrePoMax-CodeAster/PrePoMax.sln -Raw
          if($sln -match '\{74EA83FB-2743-49EE-85A8-5B42CBCE19B3\}\.Release\|x64\.ActiveCfg = Release\|Any CPU'){throw 'Permanent bootstrap x64 alignment did not apply'}
          if($sln -notmatch '\{74EA83FB-2743-49EE-85A8-5B42CBCE19B3\}\.Release\|x64\.ActiveCfg = Release\|x64'){throw 'Permanent bootstrap x64 mapping missing'}
          python integrations/prepomax-codeaster/tools/apply_full_model_results_demo.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_results_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_clean_verified_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_extrema_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_node_probe_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_deformation_geometry.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_render_mesh_deformation_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_deformation_ui_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_deformation_ui_evidence_fix.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_rendered_viewport_deformation_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_rendered_viewport_diagnostic_admission.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_professional_viewport_badge.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_safe_vtk_interactor_detach.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_deterministic_program_shutdown.py build/PrePoMax-CodeAster

      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build Release x64 with zero architecture mismatches
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/c8-81|Out-Null
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal 2>&1 | Tee-Object artifact/c8-81/build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $arch=Select-String -Path artifact/c8-81/build.log -Pattern 'MSB3270|processor architecture.*MSIL|processor architecture.*AMD64' -ErrorAction SilentlyContinue
          if($arch){$arch|ForEach-Object{Write-Host $_.Line};throw "Architecture mismatch warnings remain: $(@($arch).Count)"}
          if(-not(Test-Path 'build/PrePoMax-CodeAster/UserControls/bin/x64/Release/UserControls.dll')){throw 'UserControls x64 output missing'}

      - name: Qualify fresh professional viewport, capture, and deterministic shutdown
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class C881Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd,out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $ready=(Join-Path $PWD 'artifact/c8-81/READY.json')
          $stdout=(Join-Path $PWD 'artifact/c8-81/stdout.log')
          $stderr=(Join-Path $PWD 'artifact/c8-81/stderr.log')
          $env:ASTERMAX_RESULTS_FULL_MODEL_PMX=$env:C881_PMX
          $env:ASTERMAX_RESULTS_EXPECTED_NODES=$env:C881_NODES
          $env:ASTERMAX_RESULTS_EXPECTED_ELEMENTS='2474'
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_MAX=$env:C881_MISES
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_MAX=$env:C881_DISP
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_NODE=$env:C881_MISES_NODE
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_NODE=$env:C881_DISP_NODE
          $p=Start-Process $exe -ArgumentList @('--astermax-results-demo',$env:C881_RMED,$env:C881_RESU,$ready) -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $deadline=(Get-Date).AddSeconds(120)
          while(-not(Test-Path $ready) -and (Get-Date)-lt $deadline){Start-Sleep -Milliseconds 400;$p.Refresh();if($p.HasExited){Get-Content $stderr -ErrorAction SilentlyContinue;throw "Fresh Results exited before READY: $($p.ExitCode)"}}
          if(-not(Test-Path $ready)){throw 'Fresh professional Results READY timeout'}
          $s=Get-Content $ready -Raw|ConvertFrom-Json
          if(-not $s.scene_ready -or -not $s.result_admitted -or -not $s.full_model_pmx_loaded -or -not $s.native_draw_invoked){throw 'Fresh native Results admission incomplete'}
          if(-not $s.native_scalar_bar_semantically_verified){throw 'Fresh scalar bar semantics lost'}
          if(-not $s.rendered_viewport_deformation_verified){throw 'Fresh rendered x10 qualification lost'}
          if([string]$s.deformation_state -ne 'user-defined-x10-contour'){throw 'Fresh final deformation state is not x10 contour'}
          if([double]$s.rendered_viewport_float32_quantized_max_error_mm -gt 1e-6){throw 'Fresh rendered geometry exceeds float32 qualification tolerance'}
          $num=Get-Content $env:C881_NUM -Raw|ConvertFrom-Json
          $vmErr=[math]::Abs([double]$s.mises_max_mpa-[double]$num.mises_max_mpa)
          $uErr=[math]::Abs([double]$s.disp_max_mm-[double]$num.disp_max_mm)
          if($vmErr -gt 1e-4 -or $uErr -gt 1e-8){throw "Fresh solver-to-viewport extrema mismatch vm=$vmErr MPa u=$uErr mm"}
          $windowDeadline=(Get-Date).AddSeconds(20)
          do{Start-Sleep -Milliseconds 250;$p.Refresh()}while($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and (Get-Date)-lt $windowDeadline)
          if($p.HasExited -or $p.MainWindowHandle -eq 0){throw 'No live AsterMax main window for fresh capture'}
          [C881Win]::SetForegroundWindow($p.MainWindowHandle)|Out-Null; Start-Sleep -Seconds 2
          $r=New-Object C881Win+RECT
          if(-not[C881Win]::GetWindowRect($p.MainWindowHandle,[ref]$r)){throw 'GetWindowRect failed'}
          $w=$r.Right-$r.Left;$h=$r.Bottom-$r.Top
          if($w -lt 640 -or $h -lt 480){throw "Viewport too small: ${w}x${h}"}
          $bmp=New-Object Drawing.Bitmap($w,$h);$g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)
          $png=(Join-Path $PWD 'artifact/c8-81/AsterMax-C8.81-fresh-professional-verified-viewport.png');$bmp.Save($png,[Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bmp.Dispose()
          if((Get-Item $png).Length -lt 15000){throw 'Fresh professional screenshot unexpectedly small'}
          if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force;throw 'Fresh viewport did not close deterministically'}
          if($p.ExitCode -ne 0){throw "Fresh viewport exit code $($p.ExitCode)"}
          $out=Get-Content $stdout -Raw -ErrorAction SilentlyContinue;$err=Get-Content $stderr -Raw -ErrorAction SilentlyContinue
          if($err -match 'AccessViolationException|FatalExecutionEngineError|SEHException'){throw 'Unsafe native shutdown signature detected'}
          if($out -notmatch 'Application.Run returned' -or $out -notmatch 'FrmMain disposed' -or $out -notmatch 'finalizer drain complete'){throw 'Deterministic shutdown checkpoints incomplete'}
          @{
            schema='astermax.c8.81.fresh-professional-viewport.v1';commit='${{ github.sha }}';source_c879_run=[long]$env:C879_RUN_ID;source_c880_run=[long]$env:C880_RUN_ID
            permanent_x64_bootstrap_verified=$true;architecture_mismatch_warning_count=0;usercontrols_x64_output_verified=$true
            step_mm_source='fresh C8.79 end-to-end study';solver='Code_Aster 17.4.0';mesh_nodes=[int]$s.mesh_nodes;mesh_elements=2474
            mises_max_mpa=[double]$num.mises_max_mpa;mises_max_node=[int]$num.mises_max_node;disp_max_mm=[double]$num.disp_max_mm;disp_max_node=[int]$num.disp_max_node
            reaction_equilibrium_verified=[bool]$num.reaction_equilibrium_verified;equilibrium_residual_norm_n=[double]$num.equilibrium_residual_norm_n
            native_scalar_bar_semantically_verified=$true;rendered_viewport_deformation_verified=$true;deformation_state=[string]$s.deformation_state
            solver_results_mises_abs_error_mpa=$vmErr;solver_results_disp_abs_error_mm=$uErr;deterministic_shutdown_verified=$true;shutdown_exit_code=$p.ExitCode
            pmx_sha256=$num.pmx_sha256;rmed_sha256=$num.rmed_sha256;resu_sha256=$num.resu_sha256;screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant()
            industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 6|Set-Content artifact/c8-81/C8.81_FRESH_PROFESSIONAL_VIEWPORT_EVIDENCE.json -Encoding UTF8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.81-Fresh-Professional-Viewport-${{ github.sha }}
          path: artifact/c8-81/**
          if-no-files-found: warn
          retention-days: 14
