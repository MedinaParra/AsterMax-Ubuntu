name: C8.69 Verified Extrema Presentation

on:
  push:
    branches: [agent/c8-69-verified-extrema-deformation-presentation]
  workflow_dispatch:

concurrency:
  group: c8-69-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-verified-extrema:
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      C865_RUN_ID: '33963671896'
      C865_SHA: '86b123a2df7a481a06451358e299bac69db2b7e4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact solver-verified extrema evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prior/windows,prior/solve | Out-Null
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "C8.65-Windows-Generated-Study-$env:C865_SHA" --dir prior/windows
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "AsterMax-C8.65-Product-Native-Reaction-$env:C865_SHA" --dir prior/solve
          $pmx=Get-ChildItem prior/windows -Recurse -Filter 'AsterMax_C862_Structural.pmx'|Select-Object -First 1
          $rmed=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.rmed'|Select-Object -First 1
          $resu=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.resu'|Select-Object -First 1
          $ev=Get-ChildItem prior/solve -Recurse -Filter 'C8.65_PRODUCT_NATIVE_REACTION_EVIDENCE.json'|Select-Object -First 1
          if(-not $pmx -or -not $rmed -or -not $resu -or -not $ev){throw 'Pinned evidence bundle incomplete.'}
          $e=Get-Content $ev.FullName -Raw|ConvertFrom-Json
          if(-not $e.solver_verified -or -not $e.result_field_values_verified -or -not $e.reaction_equilibrium_verified){throw 'Source solve is not admitted.'}
          if([int]$e.max_von_mises_node -le 0 -or [int]$e.max_displacement_node -le 0){throw 'Extrema-node provenance missing.'}
          "C869_PMX=$($pmx.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C869_RMED=$($rmed.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C869_RESU=$($resu.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C869_PRIOR=$($ev.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C869_NODES=$($e.node_count)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C869_MISES=$($e.max_von_mises_mpa.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C869_DISP=$($e.max_displacement_mm.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C869_MISES_NODE=$($e.max_von_mises_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C869_DISP_NODE=$($e.max_displacement_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Bootstrap and apply verified Results presentation chain
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_full_model_results_demo.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_results_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_clean_verified_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_extrema_presentation.py build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Run verified extrema Results scene and capture evidence
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class NativeWindowC869 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd,out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          New-Item -ItemType Directory -Force artifact/c8-69|Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $ready=(Join-Path $PWD 'artifact/c8-69/RESULTS_VERIFIED_EXTREMA_READY.json')
          $env:ASTERMAX_RESULTS_FULL_MODEL_PMX=$env:C869_PMX
          $env:ASTERMAX_RESULTS_EXPECTED_NODES=$env:C869_NODES
          $env:ASTERMAX_RESULTS_EXPECTED_ELEMENTS='2474'
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_MAX=$env:C869_MISES
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_MAX=$env:C869_DISP
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_NODE=$env:C869_MISES_NODE
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_NODE=$env:C869_DISP_NODE
          $p=Start-Process $exe -ArgumentList @('--astermax-results-demo',$env:C869_RMED,$env:C869_RESU,$ready) -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(90)
          while(-not(Test-Path $ready) -and (Get-Date)-lt $deadline){Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw "Results process exited early: $($p.ExitCode)"}}
          if(-not(Test-Path $ready)){throw 'Timed out waiting for Results READY.'}
          $s=Get-Content $ready -Raw|ConvertFrom-Json
          if(-not $s.scene_ready -or -not $s.result_admitted -or -not $s.full_model_pmx_loaded){throw 'Full-model Results gate failed.'}
          if(-not $s.native_scalar_bar_semantically_verified -or -not $s.clean_presentation_profile -or -not $s.verified_extrema_labels){throw 'Presentation semantics gate failed.'}
          if([int]$s.mises_max_node -ne [int]$env:C869_MISES_NODE){throw 'Mises node provenance mismatch.'}
          if([int]$s.disp_max_node -ne [int]$env:C869_DISP_NODE){throw 'Displacement node provenance mismatch.'}
          if([string]$s.deformation_state -ne 'undeformed-contour'){throw 'Unexpected deformation state.'}
          if([bool]$s.deformation_scale_semantics_verified){throw 'C8.69 must not claim deformation-scale verification.'}
          $wd=(Get-Date).AddSeconds(20);do{Start-Sleep -Milliseconds 250;$p.Refresh()}while($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and (Get-Date)-lt $wd)
          if($p.MainWindowHandle -eq 0){throw 'No live native window.'}
          [NativeWindowC869]::SetForegroundWindow($p.MainWindowHandle)|Out-Null;Start-Sleep -Seconds 2
          $r=New-Object NativeWindowC869+RECT;if(-not [NativeWindowC869]::GetWindowRect($p.MainWindowHandle,[ref]$r)){throw 'GetWindowRect failed.'}
          $w=$r.Right-$r.Left;$h=$r.Bottom-$r.Top;if($w -lt 1000 -or $h -lt 650){throw "Presentation window too small ${w}x${h}."}
          $bmp=New-Object Drawing.Bitmap($w,$h);$g=[Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)
          $png=(Join-Path $PWD 'artifact/c8-69/AsterMax-C8.69-verified-extrema.png');$bmp.Save($png,[Drawing.Imaging.ImageFormat]::Png);$g.Dispose();$bmp.Dispose()
          if((Get-Item $png).Length -lt 15000){throw 'Screenshot unexpectedly small.'}
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Emit fail-closed C8.69 evidence
        shell: pwsh
        run: |
          $s=Get-Content artifact/c8-69/RESULTS_VERIFIED_EXTREMA_READY.json -Raw|ConvertFrom-Json
          $prior=Get-Content $env:C869_PRIOR -Raw|ConvertFrom-Json
          @{
            schema='astermax.c8.69.verified-extrema-presentation.v1';commit='${{ github.sha }}';source_solver_run=[long]$env:C865_RUN_ID;source_solver_commit=$env:C865_SHA
            solver_verified=[bool]$prior.solver_verified;result_fields_verified=[bool]$prior.result_field_values_verified;reaction_equilibrium_verified=[bool]$prior.reaction_equilibrium_verified
            mesh_nodes=[int]$s.mesh_nodes;mesh_elements=2474;field='STRESS/MISES';unit='MPa';mises_max_mpa=[double]$s.mises_max_mpa;mises_max_node=[int]$s.mises_max_node;disp_max_mm=[double]$s.disp_max_mm;disp_max_node=[int]$s.disp_max_node
            clean_presentation_profile=[bool]$s.clean_presentation_profile;verified_extrema_labels=[bool]$s.verified_extrema_labels;deformation_state=[string]$s.deformation_state;deformation_scale_semantics_verified=[bool]$s.deformation_scale_semantics_verified
            pmx_sha256=(Get-FileHash $env:C869_PMX -Algorithm SHA256).Hash.ToLowerInvariant();rmed_sha256=(Get-FileHash $env:C869_RMED -Algorithm SHA256).Hash.ToLowerInvariant();resu_sha256=(Get-FileHash $env:C869_RESU -Algorithm SHA256).Hash.ToLowerInvariant();screenshot_sha256=(Get-FileHash artifact/c8-69/AsterMax-C8.69-verified-extrema.png -Algorithm SHA256).Hash.ToLowerInvariant()
            verified_extrema_presentation_qualified=$true;industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 5|Set-Content artifact/c8-69/C8_69_VERIFIED_EXTREMA_EVIDENCE.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.69-Verified-Extrema-${{ github.sha }}
          path: artifact/c8-69/**
          if-no-files-found: warn
          retention-days: 14
