name: C12.07 Windows x64 native Code_Aster package
on:
  push:
    branches: [agent/c1199-codeaster-contract-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64-build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Setup Python MED runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Python MED dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy h5py
          if($LASTEXITCODE -ne 0){ throw 'Python MED dependency installation failed.' }
      - name: Rebuild cumulative source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python native-windows/validate-patch-chain.py
          $chain=Get-Content native-windows/patch-chain.json -Raw|ConvertFrom-Json
          $patches=@($chain.patches|ForEach-Object{$_.file})
          ./native-windows/harness-c10208a-patch-chain.ps1 -Root "$PWD/upstream" -Patches $patches -OutDir "$PWD/dist/Audit/PatchChain"
      - name: Apply validated STEP VTK performance chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/candidate-c1042-vtk-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-controller-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-large-assembly-pipeline.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1042-large-assembly.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1043-cad-import-reliability.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1043-cad-import-reliability.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1044-adaptive-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1044-adaptive-cad-preview.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1084-step-culture-format-fix.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1045-parallel-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1083-step-import-format-hotfix.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1045b-isolated-netgen-workers.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1045b-isolated-netgen-workers.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/test-c1046-netgen-worker-lifecycle.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1085-step-import-stage-diagnostics.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1085-step-import-stage-diagnostics.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1086-vis-edge-token-diagnostics.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1047-runtime-audit.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1048-actor-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1048-lazy-element-edges-v3.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1078-runtime-counters.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1079-render-execution-counters.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1080-edge-camera-runtime-counters.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1081-edge-materialization-counters.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1048-lazy-element-edges.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1078-runtime-counter-contract.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1079-render-execution-counter-contract.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1080-edge-camera-runtime-counter-contract.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1081-edge-materialization-contract.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1052-viewport-purity.ps1 -Root "$PWD/upstream"
      - name: Verify C12.07 runner discovery
        id: discovery
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1206-runner-discovery.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1207/RunnerDiscovery" -ExpectedRelease C12.07
      - name: Verify production contact topology and orientation contracts
        id: contact_topology
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1207-contact-topology.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1207/ContactTopology"
      - name: Verify production C# solver failure diagnostics
        id: solver_diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1207-solver-diagnostics.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1207/SolverDiagnostics"
      - name: Verify native runner rejects invalid backend probes
        id: native_probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1206-native-probe.ps1
      - name: Verify fatal solver diagnostics and retained failure evidence
        id: runner_failures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1207-runner-failures.ps1 -OutDir "$PWD/dist/Audit/C1207/RunnerFailures"
      - name: Verify stale results and failed solves are never promoted
        id: runner_regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1017-runner.ps1
      - name: Restore legacy NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuget="$PWD/nuget.exe"
          Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget
          & $nuget restore "$PWD/upstream/PrePoMax.sln" -PackagesDirectory "$PWD/upstream/packages" -NonInteractive
          if($LASTEXITCODE -ne 0){ throw "NuGet restore failed: $LASTEXITCODE" }
          foreach($p in @('ncalc.1.3.8','System.ValueTuple.4.5.0','UnitsNet.4.89.1','Activiz.NET.x64.5.8.0')){ if(-not (Test-Path "$PWD/upstream/packages/$p")){ throw "Required package missing after restore: $p" } }
      - name: Verify native Release x64 contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sln=Get-Content "$PWD/upstream/PrePoMax.sln" -Raw
          if($sln -notmatch '(?m)^\s*Release\|x64\s*=\s*Release\|x64\s*$'){ throw 'Release|x64 solution configuration missing' }
          if($sln -match '(?m)^\s*Release\|Any CPU\s*='){ throw 'Unexpected Release|Any CPU configuration detected' }
      - name: Build Release x64
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild=& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if(-not $msbuild){ throw 'MSBuild not found' }
          & $msbuild "$PWD/upstream/PrePoMax.sln" /m /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){ throw "MSBuild failed: $LASTEXITCODE" }
      - name: Verify GUI and native Code Aster distribution contract
        id: contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $executables=@(Get-ChildItem "$PWD/upstream" -Recurse -File -Filter 'AsterMax Mechanical.exe' | Where-Object { $_.FullName -match '[\\/]bin[\\/]x64[\\/]Release[\\/]' })
          if($executables.Count -ne 1){ throw "Expected one Release x64 AsterMax Mechanical.exe; found $($executables.Count)." }
          "ASTERMAX_BUILT_EXE=$($executables[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $runtimeFiles=@('astermax-codeaster-runner.cmd','astermax-codeaster-runner.ps1','setup-codeaster-windows.cmd','setup-codeaster-windows.ps1')
          foreach($f in $runtimeFiles){
            $path=Join-Path "$PWD/native-windows/runtime/CodeAster" $f
            if(-not (Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0){ throw "Native Windows Code_Aster runtime file missing or empty: $f" }
            if($f.EndsWith('.ps1')){
              $tokens=$null; $parseErrors=$null
              $ast=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$parseErrors)
              if($parseErrors.Count -gt 0){ throw "PowerShell syntax error in ${f}: $($parseErrors -join '; ')" }
              $foreignCommands=@($ast.FindAll({param($node) $node -is [System.Management.Automation.Language.CommandAst] -and $node.GetCommandName() -match '^(?:wsl|bash|docker|podman|ccx|calculix)(?:\.exe)?$'},$true))
              if($foreignCommands.Count -gt 0){ throw "Non-native solver command detected in $f" }
            }
          }
          Write-Host 'PASS: Windows x64 GUI build and native Code_Aster runner contract present.'
      - name: Assemble Windows package and complete MED runtime
        id: assemble
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dest="$PWD/dist/AsterMax-Mechanical-C12.07-Windows-x64-CodeAster"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $source=Split-Path $env:ASTERMAX_BUILT_EXE -Parent
          Copy-Item "$source/*" $dest -Recurse -Force

          $tools=Join-Path $dest 'AsterMaxTools'
          $codeAster=Join-Path $dest 'AsterMaxRuntime/CodeAster'
          $pythonDest=Join-Path $dest 'AsterMaxRuntime/Python'
          New-Item -ItemType Directory -Force -Path $tools,$codeAster,$pythonDest | Out-Null
          Copy-Item "$PWD/native-windows/runtime/CodeAster/*" $codeAster -Recurse -Force
          $toolNames=@('bridge-c964-med-results.py','bind-c998-results-fingerprint.py','qualify-mechanical-analysis.py')
          foreach($name in $toolNames){
            Copy-Item (Join-Path "$PWD/native-windows" $name) $tools -Force
          }
          $solveSource=Get-Content "$PWD/upstream/PrePoMax/Forms/AsterMaxNativeSolveTransaction.cs" -Raw
          foreach($match in [regex]::Matches($solveSource,'Path\.Combine\(tools,\s*"([^"\r\n]+\.py)"\)')){
            if($match.Groups[1].Value -notin $toolNames){ throw "Generated application references an unpackaged Python tool: $($match.Groups[1].Value)" }
          }
          $pythonRoot=Split-Path (Get-Command python).Source -Parent
          Copy-Item "$pythonRoot/*" $pythonDest -Recurse -Force
          $python=Join-Path $pythonDest 'python.exe'
          & $python -c "import sys,numpy,h5py; assert sys.maxsize > 2**32; print('ASTERMAX_PACKAGED_PYTHON_MED_OK')"
          if($LASTEXITCODE -ne 0){ throw 'Packaged Windows x64 Python MED runtime failed.' }
          foreach($name in @('bind-c998-results-fingerprint.py','qualify-mechanical-analysis.py')){
            & $python (Join-Path $tools $name) --help
            if($LASTEXITCODE -ne 0){ throw "Packaged Python tool could not start: $name" }
          }

          $releaseZip=Join-Path $env:RUNNER_TEMP 'PrePoMax-v2.0.0.zip'
          $releaseDir=Join-Path $env:RUNNER_TEMP 'PrePoMax-v2.0.0'
          Invoke-WebRequest -Uri 'https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v2.0.0.zip' -OutFile $releaseZip
          $netgenSourceSha256=(Get-FileHash $releaseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          Expand-Archive -LiteralPath $releaseZip -DestinationPath $releaseDir -Force
          $netgenExe=Get-ChildItem $releaseDir -Recurse -File -Filter 'NetGenMesher.exe' | Select-Object -First 1
          if(-not $netgenExe){ throw 'NetGenMesher.exe missing from the PrePoMax v2.0.0 runtime.' }
          $netgenDest=Join-Path $dest 'NetGen'
          New-Item -ItemType Directory -Force -Path $netgenDest | Out-Null
          Copy-Item "$($netgenExe.Directory.FullName)/*" $netgenDest -Recurse -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $dest 'Temp') | Out-Null

          $licenseDest=Join-Path $dest 'ThirdParty/PrePoMax'
          New-Item -ItemType Directory -Force -Path $licenseDest | Out-Null
          foreach($license in @(Get-ChildItem "$PWD/upstream" -Recurse -File | Where-Object { $_.Name -match '^(?:COPYING|LICEN[CS]E|NOTICE)(?:[._-]|$)' })){
            $relative=[IO.Path]::GetRelativePath("$PWD/upstream",$license.FullName)
            $target=Join-Path $licenseDest $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $license.FullName -Destination $target -Force
          }
          $netgenLicenses=Join-Path $dest 'ThirdParty/NetGen'
          foreach($license in @(Get-ChildItem $releaseDir -Recurse -File | Where-Object { $_.Name -match '^(?:COPYING|LICEN[CS]E|NOTICE|README)(?:[._-]|$)' })){
            $relative=[IO.Path]::GetRelativePath($releaseDir,$license.FullName)
            $target=Join-Path $netgenLicenses $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
            Copy-Item -LiteralPath $license.FullName -Destination $target -Force
          }
          if(-not (Test-Path -LiteralPath (Join-Path $licenseDest 'LICENSE'))){ throw 'Upstream PrePoMax license was not preserved.' }
          if(-not (Test-Path -LiteralPath (Join-Path $licenseDest 'UserControls/License-LGPL.txt'))){ throw 'UserControls LGPL notice was not preserved.' }
          if(-not (Test-Path -LiteralPath (Join-Path $pythonDest 'LICENSE.txt'))){ throw 'Python runtime license was not preserved.' }
          python "$PWD/native-windows/build-c1010-materials.py" --out $dest
          if($LASTEXITCODE -ne 0){ throw 'Material library generation failed.' }

          @'
          @echo off
          call "%~dp0AsterMaxRuntime\CodeAster\setup-codeaster-windows.cmd" %*
          exit /b %ERRORLEVEL%
          '@ | Set-Content (Join-Path $dest 'Configurar-Code_Aster.cmd') -Encoding ascii
          @"
          AsterMax Mechanical C12.07 - Windows x64

          1. Extraiga el ZIP completo en una carpeta.
          2. Ejecute Configurar-Code_Aster.cmd para instalar y comprobar Code_Aster para Windows.
             La primera configuracion requiere Internet: descarga el instalador original del proveedor
             y verifica su SHA-256 antes de instalarlo. No necesita definir variables de entorno.
          3. Abra AsterMax Mechanical.exe. Runtime/PREFLIGHT muestra el estado del motor.

          Este paquete contiene el ejecutable, NetGen, los adaptadores nativos, Python y el puente MED.
          Code_Aster requiere una instalacion nativa; el instalador del proveedor no se redistribuye
          dentro del ZIP. Se conservan las pruebas numericas reales de CI en el manifiesto de validacion.

          C12.07 comprueba los nodos esclavos compartidos entre zonas antes de exportar el contacto.
          Cuando existe una orientacion compatible, intercambia los roles de las superficies y
          conserva sus caras, materiales, cargas y ley de contacto. Los casos incompatibles se
          detienen con un diagnostico concreto. Los fallos del motor conservan su archivo .mess.
          La admision de esta compilacion exige una barra TETRA4 real y un caso de tres cuerpos:
          el control original debe reproducir CONTACT2_16 con 12 nodos compartidos, y el exportado
          por el ejecutable debe resolver, importar MED y satisfacer el equilibrio de fuerzas.
          Consulte VALIDATION_NATIVE_CODE_ASTER.json y VALIDATION_NATIVE_CONTACT.json.

          Origen y fuentes:
          AsterMax y cadena de reconstruccion: https://github.com/MedinaParra/AsterMax-Ubuntu/tree/$env:GITHUB_SHA
          PrePoMax base: https://github.com/tsvilans/PrePoMax/tree/3669e65581650e5d9d868aa761db9efd856f8571
          Python: https://github.com/python/cpython
          NumPy: https://github.com/numpy/numpy
          h5py: https://github.com/h5py/h5py
          NetGen distribuido por PrePoMax: https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v2.0.0.zip
          Code_Aster para Windows, instalacion desde proveedor: https://code-aster-windows.com/

          Las versiones Python y paquetes instalados figuran en ASTERMAX_BUILD_MANIFEST.json.
          Las licencias y avisos originales se conservan en ThirdParty y AsterMaxRuntime/Python,
          incluidos los directorios dist-info de los paquetes Python.
          "@ | Set-Content (Join-Path $dest 'LEEME-C12.07.txt') -Encoding utf8
          [ordered]@{
            release='C12.07';commit=$env:GITHUB_SHA;branch=$env:GITHUB_REF_NAME
            executable='AsterMax Mechanical.exe'
            executable_sha256=(Get-FileHash (Join-Path $dest 'AsterMax Mechanical.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            python_med_runtime_bundled=$true
            python_version=([string](& $python -c "import sys; print(sys.version.split()[0])")).Trim()
            python_packages=((& $python -m pip list --format=json) | ConvertFrom-Json)
            netgen_source='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v2.0.0.zip'
            netgen_source_sha256=$netgenSourceSha256
            runner_path='AsterMaxRuntime/CodeAster/astermax-codeaster-runner.cmd'
            bootstrap_path='AsterMaxRuntime/CodeAster/setup-codeaster-windows.ps1'
            solver_installer_bundled=$false;bootstrap_bundled=$true;native_installation_required=$true
            solver_transport='WINDOWS_NATIVE';synthetic_results_allowed=$false
            native_solver_validation='PENDING';native_contact_validation='PENDING';gui_interactive_validation='NOT_RUN'
          } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $dest 'ASTERMAX_BUILD_MANIFEST.json') -Encoding utf8
          "ASTERMAX_PACKAGE_DIR=$dest" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Preflight contact export from the packaged executable
        id: contact_export_preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $preflight="$PWD/dist/Audit/C1207/ContactExportPreflight"
          if(Test-Path -LiteralPath $preflight){ throw 'Contact export preflight requires a fresh evidence directory.' }
          $python=Join-Path $env:ASTERMAX_PACKAGE_DIR 'AsterMaxRuntime/Python/python.exe'
          $windowsPowerShell=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $scripts="$PWD/native-windows/c1207-contact"
          & $python (Join-Path $scripts 'generate_contact_fixture.py') --out $preflight
          if($LASTEXITCODE -ne 0){ throw "Contact export preflight fixture generation failed: $LASTEXITCODE" }
          & $windowsPowerShell -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $scripts 'export-compiled-contact.ps1') -Root "$PWD/upstream" -Dist $env:ASTERMAX_PACKAGE_DIR -Contract (Join-Path $preflight 'contact-contract.json') -OutDir (Join-Path $preflight 'corrected') -BaseName 'astermax-contact'
          if($LASTEXITCODE -ne 0){ throw "Contact export preflight from packaged executable failed: $LASTEXITCODE" }
          & $python (Join-Path $scripts 'prepare_contact_validation.py') --root $preflight
          if($LASTEXITCODE -ne 0){ throw "Contact export preflight input validation failed: $LASTEXITCODE" }
          Write-Host 'C12.07 packaged contact export preflight PASS; solver execution NOT_RUN.'
      - name: Install genuine native Windows Code_Aster using packaged setup
        id: native_setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $env:ASTERMAX_PACKAGE_DIR 'AsterMaxRuntime/CodeAster/setup-codeaster-windows.ps1'
          $setupLogs="$PWD/dist/Audit/C1207/NativeSetup"
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $setup -Unattended -LogDirectory $setupLogs
          if($LASTEXITCODE -ne 0){ throw "Packaged native Code_Aster setup failed: $LASTEXITCODE" }
          $runner=Join-Path $env:ASTERMAX_PACKAGE_DIR 'AsterMaxRuntime/CodeAster/astermax-codeaster-runner.cmd'
          $probeText=& $runner probe
          $probeExit=$LASTEXITCODE
          $audit="$PWD/dist/Audit/C1207"
          New-Item -ItemType Directory -Force -Path $audit | Out-Null
          $probeText | Set-Content (Join-Path $audit 'packaged-runner-probe.json') -Encoding utf8
          $probe=$probeText | ConvertFrom-Json
          if($probeExit -ne 0 -or -not $probe.ready -or $probe.transport -ne 'WINDOWS_NATIVE' -or $probe.wsl_required -eq $true){ throw 'Packaged runner did not validate a real native Windows Code_Aster installation.' }
      - name: Solve real TETRA4 model and validate native MED results
        id: native_solve
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1011-native-windows.ps1 -Dist $env:ASTERMAX_PACKAGE_DIR -RequireInstalledRuntime
          $validationRoot=Join-Path $env:ASTERMAX_PACKAGE_DIR 'Validation/C10.10.1-Native-Windows'
          $python=Join-Path $env:ASTERMAX_PACKAGE_DIR 'AsterMaxRuntime/Python/python.exe'
          $bridge=Join-Path $env:ASTERMAX_PACKAGE_DIR 'AsterMaxTools/bridge-c964-med-results.py'
          $env:ASTERMAX_MED_BRIDGE_MODE='production'
          & $python $bridge (Join-Path $validationRoot 'astermax-tet4-bar.rmed') (Join-Path $validationRoot 'astermax-tet4-bar.astermax-results.json') (Join-Path $validationRoot 'astermax-tet4-bar.astermax-results.vtu')
          if($LASTEXITCODE -ne 0){ throw 'Packaged MED bridge failed on the genuine native solver result.' }
          & $python "$PWD/native-windows/c1008-real-tetra/validate_c1008.py" --root $validationRoot --name astermax-tet4-bar
          if($LASTEXITCODE -ne 0){ throw 'Packaged MED bridge output failed the real TETRA4 numerical validation.' }
          $evidence=Join-Path $env:ASTERMAX_PACKAGE_DIR 'Validation/C10.10.1-Native-Windows/WINDOWS_NATIVE_EVIDENCE.json'
          if(-not (Test-Path -LiteralPath $evidence)){ throw 'Native numerical validation evidence missing.' }
          $validated=Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if($validated.transport -ne 'WINDOWS_NATIVE' -or $validated.solver_execution -ne 'RUN' -or $validated.synthetic_results_allowed -ne $false){ throw 'Native validation evidence does not satisfy the package contract.' }
          Copy-Item -LiteralPath $evidence -Destination (Join-Path $env:ASTERMAX_PACKAGE_DIR 'VALIDATION_NATIVE_CODE_ASTER.json') -Force
          $manifestPath=Join-Path $env:ASTERMAX_PACKAGE_DIR 'ASTERMAX_BUILD_MANIFEST.json'
          $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.native_solver_validation='PASS_REAL_TETRA4_MED'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8
      - name: Reproduce shared-slave failure and solve production-oriented native contacts
        id: native_contact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/test-c1207-native-contact.ps1 -Root "$PWD/upstream" -Dist $env:ASTERMAX_PACKAGE_DIR
          $evidence=Join-Path $env:ASTERMAX_PACKAGE_DIR 'Validation/C12.07-Native-Contact/C12.07_NATIVE_CONTACT_VALIDATION.json'
          if(-not (Test-Path -LiteralPath $evidence)){ throw 'Native contact validation evidence is missing.' }
          $validated=Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
          if(-not $validated.all_checks_pass -or $validated.transport -ne 'WINDOWS_NATIVE' -or $validated.solver_execution -ne 'RUN' -or $validated.synthetic_results_allowed -ne $false){ throw 'Native contact numerical evidence did not pass.' }
          if($validated.negative_control.marker -ne 'CONTACT2_16' -or $validated.original_shared_slave_nodes -ne 12 -or $validated.exported_shared_slave_nodes -ne 0 -or $validated.contact_law_preserved -ne $true){ throw 'Native contact regression did not exercise the required unchanged-law correction.' }
          $exeHash=(Get-FileHash (Join-Path $env:ASTERMAX_PACKAGE_DIR 'AsterMax Mechanical.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($validated.export_source -ne 'COMPILED_ASTERMAX_EXECUTABLE' -or $validated.executable_sha256 -ne $exeHash){ throw 'Native contact deck did not originate from this packaged executable.' }
          Copy-Item -LiteralPath $evidence -Destination (Join-Path $env:ASTERMAX_PACKAGE_DIR 'VALIDATION_NATIVE_CONTACT.json') -Force
          $manifestPath=Join-Path $env:ASTERMAX_PACKAGE_DIR 'ASTERMAX_BUILD_MANIFEST.json'
          $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.native_contact_validation='PASS_CONTACT2_16_REPRODUCTION_AND_REAL_CONTACT_MED_EQUILIBRIUM'
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8
      - name: Preserve native solver diagnostics
        if: always()
        shell: pwsh
        run: |
          $audit="$PWD/dist/Audit/C1207"
          New-Item -ItemType Directory -Force -Path $audit | Out-Null
          $validation="$PWD/dist/AsterMax-Mechanical-C12.07-Windows-x64-CodeAster/Validation"
          if(Test-Path -LiteralPath $validation){ Move-Item -LiteralPath $validation -Destination (Join-Path $audit 'NativeValidation') -Force }
          $setupLog=Join-Path $env:RUNNER_TEMP 'aster-install.log'
          if(Test-Path -LiteralPath $setupLog){ Copy-Item -LiteralPath $setupLog -Destination $audit -Force }
      - name: Verify payload, generate hashes, and validate distributable ZIP
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dest=$env:ASTERMAX_PACKAGE_DIR
          $required=@(
            'AsterMax Mechanical.exe','NetGen/NetGenMesher.exe',
            'AsterMaxRuntime/CodeAster/astermax-codeaster-runner.cmd',
            'AsterMaxRuntime/CodeAster/astermax-codeaster-runner.ps1',
            'AsterMaxRuntime/CodeAster/setup-codeaster-windows.cmd',
            'AsterMaxRuntime/CodeAster/setup-codeaster-windows.ps1',
            'AsterMaxRuntime/Python/python.exe','AsterMaxTools/bridge-c964-med-results.py',
            'AsterMaxTools/bind-c998-results-fingerprint.py','AsterMaxTools/qualify-mechanical-analysis.py','Configurar-Code_Aster.cmd',
            'AsterMaxRuntime/Python/LICENSE.txt','ThirdParty/PrePoMax/LICENSE','ThirdParty/PrePoMax/UserControls/License-LGPL.txt',
            'ASTERMAX_BUILD_MANIFEST.json','LEEME-C12.07.txt','VALIDATION_NATIVE_CODE_ASTER.json','VALIDATION_NATIVE_CONTACT.json'
          )
          foreach($relative in $required){
            $file=Join-Path $dest $relative
            if(-not (Test-Path -LiteralPath $file -PathType Leaf) -or (Get-Item -LiteralPath $file).Length -eq 0){ throw "Required package payload missing or empty: $relative" }
          }
          $installers=@(Get-ChildItem -LiteralPath $dest -Recurse -File -Filter '*.msi')
          if($installers.Count -gt 0){ throw 'Provider MSI must remain outside the distributable ZIP.' }
          $nativeManifest=Get-Content (Join-Path $dest 'ASTERMAX_BUILD_MANIFEST.json') -Raw | ConvertFrom-Json
          if($nativeManifest.native_solver_validation -ne 'PASS_REAL_TETRA4_MED'){ throw 'Refusing to publish a package without passing native numerical validation.' }
          if($nativeManifest.native_contact_validation -ne 'PASS_CONTACT2_16_REPRODUCTION_AND_REAL_CONTACT_MED_EQUILIBRIUM'){ throw 'Refusing to publish a package without the genuine shared-slave contact regression.' }

          $entries=@(Get-ChildItem -LiteralPath $dest -Recurse -File | Sort-Object FullName | ForEach-Object {
            [pscustomobject]@{path=[IO.Path]::GetRelativePath($dest,$_.FullName).Replace('\','/');sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          })
          $entries | ForEach-Object { "$($_.sha256)  $($_.path)" } | Set-Content (Join-Path $dest 'SHA256SUMS.txt') -Encoding utf8
          $zip="$PWD/dist/AsterMax-Mechanical-C12.07-Windows-x64-CodeAster.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory($dest,$zip,[IO.Compression.CompressionLevel]::Optimal,$false)
          $archive=[IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $archiveFiles=@($archive.Entries | Where-Object { -not $_.FullName.EndsWith('/') })
            if($archiveFiles.Count -ne $entries.Count+1){ throw 'ZIP file count differs from the verified package.' }
            foreach($entry in $entries){
              $stored=$archive.GetEntry($entry.path)
              if($null -eq $stored){ throw "ZIP entry missing: $($entry.path)" }
              $stream=$stored.Open(); $sha=[Security.Cryptography.SHA256]::Create()
              try { $actual=[BitConverter]::ToString($sha.ComputeHash($stream)).Replace('-','').ToLowerInvariant() }
              finally { $stream.Dispose(); $sha.Dispose() }
              if($actual -ne $entry.sha256){ throw "ZIP entry SHA-256 mismatch: $($entry.path)" }
            }
          } finally { $archive.Dispose() }
          $zipHash=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $([IO.Path]::GetFileName($zip))" | Set-Content "$zip.sha256" -Encoding ascii
          [ordered]@{release='C12.07';commit=$env:GITHUB_SHA;zip=[IO.Path]::GetFileName($zip);bytes=(Get-Item -LiteralPath $zip).Length;sha256=$zipHash;verified_payload_files=$entries.Count;zip_integrity='PASS'} | ConvertTo-Json | Set-Content "$PWD/dist/Audit/C1207/package-integrity.json" -Encoding utf8
      - name: Upload validated Windows executable package
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-Mechanical-C12.07-Windows-x64-CodeAster
          path: |
            dist/AsterMax-Mechanical-C12.07-Windows-x64-CodeAster.zip
            dist/AsterMax-Mechanical-C12.07-Windows-x64-CodeAster.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Write C12.07 evidence
        if: always()
        shell: pwsh
        env:
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
          CONTACT_TOPOLOGY_OUTCOME: ${{ steps.contact_topology.outcome }}
          SOLVER_DIAGNOSTICS_OUTCOME: ${{ steps.solver_diagnostics.outcome }}
          NATIVE_PROBE_OUTCOME: ${{ steps.native_probe.outcome }}
          RUNNER_FAILURES_OUTCOME: ${{ steps.runner_failures.outcome }}
          RUNNER_REGRESSION_OUTCOME: ${{ steps.runner_regression.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          CONTACT_EXPORT_PREFLIGHT_OUTCOME: ${{ steps.contact_export_preflight.outcome }}
          NATIVE_SETUP_OUTCOME: ${{ steps.native_setup.outcome }}
          NATIVE_SOLVE_OUTCOME: ${{ steps.native_solve.outcome }}
          NATIVE_CONTACT_OUTCOME: ${{ steps.native_contact.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          New-Item -ItemType Directory -Force "$PWD/dist/Audit/C1207" | Out-Null
          [ordered]@{
            candidate='C12.07';branch=$env:GITHUB_REF_NAME;commit=$env:GITHUB_SHA
            runner_discovery=$env:DISCOVERY_OUTCOME;native_probe_contract=$env:NATIVE_PROBE_OUTCOME;build=$env:BUILD_OUTCOME;distribution_contract=$env:CONTRACT_OUTCOME
            contact_topology=$env:CONTACT_TOPOLOGY_OUTCOME;solver_diagnostics=$env:SOLVER_DIAGNOSTICS_OUTCOME;runner_failures=$env:RUNNER_FAILURES_OUTCOME;stale_output_regression=$env:RUNNER_REGRESSION_OUTCOME
            assembly=$env:ASSEMBLE_OUTCOME;contact_export_preflight=$env:CONTACT_EXPORT_PREFLIGHT_OUTCOME;native_setup=$env:NATIVE_SETUP_OUTCOME;native_solve_med=$env:NATIVE_SOLVE_OUTCOME
            native_contact_med_equilibrium=$env:NATIVE_CONTACT_OUTCOME
            package_integrity=$env:PACKAGE_OUTCOME;solver_installer_bundled=$false;bootstrap_bundled=($env:ASSEMBLE_OUTCOME -eq 'success');native_installation_required=$true
            target='windows-x64';gui_interactive='NOT_RUN';exact_large_step='NOT_RUN';dynamic_performance='NOT_RUN';benchmark_values_invented=$false
          } | ConvertTo-Json | Set-Content "$PWD/dist/Audit/C1207/evidence.json" -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C12.07-Windows-x64-Build-Audit
          path: dist/Audit
