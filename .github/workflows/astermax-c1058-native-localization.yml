name: C10.58 native es-CL localization Windows package
on:
  push:
    branches: [agent/c1058-resx-migration]
  workflow_dispatch:

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Rebuild validated AsterMax baseline through C10.56
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python native-windows/validate-patch-chain.py
          $chain=Get-Content native-windows/patch-chain.json -Raw|ConvertFrom-Json
          $patches=@($chain.patches|ForEach-Object{$_.file})
          ./native-windows/harness-c10208a-patch-chain.ps1 -Root "$PWD/upstream" -Patches $patches -OutDir "$PWD/dist/Audit/PatchChain"
          ./native-windows/candidate-c1042-vtk-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-controller-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-large-assembly-pipeline.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1043-cad-import-reliability.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1044-adaptive-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1045-parallel-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1045b-isolated-netgen-workers.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1048-lazy-element-edges-v3.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1049-import-telemetry.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1052-viewport-purity.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1056-netgen-failure-diagnostics.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1056-netgen-failure-diagnostics.ps1 -Root "$PWD/upstream"
      - name: Apply C10.58 native localization and contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/candidate-c1058-native-localization-resx.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1058-native-localization.ps1 -Root "$PWD/upstream"
      - name: Windows x64 Release build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          nuget restore .\upstream\PrePoMax.sln -NonInteractive
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild=& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if(!$msbuild){throw 'MSBuild.exe not found'}
          & $msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0){throw 'C10.58 Windows x64 Release build failed'}
      - name: Locate runnable output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -File | Where-Object {$_.Name -in @('AsterMax Mechanical.exe','PrePoMax.exe') -and $_.FullName -match '\\bin\\(x64\\)?Release\\'} | Select-Object -First 1
          if(!$exe){throw 'Release executable not found'}
          "APP_ROOT=$($exe.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Provision NetGen runtime only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v3.0.0%20RC1.zip'
          $zip="$env:RUNNER_TEMP\PrePoMax-v3.0.0-RC1.zip"
          $extract="$env:RUNNER_TEMP\PrePoMaxRuntime"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $netgen=Get-ChildItem $extract -Recurse -File -Filter NetGenMesher.exe | Select-Object -First 1
          if(!$netgen){throw 'Official runtime does not contain NetGenMesher.exe'}
          "NETGEN_DIR=$($netgen.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Package C10.58
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pkg="$PWD\dist\AsterMax-C10.58-Windows-x64"
          New-Item -ItemType Directory -Force $pkg|Out-Null
          Copy-Item "$env:APP_ROOT\*" $pkg -Recurse -Force
          New-Item -ItemType Directory -Force "$pkg\NetGen"|Out-Null
          Copy-Item "$env:NETGEN_DIR\*" "$pkg\NetGen" -Recurse -Force
          ./native-windows/test-c1054-portable-runtime.ps1 -PackageRoot $pkg
          Compress-Archive -Path "$pkg\*" -DestinationPath "$PWD\dist\AsterMax-C10.58-Windows-x64.zip" -Force
      - name: Record C10.58 qualification
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist\Audit\C10.58|Out-Null
          @{
            commit='${{ github.sha }}'
            branch='${{ github.ref_name }}'
            native_localization_contract=if(Test-Path '.\upstream\PrePoMax\Localization\Strings.es-CL.resx'){'PASS'}else{'FAIL_OR_NOT_RUN'}
            windows_x64_build=if(Test-Path '.\dist\AsterMax-C10.58-Windows-x64.zip'){'PASS'}else{'FAIL_OR_NOT_RUN'}
            runtime_ui_visual_validation='NOT_RUN'
            exact_incident_step='BLOCKED_NOT_PRESENT_IN_REPOSITORY'
            performance='NOT_RUN'
            code_aster_windows_only_solver_preserved=$true
            main_modified=$false
          }|ConvertTo-Json|Set-Content .\dist\Audit\C10.58\evidence.json -Encoding UTF8
      - name: Upload C10.58 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.58-Windows-x64
          path: dist/AsterMax-C10.58-Windows-x64.zip
          if-no-files-found: error
      - name: Upload C10.58 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.58-Audit
          path: dist/Audit
          if-no-files-found: warn