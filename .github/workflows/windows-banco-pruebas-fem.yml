name: Windows Banco Pruebas FEM

on:
  push:
    branches: [agent/banco-pruebas-fem-20261004]
    paths:
      - 'cases/banco_pruebas/**'
      - '.github/workflows/windows-banco-pruebas-fem.yml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  banco-pruebas-mesh:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AsterMax dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile bank harnesses
        shell: pwsh
        run: |
          python -W error -m py_compile cases/banco_pruebas/reconstruct_geometry.py
          python -W error -m py_compile cases/banco_pruebas/mesh_structure.py

      - name: Reconstruct and verify structural BREP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\banco_pruebas | Out-Null
          python cases/banco_pruebas/reconstruct_geometry.py 2>&1 | Tee-Object -FilePath artifacts\banco_pruebas\geometry_reconstruction.log
          if($LASTEXITCODE -ne 0){throw "Geometry reconstruction failed: $LASTEXITCODE"}
          Get-FileHash cases\banco_pruebas\MAX_CIM_structure_base.brep -Algorithm SHA256 | Format-List | Out-String | Set-Content artifacts\banco_pruebas\geometry_sha256.txt

      - name: Generate curvature-bounded TET10 mesh
        shell: pwsh
        run: |
          python cases/banco_pruebas/mesh_structure.py cases/banco_pruebas/MAX_CIM_structure_base.brep --min-mm 30 --max-mm 110 --curvature-elements 20 --out artifacts/banco_pruebas
          if($LASTEXITCODE -ne 0){throw "Banco mesh harness failed: $LASTEXITCODE"}

      - name: Show mesh evidence
        if: always()
        shell: pwsh
        run: |
          if(Test-Path artifacts\banco_pruebas\mesh_evidence.json){Get-Content artifacts\banco_pruebas\mesh_evidence.json}
          if(Test-Path artifacts\banco_pruebas\geometry_reconstruction.log){Get-Content artifacts\banco_pruebas\geometry_reconstruction.log}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banco-pruebas-fem-evidence-${{ github.run_number }}
          path: artifacts/banco_pruebas/
          if-no-files-found: error
