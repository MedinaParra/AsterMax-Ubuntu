name: C8.53 Region Binding Inspector Windows

on:
  push:
    branches: [agent/c8-53-region-binding-inspector]
  workflow_dispatch:

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - name: Restore
        shell: pwsh
        run: nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Verify region binding contract
        shell: pwsh
        run: |
          $src=Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxRegionBindingInspector.cs' -Raw
          foreach($token in @('REGION BINDING INSPECTOR','BoundaryConditions','Loads','RegionName','RegionType','CreationIds','GeometryIds','NodeIds','ElementIds','Observed only. No viewport anchoring or solver verification is inferred.')) {
            if($src -notmatch [regex]::Escape($token)){throw "Missing C8.53 token: $token"}
          }
          if($src -match 'solver_verified\s*=\s*true|entity_anchored\s*=\s*true'){throw 'Inspector must not synthesize solver/entity verification.'}
          $frm=Get-Content 'build/PrePoMax-CodeAster/PrePoMax/Forms/FrmMain.cs' -Raw
          if($frm -notmatch 'InstallAsterMaxRegionBindingInspector'){throw 'Region binding inspector not installed in FrmMain.'}
      - name: Native GUI smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(30)
          do{Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw 'GUI exited early'}}while($p.MainWindowHandle -eq 0 -and (Get-Date)-lt $deadline)
          if($p.MainWindowHandle -eq 0){throw 'No native window'}
          if($p.MainWindowTitle -notmatch '^AsterMax Mechanical'){throw "Unexpected title: $($p.MainWindowTitle)"}
          @{title=$p.MainWindowTitle;region_binding_inspector=$true;entity_anchored_verified=$false;solver_verified=$false;industrial_validation=$false;ansys_equivalence=$false;commit='${{ github.sha }}'}|ConvertTo-Json|Set-Content -Encoding UTF8 artifact/C8.53_EVIDENCE.json
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.53-Region-Binding-Inspector-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
