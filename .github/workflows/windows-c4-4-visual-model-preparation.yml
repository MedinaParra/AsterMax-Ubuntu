name: Windows C4.4 Visual Model Preparation

on:
  pull_request:
    paths:
      - "src/astermax/app.py"
      - "src/astermax/fea/visual_model_preparation.py"
      - "tests/test_visual_model_preparation.py"
      - ".github/workflows/windows-c4-4-visual-model-preparation.yml"

jobs:
  verify-visual-model-preparation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMV and full test dependencies
        run: python -m pip install -e .[test]
      - name: Compile C4.4 modules with warnings as errors
        run: python -W error -m py_compile src/astermax/fea/visual_model_preparation.py src/astermax/app.py
      - name: Run C4.4 visual preparation harness
        run: python -m pytest tests/test_visual_model_preparation.py -q
      - name: Run deterministic regression harness
        run: python -m pytest -q
