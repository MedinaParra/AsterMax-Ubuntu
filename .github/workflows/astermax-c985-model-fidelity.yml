name: AsterMax C9.85 Native FeModel Fidelity Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'native-windows/patch-c985-model-fidelity-gate.ps1'
      - '.github/workflows/astermax-c985-model-fidelity.yml'
  workflow_dispatch:

jobs:
  native-femodel-fidelity:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Checkout PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: master
          path: upstream
      - name: Apply AsterMax patches required by fidelity gate
        shell: pwsh
        run: |
          .\native-windows\patch-astermax.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-branding.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c965-results-workspace.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c976-automatic-model-fingerprint.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c985-model-fidelity-gate.ps1 -Root "$PWD\upstream"
      - name: Restore packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Build AsterMax Windows x64
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Exercise compiled FeModel freshness gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe'|Where-Object{$_.FullName -match 'bin\\x64\\Release'}|Select-Object -First 1
          if(-not $exe){throw 'AsterMax Mechanical.exe missing'}
          $bin=$exe.Directory.FullName;$root=(Resolve-Path .\upstream).Path;[Environment]::CurrentDirectory=$bin
          $global:r=$root;$global:b=$bin
          [AppDomain]::CurrentDomain.add_AssemblyResolve({param($s,$a);$d=([Reflection.AssemblyName]$a.Name).Name+'.dll';$p=Join-Path $global:b $d;if(Test-Path $p){return [Reflection.Assembly]::LoadFrom($p)};$c=Get-ChildItem $global:r -Recurse -Filter $d -ErrorAction SilentlyContinue|Where-Object{$_.FullName -match 'bin\\(x64\\)?Release|packages'}|Select-Object -First 1;if($c){return [Reflection.Assembly]::LoadFrom($c.FullName)};return $null})
          $asm=[Reflection.Assembly]::LoadFrom($exe.FullName)
          $fpType=$asm.GetType('PrePoMax.AsterMaxModelFingerprint',$true)
          $gateType=$asm.GetType('PrePoMax.AsterMaxModelFidelityGate',$true)
          $extract=$fpType.GetMethod('Extract',[Reflection.BindingFlags]'Public,Static')
          $verify=$gateType.GetMethod('Verify',[Reflection.BindingFlags]'Public,Static')
          $require=$gateType.GetMethod('Require',[Reflection.BindingFlags]'Public,Static')
          $cm=[Reflection.Assembly]::LoadFrom((Get-ChildItem $root -Recurse -Filter 'CaeModel.dll'|Where-Object{$_.FullName -match 'bin\\x64\\Release'}|Select-Object -First 1).FullName)
          $meshAsm=[Reflection.Assembly]::LoadFrom((Get-ChildItem $root -Recurse -Filter 'CaeMesh.dll'|Where-Object{$_.FullName -match 'bin\\x64\\Release'}|Select-Object -First 1).FullName)
          $cg=[Reflection.Assembly]::LoadFrom((Get-ChildItem $root -Recurse -Filter 'CaeGlobals.dll'|Where-Object{$_.FullName -match 'bin\\x64\\Release'}|Select-Object -First 1).FullName)
          $feType=$cm.GetType('CaeModel.FeModel',$true);$model=[Activator]::CreateInstance($feType,@('C985-POC'))
          $usType=$cg.GetType('CaeGlobals.UnitSystem',$true);$ust=$cg.GetType('CaeGlobals.UnitSystemType',$true);$mmEnum=[Enum]::Parse($ust,'MM_TON_S_C');$us=[Activator]::CreateInstance($usType,@($mmEnum));$feType.GetProperty('UnitSystem').SetValue($model,$us)
          $matType=$cm.GetType('CaeModel.Material',$true);$mat=[Activator]::CreateInstance($matType,@('Steel-PoC'));$model.Materials.Add('Steel-PoC',$mat)
          $nodeType=$meshAsm.GetType('CaeMesh.FeNode',$true);$node=[Activator]::CreateInstance($nodeType,@(1,0.0,0.0,0.0));$model.Mesh.Nodes.Add(1,$node)
          $stepType=$cm.GetType('CaeModel.StaticStep',$true);$step=[Activator]::CreateInstance($stepType,@('Step-1'))
          $regionType=$cg.GetType('CaeGlobals.RegionTypeEnum',$true);$nodeSet=[Enum]::Parse($regionType,'NodeSetName')
          $bcType=$cm.GetType('CaeModel.FixedBC',$true);$bc=[Activator]::CreateInstance($bcType,@('Fixed-1','FIXED',$nodeSet,$false));$step.AddBoundaryCondition($bc)
          $loadType=$cm.GetType('CaeModel.CLoad',$true);$load=[Activator]::CreateInstance($loadType,@('Force-1',1,1000.0,0.0,0.0,$false,$false,0.0));$step.AddLoad($load)
          $model.StepCollection.AddStep($step,$false)
          $fp=$extract.Invoke($null,@($model));$sha=[string]$fpType.GetProperty('Sha256').GetValue($fp)
          $same=[bool]$verify.Invoke($null,@($model,$sha))
          $accepted=[string]$require.Invoke($null,@($model,$sha))
          $load.F1=1001.0;$loadRejected=$false;try{$null=$require.Invoke($null,@($model,$sha))}catch{$loadRejected=$true};$load.F1=1000.0
          $node.X=1.0;$meshRejected=$false;try{$null=$require.Invoke($null,@($model,$sha))}catch{$meshRejected=$true};$node.X=0.0
          $mat.Description='changed';$materialRejected=$false;try{$null=$require.Invoke($null,@($model,$sha))}catch{$materialRejected=$true};$mat.Description=$null
          $freshAgain=[bool]$verify.Invoke($null,@($model,$sha))
          $checks=[ordered]@{
            windows_x64_build=(Test-Path $exe.FullName)
            compiled_native_gate=($null -ne $gateType)
            fingerprint_sha256_shape=($sha -match '^[0-9a-f]{64}$')
            unchanged_model_allowed=$same
            require_returns_same_fingerprint=($accepted -eq $sha)
            stale_load_blocked=$loadRejected
            stale_mesh_blocked=$meshRejected
            stale_material_blocked=$materialRejected
            restored_model_allowed=$freshAgain
          }
          $out=[ordered]@{release='C9.85';title='Native FeModel Fidelity Gate';checks=$checks;passed=($checks.Values|Where-Object{$_}).Count;total=$checks.Count;pass=(-not($checks.Values -contains $false));model_fingerprint_sha256=$sha;fea_values_invented=$false;fresh_solver_run='NOT_RUN';truth_boundary='C9.85 proves a compiled Windows AsterMax gate can block Solve when the real in-memory FeModel changes after fingerprint capture. It does not yet prove automatic Code_Aster deck equivalence.'}
          $out|ConvertTo-Json -Depth 6|Set-Content artifact\C9.85_VALIDATION.json -Encoding UTF8
          $out|ConvertTo-Json -Depth 6|Write-Host
          if(-not $out.pass){throw 'C9.85 FeModel fidelity gate failed'}
      - name: Package evidence
        if: always()
        shell: pwsh
        run: |
          Copy-Item .\native-windows\patch-c985-model-fidelity-gate.ps1 artifact\ -Force
          Get-FileHash artifact\* -Algorithm SHA256|Format-Table -AutoSize|Out-String|Set-Content artifact\SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C9.85-Native-FeModel-Fidelity
          path: artifact
          if-no-files-found: error
