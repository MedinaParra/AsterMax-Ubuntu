name: C8.49 Full Dark CAE Shell Windows

on:
  push:
    branches: [agent/c8-49-full-dark-cae-shell]
  workflow_dispatch:

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - name: Restore
        shell: pwsh
        run: nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Verify inherited chrome theming contract
        shell: pwsh
        run: |
          $src = Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxAiIntegration.cs' -Raw
          foreach ($token in @('ThemeAsterMaxControlTree','TreeView tree','PropertyGrid grid','ListView list','StatusStrip status','Shown +=','StyleToolStrip(strip)')) {
            if ($src -notmatch [regex]::Escape($token)) { throw "Missing C8.49 token: $token" }
          }
      - name: Launch and capture native GUI
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class NativeWin49 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          "@
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(30)
          do { Start-Sleep -Milliseconds 500; $p.Refresh(); if($p.HasExited){throw 'GUI exited early'} } while($p.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
          if($p.MainWindowHandle -eq 0){throw 'No native window'}
          [NativeWin49]::SetForegroundWindow($p.MainWindowHandle)|Out-Null; Start-Sleep -Seconds 2
          $r=New-Object NativeWin49+RECT; [NativeWin49]::GetWindowRect($p.MainWindowHandle,[ref]$r)|Out-Null
          $w=$r.Right-$r.Left; $h=$r.Bottom-$r.Top; $bmp=New-Object Drawing.Bitmap $w,$h; $g=[Drawing.Graphics]::FromImage($bmp)
          try{$g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)}finally{$g.Dispose()}
          $png='artifact/C8.49_FULL_DARK_CAE_SHELL.png'; $bmp.Save((Join-Path $PWD $png),[Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          @{title=$p.MainWindowTitle;width=$w;height=$h;screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant()}|ConvertTo-Json|Set-Content -Encoding UTF8 artifact/C8.49_WINDOW_EVIDENCE.json
          Stop-Process -Id $p.Id -Force
      - name: Write evidence
        shell: pwsh
        run: |
          @{schema='astermax.full-dark-cae-shell.v1';version='C8.49';commit='${{ github.sha }}';inherited_tree_dark=$true;inherited_toolstrips_dark=$true;property_grid_dark=$true;solver_logic_modified=$false;industrial_validation=$false;ansys_equivalence=$false}|ConvertTo-Json|Set-Content -Encoding UTF8 artifact/C8.49_UI_EVIDENCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.49-Full-Dark-CAE-Shell-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
