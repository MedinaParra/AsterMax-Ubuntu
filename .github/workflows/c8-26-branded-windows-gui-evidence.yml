name: C8.26 Branded Windows GUI evidence

on:
  push:
    branches:
      - agent/c8-26-branded-windows-gui-evidence
    paths:
      - 'integrations/prepomax-codeaster/**'
      - '.github/workflows/c8-26-branded-windows-gui-evidence.yml'
  workflow_dispatch:

concurrency:
  group: c8-26-branded-windows-gui-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branded-gui-evidence:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bootstrap current AsterMax Mechanical overlay
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster

      - name: Assert product identity was applied before build
        shell: pwsh
        run: |
          $globals = Get-Content build/PrePoMax-CodeAster/PrePoMax/Globals.cs -Raw
          $assembly = Get-Content build/PrePoMax-CodeAster/PrePoMax/Properties/AssemblyInfo.cs -Raw
          if ($globals -notmatch 'ProgramName\s*=\s*"AsterMax Mechanical"') { throw 'Globals.cs does not contain AsterMax Mechanical ProgramName.' }
          if ($assembly -notmatch 'AssemblyTitle\("AsterMax Mechanical"\)') { throw 'Assembly title was not branded.' }
          if ($assembly -notmatch 'AssemblyProduct\("AsterMax Mechanical"\)') { throw 'Assembly product was not branded.' }
          if ($globals -match 'ProgramName\s*=\s*"PrePoMax v1\.4\.0"') { throw 'Legacy PrePoMax window identity is still active.' }

      - name: Restore NuGet dependencies
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal 2>&1 | Tee-Object -FilePath c8-26-msbuild.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate actual executable
        id: locate
        shell: pwsh
        run: |
          $candidates = Get-ChildItem -Path build/PrePoMax-CodeAster -Recurse -Filter PrePoMax.exe -File -ErrorAction Stop |
            Where-Object { $_.FullName -match '[\\/]bin[\\/].*[\\/]Release[\\/]' -or $_.FullName -match '[\\/]bin[\\/]Release[\\/]' }
          if (-not $candidates) { throw 'Release/x64 executable was not found after successful MSBuild.' }
          $exe = $candidates | Sort-Object FullName | Select-Object -First 1
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Launch branded GUI and capture native evidence
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindowRect {
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@

          New-Item -ItemType Directory -Force -Path artifact/c8-26 | Out-Null
          $exe = '${{ steps.locate.outputs.exe }}'
          $proc = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 500
            $proc.Refresh()
            if ($proc.HasExited) { throw "GUI exited before a main window was created. ExitCode=$($proc.ExitCode)" }
          } while ($proc.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)

          $proc.Refresh()
          if ($proc.MainWindowHandle -eq 0) { throw 'No native main window handle appeared within 30 seconds.' }
          $title = $proc.MainWindowTitle
          if ($title -notmatch '^AsterMax Mechanical') { throw "Unexpected real window title: '$title'. Expected AsterMax Mechanical branding." }
          if ($title -match 'PrePoMax') { throw "Legacy PrePoMax title leaked into branded window: '$title'." }

          [NativeWindowRect]::SetForegroundWindow($proc.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          $rect = New-Object NativeWindowRect+RECT
          if (-not [NativeWindowRect]::GetWindowRect($proc.MainWindowHandle, [ref]$rect)) { throw 'GetWindowRect failed.' }
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          if ($width -lt 640 -or $height -lt 480) { throw "Main window is unexpectedly small: ${width}x${height}." }

          $bmp = New-Object System.Drawing.Bitmap $width, $height
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          try {
            $gfx.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bmp.Size)
            $png = Join-Path $PWD 'artifact/c8-26/AsterMax-Mechanical-real-window.png'
            $bmp.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          } finally {
            $gfx.Dispose()
            $bmp.Dispose()
          }

          $pngInfo = Get-Item artifact/c8-26/AsterMax-Mechanical-real-window.png
          if ($pngInfo.Length -lt 10000) { throw "Captured PNG is suspiciously small: $($pngInfo.Length) bytes." }
          $pngHash = (Get-FileHash $pngInfo.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @{
            schema = 'astermax.branded-windows-gui-evidence.v1'
            commit = '${{ github.sha }}'
            executable_file_name = [System.IO.Path]::GetFileName($exe)
            executable_sha256 = '${{ steps.locate.outputs.sha256 }}'
            native_main_window_handle_observed = $true
            main_window_title = $title
            expected_product_identity = 'AsterMax Mechanical'
            legacy_prepomax_title_absent = $true
            window_width_px = $width
            window_height_px = $height
            screenshot = 'AsterMax-Mechanical-real-window.png'
            screenshot_sha256 = $pngHash
            screenshot_size_bytes = $pngInfo.Length
            real_windows_process = $true
            gui_window_observed = $true
            branding_verified_from_real_window = $true
            fea_solve_executed_by_this_job = $false
            numerical_verification_by_this_job = $false
            rendering_semantics_verified = $false
            industrial_validation = $false
            ansys_equivalence = $false
            note = 'Real compiled Windows GUI evidence. Product identity is verified from the native window title; no FEA result claim is promoted by this job.'
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 artifact/c8-26/GUI_EVIDENCE.json
          Stop-Process -Id $proc.Id -Force

      - name: Validate screenshot PNG signature
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path artifact/c8-26/AsterMax-Mechanical-real-window.png))
          $expected = [byte[]](137,80,78,71,13,10,26,10)
          for ($i = 0; $i -lt $expected.Length; $i++) {
            if ($bytes[$i] -ne $expected[$i]) { throw 'Screenshot is not a valid PNG.' }
          }
          Get-Content artifact/c8-26/GUI_EVIDENCE.json

      - name: Package branded PMV runtime
        shell: pwsh
        run: |
          $src = '${{ steps.locate.outputs.exe_dir }}'
          $dst = Join-Path $PWD 'artifact/c8-26/AsterMax-PMV-Windows-x64'
          Copy-Item -Path $src -Destination $dst -Recurse -Force
          $harness = Get-ChildItem -Path $dst -Recurse -Filter astermax_harness.py -File -ErrorAction SilentlyContinue
          if (-not $harness) { throw 'Bundled solver harness is missing from distributable runtime.' }
          Compress-Archive -Path "$dst/*" -DestinationPath artifact/c8-26/AsterMax-PMV-Windows-x64.zip -CompressionLevel Optimal

      - name: Upload branded GUI and executable evidence
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.26-Windows-${{ github.sha }}
          path: artifact/c8-26/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c8-26-build-diagnostics-${{ github.sha }}
          path: c8-26-msbuild.log
          if-no-files-found: ignore
          retention-days: 14
