name: Windows C3.2 CAD-Derived Axial Verification

on:
  push:
    branches:
      - agent/cad-derived-axial-witness-c3-2-v0.9
  pull_request:
    branches:
      - agent/axial-step-neighborhood-c3-1-v0.8
  workflow_dispatch:

jobs:
  verify-c3-2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV and test dependencies
        run: python -m pip install -e .[test]
      - name: Compile with warnings as errors
        run: python -W error -m compileall -q src benchmarks packaging
      - name: Run C3.2 CAD witness harness
        run: python -m pytest -q tests/test_cad_axial_witness.py tests/test_axial_step_verification.py tests/test_neighborhood_verification.py
      - name: Run exact STEP to CAD witness to sparse FEA benchmark
        run: python benchmarks/c3_2_cad_derived_axial_benchmark.py
      - name: Run deterministic regression harness
        run: python -m pytest -q
      - name: Upload C3.2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: c3-2-cad-derived-axial-windows
          path: c3_2_cad_derived_axial_benchmark.json
          if-no-files-found: error
