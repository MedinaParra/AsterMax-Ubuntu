name: AsterMax one-time real STEP routing

on:
  push:
    branches:
      - agent/mechanical-gui-pdf-workflow
    paths:
      - ".github/workflows/astermax-one-time-cad-routing.yml"

permissions:
  contents: write

jobs:
  patch-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mechanical-gui-pdf-workflow
          fetch-depth: 0

      - name: Route general CAD actions to verified engines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          actions = Path('windows/AsterMax.MechanicalGui/MechanicalForm.Actions.cs')
          text = actions.read_text(encoding='utf-8')

          text = text.replace(
              '        _resultCount = 0;\n        BuildProjectTree();',
              '        _resultCount = 0;\n        ResetCadState();\n        BuildProjectTree();', 1)
          text = text.replace('        Text = "AsterMax Mechanical 0.3 beta";', '        Text = ProductTitle;', 1)
          text = text.replace('        Text = $"AsterMax Mechanical 0.3 beta - {snapshot.ProjectName}";', '        Text = $"{ProductTitle} - {snapshot.ProjectName}";', 1)
          text = text.replace('            Text = $"AsterMax Mechanical 0.3 beta - {snapshot.ProjectName}";', '            Text = $"{ProductTitle} - {snapshot.ProjectName}";', 1)

          old_import = '''    private void ImportGeometry(string? file)
    {
        if (file is null)
        {
            using var dialog = new OpenFileDialog
            {
                Title = "Import Geometry",
                Filter = "CAD geometry (*.step;*.stp;*.iges;*.igs;*.brep)|*.step;*.stp;*.iges;*.igs;*.brep|All files (*.*)|*.*"
            };
            if (dialog.ShowDialog(this) != DialogResult.OK) return;
            file = dialog.FileName;
        }
        _geometryPath = file;
        var geometry = _nodes["Geometry"];
        geometry.Nodes.Clear();
        var part = MakeNode(Path.GetFileNameWithoutExtension(file), ObjectKind.Body, ObjectState.UpToDate, "Body");
        ((ModelObject)part.Tag).Properties["Material"] = "Structural Steel";
        ((ModelObject)part.Tag).Properties["Body Type"] = "Solid";
        part.Nodes.Add(MakeNode("Solid Body 1", ObjectKind.Body, ObjectState.UpToDate, "Solid Body"));
        geometry.Nodes.Add(part);
        geometry.Expand();
        SetState(geometry, ObjectState.UpToDate);
        SetState(_nodes["Model"], ObjectState.Ready);
        _meshGenerated = false;
        _solved = false;
        SetState(_nodes["Mesh"], ObjectState.NeedsAttention);
        MarkSolutionDirty();
        Log($"Geometry imported: {file}");
        SelectNode("Geometry");
    }
'''
          new_import = '''    private void ImportGeometry(string? file)
    {
        if (file is null)
        {
            using var dialog = new OpenFileDialog
            {
                Title = "Import STEP Geometry",
                Filter = "STEP geometry (*.step;*.stp)|*.step;*.stp|All files (*.*)|*.*"
            };
            if (dialog.ShowDialog(this) != DialogResult.OK) return;
            file = dialog.FileName;
        }

        var extension = Path.GetExtension(file).ToLowerInvariant();
        if (extension is ".step" or ".stp")
        {
            _ = ImportCadStepAsync(file);
            return;
        }

        MessageBox.Show(this,
            "The functional native CAD route currently accepts STEP/STP. IGES and BREP remain on the roadmap and are no longer represented by fictitious geometry.",
            "Geometry format not implemented",
            MessageBoxButtons.OK,
            MessageBoxIcon.Information);
    }
'''
          if old_import not in text:
              raise SystemExit('Original ImportGeometry block was not found.')
          text = text.replace(old_import, new_import, 1)

          old_mesh = '''    private void GenerateMesh()
    {
        if (_nodes["Geometry"].Nodes.Count == 0)
        {
            MessageBox.Show(this, "Import geometry before generating the mesh.", "AsterMax", MessageBoxButtons.OK, MessageBoxIcon.Warning);
            SelectNode("Geometry");
            return;
        }
        _meshGenerated = true;
        SetState(_nodes["Mesh"], ObjectState.UpToDate);
        _viewport.MeshVisible = true;
        _viewport.ResultVisible = false;
        _viewport.Caption = "Mesh";
        _viewport.SubCaption = "Generated quadratic tetrahedral mesh";
        _viewport.Invalidate();
        MarkSolutionDirty();
        _statusMain.Text = "Mesh up-to-date";
        Log("Mesh generated: 12,486 nodes; 7,214 tetrahedral elements.");
        RefreshWorkflow();
        SelectNode("Mesh");
    }
'''
          new_mesh = '''    private void GenerateMesh()
    {
        if (_cadStepPath is not null && _cadEnvelope is not null && !_cadEnvelope.IsSupportedPrism)
        {
            _ = GenerateCadMeshAsync();
            return;
        }
        if (_simpleSolid is not null)
        {
            GenerateSimpleMesh();
            return;
        }
        if (_nodes["Geometry"].Nodes.Count == 0)
        {
            MessageBox.Show(this, "Import STEP geometry before generating the mesh.", "AsterMax", MessageBoxButtons.OK, MessageBoxIcon.Warning);
            SelectNode("Geometry");
            return;
        }
        MessageBox.Show(this,
            "The selected tree body was created by a legacy demonstration route and has no geometric topology. Re-import the STEP with this version.",
            "Geometry must be re-imported",
            MessageBoxButtons.OK,
            MessageBoxIcon.Warning);
    }
'''
          if old_mesh not in text:
              raise SystemExit('Original GenerateMesh block was not found.')
          text = text.replace(old_mesh, new_mesh, 1)

          old_solve = '''    private async Task SolveAsync()
    {
        if (_busy) return;
'''
          new_solve = '''    private async Task SolveAsync()
    {
        if (_cadVolumeMesh is not null)
        {
            MessageBox.Show(this,
                "The real Gmsh mesh is ready, but arbitrary-face scoping and assembly into the general 3-D solver are not implemented yet. No fictitious solution will be generated.",
                "General STEP solver pending",
                MessageBoxButtons.OK,
                MessageBoxIcon.Information);
            return;
        }
        if (_simpleSolid is not null)
        {
            await SolveSimpleStaticAsync();
            return;
        }
        if (_busy) return;
'''
          if old_solve not in text:
              raise SystemExit('SolveAsync signature was not found.')
          text = text.replace(old_solve, new_solve, 1)
          actions.write_text(text, encoding='utf-8')

          simple = Path('windows/AsterMax.MechanicalGui/MechanicalForm.SimpleStatic.cs')
          text = simple.read_text(encoding='utf-8')
          text = text.replace(
              '    private void ImportSimpleStep(string path)\n    {\n        try',
              '    private void ImportSimpleStep(string path)\n    {\n        ResetCadState();\n        try', 1)
          text = text.replace(
              '    private void ResetSimpleStatic()\n    {\n        _simpleSolid = null;',
              '    private void ResetSimpleStatic()\n    {\n        ResetCadState();\n        _simpleSolid = null;', 1)
          simple.write_text(text, encoding='utf-8')

          cad = Path('windows/AsterMax.MechanicalGui/MechanicalForm.GmshCad.cs')
          text = cad.read_text(encoding='utf-8')
          text = text.replace(
              '        HideCadCanvas();\n        ResetCadState();',
              '        ResetSimpleStatic();\n        ResetCadState();', 1)
          cad.write_text(text, encoding='utf-8')
          PY

      - name: Remove migration and commit
        shell: bash
        run: |
          git rm .github/workflows/astermax-one-time-cad-routing.yml
          git config user.name "AsterMax CI"
          git config user.email "actions@users.noreply.github.com"
          git add windows/AsterMax.MechanicalGui .github/workflows/astermax-one-time-cad-routing.yml
          git commit -m "Route STEP import and meshing through real geometry engines"
          git push origin HEAD:agent/mechanical-gui-pdf-workflow
