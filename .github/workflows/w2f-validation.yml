name: W2F FEA Authorization Validation

on:
  push:
    branches:
      - "validation/W2F-fea-authorization"
  workflow_dispatch:

jobs:
  validate-w2f:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Fetch frozen W2E baseline
        run: git fetch origin work/W2E-planar-gap-variants:refs/remotes/origin/work/W2E-planar-gap-variants
      - name: Validate W2F WorkPackage contract
        run: astermax-harness validate harness/workpackages/W2F_fea_authorization.yaml
      - name: Verify exact W2F scope budget against W2E
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from astermax.harness.policy import evaluate_scope
          from astermax.harness.runner import get_changed_files, load_workpackage
          package, _ = load_workpackage('harness/workpackages/W2F_fea_authorization.yaml')
          files = get_changed_files(Path('.').resolve(), 'origin/work/W2E-planar-gap-variants')
          validation_only = '.github/workflows/w2f-validation.yml'
          if validation_only not in files:
              raise SystemExit('Expected validation-only workflow is absent from validation branch diff.')
          unexpected = sorted(path for path in files if path != validation_only and path not in package.allowed_files)
          if unexpected:
              raise SystemExit(f'Unexpected out-of-WorkPackage files: {unexpected}')
          candidate_files = [path for path in files if path != validation_only]
          if sorted(candidate_files) != sorted(package.allowed_files):
              raise SystemExit(f'Candidate diff must exactly equal W2F allowlist; candidate={sorted(candidate_files)}, allowed={sorted(package.allowed_files)}')
          result = evaluate_scope(package, candidate_files)
          print(result.model_dump_json(indent=2))
          raise SystemExit(0 if result.status.value == 'PASS' else 1)
          '@ | python -
      - name: Run W2F adversarial tests
        run: python -m pytest -q tests/test_fea_authorization.py
      - name: Run all non-numerical software tests
        run: python -m pytest -q --ignore=tests/benchmarks
      - name: Run coding harness tests
        run: python -m pytest -q tests/test_coding_harness.py
      - name: Run frontier methodology tests
        run: python -m pytest -q tests/test_frontier_methodology.py
      - name: Run frozen frontier validity suite
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from astermax.harness.evals import run_frozen_eval_suite
          result = run_frozen_eval_suite(Path('.').resolve(), Path('harness/evals/frontier.v1.yaml'), 'frontier_validity')
          print(result.model_dump_json(indent=2))
          raise SystemExit(0 if result.status.value == 'PASS' else 1)
          '@ | python -
      - name: Compile source tree
        run: python -m compileall -q src
      - name: Record evidence boundary
        shell: pwsh
        run: |
          Write-Host "W2F validates authorization contracts only."
          Write-Host "No guessed material/load/preload/friction values and no OT1613 FEA result are produced."
