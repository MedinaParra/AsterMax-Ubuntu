name: Windows Surface Axial QOI Convergence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-surface-axial-qoi-convergence:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV
        run: python -m pip install -e .[test]
      - name: Run deterministic regression harness
        run: python -m pytest -q
      - name: Evaluate sampled fillet surface axial QOI convergence
        run: python benchmarks/surface_axial_qoi_convergence.py
      - name: Upload C20 convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-axial-qoi-convergence-windows
          path: |
            surface_axial_qoi_convergence.step
            surface_axial_qoi_convergence.json
          if-no-files-found: error
