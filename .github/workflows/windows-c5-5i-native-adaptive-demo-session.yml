name: Windows C5.5i Native Adaptive Demo Session

on:
  pull_request:
  workflow_dispatch:

jobs:
  native-adaptive-demo-session:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/adaptive_demo_session.py
      - name: C5.5i real adaptive demo session harness
        run: python -m pytest -q tests/test_adaptive_demo_session.py
      - name: Adaptive solve and ownership regressions
        run: python -m pytest -q tests/test_adaptive_second_solve.py tests/test_msh_ownership_importer.py tests/test_robust_surface_association.py tests/test_adaptive_mesh_provenance.py tests/test_remesh_face_rebinding.py tests/test_gmsh_local_refinement.py tests/test_qoi_convergence.py
      - name: CAD STEP and professional results regressions
        run: python -m pytest -q tests/test_step_to_solve.py tests/test_named_selections.py tests/test_production_results.py tests/test_demo_session.py tests/test_demo_dashboard.py tests/test_results_workspace.py
      - name: Full regression suite
        run: python -m pytest -q
