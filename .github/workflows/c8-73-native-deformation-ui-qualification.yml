name: C8.73 Native Deformation UI Qualification

on:
  push:
    branches: [agent/c8-73-native-deformation-ui-qualification]
  workflow_dispatch:

concurrency:
  group: c8-73-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-deformation-ui:
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      C865_RUN_ID: '33963671896'
      C865_SHA: '86b123a2df7a481a06451358e299bac69db2b7e4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact solver-verified evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prior/windows,prior/solve | Out-Null
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "C8.65-Windows-Generated-Study-$env:C865_SHA" --dir prior/windows
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "AsterMax-C8.65-Product-Native-Reaction-$env:C865_SHA" --dir prior/solve
          $pmx=Get-ChildItem prior/windows -Recurse -Filter 'AsterMax_C862_Structural.pmx'|Select-Object -First 1
          $rmed=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.rmed'|Select-Object -First 1
          $resu=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.resu'|Select-Object -First 1
          $ev=Get-ChildItem prior/solve -Recurse -Filter 'C8.65_PRODUCT_NATIVE_REACTION_EVIDENCE.json'|Select-Object -First 1
          if(-not $pmx -or -not $rmed -or -not $resu -or -not $ev){throw 'Pinned evidence bundle incomplete.'}
          $e=Get-Content $ev.FullName -Raw|ConvertFrom-Json
          if(-not $e.solver_verified -or -not $e.result_field_values_verified -or -not $e.reaction_equilibrium_verified){throw 'Source solve is not admitted.'}
          "C873_PMX=$($pmx.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C873_RMED=$($rmed.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C873_RESU=$($resu.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C873_PRIOR=$($ev.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C873_NODES=$($e.node_count)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C873_MISES=$($e.max_von_mises_mpa.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C873_DISP=$($e.max_displacement_mm.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C873_MISES_NODE=$($e.max_von_mises_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C873_DISP_NODE=$($e.max_displacement_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Bootstrap and apply C8.66-C8.73 Results qualification chain
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_full_model_results_demo.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_results_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_clean_verified_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_extrema_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_node_probe_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_deformation_geometry.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_render_mesh_deformation_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_deformation_ui_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_deformation_ui_evidence_fix.py build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Run fail-closed native deformation UI qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/c8-73|Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $ready=(Join-Path $PWD 'artifact/c8-73/RESULTS_NATIVE_DEFORMATION_UI_READY.json')
          $env:ASTERMAX_RESULTS_FULL_MODEL_PMX=$env:C873_PMX
          $env:ASTERMAX_RESULTS_EXPECTED_NODES=$env:C873_NODES
          $env:ASTERMAX_RESULTS_EXPECTED_ELEMENTS='2474'
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_MAX=$env:C873_MISES
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_MAX=$env:C873_DISP
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_NODE=$env:C873_MISES_NODE
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_NODE=$env:C873_DISP_NODE
          $p=Start-Process $exe -ArgumentList @('--astermax-results-demo',$env:C873_RMED,$env:C873_RESU,$ready) -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(90)
          while(-not(Test-Path $ready) -and (Get-Date)-lt $deadline){Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw "Results process exited early: $($p.ExitCode)"}}
          if(-not(Test-Path $ready)){throw 'Timed out waiting for Results READY.'}
          $s=Get-Content $ready -Raw|ConvertFrom-Json
          if(-not $s.scene_ready -or -not $s.result_admitted -or -not $s.full_model_pmx_loaded){throw 'Full-model Results gate failed.'}
          if(-not $s.render_mesh_deformation_verified -or -not $s.deformation_geometry_verified){throw 'C8.71/C8.72 deformation prerequisites lost.'}
          if(-not [bool]$s.deformation_ui_scale_selector_verified){throw 'C8.73 native deformation selector gate failed.'}
          if([string]$s.deformation_ui_scale_selector_source -ne 'FrmMain.tscbDeformationType+tstbDeformationFactor -> Controller.GetScale -> DrawResults'){throw 'Unexpected UI selector provenance.'}
          if(($s.deformation_ui_states_verified|Measure-Object).Count -ne 3){throw 'Expected three qualified native UI states.'}
          if(($s.deformation_ui_effective_scales_verified|Measure-Object).Count -ne 3){throw 'Expected three qualified effective scales.'}
          if([Math]::Abs([double]$s.deformation_ui_final_scale-10.0) -gt 1e-6){throw 'Final presentation scale is not verified x10.'}
          if([string]$s.deformation_state -ne 'user-defined-x10-contour'){throw 'READY deformation_state contradicts verified final UI state.'}
          if([double]$s.deformation_ui_render_max_coordinate_error_mm -gt 1e-7){throw 'Native UI -> render-mesh coordinate error exceeds tolerance.'}
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Emit C8.73 evidence
        shell: pwsh
        run: |
          $s=Get-Content artifact/c8-73/RESULTS_NATIVE_DEFORMATION_UI_READY.json -Raw|ConvertFrom-Json
          $prior=Get-Content $env:C873_PRIOR -Raw|ConvertFrom-Json
          @{
            schema='astermax.c8.73.native-deformation-ui.v1';commit='${{ github.sha }}';source_solver_run=[long]$env:C865_RUN_ID;source_solver_commit=$env:C865_SHA
            solver_verified=[bool]$prior.solver_verified;result_fields_verified=[bool]$prior.result_field_values_verified;reaction_equilibrium_verified=[bool]$prior.reaction_equilibrium_verified
            mesh_nodes=[int]$s.mesh_nodes;mesh_elements=2474
            deformation_state=[string]$s.deformation_state
            deformation_ui_scale_selector_source=[string]$s.deformation_ui_scale_selector_source
            deformation_ui_states_verified=@($s.deformation_ui_states_verified);deformation_ui_effective_scales_verified=@($s.deformation_ui_effective_scales_verified)
            deformation_ui_final_scale=[double]$s.deformation_ui_final_scale
            deformation_ui_render_max_coordinate_error_mm=[double]$s.deformation_ui_render_max_coordinate_error_mm
            deformation_geometry_verified=[bool]$s.deformation_geometry_verified;render_mesh_deformation_verified=[bool]$s.render_mesh_deformation_verified;deformation_ui_scale_selector_verified=[bool]$s.deformation_ui_scale_selector_verified
            pmx_sha256=(Get-FileHash $env:C873_PMX -Algorithm SHA256).Hash.ToLowerInvariant();rmed_sha256=(Get-FileHash $env:C873_RMED -Algorithm SHA256).Hash.ToLowerInvariant();resu_sha256=(Get-FileHash $env:C873_RESU -Algorithm SHA256).Hash.ToLowerInvariant()
            native_deformation_ui_qualified=$true;industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 6|Set-Content artifact/c8-73/C8_73_NATIVE_DEFORMATION_UI_EVIDENCE.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.73-Native-Deformation-UI-${{ github.sha }}
          path: artifact/c8-73/**
          if-no-files-found: warn
          retention-days: 14
