name: Windows C5.4v End-to-End Demo Readiness

on:
  pull_request:
  workflow_dispatch:

jobs:
  demo-readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/demo_readiness_contract.py src/astermax/fea/results_section_contour_ui.py src/astermax/fea/section_displacement_field.py
      - name: C5.4v end-to-end readiness harness
        run: python -m pytest -q tests/test_demo_readiness_contract.py
      - name: Native section contour regression
        run: python -m pytest -q tests/test_results_section_contour_ui.py tests/test_section_displacement_field.py
      - name: Results regression
        run: python -m pytest -q tests/test_results_workspace_ui.py tests/test_results_workspace.py tests/test_production_results.py
      - name: Full regression suite
        run: python -m pytest -q
