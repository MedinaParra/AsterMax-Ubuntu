name: Windows PMV FEA Harness

on:
  pull_request:
  push:
    branches:
      - main
      - agent/windows-pmv-fea-core
      - agent/windows-step-to-solve-v0.2
      - agent/windows-offline-viewer-v0.8
      - agent/windows-evidence-package-v0.9
      - agent/windows-tet4-refinement-envelope-v1.1
      - agent/windows-cad-preflight-v1.2
      - agent/windows-tet10-global-v1.4
      - agent/windows-tet10-evidence-v1.5
      - agent/windows-gap-seating-kinematics-v1.6
      - agent/windows-gap-five-segment-poses-v1.7
      - agent/windows-unilateral-contact-law-v1.8
      - agent/windows-tet10-unilateral-contact-v1.9
      - agent/windows-tet10-contact-patch-v1.10
      - agent/windows-tri6-pressure-provenance-v1.11

jobs:
  verify-fea-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV
        run: python -m pip install -e .[test]
      - name: Run deterministic FEA harness
        run: python -m pytest -q
      - name: Generate connected scaling evidence
        run: python benchmarks/connected_scaling.py
      - name: Upload connected scaling evidence
        uses: actions/upload-artifact@v4
        with:
          name: connected-scaling-windows
          path: connected_scaling_report.json
          if-no-files-found: error
      - name: Generate offline result viewer demo
        run: python benchmarks/generate_offline_viewer.py
      - name: Upload offline result viewer demo
        uses: actions/upload-artifact@v4
        with:
          name: astermax-offline-viewer-windows
          path: astermax_demo
          if-no-files-found: error
      - name: Generate analysis evidence package
        run: python benchmarks/generate_evidence_package.py
      - name: Upload analysis evidence package
        uses: actions/upload-artifact@v4
        with:
          name: astermax-analysis-evidence-windows
          path: astermax_evidence_package
          if-no-files-found: error
      - name: Measure fine TET4 refinement envelope
        run: python benchmarks/tet4_refinement_envelope.py
      - name: Upload TET4 refinement envelope
        uses: actions/upload-artifact@v4
        with:
          name: tet4-refinement-envelope-windows
          path: tet4_refinement_envelope.json
          if-no-files-found: error
      - name: Measure TET10 convergence gate
        run: python benchmarks/tet10_convergence.py
      - name: Upload TET10 convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tet10-convergence-windows
          path: tet10_convergence.json
          if-no-files-found: error
      - name: Generate authentic TET10 analysis evidence package
        run: python benchmarks/generate_tet10_evidence_package.py
      - name: Upload authentic TET10 analysis evidence package
        uses: actions/upload-artifact@v4
        with:
          name: astermax-tet10-analysis-evidence-windows
          path: astermax_tet10_evidence_package
          if-no-files-found: error
      - name: Evaluate OT1613 seating kinematics gate
        run: python benchmarks/ot1613_gap_seating_kinematics.py
      - name: Upload OT1613 seating kinematics evidence
        uses: actions/upload-artifact@v4
        with:
          name: ot1613-gap-seating-kinematics-windows
          path: ot1613_gap_seating_kinematics.json
          if-no-files-found: error
      - name: Build five-segment contact preprocessing seed
        run: python benchmarks/ot1613_five_segment_pose_seed.py
      - name: Upload five-segment contact preprocessing seed
        uses: actions/upload-artifact@v4
        with:
          name: ot1613-five-segment-contact-seed-windows
          path: ot1613_five_segment_pose_seed.json
          if-no-files-found: error
      - name: Verify analytical unilateral contact law
        run: python benchmarks/unilateral_contact_law.py
      - name: Upload unilateral contact law evidence
        uses: actions/upload-artifact@v4
        with:
          name: unilateral-contact-law-windows
          path: unilateral_contact_law.json
          if-no-files-found: error
      - name: Verify deformable TET10 unilateral contact
        run: python benchmarks/tet10_unilateral_contact.py
      - name: Upload deformable TET10 unilateral contact evidence
        uses: actions/upload-artifact@v4
        with:
          name: tet10-unilateral-contact-windows
          path: tet10_unilateral_contact.json
          if-no-files-found: error
      - name: Verify multipoint TRI6 TET10 contact patch
        run: python benchmarks/tet10_multipoint_contact_patch.py
      - name: Upload multipoint TRI6 TET10 contact patch evidence
        uses: actions/upload-artifact@v4
        with:
          name: tet10-multipoint-contact-patch-windows
          path: tet10_multipoint_contact_patch.json
          if-no-files-found: error
      - name: Verify TRI6 pressure provenance gate
        run: python benchmarks/tri6_pressure_provenance.py
      - name: Upload TRI6 pressure provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: tri6-pressure-provenance-windows
          path: tri6_pressure_provenance
          if-no-files-found: error
