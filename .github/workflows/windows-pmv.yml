name: Windows PMV FEA Harness

on:
  pull_request:
  push:
    branches:
      - main
      - agent/windows-pmv-fea-core
      - agent/windows-step-to-solve-v0.2
      - agent/windows-offline-viewer-v0.8
      - agent/windows-evidence-package-v0.9
      - agent/windows-tet4-refinement-envelope-v1.1
      - agent/windows-cad-preflight-v1.2
      - agent/windows-tet10-global-v1.4
      - agent/windows-tet10-viewer-evidence-v1.5
      - agent/tet4-vs-tet10-efficiency-v1.6
      - agent/analytical-torsion-10cycles-v0.7
      - agent/stress-concentration-neighborhood-10cycles-v0.8
      - agent/step-feature-local-adaptivity-v0.9
      - agent/step-shoulder-real-tet10-solve-v1.0
      - agent/step-shoulder-local-stress-convergence-v1.1
      - agent/step-shoulder-sector-probe-convergence-v1.2
      - agent/step-shoulder-geometry-error-fine-convergence-v1.3
      - agent/curved-tet10-code-verification-v1.4

jobs:
  verify-fea-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV
        run: python -m pip install -e .[test]
      - name: Run deterministic FEA harness
        run: python -m pytest -q
      - name: Generate connected scaling evidence
        run: python benchmarks/connected_scaling.py
      - name: Upload connected scaling evidence
        uses: actions/upload-artifact@v4
        with:
          name: connected-scaling-windows
          path: connected_scaling_report.json
          if-no-files-found: error
      - name: Generate offline result viewer demo
        run: python benchmarks/generate_offline_viewer.py
      - name: Upload offline result viewer demo
        uses: actions/upload-artifact@v4
        with:
          name: astermax-offline-viewer-windows
          path: astermax_demo
          if-no-files-found: error
      - name: Generate analysis evidence package
        run: python benchmarks/generate_evidence_package.py
      - name: Upload analysis evidence package
        uses: actions/upload-artifact@v4
        with:
          name: astermax-analysis-evidence-windows
          path: astermax_evidence_package
          if-no-files-found: error
      - name: Measure fine TET4 refinement envelope
        run: python benchmarks/tet4_refinement_envelope.py
      - name: Upload TET4 refinement envelope
        uses: actions/upload-artifact@v4
        with:
          name: tet4-refinement-envelope-windows
          path: tet4_refinement_envelope.json
          if-no-files-found: error
      - name: Measure TET10 convergence gate
        run: python benchmarks/tet10_convergence.py
      - name: Upload TET10 convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tet10-convergence-windows
          path: tet10_convergence.json
          if-no-files-found: error
      - name: Generate converged TET10 viewer evidence package
        run: python benchmarks/generate_tet10_evidence_package.py
      - name: Upload converged TET10 viewer evidence package
        uses: actions/upload-artifact@v4
        with:
          name: astermax-tet10-evidence-windows
          path: astermax_tet10_evidence_package
          if-no-files-found: error
      - name: Compare TET4 vs TET10 accuracy at comparable DOF
        run: python benchmarks/tet4_vs_tet10_efficiency.py
      - name: Upload TET4 vs TET10 comparable-DOF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tet4-vs-tet10-efficiency-windows
          path: tet4_vs_tet10_efficiency.json
          if-no-files-found: error
      - name: Generate analytical circular shaft evidence
        run: python benchmarks/analytical_circular_shaft_evidence.py
      - name: Upload analytical circular shaft evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytical-circular-shaft-evidence-windows
          path: |
            analytical_circular_shaft.step
            analytical_circular_shaft_evidence.json
          if-no-files-found: error
      - name: Generate local stress credibility evidence
        run: python benchmarks/local_stress_credibility.py
      - name: Upload local stress credibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-stress-credibility-windows
          path: local_stress_credibility.json
          if-no-files-found: error
      - name: Verify STEP shaft shoulder recognition and local TET10 refinement
        run: python benchmarks/step_shoulder_local_adaptivity.py
      - name: Upload STEP shoulder local adaptivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-shoulder-local-adaptivity-windows
          path: |
            step_shoulder_local_adaptivity.step
            step_shoulder_local_adaptivity.json
          if-no-files-found: error
      - name: Solve real STEP shaft shoulder with consistent TRI6 traction
        run: python benchmarks/step_shoulder_real_tet10_solve.py
      - name: Upload real STEP shoulder TET10 solve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-shoulder-real-tet10-solve-windows
          path: |
            step_shoulder_real_tet10_solve.step
            step_shoulder_real_tet10_solve.json
          if-no-files-found: error
      - name: Measure real local shoulder stress convergence
        run: python benchmarks/step_shoulder_local_stress_convergence.py
      - name: Upload real local shoulder stress convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-shoulder-local-stress-convergence-windows
          path: |
            step_shoulder_local_stress_convergence.step
            step_shoulder_local_stress_convergence.json
          if-no-files-found: error
      - name: Measure sectorized physical-ring local stress convergence
        run: python benchmarks/step_shoulder_sector_probe_convergence.py
      - name: Upload sectorized physical-ring convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-shoulder-sector-probe-convergence-windows
          path: |
            step_shoulder_sector_probe_convergence.step
            step_shoulder_sector_probe_convergence.json
          if-no-files-found: error
      - name: Measure fine stress convergence and exact CAD geometry error
        run: python benchmarks/step_shoulder_geometry_error_fine_convergence.py
      - name: Upload fine stress and geometry-error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step-shoulder-geometry-error-fine-convergence-windows
          path: |
            step_shoulder_geometry_error_fine_convergence.step
            step_shoulder_geometry_error_fine_convergence.json
          if-no-files-found: error
      - name: Verify curved TET10 isoparametric geometry and reference quadrature
        run: python benchmarks/curved_tet10_code_verification.py
      - name: Upload curved TET10 code-verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curved-tet10-code-verification-windows
          path: |
            curved_tet10_code_verification.step
            curved_tet10_code_verification.json
          if-no-files-found: error
