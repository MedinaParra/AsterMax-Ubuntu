name: Windows PMV Core

on:
  push:
    branches:
      - main
      - "pmv/**"
      - "infra/**"
  pull_request:

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic core tests only
        run: python -m pytest --ignore=tests/benchmarks
      - name: Assert numerical benchmarks remain present
        shell: pwsh
        run: |
          $benchmarks = Get-ChildItem tests/benchmarks -Filter "test_*.py" -File
          if (-not $benchmarks) {
            throw "Numerical benchmark suite is missing. Windows core must not pass by deleting the numerical gate."
          }
          $benchmarks | ForEach-Object { Write-Host "NUMERICAL_GATE_OWNED_BY_CODE_ASTER=$($_.FullName)" }
