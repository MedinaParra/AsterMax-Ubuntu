name: Fabian complete lifting input gate
on:
  push:
    branches: [agent/fabian-m2-codeaster-20261007]
    paths: [engineering/fabian/RUN_APPROVED.json]
permissions:
  contents: read
jobs:
  input-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check design readiness
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('engineering/fabian/design_basis.json'))
          missing=[k for k,v in data['required_confirmed_inputs'].items() if v is None]
          if missing:
              raise SystemExit('BLOCKED: '+', '.join(missing))
          raise SystemExit('Complete solver case still requires implementation; gravity generator is not a full lifting verification.')
          PY
