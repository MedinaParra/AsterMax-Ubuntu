name: Windows C5 Persistent Named Selections

on:
  pull_request:
    paths:
      - "src/astermax/fea/named_selections.py"
      - "src/astermax/fea/persistent_geometry.py"
      - "tests/test_named_selections.py"
      - "tests/test_persistent_geometry.py"
      - ".github/workflows/windows-c5-persistent-named-selections.yml"

jobs:
  verify-named-selections:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMV and full test dependencies
        run: python -m pip install -e .[test]
      - name: Compile C5 modules with warnings as errors
        run: python -W error -m py_compile src/astermax/fea/named_selections.py src/astermax/fea/persistent_geometry.py
      - name: Run C5 persistent named-selection harness
        run: python -m pytest tests/test_named_selections.py tests/test_persistent_geometry.py -q
      - name: Run deterministic regression harness
        run: python -m pytest -q
