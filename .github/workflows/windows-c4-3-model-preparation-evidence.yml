name: Windows C4.3 Model Preparation Evidence

on:
  pull_request:
    paths:
      - "src/astermax/app.py"
      - "src/astermax/fea/live_analysis_evidence.py"
      - "src/astermax/fea/model_preparation_evidence.py"
      - "tests/test_live_analysis_evidence.py"
      - "tests/test_model_preparation_evidence.py"
      - ".github/workflows/windows-c4-3-model-preparation-evidence.yml"

jobs:
  verify-model-preparation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMV and full test dependencies
        run: python -m pip install -e .[test]
      - name: Compile C4.3 modules with warnings as errors
        run: python -W error -m py_compile src/astermax/fea/model_preparation_evidence.py src/astermax/fea/live_analysis_evidence.py src/astermax/app.py
      - name: Run C4.3 model preparation harness
        run: python -m pytest tests/test_model_preparation_evidence.py tests/test_live_analysis_evidence.py -q
      - name: Run deterministic regression harness
        run: python -m pytest -q
