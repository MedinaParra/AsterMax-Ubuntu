name: Build AsterMax Mechanical GUI

on:
  push:
    branches:
      - agent/mechanical-gui-pdf-workflow
  pull_request:
    paths:
      - "windows/AsterMax.MechanicalGui/**"
      - ".github/workflows/build-mechanical-gui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj

      - name: Build validation
        run: dotnet build windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj -c Release --no-restore

      - name: Real TET4 solver smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path windows/AsterMax.MechanicalGui/bin/Release/net8.0-windows/AsterMax-Mechanical.exe
          & $exe --solver-smoke
          if ($LASTEXITCODE -ne 0) { throw "AsterMax TET4 solver smoke test failed with code $LASTEXITCODE." }

      - name: Publish Windows executable
        run: >-
          dotnet publish windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Windows startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/win-x64/AsterMax-Mechanical.exe
          $process = Start-Process -FilePath $exe -ArgumentList "--startup-smoke" -PassThru
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "AsterMax did not complete the startup smoke test within 20 seconds."
          }
          if ($process.ExitCode -ne 0) {
            $crashDirectory = Join-Path $env:LOCALAPPDATA "AsterMax\crashes"
            if (Test-Path $crashDirectory) {
              Get-ChildItem $crashDirectory -Filter *.log | Sort-Object LastWriteTime | ForEach-Object {
                Write-Host "---- $($_.FullName) ----"
                Get-Content $_.FullName
              }
            }
            throw "AsterMax startup smoke test exited with code $($process.ExitCode)."
          }
          Write-Host "AsterMax startup smoke test passed."

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item publish/win-x64/AsterMax-Mechanical.exe artifact/AsterMax-Mechanical-0.5.0-beta.exe
          Copy-Item windows/AsterMax.MechanicalGui/README.md artifact/README.md
          Copy-Item windows/AsterMax.MechanicalGui/Icons/AsterMaxIconSet.svg artifact/AsterMaxIconSet.svg
          $hash = (Get-FileHash artifact/AsterMax-Mechanical-0.5.0-beta.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AsterMax-Mechanical-0.5.0-beta.exe" | Set-Content artifact/AsterMax-Mechanical-0.5.0-beta.exe.sha256 -Encoding ascii
          Get-ChildItem artifact | Format-Table Name, Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-Mechanical-0.5.0-beta-win-x64
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
