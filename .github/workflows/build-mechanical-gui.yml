name: Build AsterMax Mechanical GUI

on:
  push:
    branches:
      - agent/mechanical-gui-pdf-workflow
  pull_request:
    paths:
      - "windows/AsterMax.MechanicalGui/**"
      - ".github/workflows/build-mechanical-gui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj

      - name: Build validation
        run: dotnet build windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj -c Release --no-restore

      - name: Existing tutorial capability smoke tests
        shell: pwsh
        run: |
          $exe = Resolve-Path windows/AsterMax.MechanicalGui/bin/Release/net8.0-windows/win-x64/AsterMax-Mechanical.exe
          $process = Start-Process -FilePath $exe -ArgumentList "--solver-smoke" -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "AsterMax tutorial capability smoke tests failed with code $($process.ExitCode)." }
          Write-Host "Existing static, convergence, modal and thermal capabilities passed."

      - name: Publish Windows executable
        run: >-
          dotnet publish windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Bundle official Gmsh 4.15.2
        shell: pwsh
        run: |
          $uri = "https://gmsh.info/bin/Windows/gmsh-4.15.2-Windows64.zip"
          Invoke-WebRequest -Uri $uri -OutFile gmsh-windows.zip
          Expand-Archive gmsh-windows.zip -DestinationPath gmsh-extract -Force
          $source = Get-ChildItem gmsh-extract -Directory | Select-Object -First 1
          if (-not $source) { throw "The Gmsh archive did not contain a directory." }
          $target = "publish/win-x64/tools/gmsh"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$($source.FullName)/*" $target -Recurse -Force
          $gmsh = Resolve-Path "$target/gmsh.exe"
          if ((Get-Item $gmsh).Length -lt 1000000) { throw "The bundled Gmsh executable is unexpectedly small." }
          Write-Host "Bundled Gmsh executable: $gmsh"

      - name: Generate complex STEP smoke geometry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-cad | Out-Null
          @'
          SetFactory("OpenCASCADE");
          Box(1) = {0, 0, 0, 80, 50, 20};
          Cylinder(2) = {20, 25, -5, 0, 0, 30, 6};
          Cylinder(3) = {60, 25, -5, 0, 0, 30, 6};
          BooleanDifference(10) = { Volume{1}; Delete; }{ Volume{2,3}; Delete; };
          Save "complex-flange.step";
          '@ | Set-Content smoke-cad/complex.geo -Encoding ascii
          $gmsh = (Resolve-Path publish/win-x64/tools/gmsh/gmsh.exe).Path
          $working = (Resolve-Path smoke-cad).Path
          $process = Start-Process -FilePath $gmsh -ArgumentList @("complex.geo", "-0", "-nopopup", "-v", "3") -WorkingDirectory $working -PassThru -Wait
          $step = Join-Path $working "complex-flange.step"
          if (-not (Test-Path $step)) {
            throw "Unable to generate the complex STEP smoke geometry. Gmsh exit code: $($process.ExitCode)"
          }
          Write-Host "Complex STEP generated: $step; Gmsh exit code $($process.ExitCode)"

      - name: Gmsh STEP, closed skin and selectable-face smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/win-x64/AsterMax-Mechanical.exe
          $gmsh = Resolve-Path publish/win-x64/tools/gmsh/gmsh.exe
          $step = Resolve-Path smoke-cad/complex-flange.step
          $process = Start-Process -FilePath $exe -ArgumentList @("--gmsh-smoke", $gmsh.Path, $step.Path) -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "AsterMax Gmsh selectable-face smoke test failed with code $($process.ExitCode)." }
          Write-Host "AsterMax preserved selectable OpenCASCADE faces and tetrahedralized a STEP with two holes."

      - name: Standard workflow smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/win-x64/AsterMax-Mechanical.exe
          $gmsh = Resolve-Path publish/win-x64/tools/gmsh/gmsh.exe
          $step = Resolve-Path smoke-cad/complex-flange.step
          $process = Start-Process -FilePath $exe -ArgumentList @("--workflow-smoke", $gmsh.Path, $step.Path) -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "AsterMax standard workflow smoke test failed with code $($process.ExitCode)." }
          Write-Host "Normal workflow verified: mesh, selectable faces and non-empty support/load scopes; prism solve also passed."

      - name: Windows startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/win-x64/AsterMax-Mechanical.exe
          $process = Start-Process -FilePath $exe -ArgumentList "--startup-smoke" -PassThru
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "AsterMax did not complete the startup smoke test within 20 seconds."
          }
          if ($process.ExitCode -ne 0) {
            $crashDirectory = Join-Path $env:LOCALAPPDATA "AsterMax\crashes"
            if (Test-Path $crashDirectory) {
              Get-ChildItem $crashDirectory -Filter *.log | Sort-Object LastWriteTime | ForEach-Object {
                Write-Host "---- $($_.FullName) ----"
                Get-Content $_.FullName
              }
            }
            throw "AsterMax startup smoke test exited with code $($process.ExitCode)."
          }
          Write-Host "AsterMax startup smoke test passed."

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item publish/win-x64/tools artifact/tools -Recurse -Force
          Copy-Item publish/win-x64/AsterMax-Mechanical.exe artifact/AsterMax-Mechanical-0.7.1-beta.exe
          Copy-Item windows/AsterMax.MechanicalGui/README.md artifact/README.md
          Copy-Item windows/AsterMax.MechanicalGui/Icons/AsterMaxIconSet.svg artifact/AsterMaxIconSet.svg
          Copy-Item smoke-cad/complex-flange.step artifact/AsterMax_Complex_STEP_Smoke.step
          @'
          @echo off
          start "" "%~dp0AsterMax-Mechanical-0.7.1-beta.exe"
          '@ | Set-Content artifact/RUN-AsterMax.cmd -Encoding ascii
          $hash = (Get-FileHash artifact/AsterMax-Mechanical-0.7.1-beta.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AsterMax-Mechanical-0.7.1-beta.exe" | Set-Content artifact/AsterMax-Mechanical-0.7.1-beta.exe.sha256 -Encoding ascii
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length | Format-Table

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-Mechanical-0.7.1-beta-win-x64-with-gmsh
          path: artifact/**
          if-no-files-found: error
          retention-days: 30
