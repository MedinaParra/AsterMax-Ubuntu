name: PrePoMax Code_Aster integration

on:
  push:
    branches:
      - feature/prepomax-code-aster
      - feature/prepomax-code-aster-harness-runtime
    paths:
      - 'integrations/prepomax-codeaster/**'
      - '.github/workflows/prepomax-codeaster-integration.yml'
  workflow_dispatch:

concurrency:
  group: prepomax-codeaster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-overlay:
    runs-on: windows-latest
    steps:
      - name: Checkout AsterMax integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python helpers
        shell: pwsh
        run: |
          python -m py_compile integrations/prepomax-codeaster/scripts/codeaster_catalog.py
          python -m py_compile integrations/prepomax-codeaster/tools/apply_overlay.py
          python -m py_compile integrations/prepomax-codeaster/tools/apply_model_translation.py
          python -m py_compile integrations/prepomax-codeaster/tools/apply_results_bridge.py
          python -m py_compile integrations/prepomax-codeaster/tools/apply_harness_runtime.py
          python -m py_compile integrations/prepomax-codeaster/tools/apply_harness_runtime_fixups.py
          python -m py_compile integrations/prepomax-codeaster/tools/apply_harness_ui.py
          python -m py_compile integrations/prepomax-codeaster/tools/bootstrap.py
          python -m py_compile integrations/prepomax-codeaster/harness/astermax_harness.py
          python -m py_compile integrations/prepomax-codeaster/harness/test_harness_contract.py
          python integrations/prepomax-codeaster/harness/astermax_harness.py --self-test
          python integrations/prepomax-codeaster/harness/test_harness_contract.py

      - name: Bootstrap patched PrePoMax tree
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster

      - name: Verify patched source markers
        shell: pwsh
        run: |
          Select-String -Path build/PrePoMax-CodeAster/CaeJob/AnalysisJob.cs -Pattern 'AnalysisSolverTypeEnum.CodeAster'
          Select-String -Path build/PrePoMax-CodeAster/CaeJob/AnalysisJob.cs -Pattern 'F libr.*\.mail D 20'
          Select-String -Path build/PrePoMax-CodeAster/CaeJob/AnalysisJob.cs -Pattern 'F resu.*\.resu R 8'
          Select-String -Path build/PrePoMax-CodeAster/CaeJob/AnalysisJob.cs -Pattern 'UseSolverHarness'
          $exitChecks = Select-String -Path build/PrePoMax-CodeAster/CaeJob/AnalysisJob.cs -Pattern '_exe.ExitCode == 0'
          if ($exitChecks.Count -lt 2) { throw 'Both Windows execution paths must honor the harness exit code.' }
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Controller.cs -Pattern 'CodeAsterModelTranslator.WriteStudy'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Controller.cs -Pattern 'OpenCodeAsterResults'
          $harnessPrepare = Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Controller.cs -Pattern 'SolverHarnessBridge.Prepare'
          if ($harnessPrepare.Count -lt 2) { throw 'Normal and wear solver runs must both cross the harness boundary.' }
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Controller.cs -Pattern 'TryValidatePassingReport'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Forms/61_Analysis/ViewJob.cs -Pattern 'Analysis solver'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Forms/61_Analysis/ViewJob.cs -Pattern 'HarnessReport'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Forms/61_Analysis/ViewJob.cs -Pattern 'HarnessExitCode'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Settings/SettingsContainer.cs -Pattern 'CodeAsterSettings'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/CodeAster/CodeAsterModelTranslator.cs -Pattern 'MECA_STATIQUE'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/CodeAster/CodeAsterModelTranslator.cs -Pattern "AFFE=_F\(TOUT='OUI'.*MODELISATION='3D'"
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/CodeAster/CodeAsterModelTranslator.cs -Pattern 'CodeAsterResultBridge.AppendResultTables'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/CodeAster/CodeAsterMeshWriter.cs -Pattern 'COOR_3D'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/CodeAster/CodeAsterResultBridge.cs -Pattern 'PPM_STRESS_N'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/CodeAster/CodeAsterCaseWriter.cs -Pattern 'F resu.*\.resu R 8'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Harness/SolverHarnessBridge.cs -Pattern 'Harness status is'
          Select-String -Path build/PrePoMax-CodeAster/PrePoMax/Harness/SolverHarnessBridge.cs -Pattern 'previous PASS report'
          if (-not (Test-Path build/PrePoMax-CodeAster/PrePoMax/CodeAster/codeaster_catalog.py)) {
            throw 'Code_Aster catalog helper was not copied to the patched source tree.'
          }
          if (-not (Test-Path build/PrePoMax-CodeAster/PrePoMax/Harness/astermax_harness.py)) {
            throw 'AsterMax solver harness was not copied to the patched source tree.'
          }

      - name: Restore PrePoMax NuGet dependencies
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build PrePoMax solution
        shell: pwsh
        run: |
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal 2>&1 | Tee-Object -FilePath msbuild.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify bundled harness in build output
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Path build/PrePoMax-CodeAster -Recurse -Filter astermax_harness.py -ErrorAction SilentlyContinue
          if (-not $matches) { throw 'Bundled AsterMax harness was not copied to build output.' }

      - name: Upload MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepomax-codeaster-msbuild
          path: msbuild.log
          if-no-files-found: ignore
