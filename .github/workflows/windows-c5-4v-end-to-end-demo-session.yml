name: Windows C5.4v End-to-End Demo Session

on:
  pull_request:
  workflow_dispatch:

jobs:
  end-to-end-demo-session:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/demo_session.py src/astermax/fea/results_section_contour_ui.py src/astermax/fea/results_section_displacement.py src/astermax/desktop_picker_app.py
      - name: C5.4v readiness harness
        run: python -m pytest -q tests/test_demo_session.py
      - name: Native section Results regression
        run: python -m pytest -q tests/test_results_section_contour_ui.py tests/test_results_section_displacement.py tests/test_section_displacement_field.py tests/test_results_quadratic_section.py
      - name: Desktop workflow regression
        run: python -m pytest -q tests/test_desktop_picker_app.py tests/test_step_to_solve.py tests/test_production_results.py
      - name: Full regression suite
        run: python -m pytest -q
