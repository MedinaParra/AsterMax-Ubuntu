name: Windows C8.14 Qualified Runner Boundary

on:
  push:
    branches: [agent/c8-14-qualified-runner-boundary]
    paths:
      - 'src/astermax/windows_solver_runner_boundary.py'
      - 'src/astermax/code_aster_runtime_discovery.py'
      - 'tests/test_c8_14_windows_solver_runner_boundary.py'
      - '.github/workflows/windows-c8-14-qualified-runner-boundary.yml'
  pull_request:
    paths:
      - 'src/astermax/windows_solver_runner_boundary.py'
      - 'src/astermax/code_aster_runtime_discovery.py'
      - 'tests/test_c8_14_windows_solver_runner_boundary.py'
      - '.github/workflows/windows-c8-14-qualified-runner-boundary.yml'
  workflow_dispatch:

concurrency:
  group: c8-14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-negative-control:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AsterMax harness
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Verify C8.14 runner-boundary contracts
        shell: pwsh
        run: python -m pytest -q tests/test_c8_14_windows_solver_runner_boundary.py tests/test_c8_12_runtime_discovery.py tests/test_code_aster_runtime_qualification.py tests/test_code_aster_wsl_runtime.py
      - name: Record hosted Windows infrastructure boundary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          @'
          import json
          import os
          from pathlib import Path
          from astermax.code_aster_runtime_discovery import discover_wsl_code_aster_runtimes
          from astermax.windows_solver_runner_boundary import classify_windows_solver_runner

          discovery = discover_wsl_code_aster_runtimes()
          boundary = classify_windows_solver_runner(discovery, environ=os.environ).as_dict()
          assert boundary['fea_solve_executed'] is False
          assert boundary['numerical_verification'] is False
          assert boundary['results_verified'] is False
          Path('evidence/c8_14_hosted_runner_boundary.json').write_text(
              json.dumps(boundary, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(boundary, indent=2, sort_keys=True))
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: c8-14-hosted-runner-boundary
          path: evidence/c8_14_hosted_runner_boundary.json
          if-no-files-found: error
