name: Windows C8.8 Code_Aster MED Result Bridge

on:
  push:
    branches: [agent/c8-8-code-aster-med-result-bridge]
  pull_request:
    branches: [agent/c8-7-qualified-code-aster-runtime]
  workflow_dispatch:

concurrency:
  group: c8-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-med-scene-contract:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AsterMax
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Verify prior Code_Aster result contract
        shell: pwsh
        run: python -m pytest -q tests/test_code_aster_result_contract.py tests/test_code_aster_reference_run.py
      - name: Verify C8.8 MED-to-CAE scene bridge
        shell: pwsh
        run: python -m pytest -q tests/test_code_aster_med_results.py
