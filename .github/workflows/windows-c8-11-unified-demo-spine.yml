name: Windows C8.11 Unified Demo Spine

on:
  push:
    paths:
      - 'src/astermax/demo_readiness.py'
      - 'src/astermax/code_aster_capabilities.py'
      - 'src/astermax/code_aster_gui_tree.py'
      - 'src/astermax/windows_capability_outline.py'
      - 'src/astermax/cae_scene_contract.py'
      - 'src/astermax/code_aster_med_results.py'
      - 'src/astermax/professional_postprocess.py'
      - 'tests/test_c8_11_demo_readiness.py'
      - '.github/workflows/windows-c8-11-unified-demo-spine.yml'
  pull_request:
    paths:
      - 'src/astermax/demo_readiness.py'
      - 'src/astermax/code_aster_capabilities.py'
      - 'src/astermax/code_aster_gui_tree.py'
      - 'src/astermax/windows_capability_outline.py'
      - 'src/astermax/cae_scene_contract.py'
      - 'src/astermax/code_aster_med_results.py'
      - 'src/astermax/professional_postprocess.py'
      - 'tests/test_c8_11_demo_readiness.py'
      - '.github/workflows/windows-c8-11-unified-demo-spine.yml'

concurrency:
  group: c8-11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV
        run: python -m pip install -e .
      - name: Verify integration contracts
        run: >-
          python -m pytest -q
          tests/test_code_aster_capabilities.py
          tests/test_code_aster_gui_tree.py
          tests/test_windows_capability_outline.py
          tests/test_c8_10_native_depl_vector.py
          tests/test_c8_11_demo_readiness.py
      - name: Emit fail-closed readiness evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python -c "import json; from astermax.demo_readiness import demo_readiness_evidence; open('evidence/c8_11_demo_readiness.json','w',encoding='utf-8').write(json.dumps(demo_readiness_evidence(),indent=2,sort_keys=True))"
      - uses: actions/upload-artifact@v4
        with:
          name: c8-11-demo-readiness
          path: evidence/c8_11_demo_readiness.json
