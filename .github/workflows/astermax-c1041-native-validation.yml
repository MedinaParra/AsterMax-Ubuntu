name: C10.41 Windows build native solver and GUI validation (RC1 not inferred)
on:
  push:
    branches: [agent/c1041-ws01-rc1-integration]
  workflow_dispatch:
jobs:
  windows-workflow-conformance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5

      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Validate patch chain immediately before patch/build
        shell: pwsh
        run: python native-windows/validate-patch-chain.py

      - name: Apply C10.40 baseline plus C10.41 qualification patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $chain=Get-Content native-windows/patch-chain.json -Raw | ConvertFrom-Json
          $patches=@($chain.patches | ForEach-Object { $_.file })
          & ./native-windows/harness-c10208a-patch-chain.ps1 -Root "$PWD/upstream" -Patches $patches -OutDir "$PWD/dist/Audit/PatchChain"
          if($LASTEXITCODE -ne 0){ throw 'C10.41 patch application failed.' }

      - name: Regress mesh import dispatcher completion and timeout rejection
        shell: pwsh
        run: ./native-windows/test-c1041-mesh-ui-await.ps1 -BuildRoot "$PWD/upstream"

      - name: Setup Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install MED and B01 reconstruction dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy h5py gmsh

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild Windows x64 Release
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Test result-store identity and portability fixtures
        shell: powershell
        run: ./native-windows/test-c1041-result-store.ps1 -BuildRoot "$PWD/upstream" -OutDir "$PWD/dist/Audit/C10.41-ResultStore"

      - name: Assemble C10.20 test distribution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing' }
          New-Item -ItemType Directory -Force .\dist\AsterMaxTools | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\CodeAster | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\Python | Out-Null
          New-Item -ItemType Directory -Force .\dist\Audit\C10.20 | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" .\dist\ -Recurse -Force
          Copy-Item .\native-windows\bridge-c964-med-results.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\bind-c998-results-fingerprint.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\qualify-mechanical-analysis.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\mechanical-qualification-policy.json .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\runtime\CodeAster\astermax-codeaster-runner.cmd .\dist\AsterMaxRuntime\CodeAster\ -Force
          Copy-Item .\native-windows\runtime\CodeAster\astermax-codeaster-runner.ps1 .\dist\AsterMaxRuntime\CodeAster\ -Force
          $pythonRoot=Split-Path (Get-Command python).Source -Parent
          Copy-Item "$pythonRoot\*" .\dist\AsterMaxRuntime\Python\ -Recurse -Force
          & .\dist\AsterMaxRuntime\Python\python.exe -c "import numpy,h5py; print('ASTERMAX_PACKAGED_PYTHON_MED_OK')"
          if($LASTEXITCODE -ne 0){ throw 'Packaged Python MED runtime failed.' }
          $runtimeUrl='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          $runtimeSha256='954f406b65a08cb2fb47ef2fb02b03e4f70aa9c97e0979bd7048448273e17d46'
          Invoke-WebRequest $runtimeUrl -OutFile runtime.zip
          if((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtimeSha256){ throw 'Pinned CAD runtime digest mismatch.' }
          Expand-Archive runtime.zip runtime
          $ng=Get-ChildItem runtime -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $ng){ throw 'NetGenMesher.exe missing from pinned runtime.' }
          Copy-Item $ng.Directory.FullName .\dist\NetGen -Recurse -Force
          New-Item -ItemType Directory -Force .\dist\Temp | Out-Null
          foreach($project in @('CaeGlobals','CaeJob','CaeMesh','CaeModel','CaeResults','UserControls','vtkControl')) {
            $dir=Join-Path $PWD "upstream\$project\bin\x64\Release"
            if(Test-Path $dir){ New-Item -ItemType Directory -Force .\dist\lib | Out-Null; Get-ChildItem $dir -Filter *.dll | Copy-Item -Destination .\dist\lib -Force }
          }
          python .\native-windows\build-c1010-materials.py --out .\dist
          $hash=(Get-FileHash '.\dist\AsterMax Mechanical.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            release='C10.41-validation';commit='${{ github.sha }}';executable_sha256=$hash;
            rc1='BLOCKED';workflow_conformance='NOT_RUN';ansys_equivalence='NOT_RUN';fea_values_invented=$false
          } | ConvertTo-Json -Depth 5 | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8

      - name: Exercise C10.34 native tree on two real CAD bodies
        shell: pwsh
        run: ./native-windows/smoke-c1034-tree.ps1 -Dist "$PWD/dist"

      - name: Upload C10.34 tree evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.41-Mechanical-Tree-Evidence
          path: dist/Audit/C10.34
          if-no-files-found: warn

      - name: Upload C10.22 Windows 10 EXE immediately
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.41-Windows-x64-Unqualified-Build
          path: dist
          if-no-files-found: error

      - name: Preserve C10.40 real STEP contact gravity and ID stress regression
        shell: pwsh
        run: ./native-windows/smoke-c1035-defaults.ps1 -Dist "$PWD/dist"

      - name: Install and exercise native Windows Code_Aster
        shell: pwsh
        run: ./native-windows/test-c1011-native-windows.ps1 -Dist "$PWD/dist"

      - name: Execute compiled native exporter on the real contact contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $bin=(Resolve-Path './dist').Path
          $exe=Join-Path $bin 'AsterMax Mechanical.exe'
          $contract=Join-Path $bin 'Audit\C10.35-runtime\contact-solver-contract.json'
          $deck=Join-Path $PWD 'dist/Validation/C10.41-NativeContact'
          $script:AsterMaxAssemblyRoot=(Resolve-Path '.\upstream').Path
          New-Item -ItemType Directory -Force $deck | Out-Null

          function Find-AsterMaxAssembly([string]$fileName) {
            $matches=Get-ChildItem $script:AsterMaxAssemblyRoot -Recurse -File -Filter $fileName -ErrorAction SilentlyContinue
            $candidate=$matches | Where-Object { $_.FullName -match '\\bin\\x64\\Release\\' } | Select-Object -First 1
            if(-not $candidate){ $candidate=$matches | Where-Object { $_.FullName -match '\\packages\\' } | Select-Object -First 1 }
            return $candidate
          }

          # AsterMax is a .NET Framework application. Resolve its project and
          # NuGet assemblies from the actual build tree instead of assuming
          # CaeGlobals/CaeModel/etc. were copied beside the executable.
          $resolver=[System.ResolveEventHandler]{
            param($sender,$eventArgs)
            $simple=(New-Object System.Reflection.AssemblyName($eventArgs.Name)).Name + '.dll'
            $candidate=Find-AsterMaxAssembly $simple
            if($candidate){ return [System.Reflection.Assembly]::LoadFrom($candidate.FullName) }
            return $null
          }
          [AppDomain]::CurrentDomain.add_AssemblyResolve($resolver)
          try {
            $newton=Find-AsterMaxAssembly 'Newtonsoft.Json.dll'
            if(-not $newton){ throw 'Newtonsoft.Json.dll not found in build/package tree.' }
            [System.Reflection.Assembly]::LoadFrom($newton.FullName) | Out-Null
            $asm=[System.Reflection.Assembly]::LoadFrom($exe)
            $json=[Newtonsoft.Json.Linq.JObject]::Parse((Get-Content $contract -Raw))
            $type=$asm.GetType('PrePoMax.AsterMaxCodeAsterNativeExporter',$true)
            $method=$type.GetMethod('ExportContract',[System.Reflection.BindingFlags]'Public,Static')
            if($null -eq $method){ throw 'Compiled ExportContract method missing.' }
            try { $manifest=$method.Invoke($null,[object[]]@($json,[string]$deck,[string]'astermax-c1041-native-contact')) }
            catch { if($_.Exception.InnerException){ throw $_.Exception.InnerException } else { throw } }
          }
          finally {
            [AppDomain]::CurrentDomain.remove_AssemblyResolve($resolver)
          }
          $comm=Get-Content (Join-Path $deck 'astermax-c1041-native-contact.comm') -Raw
          $mail=Get-Content (Join-Path $deck 'astermax-c1041-native-contact.mail') -Raw
          foreach($t in @('DEFI_CONTACT','STAT_NON_LINE','GROUP_MA_MAIT','GROUP_MA_ESCL','CONTACT_INIT','stabilize = AFFE_CHAR_MECA',"FROTTEMENT='COULOMB'",'COULOMB=0.2',"GROUP_NO='C1038_LOAD'","DY=0","DZ=0","GROUP_NO='C1038_FIXED'",'gravity = AFFE_CHAR_MECA','PESANTEUR','GRAVITE=9810','DIRECTION=(0, -1, 0)','RHO=')){ if(-not $comm.Contains($t)){ throw "Generated .comm missing: $t" } }
          foreach($t in @('GROUP_MA NOM = AM_VOL','GROUP_MA NOM = AM_M001','GROUP_MA NOM = AM_S001')){ if(-not $mail.Contains($t)){ throw "Generated .mail missing: $t" } }
          @'
          P actions make_etude
          P version 15.2
          P mode interactif
          P time_limit 900
          P memory_limit 4096
          P ncpus 1
          P mpi_nbcpu 1

          F comm /analysis/astermax-c1041-native-contact.comm D 1
          F mail /analysis/astermax-c1041-native-contact.mail D 20
          F mess /analysis/astermax-c1041-native-contact.mess R 6
          F rmed /analysis/astermax-c1041-native-contact.rmed R 81
          F resu /analysis/astermax-c1041-native-contact.resu R 80
          '@ | Set-Content (Join-Path $deck 'astermax-c1041-native-contact.export') -Encoding ASCII
          Copy-Item $contract (Join-Path $deck 'c1039-live-femodel-contract.json') -Force

      - name: Solve the compiled contact deck with native Windows Code_Aster
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $deck="$PWD/dist/Validation/C10.41-NativeContact"
          $stem='astermax-c1041-native-contact'
          $runner="$PWD/dist/AsterMaxRuntime/CodeAster/astermax-codeaster-runner.cmd"
          $probe=& $runner probe | ConvertFrom-Json
          if(-not $probe.ready -or $probe.transport -ne 'WINDOWS_NATIVE' -or $probe.wsl_required){ throw 'Native Windows contact solver is not ready.' }
          & $runner "$deck/$stem.export" $deck | Tee-Object "$deck/NATIVE_CONTACT_STDOUT.log"
          $solverExit=$LASTEXITCODE
          if($solverExit -ne 0){ throw "Native contact solve failed: $solverExit" }
          $mess=Get-Content "$deck/$stem.mess" -Raw
          if($mess -notmatch 'ARRET NORMAL' -or $mess -match '<F(?:>|_)'){ throw 'Native contact solve did not terminate normally.' }
          $env:ASTERMAX_MED_BRIDGE_MODE='production'
          python native-windows/bridge-c964-med-results.py "$deck/$stem.rmed" "$deck/$stem.bundle.json" "$deck/$stem.vtu"
          if($LASTEXITCODE -ne 0){ throw 'Native contact MED parsing failed.' }
          python native-windows/qualify-mechanical-analysis.py --bundle "$deck/$stem.bundle.json" --analysis "$deck/$stem.native-export.json" --mess "$deck/$stem.mess" --out "$deck/mechanical-qualification.json"
          if($LASTEXITCODE -ne 0){ throw 'Native contact mechanical qualification hard block.' }
          $q=Get-Content "$deck/mechanical-qualification.json" -Raw | ConvertFrom-Json
          [ordered]@{
            status='PASS';scope='NATIVE_WINDOWS_CONTACT_SOLVER_AND_MED';commit='${{ github.sha }}';
            solver_exit_code=$solverExit;transport=$probe.transport;rc1='BLOCKED';
            engineering_qualification=$q.engineering_qualification;
            rmed_sha256=(Get-FileHash "$deck/$stem.rmed" -Algorithm SHA256).Hash.ToLowerInvariant();
            bundle_sha256=(Get-FileHash "$deck/$stem.bundle.json" -Algorithm SHA256).Hash.ToLowerInvariant();
            fea_values_invented=$false
          } | ConvertTo-Json | Set-Content "$deck/C10.41_NATIVE_CONTACT_EVIDENCE.json" -Encoding UTF8

      - name: Reconstruct B01 STEP from declared dimensions
        shell: pwsh
        run: python native-windows/workflow-conformance/generate-b01-step.py --out "$PWD/dist/Audit/C10.20/B01-100x10x10.step"

      - name: Execute native GUI workflow conformance
        shell: pwsh
        run: |
          $env:ASTERMAX_PYTHON="$PWD/dist/AsterMaxRuntime/Python/python.exe"
          $env:ASTERMAX_CODE_ASTER_RUNNER="$PWD/dist/AsterMaxRuntime/CodeAster/astermax-codeaster-runner.cmd"
          ./native-windows/workflow-conformance/run-e2e.ps1 `
            -Exe "$PWD/dist/AsterMax Mechanical.exe" `
            -Step "$PWD/dist/Audit/C10.20/B01-100x10x10.step" `
            -OutDir "$PWD/dist/Audit/C10.20" `
            -TimeoutSeconds 600

      - name: Reopen solved PMX in a separate GUI process and reject changed scopes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $project="$PWD/dist/Audit/C10.20/B01-C10.41-solved.pmx"
          $out="$PWD/dist/Audit/C10.41-Reopen"
          New-Item -ItemType Directory -Force $out | Out-Null
          $env:ASTERMAX_C1041_REOPEN_AUDIT_DIR=$out
          try {
            $p=Start-Process -FilePath "$PWD/dist/AsterMax Mechanical.exe" -WorkingDirectory "$PWD/dist" -ArgumentList @($project,'-US','MM_TON_S_C') -PassThru
            if(-not $p.WaitForExit(120000)){ Stop-Process -Id $p.Id -Force; throw 'Fresh-process reopen timed out.' }
            if($p.ExitCode -ne 0){ throw "Fresh-process reopen failed: $($p.ExitCode)" }
            $r=Get-Content "$out/fresh-process-reopen.json" -Raw | ConvertFrom-Json
            $saved=Get-Content "$PWD/dist/Audit/C10.20/solved-project-save.json" -Raw | ConvertFrom-Json
            if($r.status -ne 'PASS' -or $r.bundle_sha256 -ne $saved.bundle_sha256 -or $r.model_fingerprint_sha256 -ne $saved.model_fingerprint_sha256){ throw 'Saved/reopened result identity mismatch.' }
          } finally { Remove-Item Env:ASTERMAX_C1041_REOPEN_AUDIT_DIR -ErrorAction SilentlyContinue }

      - name: Enforce mandatory FAIL gate
        if: always()
        shell: pwsh
        run: |
          $report='.\dist\Audit\C10.20\workflow-conformance-report.json'
          if(-not(Test-Path $report)){ throw 'Workflow conformance report was not produced.' }
          $r=Get-Content $report -Raw | ConvertFrom-Json
          Write-Host "MANDATORY_PASS=$($r.summary.mandatory_pass)"
          Write-Host "MANDATORY_FAIL=$($r.summary.mandatory_failures)"
          Write-Host "MANDATORY_NOT_EXERCISED=$($r.summary.mandatory_not_exercised)"
          Write-Host "CLOSURE_CANDIDATE=$($r.summary.closure_candidate)"
          if(-not $r.summary.release_gate_pass){ throw 'Workflow session failed or mandatory evidence is incomplete.' }
          if([int]$r.summary.mandatory_failures -gt 0){ throw 'At least one mandatory workflow stage is FAIL.' }

      - name: Upload C10.20 conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.41-Workflow-Conformance
          path: |
            dist/Audit/C10.20
            dist/Audit/C10.41-Reopen
            dist/Audit/C10.41-ResultStore
            dist/Audit/PatchChain
            dist/Validation
            upstream/PrePoMax/Forms/AsterMaxWorkflowConformance*.cs
            upstream/PrePoMax/Forms/FrmMain.cs
          if-no-files-found: warn

      - name: Upload C10.20 executable test distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.41-Windows-x64-Test-Distribution
          path: dist
          if-no-files-found: error
