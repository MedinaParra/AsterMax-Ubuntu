name: AsterMax FreeCAD Native Viewer POC

on:
  push:
    branches:
      - agent/astermax-freecad-native-viewer-poc
    paths:
      - ".github/workflows/astermax-freecad-native-viewer-poc.yml"
      - "windows/AsterMax.MechanicalGui/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FREECAD_VERSION: "1.1.3"
  FREECAD_ASSET: "FreeCAD_1.1.3-Windows-x86_64-py311.7z"
  FREECAD_SHA256: "9c6959dc9c4dba64dd818a62447e3dfedb4221d776fb044b239d462f150bcec4"

jobs:
  native-viewer-windows:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout POC branch
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and build Release
        shell: pwsh
        run: |
          dotnet restore windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj
          dotnet build windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj -c Release --no-restore

      - name: Publish AsterMax win-x64
        shell: pwsh
        run: |
          dotnet publish windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64
          if (-not (Test-Path publish/win-x64/FreeCAD/astermax_freecad_viewer.py)) {
            throw "Published AsterMax package is missing the FreeCAD viewer bridge script."
          }

      - name: Bundle Gmsh OpenCASCADE engine
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://gmsh.info/bin/Windows/gmsh-4.15.2-Windows64.zip" -OutFile gmsh.zip -UseBasicParsing
          Expand-Archive gmsh.zip -DestinationPath gmsh-extract -Force
          $source = Get-ChildItem gmsh-extract -Directory | Select-Object -First 1
          if ($null -eq $source) { throw "Gmsh archive did not contain the expected directory." }
          $target = "publish/win-x64/tools/gmsh"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item "$($source.FullName)/*" $target -Recurse -Force
          if (-not (Test-Path "$target/gmsh.exe")) { throw "Bundled Gmsh executable is missing." }

      - name: Download official FreeCAD 1.1.3 Windows runtime
        shell: pwsh
        run: |
          $url = "https://github.com/FreeCAD/FreeCAD/releases/download/$env:FREECAD_VERSION/$env:FREECAD_ASSET"
          $archive = Join-Path $env:RUNNER_TEMP $env:FREECAD_ASSET
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:FREECAD_SHA256) {
            throw "Official FreeCAD SHA256 mismatch. Expected $env:FREECAD_SHA256, got $hash."
          }
          $target = Join-Path (Resolve-Path publish/win-x64).Path "tools/freecad"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          & 7z x $archive "-o$target" -y
          if ($LASTEXITCODE -ne 0) { throw "Unable to extract official FreeCAD runtime." }
          Remove-Item -LiteralPath $archive -Force

          $freecad = Get-ChildItem -LiteralPath $target -Filter "FreeCAD.exe" -File -Recurse |
            Where-Object { $_.FullName -notmatch '(?i)uninstall' } |
            Select-Object -First 1
          if (-not $freecad) { throw "Extracted FreeCAD runtime does not contain FreeCAD.exe." }
          $qwindows = Get-ChildItem -LiteralPath $target -Filter "qwindows.dll" -File -Recurse | Select-Object -First 1
          if (-not $qwindows) { throw "Extracted FreeCAD runtime does not contain qwindows.dll." }

          $softwareGl = Get-ChildItem -LiteralPath $target -Filter "opengl32sw.dll" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "--- FreeCAD OpenGL-related runtime files ---"
          Get-ChildItem -LiteralPath $target -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '(?i)(opengl|mesa|gles|egl|angle).*\.dll$' } |
            Select-Object -First 80 FullName, Length |
            Format-Table -AutoSize

          "ASTERMAX_FREECAD_EXE=$($freecad.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FREECAD_RUNTIME_ROOT=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_OPENGL=software" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QT_NO_OPENGL_BUGLIST=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($softwareGl) {
            Write-Host "Found packaged software OpenGL: $($softwareGl.FullName)"
            "QT_OPENGL_DLL=$($softwareGl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Warning "Official FreeCAD archive does not contain opengl32sw.dll."
          }
          Write-Host "FreeCAD.exe: $($freecad.FullName)"
          Write-Host "qwindows.dll: $($qwindows.FullName)"
          & $freecad.FullName --version

      - name: Run headless AsterMax + FreeCAD graphical diagnostic
        id: headless_freecad_gate
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/freecad | Out-Null
          $exe = (Resolve-Path publish/win-x64/AsterMax-Mechanical.exe).Path
          $step = (Resolve-Path windows/AsterMax.MechanicalGui/TestData/CILINDRO-SIMPLE.stp).Path
          $env:ASTERMAX_STARTUP_STEP = $step
          $env:ASTERMAX_UI_SMOKE_LOG = (Join-Path (Resolve-Path evidence).Path "ui-smoke.log")
          $env:ASTERMAX_FREECAD_EMBED_LOG = (Join-Path (Resolve-Path evidence).Path "freecad-embed.log")
          $env:ASTERMAX_FREECAD_EVIDENCE_DIR = (Resolve-Path evidence/freecad).Path
          $env:ASTERMAX_REQUIRE_FREECAD_VIEWER = "1"
          $env:ASTERMAX_FREECAD_FORCE_SOFTWARE_OPENGL = "1"
          Remove-Item $env:ASTERMAX_UI_SMOKE_LOG -Force -ErrorAction SilentlyContinue
          Remove-Item $env:ASTERMAX_FREECAD_EMBED_LOG -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -ArgumentList "--startup-smoke" -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Process FreeCAD -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "Hosted Windows graphical diagnostic exceeded 90 seconds."
          }
          if (Test-Path $env:ASTERMAX_UI_SMOKE_LOG) { Get-Content $env:ASTERMAX_UI_SMOKE_LOG }
          if (Test-Path $env:ASTERMAX_FREECAD_EMBED_LOG) { Get-Content $env:ASTERMAX_FREECAD_EMBED_LOG }
          if ($process.ExitCode -ne 0) { throw "Hosted graphical diagnostic failed with code $($process.ExitCode)." }
          foreach ($gate in @("embedded-pass", "native-gate-pass")) {
            if (-not (Select-String -Path $env:ASTERMAX_FREECAD_EMBED_LOG -Pattern $gate -Quiet)) {
              throw "Hosted FreeCAD graphical diagnostic did not reach gate: $gate"
            }
          }

      - name: Record hosted-runner OpenGL limitation
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          @"
          FreeCAD native viewer POC
          =========================
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA
          Hosted graphical gate outcome: ${{ steps.headless_freecad_gate.outcome }}

          GitHub-hosted Windows runs without a normal interactive GPU/display context. The
          official FreeCAD 1.1.3 runtime and its bundled opengl32sw.dll are present, but
          Coin3D/WGL can still fail to create the 3D framebuffer in that headless session.
          This package is therefore LOCAL-GPU POC evidence, not graphical certification.
          "@ | Set-Content evidence/freecad-hosted-runner-note.txt -Encoding utf8

      - name: Re-run cylinder OpenCASCADE and TET4 regression
        if: always()
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/win-x64/AsterMax-Mechanical.exe).Path
          $step = (Resolve-Path windows/AsterMax.MechanicalGui/TestData/CILINDRO-SIMPLE.stp).Path
          & $exe --step-import-smoke $step --expect-solids 1 --expect-faces 3 *>&1 | Tee-Object evidence/cylinder-step-smoke.log
          if ($LASTEXITCODE -ne 0) { throw "Cylinder STEP/TET4 regression failed." }

      - name: Package local-GPU AsterMax FreeCAD viewer POC
        if: always()
        shell: pwsh
        run: |
          $package = "AsterMax-Windows-2.0-beta-FreeCAD-Native-Viewer-LOCAL-GPU-POC-win-x64"
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item publish/win-x64/* package -Recurse -Force
          Copy-Item windows/AsterMax.MechanicalGui/TestData/CILINDRO-SIMPLE.stp package/CILINDRO-SIMPLE.stp -Force
          if (Test-Path evidence) { Copy-Item evidence package/evidence -Recurse -Force }
          @'
          @echo off
          set ASTERMAX_FREECAD_FORCE_SOFTWARE_OPENGL=
          set QT_OPENGL=
          set QT_OPENGL_DLL=
          start "" "%~dp0AsterMax-Mechanical.exe"
          '@ | Set-Content package/RUN-AsterMax-HARDWARE.cmd -Encoding ascii
          @'
          @echo off
          set ASTERMAX_FREECAD_FORCE_SOFTWARE_OPENGL=1
          set QT_OPENGL=software
          for /r "%~dp0tools\freecad" %%F in (opengl32sw.dll) do set QT_OPENGL_DLL=%%F
          start "" "%~dp0AsterMax-Mechanical.exe"
          '@ | Set-Content package/RUN-AsterMax-SOFTWARE-GL.cmd -Encoding ascii
          @'
          ASTERMAX FREECAD NATIVE VIEWER — LOCAL GPU POC
          =================================================
          This is an experimental local-Windows validation build.

          The old custom AsterMax STEP painter is disabled. STEP visualization is delegated
          to the official FreeCAD 1.1.3 Qt/Coin3D/OpenCASCADE viewer, running in an isolated
          process and embedded into AsterMax through a native Windows HWND host.

          FIRST TEST:
          1. Extract the complete ZIP to a new folder.
          2. Run RUN-AsterMax-HARDWARE.cmd.
          3. Import CILINDRO-SIMPLE.stp.
          4. Confirm that the cylinder is visible while Details changes normally.
          5. Delete the cylinder and confirm that the native viewer disappears.

          If the native viewer cannot create an OpenGL context, close AsterMax and try
          RUN-AsterMax-SOFTWARE-GL.cmd, which forces FreeCAD's packaged Mesa llvmpipe DLL.

          LIMITATION:
          FreeCAD FaceN -> persistent AsterMax/Gmsh CAD-face scoping is NOT certified yet.
          Do not use this POC for final support/load face assignment until that mapping gate
          has been completed.

          GitHub-hosted Windows cannot certify the rendered 3D image because its session does
          not provide a normal WGL desktop context. The official FreeCAD runtime, build,
          AsterMax OCC import and TET4 regressions are still validated there.
          '@ | Set-Content package/README-FREECAD-VIEWER-POC.txt -Encoding utf8

          & 7z a -tzip -mx=3 "$package.zip" ".\package\*"
          if ($LASTEXITCODE -ne 0) { throw "POC ZIP packaging failed." }
          $hash = (Get-FileHash "$package.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content "$package.zip.sha256" -Encoding ascii
          Get-Item "$package.zip" | Select-Object Name, Length | Format-Table -AutoSize
          Get-Content "$package.zip.sha256"

      - name: Upload local-GPU POC and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-FreeCAD-Native-Viewer-LOCAL-GPU-POC-win-x64
          path: |
            AsterMax-Windows-2.0-beta-FreeCAD-Native-Viewer-LOCAL-GPU-POC-win-x64.zip
            AsterMax-Windows-2.0-beta-FreeCAD-Native-Viewer-LOCAL-GPU-POC-win-x64.zip.sha256
            evidence/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
