name: Windows C5.4d Live Results Cutover

on:
  pull_request:
  workflow_dispatch:

jobs:
  live-results-cutover:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/desktop_picker_app.py src/astermax/fea/production_results.py src/astermax/fea/results_workspace.py src/astermax/fea/results_workspace_ui.py
      - name: C5.4d live Results provenance harness
        run: python -m pytest -q tests/test_desktop_picker_app.py tests/test_production_results.py tests/test_results_workspace_ui.py tests/test_results_workspace.py
      - name: Full regression suite
        run: python -m pytest -q
