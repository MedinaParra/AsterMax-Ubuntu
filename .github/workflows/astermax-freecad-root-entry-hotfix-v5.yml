name: AsterMax FreeCAD Root Entry Hotfix v5

on:
  push:
    branches:
      - agent/astermax-freecad-native-viewer-poc
    paths:
      - ".github/workflows/astermax-freecad-root-entry-hotfix-v5.yml"
      - "windows/AsterMax.MechanicalGui/FreeCadNativeViewerHostV4.cs"
      - "windows/AsterMax.MechanicalGui/FreeCAD/**"
      - "windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hotfix-v5:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and publish
        shell: pwsh
        run: |
          dotnet restore windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj
          dotnet build windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj -c Release --no-restore
          dotnet publish windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish
          if (-not (Test-Path publish/AsterMax-Mechanical.exe)) { throw "AsterMax exe missing." }
          if (-not (Test-Path publish/FreeCAD/AsterMaxBridge/InitGui.py)) { throw "InitGui bridge missing." }
          if (-not (Test-Path publish/FreeCAD/AsterMaxBridge/astermax_bridge.py)) { throw "Bridge service missing." }

      - name: Core regression smoke
        shell: pwsh
        run: |
          dotnet run --project windows/AsterMax.MechanicalGui/AsterMax.MechanicalGui.csproj -c Release --no-build -- --solver-smoke

      - name: Package root-entry hotfix
        shell: pwsh
        run: |
          $name = "AsterMax-FreeCAD-ROOT-ENTRY-HOTFIX-v5"
          New-Item -ItemType Directory -Force -Path patch/FreeCAD | Out-Null
          Copy-Item publish/AsterMax-Mechanical.exe patch/AsterMax-Mechanical.exe -Force
          Copy-Item publish/FreeCAD/* patch/FreeCAD -Recurse -Force

          @'
          @echo off
          setlocal
          set "ROOT=%~dp0"
          set "FCROOT=%ROOT%tools\freecad\FreeCAD_1.1.3-Windows-x86_64-py311"
          set "FCEXE=%FCROOT%\FreeCAD.exe"
          if not exist "%FCROOT%" (
            echo ERROR: No encuentro el runtime FreeCAD extraido en:
            echo %FCROOT%
            pause
            exit /b 1
          )
          if not exist "%FCEXE%" (
            echo ERROR: El entry point oficial FreeCAD.exe no existe en:
            echo %FCEXE%
            echo NO se intentara usar bin\freecad.exe como sustituto.
            pause
            exit /b 1
          )
          set "ASTERMAX_FREECAD_ROOT=%FCROOT%"
          set "ASTERMAX_FREECAD_EXE=%FCEXE%"
          set FREECAD_EXE=
          set ASTERMAX_FREECAD_FORCE_SOFTWARE_OPENGL=
          set QT_OPENGL=
          set QT_OPENGL_DLL=
          start "" "%ROOT%AsterMax-Mechanical.exe"
          endlocal
          '@ | Set-Content patch/RUN-AsterMax-HARDWARE.cmd -Encoding ascii

          @'
          @echo off
          setlocal EnableDelayedExpansion
          set "ROOT=%~dp0"
          set "FCROOT=%ROOT%tools\freecad\FreeCAD_1.1.3-Windows-x86_64-py311"
          set "FCEXE=%FCROOT%\FreeCAD.exe"
          if not exist "%FCEXE%" (
            echo ERROR: No encuentro el entry point oficial %FCEXE%
            pause
            exit /b 1
          )
          set "ASTERMAX_FREECAD_ROOT=%FCROOT%"
          set "ASTERMAX_FREECAD_EXE=%FCEXE%"
          set FREECAD_EXE=
          set "ASTERMAX_FREECAD_FORCE_SOFTWARE_OPENGL=1"
          set "QT_OPENGL=software"
          for /r "%FCROOT%" %%F in (opengl32sw.dll) do set "QT_OPENGL_DLL=%%F"
          start "" "%ROOT%AsterMax-Mechanical.exe"
          endlocal
          '@ | Set-Content patch/RUN-AsterMax-SOFTWARE-GL.cmd -Encoding ascii

          @'
          ASTERMAX FREECAD ROOT ENTRY HOTFIX v5
          =====================================
          Este parche corrige el error mostrado en Windows:
            ...\bin\freecad.exe - El sistema no puede encontrar el archivo especificado.

          CAUSA
          El resolver v4 priorizaba cualquier FreeCAD.exe encontrado dentro de \bin\,
          siguiendo el layout pixi de SolidFreeCAD. El paquete oficial FreeCAD 1.1.3
          que usa este POC tiene como entry point validado:
            tools\freecad\FreeCAD_1.1.3-Windows-x86_64-py311\FreeCAD.exe

          CORRECCION
          - La ruta explicita existente se respeta sin re-ranking.
          - ASTERMAX_FREECAD_ROOT prueba primero root\FreeCAD.exe.
          - Library\bin y bin quedan como layouts alternativos, no como prioridad global.
          - Los launchers v5 verifican root\FreeCAD.exe antes de abrir AsterMax.
          - Se mantiene el bridge oculto Mod/AsterMaxBridge/InitGui.py.

          INSTALACION
          1. Cierra AsterMax y FreeCAD.
          2. Extrae este ZIP sobre la misma carpeta del POC v3/v4.
          3. Acepta reemplazar AsterMax-Mechanical.exe, FreeCAD y los dos .cmd.
          4. Ejecuta RUN-AsterMax-HARDWARE.cmd.
          5. Importa CILINDRO-SIMPLE.stp.
          6. Si aparece un error grafico/OpenGL, prueba RUN-AsterMax-SOFTWARE-GL.cmd.
          '@ | Set-Content patch/README-HOTFIX-v5.txt -Encoding utf8

          Compress-Archive -Path patch/* -DestinationPath "$name.zip" -Force -CompressionLevel Optimal
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding ascii
          Write-Host "hotfix_bytes=$((Get-Item "$name.zip").Length)"
          Write-Host "hotfix_sha256=$hash"

      - name: Upload hotfix v5
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-FreeCAD-ROOT-ENTRY-HOTFIX-v5
          path: |
            AsterMax-FreeCAD-ROOT-ENTRY-HOTFIX-v5.zip
            AsterMax-FreeCAD-ROOT-ENTRY-HOTFIX-v5.zip.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
