name: C8.71 Verified Deformation Geometry

on:
  push:
    branches: [agent/c8-71-verified-deformation-geometry]
  workflow_dispatch:

concurrency:
  group: c8-71-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-verified-deformation-geometry:
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      C865_RUN_ID: '33963671896'
      C865_SHA: '86b123a2df7a481a06451358e299bac69db2b7e4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin exact solver-verified nodal evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prior/windows,prior/solve | Out-Null
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "C8.65-Windows-Generated-Study-$env:C865_SHA" --dir prior/windows
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "AsterMax-C8.65-Product-Native-Reaction-$env:C865_SHA" --dir prior/solve
          $pmx=Get-ChildItem prior/windows -Recurse -Filter 'AsterMax_C862_Structural.pmx'|Select-Object -First 1
          $rmed=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.rmed'|Select-Object -First 1
          $resu=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.resu'|Select-Object -First 1
          $ev=Get-ChildItem prior/solve -Recurse -Filter 'C8.65_PRODUCT_NATIVE_REACTION_EVIDENCE.json'|Select-Object -First 1
          if(-not $pmx -or -not $rmed -or -not $resu -or -not $ev){throw 'Pinned evidence bundle incomplete.'}
          $e=Get-Content $ev.FullName -Raw|ConvertFrom-Json
          if(-not $e.solver_verified -or -not $e.result_field_values_verified -or -not $e.reaction_equilibrium_verified){throw 'Source solve is not admitted.'}
          if([int]$e.max_displacement_node -le 0){throw 'Solver displacement-extrema node provenance missing.'}
          "C871_PMX=$($pmx.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C871_RMED=$($rmed.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C871_RESU=$($resu.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C871_PRIOR=$($ev.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C871_NODES=$($e.node_count)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C871_MISES=$($e.max_von_mises_mpa.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C871_DISP=$($e.max_displacement_mm.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C871_MISES_NODE=$($e.max_von_mises_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "C871_DISP_NODE=$($e.max_displacement_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Bootstrap and apply verified Results plus deformation-geometry chain
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_full_model_results_demo.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_results_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_clean_verified_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_extrema_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_node_probe_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_deformation_geometry.py build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Run Results and fail-closed native deformation geometry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/c8-71|Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $ready=(Join-Path $PWD 'artifact/c8-71/RESULTS_VERIFIED_DEFORMATION_GEOMETRY_READY.json')
          $env:ASTERMAX_RESULTS_FULL_MODEL_PMX=$env:C871_PMX
          $env:ASTERMAX_RESULTS_EXPECTED_NODES=$env:C871_NODES
          $env:ASTERMAX_RESULTS_EXPECTED_ELEMENTS='2474'
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_MAX=$env:C871_MISES
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_MAX=$env:C871_DISP
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_NODE=$env:C871_MISES_NODE
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_NODE=$env:C871_DISP_NODE
          $p=Start-Process $exe -ArgumentList @('--astermax-results-demo',$env:C871_RMED,$env:C871_RESU,$ready) -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(90)
          while(-not(Test-Path $ready) -and (Get-Date)-lt $deadline){Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw "Results process exited early: $($p.ExitCode)"}}
          if(-not(Test-Path $ready)){throw 'Timed out waiting for Results READY.'}
          $s=Get-Content $ready -Raw|ConvertFrom-Json
          if(-not $s.scene_ready -or -not $s.result_admitted -or -not $s.full_model_pmx_loaded){throw 'Full-model Results gate failed.'}
          if(-not $s.native_node_probe_verified){throw 'C8.70 node-probe prerequisite was not retained.'}
          if(-not [bool]$s.deformation_geometry_verified -or -not [bool]$s.deformation_scale_semantics_verified){throw 'Native deformation geometry was not verified.'}
          if([string]$s.deformation_geometry_source -ne 'Controller.GetScaledNode(scale,nodeId)'){throw 'Unexpected deformation geometry source.'}
          if([int]$s.deformation_probe_node -ne [int]$env:C871_DISP_NODE){throw 'Deformation probe node provenance mismatch.'}
          if([math]::Abs([double]$s.true_scale_factor-1.0)-gt 1e-12){throw 'TrueScale factor is not 1.'}
          if([math]::Abs([double]$s.user_scale_factor-10.0)-gt 1e-12){throw 'Qualified user scale is not 10.'}
          if([double]$s.true_scale_max_coordinate_error_mm -gt 1e-7){throw 'TrueScale geometry error exceeds tolerance.'}
          if([double]$s.user_scale_max_coordinate_error_mm -gt 1e-7){throw 'User-scale geometry error exceeds tolerance.'}
          if([bool]$s.deformation_ui_scale_selector_verified){throw 'C8.71 must not overclaim GUI scale-selector qualification.'}
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Emit C8.71 evidence
        shell: pwsh
        run: |
          $s=Get-Content artifact/c8-71/RESULTS_VERIFIED_DEFORMATION_GEOMETRY_READY.json -Raw|ConvertFrom-Json
          $prior=Get-Content $env:C871_PRIOR -Raw|ConvertFrom-Json
          @{
            schema='astermax.c8.71.verified-deformation-geometry.v1';commit='${{ github.sha }}';source_solver_run=[long]$env:C865_RUN_ID;source_solver_commit=$env:C865_SHA
            solver_verified=[bool]$prior.solver_verified;result_fields_verified=[bool]$prior.result_field_values_verified;reaction_equilibrium_verified=[bool]$prior.reaction_equilibrium_verified
            mesh_nodes=[int]$s.mesh_nodes;mesh_elements=2474;deformation_probe_node=[int]$s.deformation_probe_node
            displacement_vector_mm=@([double]$s.disp_u1_mm,[double]$s.disp_u2_mm,[double]$s.disp_u3_mm)
            deformation_geometry_source=[string]$s.deformation_geometry_source;true_scale_factor=[double]$s.true_scale_factor;true_scale_max_coordinate_error_mm=[double]$s.true_scale_max_coordinate_error_mm
            user_scale_factor=[double]$s.user_scale_factor;user_scale_max_coordinate_error_mm=[double]$s.user_scale_max_coordinate_error_mm
            native_node_probe_verified=[bool]$s.native_node_probe_verified;deformation_geometry_verified=[bool]$s.deformation_geometry_verified;deformation_scale_semantics_verified=[bool]$s.deformation_scale_semantics_verified;deformation_ui_scale_selector_verified=[bool]$s.deformation_ui_scale_selector_verified
            pmx_sha256=(Get-FileHash $env:C871_PMX -Algorithm SHA256).Hash.ToLowerInvariant();rmed_sha256=(Get-FileHash $env:C871_RMED -Algorithm SHA256).Hash.ToLowerInvariant();resu_sha256=(Get-FileHash $env:C871_RESU -Algorithm SHA256).Hash.ToLowerInvariant()
            verified_deformation_geometry_qualified=$true;industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 6|Set-Content artifact/c8-71/C8_71_VERIFIED_DEFORMATION_GEOMETRY_EVIDENCE.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.71-Verified-Deformation-Geometry-${{ github.sha }}
          path: artifact/c8-71/**
          if-no-files-found: warn
          retention-days: 14
