name: C8.56 Native VTK Anchored Glyphs Windows

on:
  push:
    branches: [agent/c8-56-vtk-viewport-projection]
  workflow_dispatch:

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - name: Restore
        shell: pwsh
        run: nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Verify C8.56 native VTK anchor contract
        shell: pwsh
        run: |
          $layer=Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxNativeVtkAnchorLayer.cs' -Raw
          foreach($token in @('AsterMaxNativeVtkAnchorLayer','AddArrowWidget','RemoveArrowWidgets','TryResolveFeAnchor','AsterMaxRegionBindingInspector','FE POSITION','HARNESS_ONLY','POC WORLD ORIGIN · NOT MODEL DATA')) {
            if($layer -notmatch [regex]::Escape($token)){throw "Missing C8.56 native anchor token: $token"}
          }
          if($layer -match 'solver_verified\s*=\s*true|surface_geometric_centroid_exact\s*=\s*true|load_direction_projection_qualified\s*=\s*true'){throw 'C8.56 must not claim solver/exact-surface/direction verification.'}
          $integration=Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxNativeVtkAnchorIntegration.cs' -Raw
          foreach($token in @('InstallAsterMaxNativeVtkAnchorLayer','_vtk','AsterMaxNativeVtkAnchorLayer')){if($integration -notmatch [regex]::Escape($token)){throw "Missing native integration token: $token"}}
          $vtk=Get-Content 'build/PrePoMax-CodeAster/vtkControl/vtkControl.cs' -Raw
          foreach($token in @('private vtkRenderer _renderer','public void AddArrowWidget','public void RemoveArrowWidgets','SetWorldPoint','WorldToDisplay','GetDisplayPoint')) {
            if($vtk -notmatch [regex]::Escape($token)){throw "Pinned vtkControl contract moved: $token"}
          }
      - name: Launch native VTK projection proof and capture GUI
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class NativeWin56 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int nCmdShow);
          }
          "@
          New-Item -ItemType Directory -Force artifact | Out-Null
          $env:ASTERMAX_VTK_ANCHOR_POC='1'
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(30)
          do{Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw 'GUI exited early'}}while($p.MainWindowHandle -eq 0 -and (Get-Date)-lt $deadline)
          if($p.MainWindowHandle -eq 0){throw 'No native window'}
          if($p.MainWindowTitle -notmatch '^AsterMax Mechanical'){throw "Unexpected title: $($p.MainWindowTitle)"}
          [NativeWin56]::ShowWindow($p.MainWindowHandle,3)|Out-Null
          [NativeWin56]::SetForegroundWindow($p.MainWindowHandle)|Out-Null
          Start-Sleep -Seconds 4
          if($p.HasExited){throw 'GUI exited during native VTK anchor proof'}
          $r=New-Object NativeWin56+RECT; [NativeWin56]::GetWindowRect($p.MainWindowHandle,[ref]$r)|Out-Null
          $w=$r.Right-$r.Left; $h=$r.Bottom-$r.Top
          if($w -lt 900 -or $h -lt 650){throw "Native window below evidence threshold: ${w}x${h}"}
          $bmp=New-Object Drawing.Bitmap $w,$h; $g=[Drawing.Graphics]::FromImage($bmp)
          try{$g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)}finally{$g.Dispose()}
          $png='artifact/C8.56_NATIVE_VTK_ANCHORED_GLYPHS.png'; $bmp.Save((Join-Path $PWD $png),[Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          @{schema='astermax.native-vtk-anchors.v2';title=$p.MainWindowTitle;width=$w;height=$h;screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant();pinned_vtk_world_to_display_contract=$true;native_arrow_widget_contract=$true;harness_world_origin_poc_requested=$true;fe_anchor_to_native_widget_path_implemented=$true;loaded_model_anchor_runtime_proven=$false;surface_geometric_centroid_exact=$false;selection_geometry_mapping_qualified=$false;load_direction_projection_qualified=$false;solver_verified=$false;industrial_validation=$false;ansys_equivalence=$false;commit='${{ github.sha }}'}|ConvertTo-Json|Set-Content -Encoding UTF8 artifact/C8.56_EVIDENCE.json
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.56-Native-VTK-Anchored-Glyphs-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
