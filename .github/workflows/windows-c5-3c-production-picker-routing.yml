name: Windows C5.3c Production Picker Routing

on:
  pull_request:
  workflow_dispatch:

jobs:
  production-picker-routing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/production_picker_routing.py src/astermax/fea/native_cad_picker_ui.py src/astermax/fea/arbitrary_bc.py
      - name: C5.3c production routing harness
        run: python -m pytest -q tests/test_production_picker_routing.py tests/test_native_cad_picker_ui.py tests/test_cad_face_picker.py tests/test_arbitrary_bc.py
      - name: Full regression suite
        run: python -m pytest -q
