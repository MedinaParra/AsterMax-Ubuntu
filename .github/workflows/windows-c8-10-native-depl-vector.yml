name: Windows C8.10 Native DEPL Vector Scene Contract
on:
  push:
    branches: [agent/c8-10-native-depl-vector-scene-contract]
    paths:
      - 'src/astermax/cae_scene_contract.py'
      - 'src/astermax/code_aster_med_results.py'
      - 'src/astermax/professional_postprocess.py'
      - 'tests/test_c8_10_native_depl_vector.py'
      - '.github/workflows/windows-c8-10-native-depl-vector.yml'
  workflow_dispatch:
concurrency:
  group: c8-10-native-depl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-native-depl-vector:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AsterMax
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Regression C8.9 postprocess
        shell: pwsh
        run: python -m pytest -q tests/test_professional_postprocess.py
      - name: Verify native DEPL vector scene contract
        shell: pwsh
        run: python -m pytest -q tests/test_c8_10_native_depl_vector.py
