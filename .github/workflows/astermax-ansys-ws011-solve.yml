name: AsterMax ANSYS WS01.1 Solver Comparison

on:
  push:
    branches: [ codex/c10212-async-mesh-repair ]
    paths:
      - 'native-windows/ansys-tutorials/generate_ws011_case.py'
      - 'native-windows/ansys-tutorials/ws01-1-cap-fillets.comm'
      - 'native-windows/ansys-tutorials/ws01-1-cap-fillets.export'
      - 'native-windows/ansys-tutorials/compare_ws011.py'
      - 'native-windows/bridge-c964-med-results.py'
      - 'native-windows/test-c1011-native-windows.ps1'
      - '.github/workflows/astermax-ansys-ws011-solve.yml'
  workflow_dispatch:

concurrency:
  group: astermax-ansys-ws011-solve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ws011:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout AsterMax branch
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install meshing and MED dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check gmsh numpy h5py

      - name: Download exact ANSYS WS01.1 STEP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force .\ws011\solve | Out-Null
          $url='https://ecampus.paris-saclay.fr/pluginfile.php/2561407/mod_folder/content/0/Formation%20Polytech/Mechanical_Introduction_16.0_v1/Mechanical_Introduction_16.0_v1/workshop_input_files/Cap_fillets.stp?forcedownload=1'
          & curl.exe -L --fail --retry 4 --retry-delay 3 -A 'Mozilla/5.0 AsterMax WS01.1 validation' -o .\ws011\Cap_fillets.stp $url
          if($LASTEXITCODE -ne 0){ throw 'Cap_fillets.stp download failed.' }
          $head=(Get-Content .\ws011\Cap_fillets.stp -TotalCount 5) -join [Environment]::NewLine
          if($head -notmatch 'ISO-10303-21'){ throw 'Downloaded input is not STEP.' }

      - name: Generate quadratic TET10 mesh sweep
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sizes=@(3.0,2.8,2.6,2.5,2.4,2.2,1.8,1.5)
          $cases=@()
          foreach($size in $sizes) {
            $tag=('{0:0.0}' -f $size).Replace('.','p')
            $dir=".\ws011\solve-$tag"
            New-Item -ItemType Directory -Force $dir | Out-Null
            python .\native-windows\ansys-tutorials\generate_ws011_case.py --input .\ws011\Cap_fillets.stp --out-dir $dir --mesh-size $size --element-order 2
            if($LASTEXITCODE -ne 0){ throw "WS01.1 TET10 mesh failed for size $size mm." }
            Copy-Item .\native-windows\ansys-tutorials\ws01-1-cap-fillets.comm $dir -Force
            Copy-Item .\native-windows\ansys-tutorials\ws01-1-cap-fillets.export $dir -Force
            $m=Get-Content (Join-Path $dir 'ws01-1-model-evidence.json') -Raw | ConvertFrom-Json
            $cases += [pscustomobject]@{tag=$tag;mesh_size_mm=$size;nodes=$m.mesh.nodes;elements=$m.mesh.volume_elements;formulation=$m.mesh.formulation}
          }
          $cases | Format-Table -AutoSize
          $cases | ConvertTo-Json -Depth 5 | Set-Content .\ws011\mesh-sweep.json -Encoding UTF8
      - name: Assemble AsterMax native runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\CodeAster | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\Python | Out-Null
          Copy-Item .\native-windows\runtime\CodeAster\astermax-codeaster-runner.cmd .\dist\AsterMaxRuntime\CodeAster\ -Force
          Copy-Item .\native-windows\runtime\CodeAster\astermax-codeaster-runner.ps1 .\dist\AsterMaxRuntime\CodeAster\ -Force
          $pythonRoot=Split-Path (Get-Command python).Source -Parent
          Copy-Item "$pythonRoot\*" .\dist\AsterMaxRuntime\Python\ -Recurse -Force
          & .\dist\AsterMaxRuntime\Python\python.exe -c "import numpy,h5py; print('ASTERMAX_WS011_PYTHON_OK')"
          if($LASTEXITCODE -ne 0){ throw 'Packaged Python runtime failed.' }

      - name: Install and verify native Windows Code_Aster
        shell: pwsh
        run: .\native-windows\test-c1011-native-windows.ps1 -Dist "$PWD\dist"

      - name: Solve TET10 mesh sweep with AsterMax Code_Aster runtime
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference='Stop'
          $runner=(Resolve-Path .\dist\AsterMaxRuntime\CodeAster\astermax-codeaster-runner.cmd).Path
          $solveStatus=@()
          $cases=Get-ChildItem .\ws011 -Directory -Filter 'solve-*' | ForEach-Object {
            $ev=Get-Content (Join-Path $_.FullName 'ws01-1-model-evidence.json') -Raw | ConvertFrom-Json
            [pscustomobject]@{dir=$_;size=[double]$ev.mesh.target_size_mm}
          } | Sort-Object size -Descending
          foreach($case in $cases) {
            $solve=$case.dir.FullName
            Write-Host "SOLVING_TET10_CASE=$($case.dir.Name) SIZE_MM=$($case.size)"
            & $runner (Join-Path $solve 'ws01-1-cap-fillets.export') $solve | Tee-Object (Join-Path $solve 'ASTERMAX_CODE_ASTER_STDOUT.log')
            $runnerExit=$LASTEXITCODE
            $mess=Join-Path $solve 'ws01-1-cap-fillets.mess'
            $normal=(Test-Path $mess) -and ((Get-Content $mess -Raw) -match 'ARRET NORMAL')
            $rmed=Test-Path (Join-Path $solve 'ws01-1-cap-fillets.rmed')
            $valid=($runnerExit -eq 0 -and $normal -and $rmed)
            $solveStatus += [pscustomobject]@{
              case=$case.dir.Name
              mesh_size_mm=$case.size
              runner_exit=$runnerExit
              normal_termination=$normal
              rmed=$rmed
              valid=$valid
            }
            if(-not $valid){
              Write-Warning "WS01.1 mesh level rejected; continuing sweep: $($case.dir.Name)"
            }
          }
          $solveStatus | Format-Table -AutoSize
          $solveStatus | ConvertTo-Json -Depth 5 | Set-Content .\ws011\solve-status.json -Encoding UTF8
          if(($solveStatus | Where-Object {$_.valid}).Count -lt 3){
            throw 'Fewer than three valid TET10 mesh levels solved.'
          }

      - name: Import real MED and compare every mesh level
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:ASTERMAX_MED_BRIDGE_MODE='production'
          $python=(Resolve-Path .\dist\AsterMaxRuntime\Python\python.exe).Path
          $summary=@()
          $validCases=Get-Content .\ws011\solve-status.json -Raw | ConvertFrom-Json | Where-Object {$_.valid}
          foreach($status in $validCases) {
            $solve=(Resolve-Path (Join-Path '.\ws011' $status.case)).Path
            & $python .\native-windows\bridge-c964-med-results.py (Join-Path $solve 'ws01-1-cap-fillets.rmed') (Join-Path $solve 'ws01-1-cap-fillets.astermax-results.json') (Join-Path $solve 'ws01-1-cap-fillets.astermax-results.vtu')
            if($LASTEXITCODE -ne 0){ throw "AsterMax MED handoff failed: $($status.case)" }
            python .\native-windows\ansys-tutorials\compare_ws011.py --bundle (Join-Path $solve 'ws01-1-cap-fillets.astermax-results.json') --model-evidence (Join-Path $solve 'ws01-1-model-evidence.json') --out (Join-Path $solve 'WS01.1-ANSYS-vs-AsterMax.json')
            if($LASTEXITCODE -ne 0){ throw "WS01.1 comparison integrity failed: $($status.case)" }
            $cmp=Get-Content (Join-Path $solve 'WS01.1-ANSYS-vs-AsterMax.json') -Raw | ConvertFrom-Json
            $summary += [pscustomobject]@{
              case=$status.case
              mesh_size_mm=$cmp.astermax_code_aster.mesh.target_size_mm
              nodes=$cmp.astermax_code_aster.mesh.nodes
              elements=$cmp.astermax_code_aster.mesh.volume_elements
              vm_mpa=$cmp.astermax_code_aster.von_mises_ansys_corner_component_first_max_mpa
              u_mm=$cmp.astermax_code_aster.total_deformation_max_mm
              sf=$cmp.astermax_code_aster.safety_factor_ansys_parity
              vm_error_pct=$cmp.comparison.stress_error_pct
              u_error_pct=$cmp.comparison.deformation_error_pct
              within_5pct=$cmp.comparison.both_primary_results_within_5pct
            }
          }
          $summary=$summary | Sort-Object mesh_size_mm -Descending
          $summary | Format-Table -AutoSize
          $summary | ConvertTo-Json -Depth 5 | Set-Content .\ws011\WS01.1-TET10-SWEEP-SUMMARY.json -Encoding UTF8

      - name: Upload WS01.1 solver comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-ANSYS-WS01.1-Solver-Comparison
          path: ws011
          if-no-files-found: error
