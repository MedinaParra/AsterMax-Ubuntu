name: Windows C5.4g Provenance-Safe Results Clip Plane

on:
  pull_request:
  workflow_dispatch:

jobs:
  results-clip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/results_clip.py src/astermax/fea/results_workspace_ui.py src/astermax/fea/results_workspace.py
      - name: C5.4g clipping-plane harness
        run: python -m pytest -q tests/test_results_clip.py tests/test_results_workspace_ui.py tests/test_results_workspace.py tests/test_production_results.py
      - name: Full regression suite
        run: python -m pytest -q
