name: C8.86 Multi-ROI NetGen Refinement

on:
  push:
    branches: [agent/c8-86-multi-roi-netgen-refinement]
  workflow_dispatch:

concurrency:
  group: c8-86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-adaptive-family:
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap AsterMax and install NetGen qualification seams
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_c8_82_native_mesh_sensitivity.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_c8_82f_netgen_consumer_sizing.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_c8_86_multi_roi_refinement.py build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Restore and build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Fetch pinned NetGen runtime, SI-mm STEP, and admitted C8.85 ROIs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/c8-86/source | Out-Null
          gh run download 34042958847 --repo '${{ github.repository }}' --name 'AsterMax-C8.85-Hotspot-ROI-1732bc6622db0384aba9c170d2d9462925e7ae05' --dir artifact/c8-86/source
          if(-not(Test-Path artifact/c8-86/source/C8.85_HOTSPOT_ROI.json)){throw 'Pinned C8.85 ROI evidence missing'}
          $roi=Get-Content artifact/c8-86/source/C8.85_HOTSPOT_ROI.json -Raw|ConvertFrom-Json
          if(-not $roi.multi_roi_refinement_ready -or $roi.recommended_adaptive_strategy -ne 'multi_roi'){throw 'C8.85 multi-ROI admission drift'}
          $spec=@()
          foreach($r in $roi.persistent_rois){ foreach($level in @('coarse','medium','fine')){ $p=$r.levels.$level.best_xyz_mm; $spec += ('{0:R},{1:R},{2:R},12' -f [double]$p[0],[double]$p[1],[double]$p[2]) } }
          $spec=($spec|Select-Object -Unique) -join ';'
          if(($spec -split ';').Count -lt 6){throw 'Insufficient evidence-backed ROI refinement points'}
          "ASTERMAX_C886_REFINEMENT_POINTS=$spec" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $runtimeZip='build/PrePoMax-v1.4.0-portable.zip'; $runtimeExtract='build/PrePoMax-v1.4.0-portable'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $runtimeZip 'https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Expand-Archive -Path $runtimeZip -DestinationPath $runtimeExtract -Force
          $netgen=Get-ChildItem -Path $runtimeExtract -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $netgen){throw 'Portable runtime missing NetGenMesher.exe'}
          $release=(Get-Item 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release').FullName; $runtimeRoot=$netgen.Directory.Parent.FullName
          foreach($folder in @('NetGen','Solver','Models','Temp')){ $source=Join-Path $runtimeRoot $folder; if(Test-Path $source){Copy-Item -Path $source -Destination $release -Recurse -Force} }
          $fixture='build/AsterMax_C8.86_Box_mm.step'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $fixture 'https://raw.githubusercontent.com/facebookresearch/project_superdex/9b59be6f5279936d15322f02bd04c631c7249cb4/assets/prefabs/box_and_blocks/cad/box.step'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $raw=Get-Content $fixture -Raw
          if($raw -notmatch [regex]::Escape('.MILLI., .METRE.')){throw 'STEP fixture no longer declares SI millimetres.'}
          if($raw -notmatch '537\.000000' -or $raw -notmatch '162\.000000' -or $raw -notmatch '\-254\.000000'){throw 'STEP dimensional sentinels changed.'}
          "ASTERMAX_C886_STEP=$((Resolve-Path $fixture).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate baseline 40 mm and adaptive 40/12 mm multi-ROI studies
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $summary=@(); $budgetSeconds=720
          foreach($name in @('baseline','adaptive')){
            $root=Join-Path $PWD "artifact/c8-86/$name"; $study=Join-Path $root 'study'; New-Item -ItemType Directory -Force $study | Out-Null
            $meshEv=Join-Path $root 'STEP_NETGEN.json'; $cfgEv=Join-Path $root 'NETGEN_CONFIG.json'; $paramCopy=Join-Path $root 'meshParameters.effective.txt'; $refCopy=Join-Path $root 'meshRefinement.effective.txt'; $setupEv=Join-Path $root 'STRUCTURAL_SETUP.json'; $genEv=Join-Path $root 'CODEASTER_GENERATION.json'
            $env:ASTERMAX_STEP_MESH_FIXTURE='1'; $env:ASTERMAX_STEP_MESH_PATH=$env:ASTERMAX_C886_STEP; $env:ASTERMAX_STEP_MESH_MAXH_MM='40'; $env:ASTERMAX_STEP_MESH_CONFIG_EVIDENCE_PATH=$cfgEv; $env:ASTERMAX_STEP_MESH_EVIDENCE_PATH=$meshEv
            $env:ASTERMAX_NETGEN_CONSUMER_MAXH_MM='40'; $env:ASTERMAX_NETGEN_PARAMETERS_COPY_PATH=$paramCopy; $env:ASTERMAX_NETGEN_REFINEMENT_COPY_PATH=$refCopy
            if($name -eq 'adaptive'){ $env:ASTERMAX_NETGEN_REFINEMENT_POINTS=$env:ASTERMAX_C886_REFINEMENT_POINTS } else { Remove-Item Env:ASTERMAX_NETGEN_REFINEMENT_POINTS -ErrorAction SilentlyContinue }
            $env:ASTERMAX_STRUCTURAL_SETUP_FIXTURE='1'; $env:ASTERMAX_STRUCTURAL_SETUP_EVIDENCE_PATH=$setupEv; $env:ASTERMAX_CODEASTER_GENERATION_FIXTURE='1'; $env:ASTERMAX_CODEASTER_GENERATION_EVIDENCE_PATH=$genEv; $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR=$study
            $sw=[Diagnostics.Stopwatch]::StartNew(); $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru; $deadline=(Get-Date).AddSeconds(35)
            do{Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw "$name GUI exited early: $($p.ExitCode)"}}while($p.MainWindowHandle -eq 0 -and (Get-Date)-lt $deadline)
            if($p.MainWindowHandle -eq 0){throw "${name}: no native AsterMax window"}
            $proofDeadline=(Get-Date).AddSeconds($budgetSeconds)
            while(((-not(Test-Path $meshEv))-or(-not(Test-Path $paramCopy))-or(-not(Test-Path $refCopy))-or(-not(Test-Path $setupEv))-or(-not(Test-Path $genEv))) -and (Get-Date)-lt $proofDeadline){Start-Sleep -Milliseconds 750;$p.Refresh();if($p.HasExited){throw "$name GUI exited during generation"}}
            $sw.Stop(); foreach($ev in @($meshEv,$paramCopy,$refCopy,$setupEv,$genEv)){if(-not(Test-Path $ev)){throw "$name exceeded evidence budget; missing $ev"}}
            $m=Get-Content $meshEv -Raw|ConvertFrom-Json; $s=Get-Content $setupEv -Raw|ConvertFrom-Json; $g=Get-Content $genEv -Raw|ConvertFrom-Json
            if(-not $m.step_to_netgen_mesh_qualified){throw "$name STEP/NetGen failed: $($m.error)"}; if(-not $s.structural_setup_qualified -or -not $s.mm_n_mpa_unit_lock){throw "$name structural setup failed"}; if(-not $g.pmx_structural_roundtrip_qualified -or -not $g.unit_pmx_codeaster_generation_qualified){throw "$name Code_Aster generation failed"}
            $refLines=Get-Content $refCopy; $pointCount=[int]$refLines[0]
            if($name -eq 'adaptive' -and $pointCount -lt 6){throw "adaptive refinement contract lost: $pointCount points"}
            $summary += [pscustomobject]@{name=$name;global_maxh_mm=40;local_h_mm=if($name -eq 'adaptive'){12}else{$null};nodes=[int]$m.mesh_node_count;elements=[int]$m.mesh_element_count;refinement_point_count=$pointCount;generation_walltime_s=[math]::Round($sw.Elapsed.TotalSeconds,3);mail_sha256=(Get-FileHash (Join-Path $study 'astermax_c862_static.mail') -Algorithm SHA256).Hash.ToLowerInvariant();refinement_sha256=(Get-FileHash $refCopy -Algorithm SHA256).Hash.ToLowerInvariant()}
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2
          }
          if($summary[1].elements -le $summary[0].elements){throw "Local refinement did not increase elements: $($summary.elements -join ',')"}
          @{schema='astermax.c8.86.multi-roi-netgen-family.v1';commit='${{ github.sha }}';levels=$summary;source_hotspot_workflow=34042958847;source_roi_count=3;consumer_multi_roi_refinement_verified=$true;native_femeshrefinement_binding_verified=$false;industrial_validation=$false;ansys_equivalence=$false}|ConvertTo-Json -Depth 8|Set-Content artifact/c8-86/C8.86_MESH_FAMILY.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C8.86-Multi-ROI-NetGen-Studies-${{ github.sha }}
          path: artifact/c8-86/**
          if-no-files-found: warn
          retention-days: 14

  solve-and-qualify:
    needs: generate-adaptive-family
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: C8.86-Multi-ROI-NetGen-Studies-${{ github.sha }}
          path: artifact/c8-86
      - name: Download exact admitted global-25 reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/c8-83-ref
          gh run download 34033613470 --repo '${{ github.repository }}' --name 'AsterMax-C8.83-Distributed-Traction-Convergence-86302f91a4974eb1ae8b5a813d144c845589707c' --dir artifact/c8-83-ref
          test -s artifact/c8-83-ref/C8.83_CONVERGENCE_QUALIFICATION.json
      - name: Apply identical audited +1000 N surface traction
        shell: bash
        run: |
          set -euo pipefail
          for level in baseline adaptive; do
            python integrations/prepomax-codeaster/tools/c8_83_surface_traction_contract.py "artifact/c8-86/$level/study" --resultant-n 1000 --evidence "artifact/c8-86/$level/C8.86_SURFACE_TRACTION.json"
          done
      - name: Solve both studies with Code_Aster 17.4.0
        shell: bash
        run: |
          set -euo pipefail
          docker pull simvia/code_aster:17.4.0
          for level in baseline adaptive; do
            d="artifact/c8-86/$level/study"; chmod -R a+rwX "$d"
            docker run --rm -v "$PWD/$d:/home/user/data" -w /home/user/data simvia/code_aster:17.4.0 bash -i -c 'run_aster astermax_c862_static.export' | tee "artifact/c8-86/$level/C8.86_CODE_ASTER_STDOUT.log"
            test -s "$d/astermax_c862_static.mess"; test -s "$d/astermax_c862_static.resu"; test -s "$d/astermax_c862_static.rmed"
          done
      - name: Independently compare adaptive accuracy and DOF proxy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile integrations/prepomax-codeaster/tools/c8_86_compare_adaptive.py
          python integrations/prepomax-codeaster/tools/c8_86_compare_adaptive.py artifact/c8-86 artifact/c8-83-ref | tee artifact/c8-86/C8.86_ANALYSIS_STDOUT.log
          test -s artifact/c8-86/C8.86_ADAPTIVE_QUALIFICATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.86-Multi-ROI-Adaptive-${{ github.sha }}
          path: artifact/c8-86/**
          if-no-files-found: warn
          retention-days: 14
