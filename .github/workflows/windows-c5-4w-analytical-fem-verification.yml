name: Windows C5.4w Analytical FEM Verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  analytical-fem-verification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/analytical_fem_verification.py
      - name: C5.4w analytical-FEM harness
        run: python -m pytest -q tests/test_analytical_fem_verification.py
      - name: Analytical evidence regression
        run: python -m pytest -q tests/test_analytical_evidence.py tests/test_cad_axial_witness.py tests/test_neighborhood_verification.py
      - name: End-to-end demo regression
        run: python -m pytest -q tests/test_end_to_end_demo_session.py tests/test_step_to_solve.py tests/test_production_results.py
      - name: Full regression suite
        run: python -m pytest -q
