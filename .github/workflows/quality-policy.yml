name: Windows Mesh Quality Policy

on:
  push:
    branches:
      - agent/quality-policy-unification-v0.9
  pull_request:
    branches:
      - agent/mesh-inspector-v0.8

jobs:
  verify-quality-policy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV
        run: python -m pip install -e .[test]
      - name: Run deterministic regression harness
        run: python -m pytest -q
      - name: Compile package with warnings as errors
        run: python -W error -m compileall -q src packaging
