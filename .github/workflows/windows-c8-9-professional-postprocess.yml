name: Windows C8.9 Professional Postprocess Instruments
on:
  push:
    branches: [agent/c8-9-professional-postprocess-instruments]
    paths:
      - 'src/astermax/professional_postprocess.py'
      - 'tests/test_professional_postprocess.py'
      - '.github/workflows/windows-c8-9-professional-postprocess.yml'
  pull_request:
    branches: [agent/c8-8-code-aster-med-result-bridge]
    paths:
      - 'src/astermax/professional_postprocess.py'
      - 'tests/test_professional_postprocess.py'
      - '.github/workflows/windows-c8-9-professional-postprocess.yml'
  workflow_dispatch:
concurrency:
  group: c8-9-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-professional-postprocess:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AsterMax and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Verify C8.8 result bridge regression
        shell: pwsh
        run: python -m pytest -q tests/test_code_aster_med_results.py
      - name: Verify C8.9 professional postprocess instruments
        shell: pwsh
        run: python -m pytest -q tests/test_professional_postprocess.py
