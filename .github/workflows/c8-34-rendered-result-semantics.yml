name: C8.34 Rendered result semantics

on:
  push:
    branches:
      - agent/c8-34-rendered-result-semantics
    paths:
      - 'integrations/prepomax-codeaster/**'
      - '.github/workflows/c8-34-rendered-result-semantics.yml'
  workflow_dispatch:

concurrency:
  group: c8-34-rendered-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  genuine-solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Genuine Code_Aster 17.4.0 solve
        shell: bash
        run: |
          chmod -R a+rwX integrations/prepomax-codeaster/smoke/codeaster-linear-tetra
          docker pull simvia/code_aster:17.4.0
          python integrations/prepomax-codeaster/harness/astermax_harness.py \
            --manifest integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/smoke.harness.manifest.json
      - name: Independent mm-N-MPa oracle
        shell: bash
        run: |
          python integrations/prepomax-codeaster/harness/validate_numeric_reference.py \
            --resu integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/smoke.resu \
            --contract integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/c8-29-reference-contract.json
      - name: Stage genuine evidence
        shell: bash
        run: |
          mkdir -p artifact/genuine
          cp integrations/prepomax-codeaster/smoke/codeaster-linear-tetra/{smoke.rmed,smoke.resu,smoke.mess,smoke.harness.json} artifact/genuine/
          sha256sum artifact/genuine/* > artifact/genuine/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: c8-34-genuine-${{ github.sha }}
          path: artifact/genuine/**
          if-no-files-found: error

  windows-rendered-semantics:
    needs: genuine-solve
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: c8-34-genuine-${{ github.sha }}
          path: genuine
      - name: Bootstrap pinned AsterMax source
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Launch, gate semantics and capture native Results scene
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeWindowC834 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@

          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $rmed=(Resolve-Path 'genuine/smoke.rmed').Path
          $resu=(Resolve-Path 'genuine/smoke.resu').Path
          New-Item -ItemType Directory -Force 'artifact/c8-34' | Out-Null
          $ready=(Join-Path $PWD 'artifact/c8-34/RESULTS_DEMO_READY.json')
          $stdout=(Join-Path $PWD 'artifact/c8-34/results-demo.stdout.log')
          $stderr=(Join-Path $PWD 'artifact/c8-34/results-demo.stderr.log')
          $p=Start-Process -FilePath $exe -ArgumentList @('--astermax-results-demo',$rmed,$resu,$ready) -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

          $deadline=(Get-Date).AddSeconds(45)
          do {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if($p.HasExited){
              Write-Host (Get-Content $stdout -Raw -ErrorAction SilentlyContinue)
              Write-Host (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
              throw "Rendered semantics demo exited before READY. ExitCode=$($p.ExitCode)"
            }
          } while(-not (Test-Path $ready) -and (Get-Date) -lt $deadline)
          if(-not (Test-Path $ready)){ throw 'Timed out waiting for C8.34 READY marker.' }

          $state=Get-Content $ready -Raw | ConvertFrom-Json
          if($state.schema -ne 'astermax.results-demo-ready.v2'){ throw "Unexpected READY schema: $($state.schema)" }
          if(-not $state.scene_ready -or -not $state.result_admitted -or -not $state.native_draw_invoked){ throw 'Results scene admission is incomplete.' }
          if($state.view -ne 'Results' -or $state.view_results_type -ne 'ColorContours'){ throw 'Native Results/ColorContours state was not retained.' }
          if($state.field -ne 'STRESS' -or $state.component -ne 'MISES'){ throw 'C8.34 did not select STRESS/MISES.' }
          if($state.unit_system -ne 'mm-N-MPa'){ throw "Unexpected unit system: $($state.unit_system)" }
          if(-not $state.verification_overlay_visible -or -not $state.verification_overlay_bound_to_field){ throw 'Visible verification overlay is not bound to the admitted field.' }

          $expectedMises=1.0392304845413265
          $expectedDisp=0.0007428571428571429
          if([Math]::Abs([double]$state.mises_max_mpa-$expectedMises) -gt 1e-5){ throw "Rendered Mises maximum failed oracle: $($state.mises_max_mpa)" }
          if([Math]::Abs([double]$state.disp_max_mm-$expectedDisp) -gt 1e-9){ throw "Rendered displacement maximum failed oracle: $($state.disp_max_mm)" }

          $windowDeadline=(Get-Date).AddSeconds(20)
          do { Start-Sleep -Milliseconds 250; $p.Refresh() } while($p.MainWindowHandle -eq 0 -and -not $p.HasExited -and (Get-Date) -lt $windowDeadline)
          if($p.HasExited){ throw "C8.34 process exited after READY but before capture. ExitCode=$($p.ExitCode)" }
          if($p.MainWindowHandle -eq 0){ throw 'C8.34 has no native main window.' }
          if($p.MainWindowTitle -notlike 'AsterMax Mechanical*'){ throw "Unexpected window title: $($p.MainWindowTitle)" }

          [NativeWindowC834]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          $r=New-Object NativeWindowC834+RECT
          if(-not [NativeWindowC834]::GetWindowRect($p.MainWindowHandle,[ref]$r)){ throw 'GetWindowRect failed.' }
          $w=$r.Right-$r.Left; $h=$r.Bottom-$r.Top
          if($w -lt 640 -or $h -lt 480){ throw "Native Results window too small: ${w}x${h}" }

          $bmp=New-Object System.Drawing.Bitmap($w,$h)
          $g=[System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)
          $png=Join-Path $PWD 'artifact/c8-34/AsterMax-C8.34-rendered-semantics.png'
          $bmp.Save($png,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          if((Get-Item $png).Length -lt 20000){ throw 'C8.34 screenshot is unexpectedly small.' }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Emit content-addressed C8.34 evidence
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $png=(Resolve-Path 'artifact/c8-34/AsterMax-C8.34-rendered-semantics.png').Path
          $ready=(Resolve-Path 'artifact/c8-34/RESULTS_DEMO_READY.json').Path
          $state=Get-Content $ready -Raw | ConvertFrom-Json
          @{
            schema='astermax.c8-34-rendered-result-semantics.v1'
            commit='${{ github.sha }}'
            solver='Code_Aster 17.4.0'
            unit_system='mm-N-MPa'
            genuine_solve=$true
            numerical_oracle=$true
            result_admitted_to_live_controller=$true
            selected_field='STRESS/MISES'
            deformation_field='DISP/ALL'
            native_draw_invoked=$true
            rendered_semantics_overlay_visible=[bool]$state.verification_overlay_visible
            rendered_semantics_bound_to_field=[bool]$state.verification_overlay_bound_to_field
            rendered_mises_min_mpa=[double]$state.mises_min_mpa
            rendered_mises_max_mpa=[double]$state.mises_max_mpa
            rendered_disp_max_mm=[double]$state.disp_max_mm
            executable_sha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            rmed_sha256=(Get-FileHash genuine/smoke.rmed -Algorithm SHA256).Hash.ToLowerInvariant()
            resu_sha256=(Get-FileHash genuine/smoke.resu -Algorithm SHA256).Hash.ToLowerInvariant()
            ready_state_sha256=(Get-FileHash $ready -Algorithm SHA256).Hash.ToLowerInvariant()
            screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant()
            native_scalar_bar_semantically_verified=$false
            probe_visual_verified=$false
            contour_pixels_semantically_verified=$false
            industrial_validation=$false
            ansys_equivalence=$false
          } | ConvertTo-Json -Depth 4 | Set-Content artifact/c8-34/C8_34_EVIDENCE.json
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.34-rendered-result-semantics-${{ github.sha }}
          path: artifact/c8-34/**
          if-no-files-found: error
          retention-days: 14
