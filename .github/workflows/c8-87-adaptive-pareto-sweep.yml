name: C8.87 Adaptive Pareto Sweep

on:
  push:
    branches: [agent/c8-87-adaptive-pareto-sweep]
  workflow_dispatch:

concurrency:
  group: c8-87-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-family:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap AsterMax and install qualified NetGen seams
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_c8_82_native_mesh_sensitivity.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_c8_82f_netgen_consumer_sizing.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_c8_86_multi_roi_refinement.py build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Restore and build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Fetch pinned NetGen runtime, SI-mm STEP, and admitted C8.85 ROIs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/c8-87/source | Out-Null
          gh run download 34042958847 --repo '${{ github.repository }}' --name 'AsterMax-C8.85-Hotspot-ROI-1732bc6622db0384aba9c170d2d9462925e7ae05' --dir artifact/c8-87/source
          $roi=Get-Content artifact/c8-87/source/C8.85_HOTSPOT_ROI.json -Raw|ConvertFrom-Json
          if(-not $roi.multi_roi_refinement_ready){throw 'Pinned C8.85 ROI evidence not admitted'}
          $pts=@()
          foreach($r in $roi.persistent_rois){ foreach($level in @('coarse','medium','fine')){ $p=$r.levels.$level.best_xyz_mm; $pts += ('{0:R},{1:R},{2:R}' -f [double]$p[0],[double]$p[1],[double]$p[2]) } }
          $pts=$pts|Select-Object -Unique
          if($pts.Count -lt 6){throw 'Insufficient evidence-backed ROI points'}
          "ASTERMAX_C887_ROI_POINTS=$($pts -join ';')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $zip='build/PrePoMax-v1.4.0-portable.zip'; $extract='build/PrePoMax-v1.4.0-portable'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $zip 'https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $netgen=Get-ChildItem -Path $extract -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $netgen){throw 'Portable runtime missing NetGenMesher.exe'}
          $release=(Get-Item 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release').FullName; $runtimeRoot=$netgen.Directory.Parent.FullName
          foreach($folder in @('NetGen','Solver','Models','Temp')){ $src=Join-Path $runtimeRoot $folder; if(Test-Path $src){Copy-Item -Path $src -Destination $release -Recurse -Force} }
          $fixture='build/AsterMax_C8.87_Box_mm.step'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $fixture 'https://raw.githubusercontent.com/facebookresearch/project_superdex/9b59be6f5279936d15322f02bd04c631c7249cb4/assets/prefabs/box_and_blocks/cad/box.step'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $raw=Get-Content $fixture -Raw
          if($raw -notmatch [regex]::Escape('.MILLI., .METRE.')){throw 'STEP fixture no longer declares SI millimetres'}
          "ASTERMAX_C887_STEP=$((Resolve-Path $fixture).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate baseline and adaptive local-size sweep
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $cases=@(
            @{name='baseline';h=$null},
            @{name='adaptive-h18';h=18},
            @{name='adaptive-h16';h=16},
            @{name='adaptive-h14';h=14},
            @{name='adaptive-h12';h=12}
          )
          $summary=@(); $budgetSeconds=720
          foreach($case in $cases){
            $name=$case.name; $h=$case.h; $root=Join-Path $PWD "artifact/c8-87/$name"; $study=Join-Path $root 'study'; New-Item -ItemType Directory -Force $study | Out-Null
            $meshEv=Join-Path $root 'STEP_NETGEN.json'; $cfgEv=Join-Path $root 'NETGEN_CONFIG.json'; $paramCopy=Join-Path $root 'meshParameters.effective.txt'; $refCopy=Join-Path $root 'meshRefinement.effective.txt'; $setupEv=Join-Path $root 'STRUCTURAL_SETUP.json'; $genEv=Join-Path $root 'CODEASTER_GENERATION.json'
            $env:ASTERMAX_STEP_MESH_FIXTURE='1'; $env:ASTERMAX_STEP_MESH_PATH=$env:ASTERMAX_C887_STEP; $env:ASTERMAX_STEP_MESH_MAXH_MM='40'; $env:ASTERMAX_STEP_MESH_CONFIG_EVIDENCE_PATH=$cfgEv; $env:ASTERMAX_STEP_MESH_EVIDENCE_PATH=$meshEv
            $env:ASTERMAX_NETGEN_CONSUMER_MAXH_MM='40'; $env:ASTERMAX_NETGEN_PARAMETERS_COPY_PATH=$paramCopy; $env:ASTERMAX_NETGEN_REFINEMENT_COPY_PATH=$refCopy
            if($null -ne $h){ $spec=(($env:ASTERMAX_C887_ROI_POINTS -split ';') | ForEach-Object { "$_,$h" }) -join ';'; $env:ASTERMAX_NETGEN_REFINEMENT_POINTS=$spec } else { Remove-Item Env:ASTERMAX_NETGEN_REFINEMENT_POINTS -ErrorAction SilentlyContinue }
            $env:ASTERMAX_STRUCTURAL_SETUP_FIXTURE='1'; $env:ASTERMAX_STRUCTURAL_SETUP_EVIDENCE_PATH=$setupEv; $env:ASTERMAX_CODEASTER_GENERATION_FIXTURE='1'; $env:ASTERMAX_CODEASTER_GENERATION_EVIDENCE_PATH=$genEv; $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR=$study
            $required=@($meshEv,$paramCopy,$setupEv,$genEv); if($null -ne $h){$required += $refCopy}
            $sw=[Diagnostics.Stopwatch]::StartNew(); $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru; $deadline=(Get-Date).AddSeconds(35)
            do{Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw "$name GUI exited early: $($p.ExitCode)"}}while($p.MainWindowHandle -eq 0 -and (Get-Date)-lt $deadline)
            if($p.MainWindowHandle -eq 0){throw "$name: no native AsterMax window"}
            $proofDeadline=(Get-Date).AddSeconds($budgetSeconds)
            while((@($required|Where-Object{-not(Test-Path $_)}).Count -gt 0) -and (Get-Date)-lt $proofDeadline){Start-Sleep -Milliseconds 750;$p.Refresh();if($p.HasExited){throw "$name GUI exited during generation"}}
            $sw.Stop(); foreach($ev in $required){if(-not(Test-Path $ev)){throw "$name exceeded evidence budget; missing $ev"}}
            $m=Get-Content $meshEv -Raw|ConvertFrom-Json; $s=Get-Content $setupEv -Raw|ConvertFrom-Json; $g=Get-Content $genEv -Raw|ConvertFrom-Json
            if(-not $m.step_to_netgen_mesh_qualified){throw "$name STEP/NetGen failed: $($m.error)"}; if(-not $s.structural_setup_qualified -or -not $s.mm_n_mpa_unit_lock){throw "$name structural setup failed"}; if(-not $g.unit_pmx_codeaster_generation_qualified){throw "$name Code_Aster generation failed"}
            $pointCount=0; if(Test-Path $refCopy){$lines=Get-Content $refCopy;if($lines.Count -gt 0){$pointCount=[int]$lines[0]}}
            if($null -eq $h -and $pointCount -ne 0){throw 'baseline contaminated by refinement'}
            if($null -ne $h -and $pointCount -lt 6){throw "$name refinement contract lost"}
            $summary += [pscustomobject]@{name=$name;global_maxh_mm=40;local_h_mm=$h;nodes=[int]$m.mesh_node_count;elements=[int]$m.mesh_element_count;refinement_point_count=$pointCount;generation_walltime_s=[math]::Round($sw.Elapsed.TotalSeconds,3)}
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 2
          }
          $base=$summary|Where-Object name -eq 'baseline'
          foreach($a in $summary|Where-Object name -ne 'baseline'){if($a.elements -le $base.elements){throw "$($a.name) did not refine baseline"}; if($a.elements -ge 3497){throw "$($a.name) exceeded global-25 element budget: $($a.elements)"}}
          @{schema='astermax.c8.87.mesh-family.v1';commit='${{ github.sha }}';levels=$summary;source_hotspot_workflow=34042958847;source_roi_count=3;consumer_multi_roi_refinement_verified=$true;native_femeshrefinement_binding_verified=$false;industrial_validation=$false;ansys_equivalence=$false}|ConvertTo-Json -Depth 8|Set-Content artifact/c8-87/C8.87_MESH_FAMILY.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: C8.87-Adaptive-Pareto-Meshes-${{ github.sha }}
          path: artifact/c8-87/**
          if-no-files-found: warn
          retention-days: 14

  solve-and-qualify:
    needs: generate-family
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: C8.87-Adaptive-Pareto-Meshes-${{ github.sha }}
          path: artifact/c8-87
      - name: Download exact admitted global-25 reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/c8-83-ref
          gh run download 34033613470 --repo '${{ github.repository }}' --name 'AsterMax-C8.83-Distributed-Traction-Convergence-86302f91a4974eb1ae8b5a813d144c845589707c' --dir artifact/c8-83-ref
          test -s artifact/c8-83-ref/C8.83_CONVERGENCE_QUALIFICATION.json
      - name: Apply audited +1000 N traction to all cases
        shell: bash
        run: |
          set -euo pipefail
          for level in baseline adaptive-h18 adaptive-h16 adaptive-h14 adaptive-h12; do
            python integrations/prepomax-codeaster/tools/c8_83_surface_traction_contract.py "artifact/c8-87/$level/study" --resultant-n 1000 --evidence "artifact/c8-87/$level/C8.87_SURFACE_TRACTION.json"
          done
      - name: Solve Pareto family with Code_Aster 17.4.0
        shell: bash
        run: |
          set -euo pipefail
          docker pull simvia/code_aster:17.4.0
          for level in baseline adaptive-h18 adaptive-h16 adaptive-h14 adaptive-h12; do
            d="artifact/c8-87/$level/study"; chmod -R a+rwX "$d"
            docker run --rm -v "$PWD/$d:/home/user/data" -w /home/user/data simvia/code_aster:17.4.0 bash -i -c 'run_aster astermax_c862_static.export' | tee "artifact/c8-87/$level/C8.87_CODE_ASTER_STDOUT.log"
            test -s "$d/astermax_c862_static.resu"; test -s "$d/astermax_c862_static.rmed"
          done
      - name: Independent dual-metric Pareto gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile integrations/prepomax-codeaster/tools/c8_87_compare_pareto.py
          python integrations/prepomax-codeaster/tools/c8_87_compare_pareto.py artifact/c8-87 artifact/c8-83-ref | tee artifact/c8-87/C8.87_ANALYSIS_STDOUT.log
          test -s artifact/c8-87/C8.87_PARETO_QUALIFICATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.87-Adaptive-Pareto-${{ github.sha }}
          path: artifact/c8-87/**
          if-no-files-found: warn
          retention-days: 14
