name: AsterMax C9.88 Native FeModel Production Serializer
on:
  push:
    branches: [ main ]
    paths:
      - 'native-windows/Serialize-AsterMaxFeModelContract.ps1'
      - 'native-windows/Export-AsterMaxCodeAster.ps1'
      - 'native-windows/c987-production-exporter/**'
      - 'native-windows/c988-native-femodel-harness/**'
      - 'native-windows/patch-c976-automatic-model-fingerprint.ps1'
      - '.github/workflows/astermax-c988-native-femodel-serializer.yml'
  workflow_dispatch:

jobs:
  native-femodel-production-gate:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Apply AsterMax native patches
        shell: pwsh
        run: |
          .\native-windows\patch-astermax.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-branding.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c965-results-workspace.ps1 -Root "$PWD\upstream"
          .\native-windows\patch-c976-automatic-model-fingerprint.ps1 -Root "$PWD\upstream"
      - name: Restore packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Build AsterMax Windows x64
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Build live FeModel and serialize production contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; New-Item -ItemType Directory -Force artifact | Out-Null
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe'|Where-Object{$_.FullName -match 'bin\\x64\\Release'}|Select-Object -First 1
          if(-not $exe){throw 'AsterMax Mechanical.exe missing'}
          $root=(Resolve-Path .\upstream).Path;$bin=$exe.Directory.FullName;[Environment]::CurrentDirectory=$bin;$global:r=$root;$global:b=$bin
          [AppDomain]::CurrentDomain.add_AssemblyResolve({param($s,$a);$d=([Reflection.AssemblyName]$a.Name).Name+'.dll';$p=Join-Path $global:b $d;if(Test-Path $p){return [Reflection.Assembly]::LoadFrom($p)};$c=Get-ChildItem $global:r -Recurse -Filter $d -ErrorAction SilentlyContinue|Where-Object{$_.FullName -match 'bin\\(x64\\)?Release|packages'}|Select-Object -First 1;if($c){return [Reflection.Assembly]::LoadFrom($c.FullName)};return $null})
          $asm=[Reflection.Assembly]::LoadFrom($exe.FullName)
          $cmPath=(Get-ChildItem $root -Recurse -Filter 'CaeModel.dll'|Where-Object{$_.FullName -match 'bin\\x64\\Release'}|Select-Object -First 1).FullName
          $meshPath=(Get-ChildItem $root -Recurse -Filter 'CaeMesh.dll'|Where-Object{$_.FullName -match 'bin\\x64\\Release'}|Select-Object -First 1).FullName
          $cgPath=(Get-ChildItem $root -Recurse -Filter 'CaeGlobals.dll'|Where-Object{$_.FullName -match 'bin\\x64\\Release'}|Select-Object -First 1).FullName
          [Reflection.Assembly]::LoadFrom($cmPath)|Out-Null;[Reflection.Assembly]::LoadFrom($meshPath)|Out-Null;[Reflection.Assembly]::LoadFrom($cgPath)|Out-Null
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe';if(-not(Test-Path $csc)){throw '64-bit .NET Framework csc.exe missing'}
          $factoryDll=(Join-Path (Resolve-Path artifact).Path 'C988NativeModelFactory.dll')
          & $csc '/nologo' '/target:library' "/out:$factoryDll" "/reference:$cmPath" "/reference:$meshPath" "/reference:$cgPath" '.\native-windows\c988-native-femodel-harness\C988NativeModelFactory.cs'
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $factoryDll)){throw "C9.88 typed harness compile failed: $LASTEXITCODE"}
          [Reflection.Assembly]::LoadFrom($factoryDll)|Out-Null
          $model=[AsterMax.Harness.C988NativeModelFactory]::Build()
          $fpType=$asm.GetType('PrePoMax.AsterMaxModelFingerprint',$true);$extract=$fpType.GetMethod('Extract',[Reflection.BindingFlags]'Public,Static');$fpBefore=[string]$fpType.GetProperty('Sha256').GetValue($extract.Invoke($null,@($model)))
          . .\native-windows\Serialize-AsterMaxFeModelContract.ps1
          $contract=Export-AsterMaxFeModelContract -Model $model -OutPath artifact\c988.model.json
          $fpAfter=[string]$fpType.GetProperty('Sha256').GetValue($extract.Invoke($null,@($model)))
          if($fpBefore -ne $fpAfter){throw 'C9.88 serializer mutated the live FeModel'}
          if($contract.source.kind -ne 'compiled_native_femodel'){throw 'Native source provenance missing'}
          if($contract.mesh.nodes.Count -ne 8 -or $contract.mesh.elements.Count -ne 1){throw 'Native mesh serialization mismatch'}
          if($contract.materials[0].young_modulus_mpa -ne 210000.0 -or $contract.materials[0].poisson -ne 0.3){throw 'Native material serialization mismatch'}
          [ordered]@{fingerprint_before=$fpBefore;fingerprint_after=$fpAfter;serializer_non_mutating=($fpBefore -eq $fpAfter);native_source=$contract.source.kind;upstream_prepomax='3669e65581650e5d9d868aa761db9efd856f8571';elastic_api='Elastic(double[][])';harness_binding='strongly_typed_csharp_factory';harness_compiler='.NET Framework 4.x csc x64';powershell_reflection_for_model_construction=$false}|ConvertTo-Json|Set-Content artifact\native-serializer-evidence.json -Encoding UTF8
      - name: Run production Code_Aster exporter
        shell: pwsh
        run: .\native-windows\Export-AsterMaxCodeAster.ps1 -ModelPath artifact\c988.model.json -OutDir artifact\deck
      - name: Independent semantic solve gate
        shell: pwsh
        run: python .\native-windows\c987-production-exporter\audit_c987.py --model artifact\c988.model.json --mail artifact\deck\c988.mail --comm artifact\deck\c988.comm --adapter artifact\deck\c988.adapter.json --out artifact\C9.88_SEMANTIC_GATE.json
      - name: Declare pre-solve gate state
        shell: pwsh
        run: |
          $audit=Get-Content artifact\C9.88_SEMANTIC_GATE.json -Raw|ConvertFrom-Json
          if(-not $audit.pass){throw 'Semantic gate did not pass; Solve must remain blocked'}
          $e=Get-Content artifact\native-serializer-evidence.json -Raw|ConvertFrom-Json
          if(-not $e.serializer_non_mutating){throw 'Serializer mutation detected; Solve must remain blocked'}
          [ordered]@{release='C9.88.4';model_fidelity='VERIFIED';production_serializer='VERIFIED';solver_input='VERIFIED';solve_authorization='READY';solver_execution='NOT_RUN';fea_values_invented=$false;ansys_equivalence='NOT_PROVEN';truth_boundary='READY means the validated deck may proceed to Code_Aster; this workflow does not claim a solver result.'}|ConvertTo-Json|Set-Content artifact\C9.88_VALIDATION.json -Encoding UTF8
      - name: Reject stale native FeModel after serialization
        shell: pwsh
        run: |
          $j=Get-Content artifact\c988.model.json -Raw|ConvertFrom-Json
          $j.loads[0].fy_total_n=-99.0
          $j|ConvertTo-Json -Depth 14|Set-Content artifact\tampered-native-contract.json -Encoding UTF8
          python .\native-windows\c987-production-exporter\audit_c987.py --model artifact\tampered-native-contract.json --mail artifact\deck\c988.mail --comm artifact\deck\c988.comm --adapter artifact\deck\c988.adapter.json --out artifact\C9.88_STALE_CONTRACT.json
          if($LASTEXITCODE -eq 0){throw 'Stale/tampered native contract was incorrectly accepted'}
          exit 0
      - name: Package evidence
        if: always()
        shell: pwsh
        run: Get-ChildItem artifact -Recurse -File|Get-FileHash -Algorithm SHA256|Format-Table -AutoSize|Out-String|Set-Content artifact\SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C9.88-Native-FeModel-Production-Gate
          path: artifact
          if-no-files-found: error
