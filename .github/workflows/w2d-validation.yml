name: W2D Geometry Preparation Validation

on:
  push:
    branches:
      - "validation/W2D-gap-geometry"
  workflow_dispatch:

jobs:
  validate-w2d:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Fetch frozen W2C baseline
        run: git fetch origin work/W2C-hub-sprocket-baseline:refs/remotes/origin/work/W2C-hub-sprocket-baseline

      - name: Validate W2D WorkPackage contract
        run: astermax-harness validate harness/workpackages/W2D_gap_geometry.yaml

      - name: Verify exact W2D scope budget against W2C
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from astermax.harness.policy import evaluate_scope
          from astermax.harness.runner import get_changed_files, load_workpackage

          package, _ = load_workpackage('harness/workpackages/W2D_gap_geometry.yaml')
          files = get_changed_files(Path('.').resolve(), 'origin/work/W2C-hub-sprocket-baseline')
          validation_only = '.github/workflows/w2d-validation.yml'

          if validation_only not in files:
              raise SystemExit('Expected validation-only workflow is absent from validation branch diff.')
          unexpected = sorted(
              path for path in files
              if path != validation_only and path not in package.allowed_files
          )
          if unexpected:
              raise SystemExit(f'Unexpected out-of-WorkPackage files before scope evaluation: {unexpected}')
          candidate_files = [path for path in files if path != validation_only]
          if sorted(candidate_files) != sorted(package.allowed_files):
              raise SystemExit(
                  'Validation branch candidate diff must exactly equal the frozen W2D allowlist; '
                  f'candidate={sorted(candidate_files)}, allowed={sorted(package.allowed_files)}'
              )
          print(f'VALIDATION_ONLY_EXCLUSION={validation_only}')
          print(f'W2D_CANDIDATE_CHANGED_FILES={candidate_files}')
          result = evaluate_scope(package, candidate_files)
          print(result.model_dump_json(indent=2))
          raise SystemExit(0 if result.status.value == 'PASS' else 1)
          '@ | python -

      - name: Run W2D adversarial tests
        run: python -m pytest -q tests/test_gap_geometry.py

      - name: Run all non-numerical software tests
        run: python -m pytest -q --ignore=tests/benchmarks

      - name: Run coding harness tests
        run: python -m pytest -q tests/test_coding_harness.py

      - name: Run frontier methodology tests
        run: python -m pytest -q tests/test_frontier_methodology.py

      - name: Run frozen frontier validity suite
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from astermax.harness.evals import run_frozen_eval_suite
          result = run_frozen_eval_suite(Path('.').resolve(), Path('harness/evals/frontier.v1.yaml'), 'frontier_validity')
          print(result.model_dump_json(indent=2))
          raise SystemExit(0 if result.status.value == 'PASS' else 1)
          '@ | python -

      - name: Compile source tree
        run: python -m compileall -q src

      - name: Record evidence boundary
        shell: pwsh
        run: |
          Write-Host "W2D validates local CAD intake contracts and GAP scenario semantics only."
          Write-Host "No confidential CAD bytes, mesh, interface selection, solver job or OT1613 numerical PASS is produced here."
