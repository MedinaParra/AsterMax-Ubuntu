name: AsterMax C9.62 Real Code_Aster Solver

on:
  push:
    branches: [ main ]
    paths:
      - 'native-windows/c958-benchmark/**'
      - 'native-windows/validate-c962-solver.py'
      - '.github/workflows/astermax-c962-real-solver.yml'
  workflow_dispatch:

jobs:
  real-code-aster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout AsterMax
        uses: actions/checkout@v4

      - name: Prepare deterministic benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p c962-work
          chmod -R 0777 c962-work
          cp native-windows/c958-benchmark/axial-bar.comm c962-work/
          cp native-windows/c958-benchmark/axial-bar.mail c962-work/
          cp native-windows/c958-benchmark/axial-bar.export c962-work/
          cp native-windows/validate-c962-solver.py c962-work/
          sha256sum c962-work/axial-bar.* | tee c962-work/INPUT_SHA256.txt

      - name: Pull real Code_Aster solver image
        shell: bash
        run: |
          set -euxo pipefail
          docker pull scimulate/code_aster:15.2
          docker image inspect scimulate/code_aster:15.2 --format '{{json .RepoDigests}}' | tee c962-work/CODE_ASTER_IMAGE_DIGEST.txt

      - name: Execute Code_Aster benchmark
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            --volume "$PWD/c962-work:/analysis" \
            scimulate/code_aster:15.2 \
            /opt/aster/bin/as_run /analysis/axial-bar.export | tee c962-work/CODE_ASTER_STDOUT.log
          ls -lah c962-work

      - name: Validate real numerical evidence
        shell: bash
        run: |
          set -euxo pipefail
          python3 c962-work/validate-c962-solver.py c962-work
          sha256sum c962-work/axial-bar.resu c962-work/axial-bar.mess c962-work/axial-bar.rmed | tee c962-work/OUTPUT_SHA256.txt

      - name: Package solver evidence
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          cp -a c962-work/. artifact/
          cat > artifact/C9.62_STATUS.md <<'EOF'
          # AsterMax C9.62 — Real Code_Aster solver gate

          This artifact is generated from an actual Code_Aster container execution attempt.
          The analytical 1D axial-bar value is a reference only and is never presented as FEA output.
          `C9.62_SOLVER_VALIDATION.json`, when present, is the authoritative numerical pass/fail manifest.
          EOF

      - name: Upload C9.62 solver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C9.62-Real-CodeAster-Solver-Evidence
          path: artifact
          if-no-files-found: error
