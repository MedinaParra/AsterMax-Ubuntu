name: W2C Validation Harness

on:
  push:
    branches:
      - "validation/W2C-harness"
  workflow_dispatch:

jobs:
  validate-w2c:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Fetch frozen W2B baseline
        run: git fetch origin work/W2B-authentic-results:refs/remotes/origin/work/W2B-authentic-results

      - name: Validate W2C WorkPackage contract
        run: astermax-harness validate harness/workpackages/W2C_hub_sprocket_baseline.yaml

      - name: Verify W2C scope budget against W2B
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from astermax.harness.policy import evaluate_scope
          from astermax.harness.runner import get_changed_files, load_workpackage
          package, _ = load_workpackage('harness/workpackages/W2C_hub_sprocket_baseline.yaml')
          files = get_changed_files(Path('.').resolve(), 'origin/work/W2B-authentic-results')
          result = evaluate_scope(package, files)
          print(result.model_dump_json(indent=2))
          raise SystemExit(0 if result.status.value == 'PASS' else 1)
          '@ | python -

      - name: Run W2C adversarial tests
        run: python -m pytest -q tests/test_hub_sprocket_baseline.py

      - name: Run all non-numerical software tests
        run: python -m pytest -q --ignore=tests/benchmarks

      - name: Run coding harness tests
        run: python -m pytest -q tests/test_coding_harness.py

      - name: Run frontier methodology tests
        run: python -m pytest -q tests/test_frontier_methodology.py

      - name: Run frozen frontier validity suite
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from astermax.harness.evals import run_frozen_eval_suite
          result = run_frozen_eval_suite(Path('.').resolve(), Path('harness/evals/frontier.v1.yaml'), 'frontier_validity')
          print(result.model_dump_json(indent=2))
          raise SystemExit(0 if result.status.value == 'PASS' else 1)
          '@ | python -

      - name: Compile source tree
        run: python -m compileall -q src

      - name: Record numerical ownership boundary
        shell: pwsh
        run: |
          Write-Host "W2C numerical_impact=false: Code_Aster benchmark is not executed by this validation branch."
          Write-Host "Numerical benchmark ownership remains fail-closed under issue #36; no numerical PASS is claimed here."
