name: Windows CAD Face Picker

on:
  push:
    branches:
      - agent/windows-face-picker-v0.5
  pull_request:
    branches:
      - agent/astermax-project-v0.4

jobs:
  verify-face-picker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PMV
        run: python -m pip install -e .[test]
      - name: Run deterministic regression harness
        run: python -m pytest -q
      - name: Verify CAD face picker roundtrip
        run: python benchmarks/cad_face_picker_roundtrip.py
      - name: Upload face picker evidence
        uses: actions/upload-artifact@v4
        with:
          name: cad-face-picker-windows
          path: |
            cad_face_picker_gate.json
            cad_face_picker_gate/astermax_face_picker.html
            cad_face_picker_gate/picker_fixture.astermax
            cad_face_picker_gate/results/astermax_project_run.json
          if-no-files-found: error
