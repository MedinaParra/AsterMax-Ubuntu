name: Windows C8.20 Genuine Solve Launch Gate

on:
  push:
    branches: [agent/c8-20-first-genuine-solve-launch-gate]
    paths:
      - 'src/astermax/code_aster_genuine_bundle.py'
      - 'src/astermax/code_aster_result_contract.py'
      - 'src/astermax/code_aster_reference_run.py'
      - 'src/astermax/professional_evidence_bundle.py'
      - 'tests/test_c8_20_genuine_bundle_launch_gate.py'
      - '.github/workflows/windows-c8-20-genuine-solve-launch-gate.yml'
  pull_request:
    branches: [agent/c8-19-mesh-provenance-evidence-bundle]
    paths:
      - 'src/astermax/code_aster_genuine_bundle.py'
      - 'src/astermax/code_aster_result_contract.py'
      - 'src/astermax/code_aster_reference_run.py'
      - 'src/astermax/professional_evidence_bundle.py'
      - 'tests/test_c8_20_genuine_bundle_launch_gate.py'
      - '.github/workflows/windows-c8-20-genuine-solve-launch-gate.yml'
  workflow_dispatch:
    inputs:
      distribution:
        description: WSL2 distribution containing Code_Aster
        required: true
        default: Ubuntu-24.04
      run_aster_linux:
        description: Absolute Linux path to run_aster
        required: true
        default: /opt/aster/bin/run_aster
      config_linux:
        description: Absolute Linux path to Code_Aster config.yaml
        required: true
        default: /opt/aster/etc/codeaster/config.yaml

concurrency:
  group: c8-20-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch-contract:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AsterMax harness
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Verify C8.20 preparation-to-solve contract
        shell: pwsh
        run: >-
          python -m pytest -q
          tests/test_c8_20_genuine_bundle_launch_gate.py
          tests/test_code_aster_result_contract.py
          tests/test_code_aster_reference_run.py
          tests/test_c8_18_mesh_chain_of_custody.py
          tests/test_c8_16_professional_evidence_bundle.py
      - name: Emit non-solve launch witness
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          witness = {
              'increment': 'C8.20',
              'generic_comm_to_genuine_result_contract_gap_closed': True,
              'reac_noda_extraction_bound': True,
              'displacement_table_bound': True,
              'reaction_table_bound': True,
              'stress_table_bound': True,
              'result_med_bound': True,
              'solver_message_bound': True,
              'cad_length_unit': 'mm',
              'solver_unit_system': 'mm-N-MPa',
              'real_runtime_attested': False,
              'fea_solve_executed': False,
              'numerical_verification': False,
              'results_verified': False,
              'industrial_validation': False,
              'ansys_equivalence': False,
          }
          Path('c8-20-launch-witness.json').write_text(json.dumps(witness, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps(witness, indent=2, sort_keys=True))
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.20-genuine-solve-launch-contract
          path: c8-20-launch-witness.json
          if-no-files-found: error

  genuine-code-aster-solve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, astermax-code-aster]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AsterMax
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Execute qualified genuine reference chain
        shell: pwsh
        env:
          ASTERMAX_DISTRO: ${{ inputs.distribution }}
          ASTERMAX_RUN_ASTER: ${{ inputs.run_aster_linux }}
          ASTERMAX_CONFIG: ${{ inputs.config_linux }}
        run: |
          @'
          import json
          import os
          from pathlib import Path
          from astermax.code_aster_genuine_bundle import prepare_genuine_reference_bundle
          from astermax.code_aster_reference_harness import UniaxialPrismSpec
          from astermax.code_aster_reference_run import execute_and_verify_reference_wsl, write_genuine_reference_solve_evidence
          from astermax.code_aster_runtime_qualification import qualify_wsl_code_aster_runtime, write_runtime_qualification
          from astermax.code_aster_wsl_runtime import CodeAsterWslRuntime
          from astermax.professional_evidence_bundle import create_professional_evidence_bundle

          root = Path('c8-20-genuine-case').resolve()
          root.mkdir(parents=True, exist_ok=True)
          spec = UniaxialPrismSpec()
          prepare_genuine_reference_bundle(spec, root)
          runtime = CodeAsterWslRuntime(os.environ['ASTERMAX_DISTRO'], os.environ['ASTERMAX_RUN_ASTER'])
          qualification = qualify_wsl_code_aster_runtime(runtime, config_linux=os.environ['ASTERMAX_CONFIG'])
          write_runtime_qualification(qualification, root / 'runtime_qualification.json')
          solved = execute_and_verify_reference_wsl(runtime, spec, root, qualification=qualification)
          assert solved.fea_solve_executed is True
          assert solved.numerical_verification is True
          assert solved.results_verified is True
          write_genuine_reference_solve_evidence(solved, root / 'genuine_solve_evidence.json')
          bundle = create_professional_evidence_bundle(root, solved, root / 'professional_evidence.json')
          assert bundle.industrial_validation is False
          assert bundle.ansys_equivalence is False
          print(json.dumps(solved.as_dict(), indent=2, sort_keys=True))
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.20-genuine-Code-Aster-evidence
          path: c8-20-genuine-case
          if-no-files-found: error
