name: C8.55 Surface Selection Face Resolver Windows

on:
  push:
    branches: [agent/c8-55-surface-selection-face-resolver]
  workflow_dispatch:

jobs:
  validate-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - name: Restore
        shell: pwsh
        run: nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Verify C8.55 surface-face contract
        shell: pwsh
        run: |
          $src=Get-Content 'build/PrePoMax-CodeAster/PrePoMax/AsterMaxAI/AsterMaxRegionBindingInspector.cs' -Raw
          foreach($token in @('SURFACE / FACE RESOLVER','ResolveSurface','Surfaces','ElementFaces','ElementSets','GetNodeIdsFromFaceName','SURFACE_FACE_NODE_MEAN','ORDERED_FACE_MEAN','FE_ANCHOR','SELECTION_GEOMETRY_ENCODING_NOT_QUALIFIED','No viewport projection or solver verification inferred')) {
            if($src -notmatch [regex]::Escape($token)){throw "Missing C8.55 token: $token"}
          }
          if($src -match 'solver_verified\s*=\s*true|entity_anchored_verified\s*=\s*true|viewport_projection_qualified\s*=\s*true'){throw 'C8.55 must not claim solver/entity/viewport verification.'}
          $surface=(Invoke-WebRequest -UseBasicParsing 'https://raw.githubusercontent.com/tsvilans/PrePoMax/3669e65581650e5d9d868aa761db9efd856f8571/CaeMesh/FeSurface.cs').Content
          $element=(Invoke-WebRequest -UseBasicParsing 'https://raw.githubusercontent.com/tsvilans/PrePoMax/3669e65581650e5d9d868aa761db9efd856f8571/CaeMesh/Elements/FeElement.cs').Content
          foreach($token in @('public Dictionary<FeFaceName, string> ElementFaces','public int[] FaceIds')){if($surface -notmatch [regex]::Escape($token)){throw "Pinned FeSurface contract moved: $token"}}
          foreach($token in @('abstract public int[] GetNodeIdsFromFaceName(FeFaceName faceName)','public int[] NodeIds')){if($element -notmatch [regex]::Escape($token)){throw "Pinned FeElement contract moved: $token"}}
      - name: Launch and capture native GUI
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class NativeWin55 {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int nCmdShow);
          }
          "@
          New-Item -ItemType Directory -Force artifact | Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(30)
          do{Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw 'GUI exited early'}}while($p.MainWindowHandle -eq 0 -and (Get-Date)-lt $deadline)
          if($p.MainWindowHandle -eq 0){throw 'No native window'}
          if($p.MainWindowTitle -notmatch '^AsterMax Mechanical'){throw "Unexpected title: $($p.MainWindowTitle)"}
          [NativeWin55]::ShowWindow($p.MainWindowHandle,3)|Out-Null
          [NativeWin55]::SetForegroundWindow($p.MainWindowHandle)|Out-Null
          Start-Sleep -Seconds 3
          $r=New-Object NativeWin55+RECT; [NativeWin55]::GetWindowRect($p.MainWindowHandle,[ref]$r)|Out-Null
          $w=$r.Right-$r.Left; $h=$r.Bottom-$r.Top
          if($w -lt 900 -or $h -lt 650){throw "Native window below evidence threshold: ${w}x${h}"}
          $bmp=New-Object Drawing.Bitmap $w,$h; $g=[Drawing.Graphics]::FromImage($bmp)
          try{$g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)}finally{$g.Dispose()}
          $png='artifact/C8.55_SURFACE_FACE_RESOLVER.png'; $bmp.Save((Join-Path $PWD $png),[Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          @{schema='astermax.surface-face-resolver.v1';title=$p.MainWindowTitle;width=$w;height=$h;screenshot_sha256=(Get-FileHash $png -Algorithm SHA256).Hash.ToLowerInvariant();surface_name_to_element_faces=$true;face_node_anchor_resolver=$true;ordered_face_normal_resolver=$true;surface_geometric_centroid_exact=$false;selection_geometry_mapping_qualified=$false;viewport_projection_qualified=$false;entity_anchored_verified=$false;solver_verified=$false;industrial_validation=$false;ansys_equivalence=$false;commit='${{ github.sha }}'}|ConvertTo-Json|Set-Content -Encoding UTF8 artifact/C8.55_EVIDENCE.json
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C8.55-Surface-Face-Resolver-${{ github.sha }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
