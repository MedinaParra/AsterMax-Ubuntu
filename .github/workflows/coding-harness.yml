name: Coding Harness

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "pmv/**"

jobs:
  harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate W2 WorkPackage
        run: astermax-harness validate harness/workpackages/W2_solver_bridge.yaml
      - name: Run harness tests
        run: python -m pytest -q tests/test_coding_harness.py
      - name: Compile source tree
        run: python -m compileall -q src
