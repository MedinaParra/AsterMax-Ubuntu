name: C8.65 Product-native Reaction Equilibrium

on:
  push:
    branches: [agent/c8-65-native-reaction-product]
  workflow_dispatch:

concurrency:
  group: c8-65-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-windows-study:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bootstrap pinned AsterMax tree
        shell: pwsh
        run: python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
      - uses: microsoft/setup-msbuild@v2
      - name: Restore and build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
      - name: Fetch pinned CAD runtime and STEP/mm fixture
        shell: pwsh
        run: |
          $runtimeZip='build/PrePoMax-v1.4.0-portable.zip'
          $runtimeExtract='build/PrePoMax-v1.4.0-portable'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $runtimeZip 'https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Expand-Archive -Path $runtimeZip -DestinationPath $runtimeExtract -Force
          $netgen=Get-ChildItem -Path $runtimeExtract -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $netgen){throw 'Portable runtime missing NetGenMesher.exe'}
          $release=(Get-Item 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release').FullName
          $runtimeRoot=$netgen.Directory.Parent.FullName
          foreach($folder in @('NetGen','Solver','Models','Temp')){ $source=Join-Path $runtimeRoot $folder; if(Test-Path $source){Copy-Item -Path $source -Destination $release -Recurse -Force} }
          $fixture='build/AsterMax_C8.65_Box_mm.step'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $fixture 'https://raw.githubusercontent.com/facebookresearch/project_superdex/9b59be6f5279936d15322f02bd04c631c7249cb4/assets/prefabs/box_and_blocks/cad/box.step'
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $raw=Get-Content $fixture -Raw
          if($raw -notmatch [regex]::Escape('.MILLI., .METRE.')){throw 'STEP fixture no longer declares SI millimetres.'}
          "ASTERMAX_STEP_FIXTURE=$((Resolve-Path $fixture).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate product-native reaction study
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/C8.65_study | Out-Null
          $env:ASTERMAX_STEP_MESH_FIXTURE='1'
          $env:ASTERMAX_STEP_MESH_PATH=$env:ASTERMAX_STEP_FIXTURE
          $env:ASTERMAX_STEP_MESH_EVIDENCE_PATH=(Join-Path $PWD 'artifact/C8.65_STEP_NETGEN_RUNTIME.json')
          $env:ASTERMAX_STRUCTURAL_SETUP_FIXTURE='1'
          $env:ASTERMAX_STRUCTURAL_SETUP_EVIDENCE_PATH=(Join-Path $PWD 'artifact/C8.65_STRUCTURAL_SETUP_RUNTIME.json')
          $env:ASTERMAX_CODEASTER_GENERATION_FIXTURE='1'
          $env:ASTERMAX_CODEASTER_GENERATION_EVIDENCE_PATH=(Join-Path $PWD 'artifact/C8.65_CODEASTER_GENERATION_RUNTIME.json')
          $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR=(Join-Path $PWD 'artifact/C8.65_study')
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $deadline=(Get-Date).AddSeconds(35)
          do{Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw "GUI exited early: $($p.ExitCode)"}}while($p.MainWindowHandle -eq 0 -and (Get-Date)-lt $deadline)
          if($p.MainWindowHandle -eq 0){throw 'No native AsterMax window'}
          if($p.MainWindowTitle -notmatch '^AsterMax Mechanical'){throw "Unexpected title: $($p.MainWindowTitle)"}
          $meshEv=$env:ASTERMAX_STEP_MESH_EVIDENCE_PATH; $setupEv=$env:ASTERMAX_STRUCTURAL_SETUP_EVIDENCE_PATH; $genEv=$env:ASTERMAX_CODEASTER_GENERATION_EVIDENCE_PATH
          $proofDeadline=(Get-Date).AddSeconds(240)
          while(((-not(Test-Path $meshEv))-or(-not(Test-Path $setupEv))-or(-not(Test-Path $genEv))) -and (Get-Date)-lt $proofDeadline){Start-Sleep -Milliseconds 500;$p.Refresh();if($p.HasExited){throw 'GUI exited during study generation'}}
          foreach($ev in @($meshEv,$setupEv,$genEv)){if(-not(Test-Path $ev)){throw "Missing runtime evidence: $ev"}}
          $m=Get-Content $meshEv -Raw|ConvertFrom-Json; $s=Get-Content $setupEv -Raw|ConvertFrom-Json; $g=Get-Content $genEv -Raw|ConvertFrom-Json
          if(-not $m.step_to_netgen_mesh_qualified){throw "STEP/mesh gate failed: $($m.error)"}
          if(-not $s.structural_setup_qualified -or -not $s.mm_n_mpa_unit_lock){throw "Structural setup gate failed: $($s.error)"}
          if(-not $g.unit_pmx_codeaster_generation_qualified){throw "Code_Aster generation gate failed: $($g.error)"}
          $comm=Join-Path $env:ASTERMAX_CODEASTER_GENERATION_WORKDIR 'astermax_c862_static.comm'
          if(-not(Test-Path $comm)){throw 'Missing generated .comm'}
          $txt=Get-Content $comm -Raw
          if($txt -notmatch [regex]::Escape("FORCE=('REAC_NODA',)")){throw 'Product translator did not request REAC_NODA.'}
          if(([regex]::Matches($txt,[regex]::Escape("TITRE='PPM_REACTION'"))).Count -ne 1){throw 'Product translator must emit exactly one PPM_REACTION table.'}
          if(([regex]::Matches($txt,[regex]::Escape("TITRE='PPM_DEPL'"))).Count -ne 1){throw 'Expected exactly one PPM_DEPL table.'}
          @{schema='astermax.c8.65.windows-product-native-reaction.v1';commit='${{ github.sha }}';step_mesh_qualified=$true;structural_setup_qualified=$true;mm_n_mpa_unit_lock=$true;codeaster_generation_qualified=$true;reaction_requested_by_product=$true;reaction_table_emitted_by_product=$true;harness_postprocess_augmentation=$false;source_comm_sha256=(Get-FileHash $comm -Algorithm SHA256).Hash.ToLowerInvariant();solver_executed=$false;solver_verified=$false;industrial_validation=$false;ansys_equivalence=$false}|ConvertTo-Json -Depth 4|Set-Content -Encoding UTF8 artifact/C8.65_WINDOWS_PRODUCT_REACTION.json
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: C8.65-Windows-Generated-Study-${{ github.sha }}
          path: |
            artifact/C8.65_study/**
            artifact/C8.65_*RUNTIME.json
            artifact/C8.65_WINDOWS_PRODUCT_REACTION.json
          if-no-files-found: error
          retention-days: 14

  solve-product-study:
    needs: generate-windows-study
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: C8.65-Windows-Generated-Study-${{ github.sha }}
          path: artifact/input
      - name: Stage exact product-generated study without patching
        run: |
          set -euxo pipefail
          mkdir -p artifact/c8-65-solve
          cp artifact/input/C8.65_study/astermax_c862_static.{comm,mail,export} artifact/c8-65-solve/
          grep -F "FORCE=('REAC_NODA',)" artifact/c8-65-solve/astermax_c862_static.comm
          grep -F "TITRE='PPM_REACTION'" artifact/c8-65-solve/astermax_c862_static.comm
          test "$(grep -c "TITRE='PPM_REACTION'" artifact/c8-65-solve/astermax_c862_static.comm)" -eq 1
          sha256sum artifact/c8-65-solve/astermax_c862_static.{comm,mail,export} > artifact/c8-65-solve/PRE_SOLVE_SHA256SUMS.txt
      - name: Genuine Code_Aster 17.4.0 solve
        run: |
          set -euxo pipefail
          docker pull simvia/code_aster:17.4.0
          chmod -R a+rwX artifact/c8-65-solve
          docker run --rm -v "$PWD/artifact/c8-65-solve:/home/user/data" -w /home/user/data simvia/code_aster:17.4.0 bash -i -c 'run_aster astermax_c862_static.export' | tee artifact/c8-65-solve/CODE_ASTER_STDOUT.log
          test -s artifact/c8-65-solve/astermax_c862_static.mess
          test -s artifact/c8-65-solve/astermax_c862_static.rmed
          test -s artifact/c8-65-solve/astermax_c862_static.resu
      - name: Admit product-native numerical fields and equilibrium
        run: |
          python - <<'PY'
          import hashlib,json,math,pathlib,re
          root=pathlib.Path('artifact/c8-65-solve')
          comm=(root/'astermax_c862_static.comm').read_text(encoding='utf-8',errors='replace')
          mess=(root/'astermax_c862_static.mess').read_text(encoding='utf-8',errors='replace')
          lines=(root/'astermax_c862_static.resu').read_text(encoding='utf-8',errors='replace').splitlines()
          if re.search(r'<F>|ERREUR FATALE|FATAL_ERROR|EXECUTION_CODE_ASTER.*FAILED',mess,re.I): raise SystemExit('Fatal solver marker found.')
          if not re.search(r'DIAGNOSTIC JOB\s*:\s*OK|Code_Aster MPI exits normally|TOTAL_JOB',mess,re.I): raise SystemExit('No positive solver completion marker.')
          def split(line): return [x.strip().lstrip('#').strip() for x in line.split(';')]
          def parse(title, cols):
              hits=[i for i,l in enumerate(lines) if title in l]
              if len(hits)!=1: raise SystemExit(f'{title}: expected one title, got {len(hits)}')
              start=hits[0]; hdr=None; hidx=None
              for i in range(start+1,min(len(lines),start+100)):
                  t=split(lines[i])
                  if 'NOEUD' in t and all(c in t for c in cols): hdr=t; hidx=i; break
              if hdr is None: raise SystemExit(f'{title}: header not found')
              idx={c:hdr.index(c) for c in ['NOEUD']+cols}; out=[]
              for line in lines[hidx+1:]:
                  raw=line.strip()
                  if not raw:
                      if out: break
                      continue
                  if 'PPM_' in raw and out: break
                  t=split(line)
                  if len(t)<=max(idx.values()): continue
                  m=re.fullmatch(r'[Nn]?(\d+)',t[idx['NOEUD']])
                  if not m:
                      if out and raw.startswith('#'): break
                      continue
                  vals=[float(t[idx[c]].replace('D','E')) for c in cols]
                  if not all(math.isfinite(x) for x in vals): raise SystemExit(f'{title}: non-finite value')
                  out.append((int(m.group(1)),vals))
              if not out: raise SystemExit(f'{title}: no rows')
              return out
          depl=parse('PPM_DEPL',['DX','DY','DZ'])
          sig_n=parse('PPM_STRESS_N',['SIXX','SIYY','SIZZ'])
          sig_s=parse('PPM_STRESS_S',['SIXY','SIYZ','SIXZ'])
          reac=parse('PPM_REACTION',['DX','DY','DZ'])
          if len(depl)!=len(sig_n) or len(depl)!=len(sig_s) or len(depl)!=len(reac): raise SystemExit('Product-native result coverage mismatch.')
          max_u=max((math.sqrt(sum(x*x for x in v)),n,v) for n,v in depl)
          smap={n:v for n,v in sig_s}; max_vm=(-1.0,None)
          for n,(sxx,syy,szz) in sig_n:
              sxy,syz,sxz=smap[n]
              vm=math.sqrt(0.5*((sxx-syy)**2+(syy-szz)**2+(szz-sxx)**2)+3*(sxy*sxy+syz*syz+sxz*sxz))
              if vm>max_vm[0]: max_vm=(vm,n)
          lm=re.search(r'FORCE_NODALE=.*?FX=([+-]?[0-9.eEdD+-]+)',comm,re.S)
          if not lm: raise SystemExit('Applied Fx not found.')
          fx=float(lm.group(1).replace('D','E'))
          rx=sum(v[0] for _,v in reac); ry=sum(v[1] for _,v in reac); rz=sum(v[2] for _,v in reac)
          rel=abs(rx+fx)/abs(fx); transverse=max(abs(ry),abs(rz))/abs(fx); tol=0.005
          if rel>tol or transverse>tol: raise SystemExit(f'Equilibrium failed: Fx={fx}, R=({rx},{ry},{rz}), rel={rel}')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          ev={'schema':'astermax.c8.65.product-native-reaction.v1','solver':'Code_Aster 17.4.0','unit_system':'mm-N-MPa','reaction_requested_by_product':True,'reaction_table_emitted_by_product':True,'harness_postprocess_augmentation':False,'solver_executed':True,'solver_verified':True,'result_field_values_verified':True,'reaction_equilibrium_verified':True,'node_count':len(depl),'reaction_node_count':len(reac),'max_displacement_mm':max_u[0],'max_displacement_node':max_u[1],'max_von_mises_mpa':max_vm[0],'max_von_mises_node':max_vm[1],'applied_fx_n':fx,'reaction_sum_n':[rx,ry,rz],'reaction_equilibrium_relative_error_x':rel,'reaction_transverse_relative':transverse,'reaction_equilibrium_tolerance':tol,'mess_sha256':sha(root/'astermax_c862_static.mess'),'resu_sha256':sha(root/'astermax_c862_static.resu'),'rmed_sha256':sha(root/'astermax_c862_static.rmed'),'industrial_validation':False,'ansys_equivalence':False}
          (root/'C8.65_PRODUCT_NATIVE_REACTION_EVIDENCE.json').write_text(json.dumps(ev,indent=2),encoding='utf-8')
          print(json.dumps(ev,indent=2))
          PY
      - name: Hash complete evidence
        run: sha256sum artifact/c8-65-solve/* > artifact/c8-65-solve/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.65-Product-Native-Reaction-${{ github.sha }}
          path: artifact/c8-65-solve/**
          if-no-files-found: warn
          retention-days: 14
