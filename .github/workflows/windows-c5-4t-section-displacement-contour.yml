name: Windows C5.4t Section Displacement Contour

on:
  pull_request:
  workflow_dispatch:

jobs:
  section-displacement-contour:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/results_section_displacement.py src/astermax/fea/section_displacement_field.py src/astermax/fea/results_quadratic_section.py
      - name: C5.4t contour and probe harness
        run: python -m pytest -q tests/test_results_section_displacement.py
      - name: Section displacement regression
        run: python -m pytest -q tests/test_section_displacement_field.py tests/test_results_quadratic_section.py tests/test_section_polyline_assembly.py tests/test_adaptive_tet10_section.py
      - name: Results regression
        run: python -m pytest -q tests/test_results_section_instrument.py tests/test_results_section_view.py tests/test_results_workspace_ui.py tests/test_results_workspace.py tests/test_production_results.py
      - name: Full regression suite
        run: python -m pytest -q
