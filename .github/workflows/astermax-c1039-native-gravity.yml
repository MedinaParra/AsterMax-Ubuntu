name: AsterMax C10.39 Native Gravity + Directional BC + Coulomb

on:
  push:
    branches:
      - agent/c1039-native-gravity
  pull_request:
    branches:
      - agent/c1038-native-directional-bc
  workflow_dispatch:

jobs:
  windows-build-and-export:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AsterMax C10.39
        uses: actions/checkout@v4

      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v4
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Validate and apply complete patch chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .\native-windows\validate-patch-chain.py
          if($LASTEXITCODE -ne 0){ throw 'Patch-chain validation failed.' }
          $chain=Get-Content .\native-windows\patch-chain.json -Raw | ConvertFrom-Json
          foreach($p in $chain.patches){
            $script=Join-Path .\native-windows $p.file
            if(-not(Test-Path $script)){ throw "Missing patch: $($p.file)" }
            Write-Host "APPLY $($p.id)"
            & $script -Root "$PWD\upstream"
            if(-not $?){ throw "Patch failed: $($p.id)" }
          }

      - name: Setup Python and Gmsh
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check gmsh

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild C10.39 Windows x64 Release
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Locate executable and install materials library
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe was not produced.' }
          $bin=$exe.Directory.FullName
          $g=Get-Content .\upstream\PrePoMax\Globals.cs -Raw
          if(-not $g.Contains('AsterMax Mechanical C10.39')){ throw 'C10.39 title missing from compiled source.' }
          python .\native-windows\build-c1010-materials.py --out "$bin"
          if($LASTEXITCODE -ne 0){ throw 'materials.lib generation failed.' }
          "exe=$($exe.FullName)" | Out-File $env:GITHUB_OUTPUT -Append
          "bin=$bin" | Out-File $env:GITHUB_OUTPUT -Append

      - name: C10.39 source contact-export gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bridge=Get-Content .\upstream\PrePoMax\AsterMaxModelContractBridge.cs -Raw
          $exporter=Get-Content .\upstream\PrePoMax\AsterMaxCodeAsterNativeExporter.cs -Raw
          foreach($t in @('BuildCodeAsterContactSurface','codeaster_contact_contract_pass')){
            if(-not $bridge.Contains($t) -and -not (Get-Content .\upstream\PrePoMax\Forms\AsterMaxC1035Audit.cs -Raw).Contains($t)){ throw "Bridge/audit token missing: $t" }
          }
          foreach($t in @('friction_coefficient','COULOMB','DisplacementRotation','TranslationToken','GravityLoad','density_tonne_per_mm3','C10.39-native-gravity-v1')){ if(-not $bridge.Contains($t)){ throw "Bridge mechanics token missing: $t" } }
          foreach($t in @('C10.39-native-codeaster-gravity-v1','GROUP_MA NOM = AM_VOL','DEFI_CONTACT','STAT_NON_LINE','ORIE_PEAU_3D','contact_coulomb_coefficients','directional_support_count','PESANTEUR','RHO=','gravity_enabled')){
            if(-not $exporter.Contains($t)){ throw "Exporter token missing: $t" }
          }
          if($bridge.Contains('supports frictionless contact only')){ throw 'Legacy frictionless-only solve block remains.' }

      - name: Install pinned NetGen runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin='${{ steps.locate.outputs.bin }}'
          $url='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          $sha='954f406b65a08cb2fb47ef2fb02b03e4f70aa9c97e0979bd7048448273e17d46'
          Invoke-WebRequest $url -OutFile runtime.zip
          if((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha){ throw 'Pinned CAD runtime digest mismatch.' }
          Expand-Archive runtime.zip runtime -Force
          $ng=Get-ChildItem runtime -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $ng){ throw 'NetGenMesher.exe missing.' }
          Copy-Item $ng.Directory.FullName (Join-Path $bin 'NetGen') -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $bin 'Temp') | Out-Null

      - name: Run real STEP mesh + automatic contact + solver-contract audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & .\native-windows\smoke-c1035-defaults.ps1 -Dist '${{ steps.locate.outputs.bin }}'
          if($LASTEXITCODE -ne 0){ throw 'C10.39 inherited two-body runtime audit failed.' }
          $report=Get-Content '${{ steps.locate.outputs.bin }}\Audit\C10.35-runtime\defaults-autocontact-report.json' -Raw | ConvertFrom-Json
          if(-not $report.pass -or -not $report.codeaster_contact_contract_pass -or -not $report.codeaster_coulomb_contract_pass){ throw 'Real Coulomb contact contract gate failed.' }
          if(-not $report.codeaster_directional_bc_contract_pass -or -not $report.codeaster_live_load_contract_pass){ throw 'Live FeModel BC/load translation gate failed.' }
          if(-not $report.codeaster_gravity_contract_pass -or -not $report.codeaster_density_contract_pass){ throw 'Live GravityLoad/density translation gate failed.' }
          if([math]::Abs([double]$report.codeaster_gravity_ay_mm_s2+9810.0) -gt 1e-12){ throw 'Gravity acceleration mismatch.' }
          if([double]$report.codeaster_density_tonne_per_mm3 -le 0){ throw 'Material density missing or invalid.' }
          if($report.codeaster_directional_bc_group -ne 'C1038_LOAD'){ throw 'Directional BC group mismatch.' }
          if([math]::Abs([double]$report.codeaster_coulomb_mu-0.20) -gt 1e-12){ throw 'Runtime Coulomb coefficient mismatch.' }
          if([int]$report.contact_pair_count -lt 1 -or [int]$report.codeaster_contact_skin_elements -lt 2){ throw 'Contact contract contains no usable skin elements.' }
          $contract='${{ steps.locate.outputs.bin }}\Audit\C10.35-runtime\contact-solver-contract.json'
          if(-not(Test-Path $contract)){ throw 'Contact solver contract missing.' }

      - name: Validate live FeModel BC load contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $contract='${{ steps.locate.outputs.bin }}\Audit\C10.35-runtime\contact-solver-contract.json'
          $d=Get-Content $contract -Raw | ConvertFrom-Json
          if($d.supports.Count -ne 2){ throw 'Expected FixedBC + directional displacement from live FeModel.' }
          $fixed=$d.supports | Where-Object { $_.name -eq 'C1038_Fixed' }
          $dir=$d.supports | Where-Object { $_.name -eq 'C1038_Directional' }
          $load=$d.loads | Where-Object { $_.name -eq 'C1038_Force' }
          $gravity=$d.loads | Where-Object { $_.name -eq 'C1039_Gravity' }
          if(-not $fixed -or $fixed.type -ne 'fixed' -or $fixed.group -ne 'C1038_FIXED'){ throw 'Live FixedBC contract mismatch.' }
          if(-not $dir -or $dir.type -ne 'displacement' -or $dir.group -ne 'C1038_LOAD'){ throw 'Live directional BC contract mismatch.' }
          if($null -ne $dir.dx -or [double]$dir.dy -ne 0.0 -or [double]$dir.dz -ne 0.0){ throw 'Directional BC DOF semantics mismatch.' }
          $loadNodes=@($d.mesh.node_groups.C1038_LOAD).Count
          if($loadNodes -lt 1){ throw 'Live CLoad node group is empty.' }
          if(-not $load -or $load.type -ne 'nodal_force_per_node'){ throw 'Live CLoad semantics mismatch.' }
          if([math]::Abs(([double]$load.fx_per_node_n*$loadNodes)+1000.0) -gt 1e-8 -or [math]::Abs(([double]$load.fz_per_node_n*$loadNodes)-100.0) -gt 1e-8){ throw 'Live CLoad resultant mismatch.' }
          if(-not $gravity -or $gravity.type -ne 'gravity_acceleration' -or $gravity.scope -ne 'all_model'){ throw 'Live GravityLoad contract mismatch.' }
          if([math]::Abs([double]$gravity.ay_mm_s2+9810.0) -gt 1e-8){ throw 'Live GravityLoad acceleration mismatch.' }
          if([double]$d.materials[0].density_tonne_per_mm3 -le 0){ throw 'Live material density contract mismatch.' }
      - name: Execute compiled native exporter on the real contact contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $bin='${{ steps.locate.outputs.bin }}'
          $exe='${{ steps.locate.outputs.exe }}'
          $contract=Join-Path $bin 'Audit\C10.35-runtime\contact-solver-contract.json'
          $deck=Join-Path $PWD 'c1039-exported-contact'
          $script:AsterMaxAssemblyRoot=(Resolve-Path '.\upstream').Path
          New-Item -ItemType Directory -Force $deck | Out-Null

          function Find-AsterMaxAssembly([string]$fileName) {
            $matches=Get-ChildItem $script:AsterMaxAssemblyRoot -Recurse -File -Filter $fileName -ErrorAction SilentlyContinue
            $candidate=$matches | Where-Object { $_.FullName -match '\\bin\\x64\\Release\\' } | Select-Object -First 1
            if(-not $candidate){ $candidate=$matches | Where-Object { $_.FullName -match '\\packages\\' } | Select-Object -First 1 }
            return $candidate
          }

          # AsterMax is a .NET Framework application. Resolve its project and
          # NuGet assemblies from the actual build tree instead of assuming
          # CaeGlobals/CaeModel/etc. were copied beside the executable.
          $resolver=[System.ResolveEventHandler]{
            param($sender,$eventArgs)
            $simple=(New-Object System.Reflection.AssemblyName($eventArgs.Name)).Name + '.dll'
            $candidate=Find-AsterMaxAssembly $simple
            if($candidate){ return [System.Reflection.Assembly]::LoadFrom($candidate.FullName) }
            return $null
          }
          [AppDomain]::CurrentDomain.add_AssemblyResolve($resolver)
          try {
            $newton=Find-AsterMaxAssembly 'Newtonsoft.Json.dll'
            if(-not $newton){ throw 'Newtonsoft.Json.dll not found in build/package tree.' }
            [System.Reflection.Assembly]::LoadFrom($newton.FullName) | Out-Null
            $asm=[System.Reflection.Assembly]::LoadFrom($exe)
            $json=[Newtonsoft.Json.Linq.JObject]::Parse((Get-Content $contract -Raw))
            $type=$asm.GetType('PrePoMax.AsterMaxCodeAsterNativeExporter',$true)
            $method=$type.GetMethod('ExportContract',[System.Reflection.BindingFlags]'Public,Static')
            if($null -eq $method){ throw 'Compiled ExportContract method missing.' }
            try { $manifest=$method.Invoke($null,[object[]]@($json,[string]$deck,[string]'astermax-c1039-exported-contact')) }
            catch { if($_.Exception.InnerException){ throw $_.Exception.InnerException } else { throw } }
          }
          finally {
            [AppDomain]::CurrentDomain.remove_AssemblyResolve($resolver)
          }
          $comm=Get-Content (Join-Path $deck 'astermax-c1039-exported-contact.comm') -Raw
          $mail=Get-Content (Join-Path $deck 'astermax-c1039-exported-contact.mail') -Raw
          foreach($t in @('DEFI_CONTACT','STAT_NON_LINE','GROUP_MA_MAIT','GROUP_MA_ESCL','CONTACT_INIT','stabilize = AFFE_CHAR_MECA',"FROTTEMENT='COULOMB'",'COULOMB=0.2',"GROUP_NO='C1038_LOAD'","DY=0","DZ=0","GROUP_NO='C1038_FIXED'",'gravity = AFFE_CHAR_MECA','PESANTEUR','GRAVITE=9810','DIRECTION=(0, -1, 0)','RHO=')){ if(-not $comm.Contains($t)){ throw "Generated .comm missing: $t" } }
          foreach($t in @('GROUP_MA NOM = AM_VOL','GROUP_MA NOM = AM_M001','GROUP_MA NOM = AM_S001')){ if(-not $mail.Contains($t)){ throw "Generated .mail missing: $t" } }
          @'
          P actions make_etude
          P version 15.2
          P mode interactif
          P time_limit 900
          P memory_limit 4096
          P ncpus 1
          P mpi_nbcpu 1

          F comm /analysis/astermax-c1039-exported-contact.comm D 1
          F mail /analysis/astermax-c1039-exported-contact.mail D 20
          F mess /analysis/astermax-c1039-exported-contact.mess R 6
          F rmed /analysis/astermax-c1039-exported-contact.rmed R 81
          F resu /analysis/astermax-c1039-exported-contact.resu R 80
          '@ | Set-Content (Join-Path $deck 'astermax-c1039-exported-contact.export') -Encoding ASCII
          Copy-Item $contract (Join-Path $deck 'c1039-live-femodel-contract.json') -Force

      - name: Stage C10.39 candidate build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin='${{ steps.locate.outputs.bin }}'
          New-Item -ItemType Directory -Force .\candidate | Out-Null
          Copy-Item "$bin\*" .\candidate\ -Recurse -Force
          New-Item -ItemType Directory -Force .\candidate\Validation\C10.39 | Out-Null
          Copy-Item .\c1039-exported-contact\* .\candidate\Validation\C10.39\ -Force
          Copy-Item "$bin\Audit\C10.35-runtime\defaults-autocontact-report.json" .\candidate\Validation\C10.39\ -Force
          Copy-Item "$bin\Audit\C10.35-runtime\contact-solver-contract.json" .\candidate\Validation\C10.39\ -Force
          New-Item -ItemType Directory -Force .\candidate\AsterMaxRuntime\CodeAster | Out-Null
          Copy-Item .\native-windows\runtime\CodeAster\* .\candidate\AsterMaxRuntime\CodeAster\ -Recurse -Force
          $hash=(Get-FileHash '.\candidate\AsterMax Mechanical.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            release='C10.39'; branch='agent/c1039-native-gravity'; commit='${{ github.sha }}';
            executable_sha256=$hash; platform='Windows x64'; solver_backend='Code_Aster';
            automatic_contact_detection=$true; contact_contract_runtime='PASS'; compiled_contact_export='PASS';
            genuine_solver_contact='PENDING_LINUX_ADMISSION'; coulomb_friction='PASS'; coulomb_mu=0.20; tangential_load_n=100.0;
            fixed_support_origin='LIVE_FEMODEL'; directional_displacement_constraints='LIVE_FEMODEL_PENDING_SOLVER'; directional_components=@('DY','DZ');
            mechanical_load_origin='LIVE_FEMODEL'; gravity_load='LIVE_FEMODEL_PENDING_SOLVER'; gravity_acceleration_mm_s2=9810.0; gravity_direction=@(0,-1,0);
            material_density_contract='PASS'; fea_values_invented=$false
          } | ConvertTo-Json -Depth 5 | Set-Content .\candidate\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8

      - name: Upload compiled candidate
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.39-Candidate-Windows-x64
          path: candidate
          if-no-files-found: error

      - name: Upload AsterMax-exported contact deck
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.39-Exported-Gravity-Directional-Coulomb-Deck
          path: c1039-exported-contact
          if-no-files-found: error

  genuine-codeaster-contact:
    needs: windows-build-and-export
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout C10.39 validation scripts
        uses: actions/checkout@v4
      - name: Download AsterMax-exported contact deck
        uses: actions/download-artifact@v4
        with:
          name: AsterMax-C10.39-Exported-Gravity-Directional-Coulomb-Deck
          path: contact-evidence
      - name: Pull pinned genuine Code_Aster
        shell: bash
        run: |
          set -euxo pipefail
          docker pull scimulate/code_aster:15.2
          docker image inspect scimulate/code_aster:15.2 --format '{{json .RepoDigests}}' | tee contact-evidence/CODE_ASTER_IMAGE_DIGEST.txt
      - name: Execute genuine Code_Aster on AsterMax exported contact deck
        shell: bash
        run: |
          set -euxo pipefail
          chmod -R 0777 contact-evidence
          docker run --rm --volume "$PWD/contact-evidence:/analysis" scimulate/code_aster:15.2 /opt/aster/bin/as_run /analysis/astermax-c1039-exported-contact.export | tee contact-evidence/CODE_ASTER_STDOUT.log
          test -s contact-evidence/astermax-c1039-exported-contact.mess
          test -s contact-evidence/astermax-c1039-exported-contact.rmed
          if grep -q '<F>' contact-evidence/astermax-c1039-exported-contact.mess; then tail -n 200 contact-evidence/astermax-c1039-exported-contact.mess; exit 1; fi
          grep -Ei 'CONTACT|FROTTEMENT|COULOMB|STAT_NON_LINE|PESANTEUR|GRAVITE' contact-evidence/astermax-c1039-exported-contact.mess | tail -n 160 || true
      - name: Seal genuine solver admission evidence
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('contact-evidence')
          mess=root/'astermax-c1039-exported-contact.mess'
          rmed=root/'astermax-c1039-exported-contact.rmed'
          text=mess.read_text(errors='ignore')
          if '<F>' in text: raise SystemExit('fatal Code_Aster marker')
          report={
            'release':'C10.39','solver_execution':'RUN','export_source':'compiled_AsterMax_native_exporter',
            'contact_solver':'DEFI_CONTACT_CONTINUE_COULOMB_STAT_NON_LINE','coulomb_mu':0.20,'tangential_load_n':100.0,
            'fixed_support_origin':'LIVE_FEMODEL','directional_bc_origin':'LIVE_FEMODEL','directional_components':['DY','DZ'],
            'load_origin':'LIVE_FEMODEL','gravity_origin':'LIVE_FEMODEL','gravity_acceleration_mm_s2':9810.0,'gravity_direction':[0,-1,0],
            'material_density_origin':'LIVE_FEMODEL','mess_bytes':mess.stat().st_size,'rmed_bytes':rmed.stat().st_size,'fea_values_invented':False,'pass':True,
          }
          (root/'C10.39_GENUINE_CONTACT_VALIDATION.json').write_text(json.dumps(report,indent=2))
          with (root/'OUTPUT_SHA256.txt').open('w') as f:
            for p in sorted(root.iterdir()):
              if p.is_file() and p.name!='OUTPUT_SHA256.txt':
                f.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Upload genuine contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.39-Genuine-CodeAster-Gravity-Directional-Coulomb-Evidence
          path: contact-evidence
          if-no-files-found: error

  finalize-c1039:
    needs: genuine-codeaster-contact
    runs-on: windows-latest
    steps:
      - name: Download compiled candidate
        uses: actions/download-artifact@v4
        with:
          name: AsterMax-C10.39-Candidate-Windows-x64
          path: dist
      - name: Download genuine solver evidence
        uses: actions/download-artifact@v4
        with:
          name: AsterMax-C10.39-Genuine-CodeAster-Gravity-Directional-Coulomb-Evidence
          path: genuine-contact
      - name: Admit solver evidence and seal final build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $v=Get-Content .\genuine-contact\C10.39_GENUINE_CONTACT_VALIDATION.json -Raw | ConvertFrom-Json
          if(-not $v.pass -or $v.solver_execution -ne 'RUN' -or $v.fea_values_invented){ throw 'Genuine Code_Aster contact evidence not admitted.' }
          New-Item -ItemType Directory -Force .\dist\Validation\C10.39\Genuine-CodeAster | Out-Null
          Copy-Item .\genuine-contact\* .\dist\Validation\C10.39\Genuine-CodeAster\ -Force
          $m=Get-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Raw | ConvertFrom-Json
          $m.genuine_solver_contact='PASS'
          $m | Add-Member -NotePropertyName contact_solver_execution -NotePropertyValue 'RUN' -Force
          $m | Add-Member -NotePropertyName contact_solver_path -NotePropertyValue 'DEFI_CONTACT_CONTINUE_COULOMB_STAT_NON_LINE' -Force
          $m.directional_displacement_constraints='PASS'
          $m | Add-Member -NotePropertyName directional_bc_solver_execution -NotePropertyValue 'RUN' -Force
          $m.gravity_load='PASS'
          $m | Add-Member -NotePropertyName gravity_solver_execution -NotePropertyValue 'RUN' -Force
          $m | ConvertTo-Json -Depth 8 | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8
          Get-ChildItem .\dist -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel=$_.FullName.Substring((Resolve-Path .\dist).Path.Length+1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$rel
          } | Set-Content .\dist\PACKAGE_SHA256.txt -Encoding UTF8
      - name: Upload final C10.39 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.39-Windows-x64-CodeAster-Gravity-Directional-Coulomb
          path: dist
          if-no-files-found: error
