name: C10.71 portable runtime validation
on:
  push:
    branches: [agent/c1071-netgen-mesher-path-fix]
  workflow_dispatch:

jobs:
  windows-x64-runtime:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Apply cumulative AsterMax chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python native-windows/validate-patch-chain.py
          $chain=Get-Content native-windows/patch-chain.json -Raw|ConvertFrom-Json
          $patches=@($chain.patches|ForEach-Object{$_.file})
          ./native-windows/harness-c10208a-patch-chain.ps1 -Root "$PWD/upstream" -Patches $patches -OutDir "$PWD/dist/Audit/PatchChain"
          ./native-windows/candidate-c1067-c1042-render-guard-compat.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1069Compat"
          ./native-windows/candidate-c1042-large-assembly-pipeline.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1042-large-assembly.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1043-cad-import-reliability.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1043"
          ./native-windows/test-c1043-cad-import-reliability.ps1 -BuildRoot "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1043Test"
          ./native-windows/candidate-c1044-adaptive-cad-preview.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1044"
          ./native-windows/test-c1044-adaptive-cad-preview.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1045-parallel-cad-preview.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1045"
          ./native-windows/test-c1045-parallel-cad-preview.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1045b-isolated-netgen-workers.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1045b"
          ./native-windows/test-c1045b-isolated-netgen-workers.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1046c"
          ./native-windows/test-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1046cTest"
          ./native-windows/candidate-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1047"
          ./native-windows/test-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1047Test"
          ./native-windows/candidate-c1048-lazy-element-edges-v3.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1048"
          ./native-windows/test-c1048-lazy-element-edges.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1048Test"
          ./native-windows/candidate-c1049-import-telemetry.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1049"
          ./native-windows/test-c1049-import-telemetry.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1049Test"
          ./native-windows/candidate-c1050-addcells-telemetry.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1050"
          ./native-windows/test-c1050-addcells-telemetry.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1050Test"
          ./native-windows/test-c1052-viewport-purity.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1052"
          ./native-windows/test-c1053-render-hotspots.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1053"
          ./native-windows/candidate-c1056-netgen-failure-diagnostics.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1056"
          ./native-windows/test-c1056-netgen-failure-diagnostics.ps1 -Root "$PWD/upstream" -OutDir "$PWD/dist/Audit/C1056Test"
          ./native-windows/candidate-c1058-native-localization-resx.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1058-native-localization.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1060-progress-ui.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1060-progress-ui.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1061-progress-render-purity.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1062-import-finalization-singleflush.ps1 -Root "$PWD/upstream"

      - name: Restore and build Release x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuget="$PWD/nuget.exe"
          Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget
          & $nuget restore "$PWD/upstream/PrePoMax.sln" -PackagesDirectory "$PWD/upstream/packages" -NonInteractive
          if($LASTEXITCODE -ne 0){throw "NuGet restore failed: $LASTEXITCODE"}
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild=& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if(-not $msbuild){throw 'MSBuild not found'}
          & $msbuild "$PWD/upstream/PrePoMax.sln" /m /p:Configuration=Release /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw "MSBuild failed: $LASTEXITCODE"}

      - name: Package complete portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out="$PWD/dist/AsterMax-C10.71-Windows-x64"
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe=Get-ChildItem "$PWD/upstream" -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin.*Release'} | Select-Object -First 1
          if(-not $exe){throw 'Release AsterMax Mechanical.exe not found'}
          Copy-Item (Join-Path $exe.Directory.FullName '*') $out -Recurse -Force

          # STEP/IGES/BREP import calls Application.StartupPath + Globals.NetGenMesher.
          # The compiled bin directory does not carry NetGenMesher.exe, so obtain the
          # same pinned runtime already used by the real C10.43 CAD import validation.
          $runtimeUrl='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          $runtimeSha256='954f406b65a08cb2fb47ef2fb02b03e4f70aa9c97e0979bd7048448273e17d46'
          Invoke-WebRequest $runtimeUrl -OutFile "$PWD/runtime.zip"
          $actual=(Get-FileHash "$PWD/runtime.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $runtimeSha256){throw "Pinned CAD runtime digest mismatch: $actual"}
          Expand-Archive "$PWD/runtime.zip" "$PWD/runtime"
          $ng=Get-ChildItem "$PWD/runtime" -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $ng){throw 'NetGenMesher.exe missing from pinned runtime'}
          Copy-Item $ng.Directory.FullName (Join-Path $out 'NetGen') -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $out 'Temp') | Out-Null

          if(-not (Test-Path (Join-Path $out 'AsterMax Mechanical.exe'))){throw 'Packaged AsterMax Mechanical.exe missing'}
          if(-not (Test-Path (Join-Path $out 'NetGen\NetGenMesher.exe'))){throw 'Packaged NetGen\NetGenMesher.exe missing'}
          $ngHash=(Get-FileHash (Join-Path $out 'NetGen\NetGenMesher.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "PASS: portable contains AsterMax Mechanical.exe and NetGen/NetGenMesher.exe; NetGen sha256=$ngHash"

      - name: Record C10.71 evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$PWD/dist/Audit/C1071" | Out-Null
          $portable="$PWD/dist/AsterMax-C10.71-Windows-x64"
          [ordered]@{
            candidate='C10.71'
            branch='agent/c1071-netgen-mesher-path-fix'
            windows_x64=$true
            native_gui=$true
            code_aster_windows_only_solver_preserved=$true
            netgen_mesher_present=(Test-Path (Join-Path $portable 'NetGen\NetGenMesher.exe'))
            exact_user_step='NOT_AVAILABLE_IN_CI'
            runtime_step_import='NOT_RUN'
            performance='NOT_RUN'
            benchmark_values_invented=$false
          } | ConvertTo-Json | Set-Content "$PWD/dist/Audit/C1071/evidence.json" -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C10.71-Runtime-Audit
          path: dist/Audit
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AsterMax-C10.71-Windows-x64
          path: dist/AsterMax-C10.71-Windows-x64
