name: AsterMax C10.02 Portable Runtime Discovery

on:
  push:
    branches: [ main ]
    paths:
      - 'native-windows/patch-c1002-runtime-discovery.ps1'
      - '.github/workflows/astermax-c1002-runtime-discovery.yml'
  workflow_dispatch:

jobs:
  windows-x64-runtime-discovery:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Apply AsterMax integrated chain through C10.02
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patches=@('patch-astermax.ps1','patch-branding.ps1','patch-c960-native-bridge.ps1','patch-c961-native-codeaster-export.ps1','patch-c965-results-workspace.ps1','patch-c966-results-scene.ps1','patch-c967-vtk-results-binding.ps1','patch-c968-professional-results-hud.ps1','patch-c969-renderer-synchronized-results.ps1','patch-c970-native-3d-probe.ps1','patch-c971-native-probe-callout.ps1','patch-c972-native-framebuffer-evidence.ps1','patch-c974-solver-provenance.ps1','patch-c975-analysis-provenance-manifest.ps1','patch-c976-automatic-model-fingerprint.ps1','patch-c977-pre-solve-readiness.ps1','patch-c978-assignment-hexa8-quality.ps1','patch-c985-model-fidelity-gate.ps1','patch-c998-current-model-results-gate.ps1','patch-c991-startup-hardening.ps1','patch-c992-startup-viewport.ps1','patch-c1000-native-solve-transaction.ps1','patch-c1001-automatic-results-handoff.ps1','patch-c1002-runtime-discovery.ps1')
          foreach($p in $patches){ & ".\native-windows\$p" -Root "$PWD\upstream" }
      - name: C10.02 portable-runtime source gate
        shell: pwsh
        run: |
          $src=Get-Content .\upstream\PrePoMax\Forms\AsterMaxNativeSolveTransaction.cs -Raw
          foreach($t in @('ResolvePythonRuntime','ResolveCodeAsterRunner','RuntimeDiagnostic','AsterMaxRuntime","Python','AsterMaxRuntime","CodeAster','synthetic_results_allowed"]=false','MM_N_S_MPA')){ if(-not $src.Contains($t)){ throw "C10.02 token missing: $t" } }
          if($src.Contains('fea_values_invented = true')){ throw 'Synthetic FEA path detected' }
          Write-Host 'C1002_PORTABLE_RUNTIME_GATE=PASS'
      - name: Restore packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive
      - uses: microsoft/setup-msbuild@v2
      - name: Rebuild Windows x64 Release
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Stage C10.02 runtime-aware demo
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing' }
          New-Item -ItemType Directory -Force .\dist\AsterMaxTools | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\Python | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\CodeAster | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" .\dist\ -Recurse -Force
          Copy-Item .\native-windows\bridge-c964-med-results.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\bind-c998-results-fingerprint.py .\dist\AsterMaxTools\ -Force
          @'
          C10.02 runtime slots
          AsterMaxRuntime/Python/python.exe: optional packaged Python runtime with numpy+h5py.
          AsterMaxRuntime/CodeAster/astermax-codeaster-runner.cmd: optional packaged/local Code_Aster launcher.
          Environment variables remain fallback only.
          No solver binary is fabricated or downloaded by this harness.
          '@ | Set-Content .\dist\AsterMaxRuntime\README.txt -Encoding UTF8
          $hash=(Get-FileHash '.\dist\AsterMax Mechanical.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{release='C10.02';platform='Windows x64';executable_sha256=$hash;runtime_discovery=$true;packaged_runtime_preferred=$true;environment_fallback=$true;solver_runtime_bundled=$false;python_runtime_bundled=$false;unit_contract='MM_N_S_MPA';fea_values_invented=$false;ansys_equivalence='NOT_PROVEN';limitation='Runtime discovery and packaging contract validated. This artifact does not claim a fresh Code_Aster numerical solve on Windows.'} | ConvertTo-Json | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.02-Windows-x64-Portable-Runtime-Discovery
          path: dist
          if-no-files-found: error
