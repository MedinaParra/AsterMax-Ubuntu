name: AsterMax C10.10.1 Quick Test ZIP

on:
  push:
    branches: [ codex/c1004-unified-native-codeaster ]
    paths:
      - '.github/workflows/astermax-c10101-quick-test-zip.yml'
      - 'native-windows/patch-c1012-tetra-results-connectivity.ps1'
      - 'native-windows/patch-c1013-results-contours-options.ps1'
  workflow_dispatch:

jobs:
  quick-windows-zip:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout AsterMax branch
        uses: actions/checkout@v5

      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream

      - name: Apply integrated AsterMax chain through C10.10.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $patches=@(
            'patch-astermax.ps1','patch-branding.ps1','patch-c960-native-bridge.ps1',
            'patch-c961-native-codeaster-export.ps1','patch-c965-results-workspace.ps1',
            'patch-c966-results-scene.ps1','patch-c967-vtk-results-binding.ps1',
            'patch-c968-professional-results-hud.ps1','patch-c969-renderer-synchronized-results.ps1',
            'patch-c970-native-3d-probe.ps1','patch-c971-native-probe-callout.ps1',
            'patch-c972-native-framebuffer-evidence.ps1','patch-c974-solver-provenance.ps1',
            'patch-c975-analysis-provenance-manifest.ps1','patch-c976-automatic-model-fingerprint.ps1',
            'patch-c977-pre-solve-readiness.ps1','patch-c978-assignment-hexa8-quality.ps1',
            'patch-c985-model-fidelity-gate.ps1','patch-c998-current-model-results-gate.ps1',
            'patch-c991-startup-hardening.ps1','patch-c992-startup-viewport.ps1',
            'patch-c1000-native-solve-transaction.ps1','patch-c1001-automatic-results-handoff.ps1',
            'patch-c1002-runtime-discovery.ps1','patch-c1003-runtime-readiness.ps1',
            'patch-c1004-tetra-native-solve.ps1','patch-c1005-codeaster-runner-probe.ps1',
            'patch-c1006-python-med-runtime-probe.ps1','patch-c1008-aster-group-records.ps1',
            'patch-c10081-portable-cad-smoke.ps1','patch-c1009-functional-outline.ps1',
            'patch-c1010-button-audit.ps1','patch-c1011-windows-runtime.ps1'
          )
          foreach($p in $patches){ Write-Host "Applying $p"; & ".\native-windows\$p" -Root "$PWD\upstream" }
          $rw=Get-Content .\upstream\PrePoMax\Forms\AsterMaxResultsWorkspace.cs -Raw
          foreach($t in @('ElementType != "HEXA8" && ElementType != "TETRA4" && ElementType != "TETRA10" && ElementType != "MIXED"','ReadConnectivity','CellTypes')) {
            if(-not $rw.Contains($t)){ throw "Tetra result hotfix token missing: $t" }
          }
          if($rw.Contains('PMV currently validates the proven HEXA8 result route only')) { throw 'Legacy C9.74 HEXA8-only gate remains.' }
          $vtk=Get-Content .\upstream\PrePoMax\Forms\AsterMaxVtkResultsBinding.cs -Raw
          foreach($t in @('BuildExteriorSurface','VtkQuadraticTriangle = 22','SurfaceMesh surface=BuildExteriorSurface(bundle)','_view.UpdateScalarsAndCameraAndRedraw();','data.ColorContours=_showContours.Checked;','_showEdges.Checked','_showDeformed.Checked','_autoRange.Checked','CreateDisplaySpectrum','SetDisplayRange')) {
            if(-not $vtk.Contains($t)){ throw "Results viewport/contour hotfix token missing: $t" }
          }
          if($vtk.Contains('data.Geometry.Cells.Types = bundle.CellTypes.ToArray();')) { throw 'Raw 3D volume cells are still sent to vtkMaxActor poly renderer.' }
          if($vtk.Contains('g.DrawString("VTK scalar bar"')) { throw 'Grey scalar-bar placeholder remains.' }
          Write-Host 'ASTERMAX_TETRA10_CONTOUR_OPTIONS_SOURCE_GATE=PASS'

      - name: Setup Python MED runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install MED dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check numpy h5py

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild Windows x64 Release
        shell: pwsh
        run: msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Assemble portable test package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem .\upstream -Recurse -Filter 'AsterMax Mechanical.exe' | Where-Object {$_.FullName -match 'bin\\x64\\Release'} | Select-Object -First 1
          if(-not $exe){ throw 'AsterMax Mechanical.exe missing' }
          New-Item -ItemType Directory -Force .\dist\AsterMaxTools | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\CodeAster | Out-Null
          New-Item -ItemType Directory -Force .\dist\AsterMaxRuntime\Python | Out-Null
          Copy-Item "$($exe.Directory.FullName)\*" .\dist\ -Recurse -Force
          Copy-Item .\native-windows\bridge-c964-med-results.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\bind-c998-results-fingerprint.py .\dist\AsterMaxTools\ -Force
          Copy-Item .\native-windows\runtime\CodeAster\astermax-codeaster-runner.cmd .\dist\AsterMaxRuntime\CodeAster\ -Force
          Copy-Item .\native-windows\runtime\CodeAster\astermax-codeaster-runner.ps1 .\dist\AsterMaxRuntime\CodeAster\ -Force
          $pythonRoot=Split-Path (Get-Command python).Source -Parent
          Copy-Item "$pythonRoot\*" .\dist\AsterMaxRuntime\Python\ -Recurse -Force
          & .\dist\AsterMaxRuntime\Python\python.exe -c "import numpy,h5py; print('ASTERMAX_PACKAGED_PYTHON_MED_OK')"
          if($LASTEXITCODE -ne 0){ throw 'Packaged Python MED runtime failed.' }

          $runtimeUrl='https://prepomax.fs.um.si/Files/Downloads/PrePoMax%20v1.4.0.zip'
          $runtimeSha256='954f406b65a08cb2fb47ef2fb02b03e4f70aa9c97e0979bd7048448273e17d46'
          Invoke-WebRequest $runtimeUrl -OutFile runtime.zip
          if((Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtimeSha256){ throw 'Pinned CAD runtime digest mismatch.' }
          Expand-Archive runtime.zip runtime
          $ng=Get-ChildItem runtime -Recurse -Filter NetGenMesher.exe | Select-Object -First 1
          if(-not $ng){ throw 'NetGenMesher.exe missing from pinned runtime.' }
          Copy-Item $ng.Directory.FullName .\dist\NetGen -Recurse -Force
          New-Item -ItemType Directory -Force .\dist\Temp | Out-Null
          foreach($project in @('CaeGlobals','CaeJob','CaeMesh','CaeModel','CaeResults','UserControls','vtkControl')) {
            $dir=Join-Path $PWD "upstream\$project\bin\x64\Release"
            if(Test-Path $dir){ New-Item -ItemType Directory -Force .\dist\lib | Out-Null; Get-ChildItem $dir -Filter *.dll | Copy-Item -Destination .\dist\lib -Force }
          }

          python .\native-windows\build-c1010-materials.py --out .\dist
          if($LASTEXITCODE -ne 0){ throw 'Material library generation failed.' }

          @'
          AsterMax Mechanical C10.10.1 - RESULTS CONTOUR / OPTIONS HOTFIX
          Fixes uniform-color TETRA10 results: the vtk actor now receives scalar formatting AFTER AddCells.
          Real Code_Aster nodal values drive the contour colors.
          Added post-processing controls: Contours on/off, Mesh edges on/off, Deformed on/off,
          deformation scale, Auto range, manual Min/Max range, result field selector and a visible color legend.
          TETRA4/TETRA10/HEXA8 result volumes continue to render through exterior surface extraction.
          Code_Aster itself is NOT bundled. Use your installed Code_Aster for Windows and Runtime/PREFLIGHT.
          No synthetic FEA results are included or generated.
          '@ | Set-Content .\dist\LEEME-QUICK-TEST.txt -Encoding UTF8

          $hash=(Get-FileHash '.\dist\AsterMax Mechanical.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            release='C10.10.1'
            build_kind='RESULTS_CONTOUR_OPTIONS_HOTFIX'
            commit='${{ github.sha }}'
            executable_sha256=$hash
            c974_tetra_provenance_hotfix=$true
            result_element_types=@('TETRA4','TETRA10','HEXA8','MIXED')
            result_volume_to_exterior_surface=$true
            vtk_surface_types=@('TRIANGLE','QUADRATIC_TRIANGLE','QUAD')
            real_nodal_scalar_contours=$true
            scalar_refresh_after_actor_creation=$true
            postprocess_options=@('field','deformed','deformation_scale','contours','mesh_edges','auto_range','manual_min','manual_max','nodal_probe')
            python_med_runtime_bundled=$true
            cad_netgen_runtime_bundled=$true
            code_aster_bundled=$false
            fea_values_invented=$false
          } | ConvertTo-Json -Depth 5 | Set-Content .\dist\ASTERMAX_BUILD_MANIFEST.json -Encoding UTF8

          Get-ChildItem .\dist -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative=$_.FullName.Substring((Resolve-Path .\dist).Path.Length+1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$relative
          } | Set-Content .\dist\PACKAGE_SHA256.txt -Encoding UTF8

      - name: Upload quick C10.10.1 test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.10.1-Results-Contours-Options-Hotfix
          path: dist
          if-no-files-found: error
