name: Windows C5.5d Provenance Second Structural Solve

on:
  pull_request:
  workflow_dispatch:

jobs:
  provenance-second-solve:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/adaptive_second_solve.py
      - name: C5.5d real provenance-matched second solve harness
        run: python -m pytest -q tests/test_adaptive_second_solve.py
      - name: Remesh rebind and QoI regression
        run: python -m pytest -q tests/test_remesh_face_rebinding.py tests/test_gmsh_local_refinement.py tests/test_local_refinement_plan.py tests/test_qoi_convergence.py
      - name: Solver CAD BC and Results regression
        run: python -m pytest -q tests/test_arbitrary_bc.py tests/test_production_picker_routing.py tests/test_step_to_solve.py tests/test_production_results.py tests/test_desktop_picker_app.py
      - name: ACEA and demo regression
        run: python -m pytest -q tests/test_engineering_control_architecture.py tests/test_engineering_validator_corrective.py tests/test_demo_session.py tests/test_demo_dashboard.py
      - name: Full regression suite
        run: python -m pytest -q
