name: Windows C4.7 Worst Element Inspector

on:
  pull_request:
    paths:
      - "src/astermax/app.py"
      - "src/astermax/fea/worst_element_inspector.py"
      - "tests/test_worst_element_inspector.py"
      - ".github/workflows/windows-c4-7-worst-element-inspector.yml"

jobs:
  verify-worst-element-inspector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMV and full test dependencies
        run: python -m pip install -e .[test]
      - name: Compile C4.7 modules with warnings as errors
        run: python -W error -m py_compile src/astermax/fea/worst_element_inspector.py src/astermax/app.py
      - name: Run C4.7 worst-element inspector harness
        run: python -m pytest tests/test_worst_element_inspector.py -q
      - name: Run deterministic regression harness
        run: python -m pytest -q
