name: Windows C5.4y Engineering Validator Corrective Contract

on:
  pull_request:
  workflow_dispatch:

jobs:
  engineering-validator-corrective:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/fea/engineering_validator.py src/astermax/fea/corrective_action.py
      - name: C5.4y validator corrective harness
        run: python -m pytest -q tests/test_engineering_validator_corrective.py
      - name: ACEA control regression
        run: python -m pytest -q tests/test_engineering_control_architecture.py tests/test_tet_quality.py tests/test_pre_solve_review.py
      - name: Desktop and production results regression
        run: python -m pytest -q tests/test_desktop_picker_app.py tests/test_step_to_solve.py tests/test_production_results.py tests/test_demo_session.py tests/test_demo_dashboard.py
      - name: Full regression suite
        run: python -m pytest -q
