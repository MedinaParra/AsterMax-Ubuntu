name: Windows C5.5u Packaged Unified Project Cutover

on:
  pull_request:
  workflow_dispatch:

jobs:
  packaged-unified-project-cutover:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/app.py src/astermax/fea/project_session_shell.py src/astermax/fea/unified_project_model.py
      - name: C5.5u packaged desktop cutover contract
        run: python -m pytest -q tests/test_packaged_unified_project_cutover.py
      - name: Unified project and session regressions
        run: python -m pytest -q tests/test_unified_project_model.py tests/test_project_session_shell.py tests/test_portable_adaptive_results.py
      - name: Adaptive Results regressions
        run: python -m pytest -q tests/test_adaptive_hotspot_visualization.py tests/test_adaptive_stress_comparison.py tests/test_adaptive_execution_bundle.py
      - name: CAD STEP and desktop regressions
        run: python -m pytest -q tests/test_step_to_solve.py tests/test_pre_solve_review.py tests/test_visual_model_preparation.py
      - name: Full regression suite
        run: python -m pytest -q
