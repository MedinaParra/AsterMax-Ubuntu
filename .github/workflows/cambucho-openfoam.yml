name: Cambucho OpenFOAM 2312

on:
  push:
    branches:
      - experiment/cambucho-openfoam
  workflow_dispatch:

jobs:
  run-cambucho-cfd:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenFOAM 2312
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 2312

      - name: Verify OpenFOAM installation
        shell: bash
        run: |
          set -euxo pipefail
          echo "WM_PROJECT_VERSION=$WM_PROJECT_VERSION"
          echo "FOAM_TUTORIALS=$FOAM_TUTORIALS"
          command -v blockMesh
          command -v surfaceFeatureExtract
          command -v snappyHexMesh
          command -v checkMesh
          command -v buoyantBoussinesqPimpleFoam
          blockMesh -help | head -n 5

      - name: Install Python helper dependency
        shell: bash
        run: |
          python3 -m pip install --user numpy

      - name: Generate 3-D cambucho case
        shell: bash
        run: |
          set -euxo pipefail
          python3 experiments/cambucho-openfoam/generate_case.py
          find experiments/cambucho-openfoam/case -maxdepth 3 -type f | sort

      - name: Mesh - blockMesh
        shell: bash
        working-directory: experiments/cambucho-openfoam/case
        run: |
          set -o pipefail
          blockMesh 2>&1 | tee log.blockMesh

      - name: Mesh - extract surface features
        shell: bash
        working-directory: experiments/cambucho-openfoam/case
        run: |
          set -o pipefail
          surfaceFeatureExtract 2>&1 | tee log.surfaceFeatureExtract

      - name: Mesh - snappyHexMesh
        shell: bash
        working-directory: experiments/cambucho-openfoam/case
        run: |
          set -o pipefail
          snappyHexMesh -overwrite 2>&1 | tee log.snappyHexMesh

      - name: Mesh quality
        shell: bash
        working-directory: experiments/cambucho-openfoam/case
        run: |
          set -o pipefail
          checkMesh -allGeometry -allTopology 2>&1 | tee log.checkMesh

      - name: Validate required initial fields
        shell: bash
        working-directory: experiments/cambucho-openfoam/case
        run: |
          set -euxo pipefail
          test -f 0/U
          test -f 0/T
          test -f 0/p_rgh
          test -f 0/alphat
          grep -q "skin" 0/U
          grep -q "cambucho" 0/U
          grep -q "skin" 0/T
          grep -q "cambucho" 0/T
          grep -q "skin" 0/p_rgh
          grep -q "cambucho" 0/p_rgh

      - name: Run transient CFD
        shell: bash
        working-directory: experiments/cambucho-openfoam/case
        run: |
          set -o pipefail
          buoyantBoussinesqPimpleFoam 2>&1 | tee log.buoyantBoussinesqPimpleFoam

      - name: Convert fields to VTK
        if: always()
        shell: bash
        working-directory: experiments/cambucho-openfoam/case
        run: |
          set -o pipefail
          foamToVTK -latestTime 2>&1 | tee log.foamToVTK || true

      - name: Summarize run
        if: always()
        shell: bash
        working-directory: experiments/cambucho-openfoam/case
        run: |
          {
            echo "=== OpenFOAM version ==="
            echo "$WM_PROJECT_VERSION"
            echo "=== Mesh summary ==="
            grep -E "cells:|faces:|points:|Mesh OK|Failed" log.checkMesh || true
            echo "=== Solver tail ==="
            tail -n 100 log.buoyantBoussinesqPimpleFoam 2>/dev/null || true
          } | tee RUN_SUMMARY.txt

      - name: Upload OpenFOAM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cambucho-openfoam-v2312-results
          path: |
            experiments/cambucho-openfoam/case
          if-no-files-found: warn
          retention-days: 14
