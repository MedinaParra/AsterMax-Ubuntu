name: Windows C5.3e Desktop Picker Cutover

on:
  pull_request:
  workflow_dispatch:

jobs:
  desktop-picker-cutover:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m py_compile src/astermax/desktop_picker_app.py src/astermax/fea/arbitrary_picker_review.py src/astermax/fea/production_picker_routing.py src/astermax/fea/native_cad_picker_ui.py packaging/windows_entry.py
      - name: C5.3e desktop picker cutover harness
        run: python -m pytest -q tests/test_desktop_picker_app.py tests/test_arbitrary_picker_review.py tests/test_production_picker_routing.py tests/test_native_cad_picker_ui.py tests/test_cad_face_picker.py tests/test_arbitrary_bc.py
      - name: Full regression suite
        run: python -m pytest -q
