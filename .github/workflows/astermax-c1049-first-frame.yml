name: C10.49 first-frame instrumentation Windows validation
on:
  push:
    branches: [agent/c1049-first-frame-instrumentation]
  workflow_dispatch:

jobs:
  windows-c1049:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AsterMax C10.49 branch
        uses: actions/checkout@v5
      - name: Checkout pinned PrePoMax upstream
        uses: actions/checkout@v5
        with:
          repository: tsvilans/PrePoMax
          ref: 3669e65581650e5d9d868aa761db9efd856f8571
          path: upstream
      - name: Validate and apply C10.41 baseline
        shell: pwsh
        run: |
          python native-windows/validate-patch-chain.py
          if($LASTEXITCODE -ne 0){throw 'patch-chain validation failed.'}
          $chain=Get-Content native-windows/patch-chain.json -Raw|ConvertFrom-Json
          $patches=@($chain.patches|ForEach-Object{$_.file})
          & ./native-windows/harness-c10208a-patch-chain.ps1 -Root "$PWD/upstream" -Patches $patches -OutDir "$PWD/dist/Audit/PatchChain"
          if($LASTEXITCODE -ne 0){throw 'C10.41 baseline failed.'}
      - name: Apply C10.42 through C10.46c
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/candidate-c1042-vtk-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-controller-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1042-large-assembly-pipeline.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1042-large-assembly.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1043-cad-import-reliability.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1043-cad-import-reliability.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1044-adaptive-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1044-adaptive-cad-preview.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/candidate-c1045-parallel-cad-preview.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1045b-isolated-netgen-workers.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1045b-isolated-netgen-workers.ps1 -BuildRoot "$PWD/upstream"
          ./native-windows/test-c1046-netgen-worker-lifecycle.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1046c-safe-netgen-singleflight.ps1 -Root "$PWD/upstream"
      - name: Apply C10.47 and C10.48 validated visualization chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./native-windows/candidate-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1047-vtk-scene-batch.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1048-actor-preflight.ps1 -Root "$PWD/upstream"
          ./native-windows/candidate-c1048-lazy-element-edges-v3.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1048-lazy-element-edges.ps1 -Root "$PWD/upstream"
      - name: Apply and validate C10.49 instrumentation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force .\dist\Audit\C10.49|Out-Null
          ./native-windows/candidate-c1049-first-frame-instrumentation.ps1 -Root "$PWD/upstream"
          ./native-windows/test-c1049-first-frame-instrumentation.ps1 -Root "$PWD/upstream" *>&1|Tee-Object -FilePath .\dist\Audit\C10.49\static.log
          'PASS'|Set-Content .\dist\Audit\C10.49\static-validation.txt -Encoding ASCII
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore .\upstream\PrePoMax.sln -NonInteractive
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Rebuild Windows x64 Release
        shell: pwsh
        run: |
          msbuild .\upstream\PrePoMax.sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal
          if($LASTEXITCODE -ne 0){throw 'C10.49 Windows x64 build failed.'}
          'PASS'|Set-Content .\dist\Audit\C10.49\windows-build.txt -Encoding ASCII
      - name: Record C10.49 evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist\Audit\C10.49|Out-Null
          [ordered]@{
            release='C10.49-first-frame-instrumentation';commit='${{ github.sha }}';branch='${{ github.ref_name }}';upstream='3669e65581650e5d9d868aa761db9efd856f8571'
            static_validation=if(Test-Path '.\dist\Audit\C10.49\static-validation.txt'){'PASS'}else{'FAIL_OR_NOT_RUN'}
            windows_x64_build=if(Test-Path '.\dist\Audit\C10.49\windows-build.txt'){'PASS'}else{'FAIL_OR_NOT_RUN'}
            exact_incident_step='BLOCKED_NOT_PRESENT_IN_REPOSITORY';real_pulley_performance='NOT_RUN';gpu_render_count='NOT_MEASURED';benchmark_values_invented=$false
            exact_brep_modified=$false;fem_policy_modified=$false;code_aster_windows_only_solver_preserved=$true
          }|ConvertTo-Json -Depth 5|Set-Content .\dist\Audit\C10.49\evidence.json -Encoding UTF8
      - name: Upload C10.49 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsterMax-C10.49-First-Frame-Instrumentation-Evidence
          path: dist/Audit/C10.49
          if-no-files-found: warn
