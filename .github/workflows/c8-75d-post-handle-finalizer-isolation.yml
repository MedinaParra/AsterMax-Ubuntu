name: C8.75d Post Handle Finalizer Isolation

on:
  push:
    branches: [agent/c8-75d-post-handle-finalizer-isolation]
  workflow_dispatch:

concurrency:
  group: c8-75d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-finalizer-isolation:
    runs-on: windows-2025
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    env:
      C865_RUN_ID: '33963671896'
      C865_SHA: '86b123a2df7a481a06451358e299bac69db2b7e4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pin exact admitted solver evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prior/windows,prior/solve | Out-Null
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "C8.65-Windows-Generated-Study-$env:C865_SHA" --dir prior/windows
          gh run download $env:C865_RUN_ID --repo $env:GITHUB_REPOSITORY --name "AsterMax-C8.65-Product-Native-Reaction-$env:C865_SHA" --dir prior/solve
          $pmx=Get-ChildItem prior/windows -Recurse -Filter 'AsterMax_C862_Structural.pmx'|Select-Object -First 1
          $rmed=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.rmed'|Select-Object -First 1
          $resu=Get-ChildItem prior/solve -Recurse -Filter 'astermax_c862_static.resu'|Select-Object -First 1
          $ev=Get-ChildItem prior/solve -Recurse -Filter 'C8.65_PRODUCT_NATIVE_REACTION_EVIDENCE.json'|Select-Object -First 1
          if(-not $pmx -or -not $rmed -or -not $resu -or -not $ev){throw 'Pinned evidence bundle incomplete.'}
          $e=Get-Content $ev.FullName -Raw|ConvertFrom-Json
          if(-not $e.solver_verified -or -not $e.result_field_values_verified -or -not $e.reaction_equilibrium_verified){throw 'Source solve is not admitted.'}
          "PMX=$($pmx.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RMED=$($rmed.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RESU=$($resu.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PRIOR=$($ev.FullName)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NODES=$($e.node_count)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MISES=$($e.max_von_mises_mpa.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DISP=$($e.max_displacement_mm.ToString('R',[Globalization.CultureInfo]::InvariantCulture))"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MISES_NODE=$($e.max_von_mises_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DISP_NODE=$($e.max_displacement_node)"|Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap and apply admitted Results chain plus deterministic process shutdown
        shell: pwsh
        run: |
          python integrations/prepomax-codeaster/tools/bootstrap.py --destination build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_full_model_results_demo.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_results_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_clean_verified_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_extrema_presentation.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_node_probe_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_verified_deformation_geometry.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_render_mesh_deformation_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_deformation_ui_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_native_deformation_ui_evidence_fix.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_rendered_viewport_deformation_qualification.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_rendered_viewport_diagnostic_admission.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_professional_viewport_badge.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_safe_vtk_interactor_detach.py build/PrePoMax-CodeAster
          python integrations/prepomax-codeaster/tools/apply_deterministic_program_shutdown.py build/PrePoMax-CodeAster

      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        shell: pwsh
        run: |
          nuget restore build/PrePoMax-CodeAster/PrePoMax.sln -PackagesDirectory build/PrePoMax-CodeAster/packages -NonInteractive
          msbuild build/PrePoMax-CodeAster/PrePoMax.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal 2>&1 | Tee-Object artifact-build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Run three fail-closed shutdown and finalizer cycles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact/c8-75d|Out-Null
          $exe=(Resolve-Path 'build/PrePoMax-CodeAster/PrePoMax/bin/x64/Release/PrePoMax.exe').Path
          $env:ASTERMAX_RESULTS_FULL_MODEL_PMX=$env:PMX
          $env:ASTERMAX_RESULTS_EXPECTED_NODES=$env:NODES
          $env:ASTERMAX_RESULTS_EXPECTED_ELEMENTS='2474'
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_MAX=$env:MISES
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_MAX=$env:DISP
          $env:ASTERMAX_RESULTS_EXPECTED_MISES_NODE=$env:MISES_NODE
          $env:ASTERMAX_RESULTS_EXPECTED_DISP_NODE=$env:DISP_NODE
          $cycles=@()
          1..3 | ForEach-Object {
            $i=$_;$ready=(Join-Path $PWD "artifact/c8-75d/READY_$i.json");$stdout=(Join-Path $PWD "artifact/c8-75d/stdout_$i.log");$stderr=(Join-Path $PWD "artifact/c8-75d/stderr_$i.log")
            $p=Start-Process $exe -ArgumentList @('--astermax-results-demo',$env:RMED,$env:RESU,$ready) -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            $deadline=(Get-Date).AddSeconds(120)
            while(-not(Test-Path $ready) -and (Get-Date)-lt $deadline){Start-Sleep -Milliseconds 400;$p.Refresh();if($p.HasExited){throw "Cycle $i exited before READY: $($p.ExitCode)"}}
            if(-not(Test-Path $ready)){throw "Cycle $i timed out before READY"}
            $s=Get-Content $ready -Raw|ConvertFrom-Json
            if(-not $s.scene_ready -or -not $s.result_admitted -or -not $s.rendered_viewport_deformation_verified){throw "Cycle $i lost Results admission"}
            if([string]$s.deformation_state -ne 'user-defined-x10-contour'){throw "Cycle $i lost x10 state"}
            if(-not $p.WaitForExit(30000)){Stop-Process -Id $p.Id -Force;throw "Cycle $i did not close normally"}
            $out=Get-Content $stdout -Raw -ErrorAction SilentlyContinue
            $err=Get-Content $stderr -Raw -ErrorAction SilentlyContinue
            if($p.ExitCode -ne 0){throw "Cycle $i normal shutdown exit code $($p.ExitCode)"}
            if($err -match 'AccessViolationException|FatalExecutionEngineError|SEHException'){throw "Cycle $i unsafe native teardown signature"}
            if($out -notmatch 'Application.Run returned; FrmMain disposed'){throw "Cycle $i never completed FrmMain disposal"}
            if($out -notmatch 'MessageBoxManager unregistered'){throw "Cycle $i never unregistered native MessageBox hook"}
            if($out -notmatch 'finalizer drain complete'){throw "Cycle $i never completed finalizer drain"}
            $cycles += [pscustomobject]@{cycle=$i;ready=$true;exit_code=$p.ExitCode;frm_disposed=$true;messagebox_hook_unregistered=$true;finalizer_drain=$true;unsafe_signature=$false}
          }
          $cycles|ConvertTo-Json|Set-Content artifact/c8-75d/C8_75D_CYCLES.json -Encoding UTF8

      - name: Emit C8.75d evidence
        shell: pwsh
        run: |
          $prior=Get-Content $env:PRIOR -Raw|ConvertFrom-Json
          $cycles=Get-Content artifact/c8-75d/C8_75D_CYCLES.json -Raw|ConvertFrom-Json
          $warnings=(Select-String -Path artifact-build.log -Pattern 'MSIL|AMD64|architecture' -ErrorAction SilentlyContinue|ForEach-Object {$_.Line})
          @{
            schema='astermax.c8.75d.post-handle-finalizer-isolation.v1';commit='${{ github.sha }}';source_solver_run=[long]$env:C865_RUN_ID
            solver_verified=[bool]$prior.solver_verified;result_fields_verified=[bool]$prior.result_field_values_verified;reaction_equilibrium_verified=[bool]$prior.reaction_equilibrium_verified
            deterministic_normal_shutdown_verified=$true;shutdown_cycles=@($cycles).Count;all_exit_codes=@($cycles|ForEach-Object {[int]$_.exit_code});unsafe_native_teardown_detected=$false
            frm_main_disposed_before_process_exit=$true;messagebox_native_hook_unregistered=$true;managed_finalizer_drain_verified=$true
            build_architecture_warning_count=@($warnings).Count;build_architecture_warnings=@($warnings)
            pmx_sha256=(Get-FileHash $env:PMX -Algorithm SHA256).Hash.ToLowerInvariant();rmed_sha256=(Get-FileHash $env:RMED -Algorithm SHA256).Hash.ToLowerInvariant();resu_sha256=(Get-FileHash $env:RESU -Algorithm SHA256).Hash.ToLowerInvariant()
            industrial_validation=$false;ansys_equivalence=$false
          }|ConvertTo-Json -Depth 6|Set-Content artifact/c8-75d/C8_75D_POST_HANDLE_FINALIZER_EVIDENCE.json -Encoding UTF8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AsterMax-C8.75d-Post-Handle-Finalizer-${{ github.sha }}
          path: |
            artifact/c8-75d/**
            artifact-build.log
          if-no-files-found: warn
          retention-days: 14
