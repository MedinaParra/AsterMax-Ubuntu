name: Windows C5.5e Adaptive Mesh Provenance Bridge
on:
  pull_request:
  workflow_dispatch:
jobs:
  adaptive-mesh-provenance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile warnings as errors
        run: python -W error -m compileall -q src tests
      - name: C5.5e provenance bridge harness
        run: python -m pytest -q tests/test_adaptive_mesh_provenance.py
      - name: Adaptive loop regressions
        run: python -m pytest -q tests/test_adaptive_second_solve.py tests/test_gmsh_local_refinement.py tests/test_remesh_face_rebinding.py tests/test_qoi_convergence.py
      - name: Full regression suite
        run: python -m pytest -q
